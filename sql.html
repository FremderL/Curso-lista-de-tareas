<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Curso interactivo · Bases de datos SQL</title>
<meta name="description" content="Curso interactivo de SQL en español: SELECT, JOINs, agregación, subconsultas, DML/DDL, transacciones y funciones de ventana con un mini-motor SQL 100% en tu navegador.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗄️</text></svg>">
<style>
/* ============================================================
   CodeCamp · Sistema de diseño profesional
   ============================================================ */
:root{
  --bg:#f5f6fa; --card:#ffffff; --ink:#101828; --muted:#667085; --line:#e6e8ef; --line2:#eef0f6;
  --brand:#4f46e5; --brand-2:#7c3aed; --brand-ink:#3730a3; --brand-soft:#eef1ff; --brand-line:#dee3ff;
  --ok:#12855f; --ok-bg:#effaf4; --ok-line:#bfe8d4;
  --bad:#d92d20; --bad-bg:#fef3f2; --bad-line:#f9cfc9;
  --warn:#b54708; --warn-bg:#fffaeb; --warn-line:#fbe5a8;
  --info:#175cd3; --info-bg:#f2f7ff; --info-line:#cfe1fb;
  --code-bg:#0c1222; --code-head:#111a35;
  --sh-xs:0 1px 2px rgba(16,24,40,.06);
  --sh-sm:0 1px 3px rgba(16,24,40,.07), 0 8px 20px -8px rgba(16,24,40,.1);
  --sh-md:0 4px 10px rgba(16,24,40,.08), 0 18px 40px -16px rgba(16,24,40,.18);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.65;font-size:15.5px;-webkit-font-smoothing:antialiased}
::selection{background:#ddd9ff}
body.no-scroll{overflow:hidden}
button{font-family:inherit}
a{color:var(--brand)}
code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px}
code.inline,.qfb code,.box code,li code,p code,td code,.exsub code,.lmeta code,.frame-note code,.rmsg code,.ad-note code,.nd-hint code,.lead-text code{background:var(--brand-soft);border:1px solid var(--brand-line);padding:1px 6px;border-radius:6px;font-size:.87em;color:var(--brand-ink)}

/* ===== Layout base ===== */
.app{display:grid;grid-template-columns:290px minmax(0,1fr);align-items:start}
.maincol{min-width:0}
#backdrop{display:none}
#topbar{display:flex;align-items:center;gap:16px;background:var(--card);border-bottom:1px solid var(--line);padding:0 20px;min-height:58px;position:sticky;top:0;z-index:120}
.brand{display:flex;align-items:center;gap:11px;white-space:nowrap}
.logo-mark{width:32px;height:32px;flex:none;border-radius:9px;background:linear-gradient(135deg,var(--brand),var(--brand-2));display:grid;place-items:center;font-size:16px;box-shadow:var(--sh-xs)}
.brand-text{line-height:1.2}
.brand-text b{font-size:14.5px;letter-spacing:-.01em}
.brand-text small{display:block;color:var(--muted);font-size:11px;font-weight:600;letter-spacing:.02em}
.topprogress{flex:1;display:flex;align-items:center;gap:10px;min-width:120px}
.topprogress .bar{flex:1;height:8px;background:var(--line2);border-radius:99px;overflow:hidden}
.topprogress .bar>div{height:100%;width:0%;background:linear-gradient(90deg,var(--brand),var(--brand-2));border-radius:99px;transition:width .6s cubic-bezier(.22,1,.36,1)}
.topprogress span{font-size:12px;font-weight:700;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.chip.grade{font-size:12.5px;font-weight:700;padding:6px 13px;border-radius:99px;background:var(--line2);color:var(--muted);white-space:nowrap}
.chip.grade.g-good{background:var(--ok-bg);color:var(--ok);box-shadow:inset 0 0 0 1px var(--ok-line)}
.chip.grade.g-mid{background:var(--warn-bg);color:var(--warn);box-shadow:inset 0 0 0 1px var(--warn-line)}
.chip.grade.g-bad{background:var(--bad-bg);color:var(--bad);box-shadow:inset 0 0 0 1px var(--bad-line)}
#menuBtn{display:none;border:1px solid var(--line);background:#fff;border-radius:9px;font-size:17px;padding:4px 11px;cursor:pointer;color:var(--ink)}

/* ===== Sidebar ===== */
#sidebar{position:sticky;top:0;height:100vh;height:100dvh;background:var(--card);border-right:1px solid var(--line);overflow-y:auto;padding:14px 12px 48px}
.side-sec{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:800;margin:12px 8px 6px}
.sgroup{margin-bottom:8px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
.sgroup-head{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:transparent;border:none;padding:10px 12px;cursor:pointer;font-weight:700;font-size:13px;color:var(--ink)}
.sgroup-head:hover{background:#f7f8fc}
.sgroup-head .emo{font-size:15px;flex:none}
.sgroup-head .stitle-g{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sgroup-head .chev{color:var(--muted);transition:transform .25s;font-size:10.5px;flex:none}
.sgroup.open .sgroup-head .chev{transform:rotate(90deg)}
.sgroup-body{display:none;border-top:1px solid var(--line2);background:#fcfcfe}
.sgroup.open .sgroup-body{display:block}
.slesson{display:flex;align-items:center;gap:9px;width:100%;text-align:left;border:none;background:transparent;padding:7px 12px 7px 12px;cursor:pointer;font-size:12.8px;color:#3d4657;border-left:2px solid transparent}
.slesson:hover{background:#f4f6fd}
.slesson.active{background:var(--brand-soft);border-left-color:var(--brand);font-weight:700;color:var(--brand-ink)}
.slesson .num{flex:none;width:20px;height:20px;border-radius:50%;background:var(--line2);color:#5a6474;font-size:10.5px;font-weight:800;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.slesson.done .num{background:var(--ok);color:#fff}
.slesson .stitle{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slesson .sscore,.sextra .sscore{flex:none;font-size:10px;font-weight:800;color:var(--ok);background:var(--ok-bg);box-shadow:inset 0 0 0 1px var(--ok-line);border-radius:99px;padding:2px 7px;font-variant-numeric:tabular-nums}
.sextra{display:flex;align-items:center;gap:9px;width:100%;text-align:left;border:none;background:transparent;padding:9px 12px;margin-top:2px;border-radius:10px;cursor:pointer;font-size:13px;font-weight:650;color:#3d4657}
.sextra:hover{background:#f4f6fd}
.sextra .ico{flex:none;width:22px;text-align:center}

/* ===== Contenido ===== */
#content{padding:32px 38px 90px}
.view{max-width:880px;margin:0 auto;animation:fadeUp .3s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.lesson-head{margin-bottom:22px;padding-bottom:18px;border-bottom:1px solid var(--line)}
.lmodule{display:inline-flex;align-items:center;gap:7px;font-size:11px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--brand-ink);background:var(--brand-soft);box-shadow:inset 0 0 0 1px var(--brand-line);padding:4px 11px;border-radius:99px;margin-bottom:12px}
h1.ltitle{font-size:27px;line-height:1.28;letter-spacing:-.02em;font-weight:800}
.lmeta{color:var(--muted);font-size:12.5px;margin-top:7px;font-weight:600}
h3.sec{font-size:18.5px;margin:28px 0 10px;letter-spacing:-.015em;font-weight:750}
p.lead-text{margin:10px 0}
ul.nice,ol.nice{margin:10px 0 10px 4px;padding-left:22px}
ul.nice li,ol.nice li{margin:6px 0}
ul.nice li::marker{color:var(--brand)}
.frame-note{font-size:12.5px;color:var(--muted);margin:-8px 0 0;font-weight:550}

/* ===== Cajas de mensaje ===== */
.box{border-radius:12px;padding:13px 16px;margin:16px 0;border:1px solid;border-left-width:4px;font-size:14.5px}
.box .box-title{display:block;font-weight:750;margin-bottom:3px;font-size:13.5px}
.box.tip{background:#f2fbf7;border-color:var(--ok-line);border-left-color:#2fbf8f;color:#0d5138}
.box.tip .box-title{color:#0e9f6e}
.box.warn{background:var(--warn-bg);border-color:var(--warn-line);border-left-color:#f79009;color:#71400a}
.box.warn .box-title{color:var(--warn)}
.box.info{background:var(--info-bg);border-color:var(--info-line);border-left-color:#528bff;color:#1a3d8f}
.box.info .box-title{color:var(--info)}
.box.milestone{background:linear-gradient(115deg,#f7f4ff,#fdf3f9);border-color:#e7dbff;border-left-color:#8b5cf6;color:#432e7a}
.box.milestone .box-title{color:#6d28d9}

/* ===== Tablas de referencia ===== */
table.ref{width:100%;border-collapse:separate;border-spacing:0;margin:14px 0;font-size:13.5px;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:var(--sh-xs)}
table.ref th{background:#f8f9fc;text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:9px 14px}
table.ref td{padding:9px 14px;border-top:1px solid var(--line2);vertical-align:top}
table.ref td:first-child{white-space:nowrap;font-weight:650}

/* ===== Bloques de código ===== */
.codewrap{background:var(--code-bg);border-radius:12px;margin:16px 0;overflow:hidden;box-shadow:var(--sh-sm);border:1px solid #1c2748}
.codehead{display:flex;align-items:center;gap:10px;padding:9px 14px;background:var(--code-head);border-bottom:1px solid #1c2748}
.dots{display:flex;gap:6px;flex:none}
.dots i{width:10px;height:10px;border-radius:50%;display:block}
.dots i:nth-child(1){background:#ff5f57}.dots i:nth-child(2){background:#febc2e}.dots i:nth-child(3){background:#28c840}
.langtag{font-size:11px;font-weight:700;color:#8fa0c9;letter-spacing:.08em;text-transform:uppercase;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.copybtn{border:1px solid #2c3a63;background:transparent;color:#aebbe4;font-size:11.5px;padding:4px 10px;border-radius:7px;cursor:pointer;font-weight:700;flex:none}
.copybtn:hover{background:#1b2647;color:#fff}
.codewrap pre{padding:16px 18px;overflow-x:auto;font-size:13px;line-height:1.65;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#d7e0f7}
.tok-c{color:#7d8898;font-style:italic}
.tok-tag{color:#6ee7a0}
.tok-attr{color:#82aaff}
.tok-str{color:#9ecbff}
.tok-kw{color:#f97583}
.tok-num{color:#f8c763}
.tok-builtin{color:#c39cff}
.tok-doctype{color:#c39cff;font-weight:700}
.tok-sel{color:#6ee7a0}
.tok-prop{color:#82aaff}
.tok-val{color:#9ecbff}

/* ===== Editor en vivo ===== */
.edwrap{border:1px solid var(--line);border-radius:14px;overflow:hidden;margin:18px 0;background:#fff;box-shadow:var(--sh-sm)}
.edbar{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#f8f9fc;border-bottom:1px solid var(--line);padding:8px 14px}
.edfile{font-size:12px;font-weight:700;color:var(--muted);font-family:ui-monospace,Menlo,Consolas,monospace}
.edbtns{display:flex;gap:8px}
.runbtn,.resetbtn{border:1px solid transparent;border-radius:8px;padding:6px 13px;font-size:12px;font-weight:750;cursor:pointer}
.runbtn{background:#12b76a;color:#fff}
.runbtn:hover{background:#0e9f5e}
.resetbtn{background:#fff;border-color:var(--line);color:#3d4657}
.resetbtn:hover{background:#f4f6fd}
.edpanes{display:grid;grid-template-columns:1fr 1fr;min-height:230px}
.edpanes textarea{border:none;resize:vertical;outline:none;padding:14px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.8px;line-height:1.6;background:var(--code-bg);color:#d7e0f7;min-height:230px;border-right:1px solid var(--line);tab-size:2}
.edpanes iframe{border:none;width:100%;min-height:230px;background:#fff}
.edhint{font-size:12.5px;color:var(--muted);margin-top:-10px;margin-bottom:14px;padding:0 4px}

/* ===== Ejercicios ===== */
.exercise{border:1.5px dashed #c3caff;border-radius:16px;padding:20px;margin:24px 0;background:#fdfdff}
.exhead{font-size:17.5px;font-weight:800;margin-bottom:5px;letter-spacing:-.01em}
.exsub{font-size:13.5px;color:var(--muted);margin-bottom:12px}
.checks{margin:14px 0 6px;display:grid;gap:6px}
.check{display:flex;align-items:center;gap:9px;font-size:13px;background:#f8f9fc;border:1px solid var(--line);border-radius:10px;padding:7px 12px;transition:all .2s}
.check .cic{flex:none;width:20px;height:20px;border-radius:50%;background:var(--line2);display:grid;place-items:center;font-size:11px;font-weight:900;color:#6a7386}
.check.okp{background:var(--ok-bg);border-color:var(--ok-line)}
.check.okp .cic{background:var(--ok);color:#fff}
.check.failp{background:var(--bad-bg);border-color:var(--bad-line)}
.check.failp .cic{background:var(--bad);color:#fff}
.check .pts{margin-left:auto;font-size:10.5px;font-weight:800;color:var(--muted);white-space:nowrap}

/* ===== Quizzes ===== */
.quiz{border:1px solid var(--line);border-radius:16px;padding:22px;margin:32px 0 10px;background:linear-gradient(180deg,#fbfcff,#f7f8fd);box-shadow:var(--sh-xs)}
.quiz-title{font-size:20px;margin-bottom:2px;font-weight:800;letter-spacing:-.01em}
.quiz-sub{font-size:13px;color:var(--muted);margin-bottom:16px}
.qcard{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin:12px 0;box-shadow:var(--sh-xs)}
.qq{font-weight:700;font-size:14.5px;margin-bottom:4px}
.qpts{display:inline-block;font-size:10.5px;font-weight:800;color:var(--brand-ink);background:var(--brand-soft);box-shadow:inset 0 0 0 1px var(--brand-line);border-radius:99px;padding:1px 9px;margin-bottom:10px}
.opts{display:grid;gap:8px;margin-top:8px}
.opt{text-align:left;border:1px solid #d4d9e3;background:#fff;border-radius:10px;padding:10px 14px;font-size:13.8px;cursor:pointer;transition:all .15s;display:flex;gap:10px;align-items:flex-start;color:var(--ink)}
.opt .ol{flex:none;width:22px;height:22px;border-radius:7px;background:#f2f4f7;display:grid;place-items:center;font-size:11px;font-weight:900;color:#5a6474;margin-top:1px}
.opt:hover{border-color:#a5acff;background:#f8f9ff}
.opt.sel{border-color:var(--brand);background:var(--brand-soft);box-shadow:0 0 0 1px var(--brand)}
.opt.sel .ol{background:var(--brand);color:#fff}
.opt.locked{cursor:default;pointer-events:none}
.opt.reveal{border-color:var(--ok-line);background:var(--ok-bg)}
.opt.reveal .ol{background:var(--ok);color:#fff}
.opt.correct{border-color:var(--ok);box-shadow:0 0 0 1px var(--ok)}
.opt.incorrect{border-color:var(--bad);box-shadow:0 0 0 1px var(--bad)}
.fillwrap{margin-top:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.fillwrap input{flex:1;min-width:200px;border:1px solid #d4d9e3;border-radius:10px;padding:9px 13px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;outline:none;background:#fff;color:var(--ink)}
.fillwrap input:focus{border-color:var(--brand);box-shadow:0 0 0 3px #e3e0ff}
.fillwrap .hint{font-size:11.5px;color:var(--muted)}
.quiz-actions{margin-top:16px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.quiz-remain{font-size:12px;color:var(--muted);font-weight:650}
.quiz-result{display:none;margin-top:16px;border-radius:14px;padding:18px;position:relative;text-align:center;border:1px solid var(--line);background:#fff;box-shadow:var(--sh-xs)}
.quiz-result.show{display:block}
.bigscore{font-size:36px;font-weight:850;letter-spacing:-.03em}
.bigscore small{font-size:15px;color:var(--muted);font-weight:700}
.rmsg{font-size:14px;margin-top:2px}

/* ===== Botones ===== */
.btn{border:none;border-radius:10px;padding:10px 18px;font-size:13.5px;font-weight:750;cursor:pointer;background:var(--brand);color:#fff;box-shadow:var(--sh-xs);transition:background .15s,transform .15s,box-shadow .15s;letter-spacing:.005em}
.btn:hover{background:#4338ca;transform:translateY(-1px);box-shadow:var(--sh-sm)}
.btn:active{transform:none}
.btn.ghost{background:#fff;color:#3d4657;border:1px solid #d4d9e3;box-shadow:none}
.btn.ghost:hover{background:#f7f8fc;color:var(--ink);box-shadow:none}
.btn.small{padding:7px 13px;font-size:12px;border-radius:9px}
.btn.green{background:#12b76a}
.btn.green:hover{background:#0e9f5e}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}

/* ===== Navegación entre lecciones ===== */
.navbtns{display:flex;justify-content:space-between;gap:12px;margin-top:36px;padding-top:18px;border-top:1px solid var(--line)}
.navbtns .btn{max-width:48%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ===== Árbol DOM ===== */
.domtree{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin:16px 0;box-shadow:var(--sh-xs);font-size:13px}
.domtree ul{list-style:none;padding-left:26px;border-left:2px dashed #d0d5e2;margin-left:8px}
.dnode{display:inline-block;border-radius:8px;padding:3px 11px;margin:3px 0;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;font-weight:700;border:1px solid}
.dnode.doc{background:#fffaeb;border-color:#fbe5a8;color:#7a4b06}
.dnode.tag{background:#effaf4;border-color:#bfe8d4;color:#0d5c42}
.dnode.idn{background:var(--brand-soft);border-color:var(--brand-line);color:var(--brand-ink)}
.dnode.text{background:#fdf2f8;border-color:#f9c7e2;color:#9d1e5f;font-weight:650}

/* ===== Demo appendChild ===== */
.appenddemo{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin:16px 0;box-shadow:var(--sh-xs)}
.ad-code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;background:var(--code-bg);color:#6ee7a0;padding:9px 13px;border-radius:9px;margin-bottom:12px}
.ad-list{list-style:none;padding:0;margin:12px 0}
.ad-list li{background:var(--brand-soft);border:1px solid var(--brand-line);color:var(--brand-ink);border-radius:9px;padding:6px 12px;font-size:12.5px;font-weight:700;margin:6px 0;animation:pop .3s cubic-bezier(.34,1.56,.64,1) both}
@keyframes pop{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:scale(1)}}
.ad-note{font-size:12.5px;color:var(--muted);margin-top:8px}
.ad-actions{display:flex;gap:8px;flex-wrap:wrap}

/* ===== Demo navbar ===== */
.navdemo{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin:16px 0;box-shadow:var(--sh-xs)}
.nd-bar{background:#0d6efd;border-radius:11px;padding:10px 16px;display:flex;align-items:center;gap:14px;color:#fff;position:relative}
.nd-brand{font-weight:750;font-size:15px}
.nd-tog{margin-left:auto;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:8px;padding:3px 10px;font-size:15px;cursor:pointer}
.nd-menu{display:flex;gap:18px;margin-left:auto}
.nd-menu a{color:#fff;text-decoration:none;font-size:13.5px;opacity:.9;cursor:pointer}
.nd-menu a:hover{opacity:1;text-decoration:underline}
.nd-menu.colapsado{display:none}
.nd-menu.abierto{display:flex !important;position:absolute;top:46px;right:14px;flex-direction:column;background:#0d6efd;padding:12px 18px;border-radius:11px;box-shadow:var(--sh-md);gap:10px;margin:0}
.nd-hint{font-size:12.5px;color:var(--muted);margin-top:10px}

/* ===== Demo localStorage ===== */
.storedemo{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin:16px 0;box-shadow:var(--sh-xs)}
.sd-row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.sd-row input{flex:1;min-width:180px;border:1px solid #d4d9e3;border-radius:10px;padding:9px 13px;font-size:14px;outline:none;background:#fff;color:var(--ink)}
.sd-row input:focus{border-color:var(--brand);box-shadow:0 0 0 3px #e3e0ff}
.sd-out{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;background:var(--code-bg);color:#9ecbff;border-radius:10px;padding:12px 14px;margin-top:10px;min-height:44px;white-space:pre-wrap}
.sd-note{font-size:12px;color:var(--warn);margin-top:8px;font-weight:600}

/* ===== Marco de demo de la app ===== */
.appframe-wrap{border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--sh-sm);margin:18px 0 8px;background:#fff}
.appframe-bar{display:flex;align-items:center;gap:7px;background:#f2f4f7;border-bottom:1px solid var(--line);padding:9px 13px}
.appframe-bar i{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.appframe-bar .url{flex:1;background:#fff;border:1px solid var(--line);border-radius:99px;font-size:11.5px;color:var(--muted);padding:3px 12px;font-family:ui-monospace,Menlo,Consolas,monospace;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.appframe{width:100%;height:440px;border:none;display:block;background:#eef2f7}

/* ===== Inicio ===== */
.hero{border-radius:20px;color:#fff;padding:46px 42px;margin-bottom:28px;position:relative;overflow:hidden;box-shadow:var(--sh-md);
  background:
    radial-gradient(640px 320px at 88% -12%, rgba(139,92,246,.45), transparent 62%),
    radial-gradient(520px 280px at -8% 112%, rgba(56,130,246,.38), transparent 62%),
    linear-gradient(135deg,#1b1740 0%,#282364 55%,#342a80 100%)}
.hero h1{font-size:33px;line-height:1.22;letter-spacing:-.025em;font-weight:800;max-width:600px;position:relative;z-index:1}
.hero h1 u{text-decoration-color:#a78bfa;text-decoration-thickness:3px;text-underline-offset:5px}
.hero p{margin:14px 0 0;max-width:590px;font-size:15px;color:#d4d9f6;position:relative;z-index:1}
.hero .hero-ctas{margin-top:24px;display:flex;gap:10px;flex-wrap:wrap;position:relative;z-index:1}
.hero .btn{background:#fff;color:#312e81;box-shadow:0 2px 8px rgba(10,8,40,.35)}
.hero .btn:hover{background:#f1efff;transform:translateY(-1px)}
.hero .btn.ghost{background:rgba(255,255,255,.1);color:#fff;border-color:rgba(255,255,255,.45);box-shadow:none}
.hero .btn.ghost:hover{background:rgba(255,255,255,.18);color:#fff}
.hero-stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:26px;position:relative;z-index:1}
.stat{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);border-radius:12px;padding:9px 15px;font-size:11.5px;font-weight:700;color:#cfd4f2;letter-spacing:.02em}
.stat b{display:block;font-size:18px;color:#fff;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.home-sec{margin:36px 0 14px;font-size:20px;font-weight:800;letter-spacing:-.02em;display:flex;align-items:center;gap:10px}
.home-sec::before{content:"";width:26px;height:4px;border-radius:99px;background:linear-gradient(90deg,var(--brand),var(--brand-2));flex:none}
.modules-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(252px,1fr));gap:14px}
.mcard{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--sh-xs);display:flex;flex-direction:column;gap:9px;transition:transform .18s,box-shadow .18s}
.mcard:hover{transform:translateY(-2px);box-shadow:var(--sh-sm)}
.mcard .mce{width:40px;height:40px;border-radius:10px;background:var(--brand-soft);display:grid;place-items:center;font-size:21px}
.mcard h4{font-size:15px;letter-spacing:-.01em}
.mcard p{font-size:12.5px;color:var(--muted);flex:1}
.mcard .mprog{height:7px;background:var(--line2);border-radius:99px;overflow:hidden}
.mcard .mprog>div{height:100%;background:linear-gradient(90deg,var(--brand),var(--brand-2));border-radius:99px;transition:width .5s}
.mcard .mlinks{font-size:11px;font-weight:750;color:var(--muted);letter-spacing:.03em;text-transform:uppercase}
.mcard .btn{align-self:flex-start}

/* ===== Boleta / certificado ===== */
.grade-hero{background:linear-gradient(135deg,#141a2e,#1d2647);border-radius:18px;color:#fff;padding:28px 30px;display:flex;gap:28px;align-items:center;flex-wrap:wrap;margin:18px 0;box-shadow:var(--sh-md)}
.bigpct{font-size:52px;font-weight:850;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
.bigpct small{font-size:17px;color:#8b96b8;font-weight:700}
.grade-hero .gh-info{flex:1;min-width:240px}
.grade-hero .gh-info h3{font-size:17px;letter-spacing:-.01em}
.grade-hero .gh-info p{color:#9aa6c8;font-size:13px;margin-top:5px}
table.rep{width:100%;border-collapse:separate;border-spacing:0;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:var(--sh-xs);font-size:13px;margin:14px 0}
table.rep th{background:#f8f9fc;text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:9px 14px}
table.rep td{padding:8px 14px;border-top:1px solid var(--line2)}
table.rep td .rbar{height:6px;background:var(--line2);border-radius:99px;overflow:hidden;min-width:90px}
table.rep td .rbar>div{height:100%;background:linear-gradient(90deg,var(--brand),var(--brand-2));border-radius:99px}
.st-chip{font-size:10.5px;font-weight:800;border-radius:99px;padding:3px 10px}
.st-done{background:var(--ok-bg);color:var(--ok);box-shadow:inset 0 0 0 1px var(--ok-line)}
.st-todo{background:var(--line2);color:var(--muted)}
.cert{border:1px solid var(--line);background:#fff;background-image:radial-gradient(420px 200px at 50% -40%,#f2f0ff,transparent 70%);border-radius:18px;padding:36px 28px;text-align:center;margin:26px 0;box-shadow:var(--sh-sm)}
.cert .cert-kicker{font-size:10.5px;letter-spacing:.3em;text-transform:uppercase;color:var(--muted);font-weight:800}
.cert h2{font-size:24px;margin:8px 0 2px;letter-spacing:-.02em}
.cert .cert-name{font-size:30px;font-weight:850;background:linear-gradient(90deg,var(--brand),var(--brand-2));-webkit-background-clip:text;background-clip:text;color:transparent;margin:12px 0 4px}
.cert .cert-meta{color:var(--muted);font-size:13px}
.namebox{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:14px 0}
.namebox input{border:1px solid #d4d9e3;border-radius:10px;padding:10px 15px;font-size:14px;outline:none;min-width:230px;background:#fff;color:var(--ink)}
.namebox input:focus{border-color:var(--brand);box-shadow:0 0 0 3px #e3e0ff}

/* ===== Proyecto final ===== */
.filetree{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;background:var(--code-bg);color:#c7d3f2;border-radius:12px;padding:16px 20px;margin:14px 0;white-space:pre;overflow-x:auto;line-height:1.75;box-shadow:var(--sh-sm)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:16px 0 0}
.tab{border:1px solid var(--line);border-bottom:none;background:#f4f6fd;border-radius:10px 10px 0 0;padding:8px 15px;font-size:12px;font-weight:750;cursor:pointer;color:#4a5468;font-family:ui-monospace,Menlo,Consolas,monospace}
.tab:hover{background:#ebeefb}
.tab.active{background:var(--code-bg);color:#8fe7b1;border-color:var(--code-bg)}
.tabfile .codewrap{margin-top:0;border-radius:0 12px 12px 12px}

/* ===== Pasos ===== */
ol.steps{counter-reset:paso;list-style:none;margin:14px 0;padding:0}
ol.steps li{counter-increment:paso;position:relative;padding:0 0 15px 46px;margin:0}
ol.steps li::before{content:counter(paso);position:absolute;left:0;top:0;width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff;font-weight:800;font-size:13px;display:grid;place-items:center;box-shadow:0 2px 6px rgba(79,70,229,.35)}
ol.steps li:not(:last-child)::after{content:"";position:absolute;left:13px;top:31px;bottom:3px;width:2px;background:var(--brand-line)}

/* ===== Confeti ===== */
.confetti-layer{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:5}
.confetti-layer i{position:absolute;top:-14px;width:8px;height:14px;border-radius:2px;animation:cfall linear forwards}
@keyframes cfall{to{transform:translateY(480px) rotate(720deg);opacity:.15}}

/* ===== Examen ===== */
.exam-head{background:linear-gradient(135deg,#171c33,#232a56);border-radius:18px;color:#fff;padding:30px 32px;margin-bottom:22px;box-shadow:var(--sh-md)}
.exam-head h1{font-size:24px;letter-spacing:-.02em}
.exam-head p{color:#c3cdf0;font-size:13.5px;margin-top:7px;max-width:640px}

/* ===== Scrollbars ===== */
#sidebar::-webkit-scrollbar{width:10px}
#sidebar::-webkit-scrollbar-thumb{background:#cfd4e0;border-radius:99px;border:2px solid var(--bg)}
#sidebar::-webkit-scrollbar-track{background:transparent}

/* ===== Libro de texto ===== */
.book-pills{display:flex;gap:7px;flex-wrap:wrap;margin:14px 0 20px}
.bpill{border:1px solid var(--line);background:#fff;border-radius:99px;padding:7px 13px;font-size:12px;font-weight:750;cursor:pointer;color:#3d4657}
.bpill:hover{background:#f4f6fd}
.bpill.active{background:var(--brand);border-color:var(--brand);color:#fff}

/* ===== Login / cuentas ===== */
.chip.user{display:none;font-size:12px;font-weight:750;padding:6px 12px;border-radius:99px;background:var(--brand-soft);color:var(--brand-ink);border:none;cursor:pointer;font-family:inherit;white-space:nowrap}
.chip.user:hover{background:#e2e6ff}
#authLayer{display:none}
#authLayer.show{display:block;position:fixed;inset:0;z-index:100;overflow-y:auto;
  background:
    radial-gradient(700px 340px at 85% -10%, rgba(139,92,246,.5), transparent 60%),
    radial-gradient(560px 300px at -5% 110%, rgba(56,130,246,.45), transparent 60%),
    linear-gradient(135deg,#171338 0%,#241f5c 55%,#302774 100%)}
.auth-wrap{min-height:100%;display:grid;place-items:center;padding:28px 16px}
.auth-card{width:100%;max-width:430px;background:#fff;border-radius:20px;box-shadow:0 24px 70px rgba(8,6,30,.5);overflow:hidden}
.auth-head{padding:26px 28px 0;text-align:center}
.auth-logo{width:52px;height:52px;border-radius:14px;background:linear-gradient(135deg,var(--brand),var(--brand-2));display:grid;place-items:center;font-size:26px;margin:0 auto 12px;box-shadow:0 8px 20px rgba(79,70,229,.4)}
.auth-head h1{font-size:20px;letter-spacing:-.02em}
.auth-head p{font-size:12.5px;color:var(--muted);margin-top:4px}
.auth-tabs{display:flex;gap:4px;margin:18px 20px 0;background:var(--line2);border-radius:11px;padding:4px}
.auth-tab{flex:1;border:none;background:transparent;border-radius:8px;padding:8px 10px;font-size:13px;font-weight:750;cursor:pointer;color:var(--muted);font-family:inherit}
.auth-tab.active{background:#fff;color:var(--ink);box-shadow:var(--sh-xs)}
.auth-body{padding:18px 24px 8px;display:grid;gap:11px}
.auth-field label{display:block;font-size:12px;font-weight:750;color:var(--muted);margin-bottom:4px}
.auth-field input{width:100%;border:1px solid #d4d9e3;border-radius:10px;padding:10px 13px;font-size:14px;outline:none;font-family:inherit;color:var(--ink)}
.auth-field input:focus{border-color:var(--brand);box-shadow:0 0 0 3px #e3e0ff}
.auth-msg{font-size:12.5px;font-weight:650;border-radius:9px;padding:8px 12px;display:none}
.auth-msg.show{display:block}
.auth-msg.err{background:var(--bad-bg);color:var(--bad);box-shadow:inset 0 0 0 1px var(--bad-line)}
.auth-msg.ok{background:var(--ok-bg);color:var(--ok);box-shadow:inset 0 0 0 1px var(--ok-line)}
.auth-users{font-size:11.5px;color:var(--muted);text-align:center}
.auth-actions{padding:6px 24px 4px;display:grid;gap:9px}
.auth-div{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:11.5px;font-weight:700}
.auth-div::before,.auth-div::after{content:"";flex:1;height:1px;background:var(--line)}
.auth-note{padding:10px 24px 4px;text-align:center;font-size:11px;color:var(--muted);line-height:1.55}
.auth-reset{background:none;border:none;color:var(--muted);font-size:11px;cursor:pointer;text-decoration:underline;display:block;margin:0 auto;padding:2px 24px 22px;font-family:inherit;width:100%}
.auth-reset:hover{color:var(--bad)}

/* ===== Responsive ===== */
@media (max-width:920px){
  .app{grid-template-columns:1fr}
  #sidebar{position:fixed;z-index:60;width:296px;top:0;bottom:0;left:-316px;transition:left .28s ease;box-shadow:var(--sh-md)}
  #sidebar.open{left:0}
  #backdrop{display:none;position:fixed;inset:0;background:rgba(16,24,40,.45);z-index:55}
  #backdrop.show{display:block}
  #menuBtn{display:block}
  .topprogress span{display:none}
  .brand-text small{display:none}
  #content{padding:22px 16px 80px}
  .edpanes{grid-template-columns:1fr}
  .edpanes textarea{border-right:none;border-bottom:1px solid var(--line);min-height:170px}
  .edpanes iframe{min-height:200px}
  .hero{padding:32px 22px}
  .hero h1{font-size:25px}
  .grade-hero{padding:22px}
}
@media print{
  #sidebar,#topbar,#backdrop,.navbtns,.namebox,.frame-note{display:none !important}
  body{background:#fff}
  .app{display:block}
  #content{padding:0}
}

/* ===== Curso SQL: ejercicios, resultados y playground ===== */
.sqltask{border:1px solid #e2e8f0;border-radius:14px;padding:14px;margin:12px 0;background:#fff}
.sqltask.solved{border-color:#86efac;background:#f6fef9}
.sqlq{display:flex;gap:10px;align-items:flex-start;font-weight:600;font-size:14.5px}
.sqlq .tnum{flex:none;background:#eef2ff;color:#4338ca;border-radius:8px;padding:2px 9px;font-weight:800}
.sqlq .tq{flex:1;min-width:0}
.sqlq .qpts{flex:none;color:#64748b;font-size:12px;font-weight:800;background:#f1f5f9;padding:2px 8px;border-radius:99px}
.sqlq .tst{flex:none;color:#16a34a;font-weight:800;font-size:12.5px;white-space:nowrap}
.sqlta{width:100%;min-height:96px;margin-top:10px;font:13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;border:1.5px solid #cbd5e1;border-radius:12px;padding:10px 12px;resize:vertical;background:#0f172a;color:#e2e8f0;line-height:1.5;box-sizing:border-box}
.sqlta:focus{outline:none;border-color:#6366f1;box-shadow:0 0 0 3px rgba(99,102,241,.15)}
.sqlbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.btn.small.good{background:#16a34a;color:#fff}
.sqlout{margin-top:10px}
.sql-twrap{overflow-x:auto;border:1px solid #e2e8f0;border-radius:12px}
table.sqlrt{border-collapse:collapse;width:100%;font-size:13px;background:#fff}
.sqlrt th{background:#f1f5f9;text-align:left;padding:8px 10px;border-bottom:2px solid #e2e8f0;white-space:nowrap;font-size:12px;letter-spacing:.02em}
.sqlrt td{padding:7px 10px;border-bottom:1px solid #eef2f7;white-space:nowrap}
.sqlrt tr:last-child td{border-bottom:none}
.sqlrt td.nulld{color:#94a3b8;font-style:italic;background:#fafafa}
.sql-note{font-size:12px;color:#64748b;font-weight:700;margin:6px 2px 0}
.sqlerr{background:#fef2f2;border:1px solid #fecaca;color:#b91c1c;border-radius:12px;padding:10px 14px;font-size:13.5px;font-weight:600;white-space:pre-wrap}
.sqlmsg{background:#f8fafc;border:1px dashed #cbd5e1;border-radius:12px;padding:10px 14px;font-size:13.5px;color:#475569}
.sql-empty{background:#f0fdf4;border:1px solid #bbf7d0;border-radius:12px;padding:10px 14px;font-size:13.5px;color:#166534;font-weight:600}
.sqlok{background:#f0fdf4;border:1px solid #bbf7d0;border-radius:12px;padding:10px 14px;font-size:13.5px;color:#166534;font-weight:600}
.sqlno{background:#fffbeb;border:1px solid #fde68a;border-radius:12px;padding:10px 14px;font-size:13.5px;color:#92400e}
.sqlhint{margin-top:8px}
.sqlhint summary,.sqlsol summary{cursor:pointer;font-size:13px;font-weight:700;color:#4f46e5}
.sqlhint p{margin:6px 0 0;font-size:13.5px;color:#475569}
.sqlsol{margin-top:8px}
.sqlsolcode{background:#0f172a;color:#a5f3fc;font:12.5px ui-monospace,SFMono-Regular,Menlo,monospace;border-radius:12px;padding:12px;overflow-x:auto;white-space:pre}
.sqlscore{margin-top:10px;font-weight:800;color:#4338ca;font-size:13.5px}
.pgwrap{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(260px,1fr);gap:18px;align-items:start}
@media(max-width:900px){.pgwrap{grid-template-columns:1fr}}
.pgta{min-height:180px}
.pgchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chipq{border:1px solid #e2e8f0;background:#f8fafc;border-radius:99px;padding:5px 11px;font:12px ui-monospace,monospace;color:#334155;cursor:pointer}
.chipq:hover{background:#eef2ff;border-color:#c7d2fe}
.pgschema details{border:1px solid #eef2f7;border-radius:10px;padding:8px 10px;margin:6px 0}
.pgschema summary{cursor:pointer;font-weight:700;font-size:13.5px}
.pgschema ul{margin:6px 0 0;padding-left:18px;font-size:12.5px}
.pgschema small{color:#94a3b8}
.pgview{font-size:12.5px;color:#64748b;margin:4px 0}
.pgcheat{background:#f8fafc;border:1px solid #eef2f7;border-radius:12px;padding:10px 12px}
.pgcheat p{margin:4px 0;font:12px ui-monospace,monospace;color:#334155}
.pgnote{margin-top:10px}
.pgnote summary{cursor:pointer;font-weight:700;font-size:13px;color:#4f46e5}
.ersvg{width:100%;height:auto;background:#fff;border:1px solid #eef2f7;border-radius:14px}
.erwrap{margin:14px 0}
</style>

<div class="app">
  <aside id="sidebar" aria-label="Índice del curso"></aside>

  <div class="maincol">
    <header id="topbar">
      <button id="menuBtn" title="Abrir índice" aria-label="Abrir índice">☰</button>
      <div class="brand">
        <span class="logo-mark">🗄️</span>
        <span class="brand-text"><b>CodeCamp</b><small>Curso interactivo · Bases de datos SQL</small></span>

    <main id="content" tabindex="-1">
      <noscript>
        <div class="view" style="padding-top:40px">
          <div class="box warn">
            <span class="box-title">⚠️ JavaScript está desactivado</span>
            Este curso es interactivo y necesita JavaScript para mostrarse. Habilítalo en tu navegador

          </div>
        </div>
      </noscript>
    </main>
  </div>
</div>
<div id="authLayer"></div>
<script>

'use strict';
/* ============================================================
   CONTENIDO DEL CURSO — Módulos 1 y 2
   ============================================================ */
'use strict';
/* ============================================================
   CURSO 2 · JAVASCRIPT Y EL JUEGO DE MEMORIA
   Plataforma compartida con el Curso 1 (misma base de cuentas)
   ============================================================ */
'use strict';
/* ============================================================
   CURSO 2 · JAVASCRIPT Y EL JUEGO DE MEMORIA — Contenido
   ============================================================ */
'use strict';
const MODULES = [];

'use strict';
/* ============================================================
   CURSO 4 · BASES DE DATOS SQL DESDE CERO
   Plataforma compartida con los cursos 1-3 (misma base de cuentas)
   Mini-motor SQLE + base «Librería Esperanza» + 30 lecciones
   ============================================================ */
/* ============================================================
   CURSO SQL — CONTENIDO parte A (Módulos 0–3)
   Se ejecuta tras definir SQLE_DB_FRESH y SQLE (motor).
   ============================================================ */
MODULES.push({
  id:'m0', emoji:'🧭', name:'Conoce las bases de datos', color:'#64748b',
  desc:'Qué es una base de datos relacional, quién usa qué motor y tu primer contacto con el playground.',
  lessons:[

  /* -------- 0-1 -------- */
  { id:'0-1', title:'¿Qué es una base de datos y por qué no vives sin ellas?', time:'12 min', blocks:[
    {t:'p', h:'Una <b>base de datos relacional</b> guarda información en <b>tablas</b>: cada tabla es una cuadrícula de <b>filas</b> (un registro: un libro, un cliente) y <b>columnas</b> (un dato: título, precio). Lo «relacional» significa que las tablas se conectan entre sí por llaves: una venta apunta al cliente que la hizo y al libro vendido. WhatsApp, tu banco, Netflix y la app del súper viven sobre este modelo.'},
    {t:'table', head:['Concepto','Equivale a','Ejemplo en el curso'], rows:[
      ['<b>Tabla</b> (tabla)','Una hoja de Excel','<code>libros</code>'],
      ['<b>Fila</b> (registro)','Una línea de la hoja','El libro «Ficciones»'],
      ['<b>Columna</b> (campo)','Una columna con encabezado','<code>precio</code>'],
      ['<b>Llave primaria</b>','El número de boleta: único e irrepetible','<code>libros.id</code>'],
      ['<b>Llave foránea</b>','Una referencia a otra tabla','<code>ventas.libro_id</code> → <code>libros.id</code>'],
      ['<b>NULL</b>','«Este dato no se sabe / no aplica»','Un cliente sin email']
    ]},
    {t:'p', h:'¿Por qué no una hoja de Excel? Tres razones que vivirás en este curso: <b>1)</b> integridad — la base se NEGOCIA a guardar un cliente duplicado o una venta sin fecha; <b>2)</b> consultas — «las 10 categorías más vendidas en marzo» es una línea de SQL, no tres horas de copiar-pegar; <b>3)</b> concurrencia — miles de personas escriben a la vez sin pisarse. Excel gana para una lista personal; la base de datos gana en cuanto hay reglas, volumen o varias personas.'},

MODULES.push({

  { id:'1-1', title:'SELECT … FROM: elegir columnas de una tabla', time:'15 min', blocks:[
    {t:'p', h:'Toda consulta de lectura empieza con <b>SELECT</b> (qué columnas quiero) y <b>FROM</b> (de qué tabla). El orden de las palabras es FIJO: <code>SELECT … FROM …;</code> y cierra con punto y coma. Puedes pedir columnas en cualquier orden e incluso repetirlas; el resultado las muestra como las pidas.'},

SELECT titulo, precio, stock FROM libros; -- varias, en el orden que pidas
SELECT * FROM libros;                    -- todas (útil para explorar)`},
    {t:'list', items:[

      {q:'Muestra <code>titulo</code> y el precio con un 10% de descuento, con alias <code>oferta</code>. Pista: <code>precio * 0.9</code>.', check:{cols:['titulo','oferta'], rows:16}, solution:'SELECT titulo, precio * 0.9 AS oferta FROM libros;', pts:30},

  /* -------- 1-2 -------- */
  { id:'1-2', title:'WHERE: filtrar filas con condiciones', time:'15 min', blocks:[
    {t:'p', h:'<b>WHERE</b> filtra filas: solo pasan las que cumplen la condición. Los comparadores: <code>=</code> igual, <code>&lt;&gt;</code> o <code>!=</code> distinto, <code>&lt;</code>, <code>&gt;</code>, <code>&lt;=</code>, <code>&gt;=</code>. Combina condiciones con <b>AND</b> (todas), <b>OR</b> (cualquiera) y <b>NOT</b> (niega); usa paréntesis para dejar claro el orden — como en matemáticas.'},
    {t:'code', lang:'sql', title:'WHERE en acción', code:`SELECT titulo, precio FROM libros WHERE precio > 300;

SELECT titulo FROM libros
WHERE categoria = 'Cuentos' AND precio < 200;

SELECT titulo FROM libros
WHERE (categoria = 'Novela' OR categoria = 'Cuentos') AND stock > 5;

SELECT titulo FROM libros WHERE NOT (anio < 1980);`},
    {t:'warn', title:'⚠️ Un solo = para comparar', h:'SQL usa UN signo igual para comparar (<code>precio = 200</code>), no doble igual como JavaScript. Y los textos van SIEMPRE entre comillas simples: <code>WHERE ciudad = \'Mérida\'</code> — las comillas dobles quedan para identificadores en algunos motores.'},
    {t:'sqlex', title:'🧪 Practica WHERE', tasks:[
      {q:'Los libros con precio mayor a 300: muestra <code>titulo</code> y <code>precio</code>.', check:{rows:[['Rayuela',340],['Cien años de soledad',320.5],['La casa de los espíritus',310]]}, solution:'SELECT titulo, precio FROM libros WHERE precio > 300 ORDER BY titulo;', pts:20},
      {q:'Los clientes de «Ciudad de México»: muestra su <code>nombre</code>.', check:{rows:[['Ana Torres'],['Carlos Sánchez']]}, solution:'SELECT nombre FROM clientes WHERE ciudad = \'Ciudad de México\' ORDER BY nombre;', pts:20},
      {q:'Libros de categoría «Novela» con stock mayor a 5: <code>titulo</code> y <code>stock</code>.', check:{rows:[['La ciudad y los perros',10],['La hora de la estrella',14],['Rayuela',6]]}, solution:'SELECT titulo, stock FROM libros WHERE categoria = \'Novela\' AND stock > 5 ORDER BY titulo;', pts:20},
      {q:'Ventas con total entre 300 y 500 inclusive: <code>id</code> y <code>total</code>. Pista: AND con dos comparaciones.', check:{rows:10}, solution:'SELECT id, total FROM ventas WHERE total >= 300 AND total <= 500 ORDER BY id;', pts:20},
      {q:'Autores que NO sean de Argentina: <code>nombre</code> y <code>pais</code>.', check:{rows:6}, solution:'SELECT nombre, pais FROM autores WHERE pais <> \'Argentina\' ORDER BY nombre;', pts:20}
    ]}
  ]},

  /* -------- 1-3 -------- */
  { id:'1-3', title:'ORDER BY, LIMIT y DISTINCT: ordenar, recortar, uniqüizar', time:'15 min', blocks:[
    {t:'p', h:'<b>ORDER BY</b> ordena el resultado: <code>ASC</code> ascendente (el default) o <code>DESC</code> descendente. Puedes ordenar por varias columnas: <code>ORDER BY categoria ASC, precio DESC</code> — agrupa por categoría y dentro de cada una deja el más caro primero. <b>LIMIT n</b> recorta el resultado a n filas (con <code>OFFSET m</code> salta las primeras m: la base de la paginación).'},
    {t:'code', lang:'sql', title:'el top N clásico', code:`-- los 3 libros más caros
SELECT titulo, precio FROM libros ORDER BY precio DESC LIMIT 3;

-- paginación: "página 3" de 10 en 10
SELECT titulo FROM libros ORDER BY titulo LIMIT 10 OFFSET 20;

-- ordenar por posición de columna (1 = la primera del SELECT)
SELECT titulo, precio FROM libros ORDER BY 2 DESC LIMIT 2;`},
    {t:'p', h:'<b>DISTINCT</b> elimina filas duplicadas del resultado: <code>SELECT DISTINCT categoria FROM libros</code> da el catálogo de categorías sin repetir. Ojo: DISTINCT considera TODA la fila; <code>SELECT DISTINCT ciudad, pais</code> solo quita pares ciudad+pais repetidos.'},
    {t:'sqlex', title:'🧪 Practica orden y recorte', tasks:[

      {q:'La venta con el total más alto: <code>id</code> y <code>total</code> (una sola fila).', check:{rows:[[12,641]]}, solution:'SELECT id, total FROM ventas ORDER BY total DESC LIMIT 1;', pts:25},
      {q:'Clientes ordenados por ciudad (A→Z) y dentro de cada ciudad por nombre (Z→A). Muestra <code>ciudad</code> y <code>nombre</code>.', check:{rows:8, orderInsensitive:false}, solution:'SELECT ciudad, nombre FROM clientes ORDER BY ciudad ASC, nombre DESC;', pts:25}

  /* -------- 1-4 -------- */
  { id:'1-4', title:'LIKE, IN y BETWEEN: filtrar por patrones y rangos', time:'15 min', blocks:[
    {t:'p', h:'<b>LIKE</b> compara contra un patrón: <code>%</code> reemplaza CUALQUIER cadena (inclusive vacía) y <code>_</code> reemplaza UN carácter exacto. <code>\'La %\'</code> = empieza con «La »; <code>\'%de%\'</code> = contiene «de»; <code>\'_l %\'</code> = segunda letra «l». <b>IN</b> compara contra una lista de valores: <code>ciudad IN (\'Mérida\',\'Puebla\')</code> equivale a dos OR pero se lee mejor y escala. <b>BETWEEN a AND b</b> = rango inclusivo de números o fechas.'},
    {t:'code', lang:'sql', title:'patrones que usarás siempre', code:`SELECT titulo FROM libros WHERE titulo LIKE 'La %';      -- empieza con "La "
SELECT titulo FROM libros WHERE titulo LIKE '%de%';      -- contiene "de"
SELECT email  FROM clientes WHERE email LIKE '%@mail.com';
SELECT titulo FROM libros WHERE anio BETWEEN 1940 AND 1950;
SELECT titulo FROM libros WHERE categoria IN ('Cuentos', 'Poesía');`},
    {t:'info', title:'ℹ️ LIKE distingue mayúsculas… según el motor', h:'En SQLite y MySQL (colación por defecto), LIKE NO distingue mayúsculas/minúsculas para letras ASCII. En PostgreSQL sí distingue (usa <code>ILIKE</code> para ignorarlas) y en SQL Server depende de la «collation» de la columna. En caso de duda, normaliza: <code>WHERE UPPER(titulo) LIKE \'LA%\'</code>.'},
    {t:'sqlex', title:'🧪 Practica patrones y rangos', tasks:[

      {q:'Libros publicados entre 1960 y 1979 (inclusive): <code>titulo</code> y <code>anio</code> ordenados por año.', check:{rows:6, orderInsensitive:false}, solution:'SELECT titulo, anio FROM libros WHERE anio BETWEEN 1960 AND 1979 ORDER BY anio;', pts:20},
      {q:'Ventas de los libros 1, 3 y 7: <code>id</code>, <code>libro_id</code> y <code>total</code>. Usa IN.', check:{rows:7}, solution:'SELECT id, libro_id, total FROM ventas WHERE libro_id IN (1, 3, 7) ORDER BY id;', pts:20},

    ]}
  ]},

  /* -------- 1-5 -------- */
  { id:'1-5', title:'NULL: el valor que no existe', time:'15 min', blocks:[
    {t:'p', h:'<b>NULL</b> significa «aquí no hay dato»: no es cero, no es cadena vacía, es AUSENCIA. Y tiene una regla que rompe cabezas: <b>cualquier comparación con NULL da NULL</b> (ni verdadero ni falso). Por eso <code>WHERE email = NULL</code> devuelve CERO filas siempre, y <code>NULL = NULL</code> tampoco es verdadero. Para preguntar por NULL existen operadores propios: <b>IS NULL</b> y <b>IS NOT NULL</b>.'},
    {t:'code', lang:'sql', title:'la forma correcta (y la trampa)', code:`SELECT nombre FROM clientes WHERE email IS NULL;      -- ✅ sin email
SELECT nombre FROM clientes WHERE email = NULL;       -- ❌ 0 filas SIEMPRE
SELECT COUNT(*) FROM ventas WHERE cliente_id IS NULL; -- ventas de mostrador

-- COALESCE da un valor cuando hay NULL (lección 2-3)

    {t:'sqlex', title:'🧪 Practica NULL', tasks:[
      {q:'Clientes SIN email: <code>nombre</code> y <code>ciudad</code>.', check:{rows:[['María Fernanda López','Monterrey'],['Lucía Herrera','Mérida'],['Pedro Álvarez','Monterrey']]}, solution:'SELECT nombre, ciudad FROM clientes WHERE email IS NULL ORDER BY nombre;', pts:25},

MODULES.push({
  id:'m2', emoji:'🧪', name:'Transformar y enriquecer', color:'#a78bfa',
  desc:'Funciones de texto, números, fechas, limpieza de nulos y lógica condicional con CASE.',
  lessons:[

  /* -------- 2-1 -------- */
  { id:'2-1', title:'Funciones de texto: UPPER, LOWER, LENGTH, SUBSTR, TRIM', time:'15 min', blocks:[
    {t:'p', h:'SQL trae una caja de herramientas para transformar texto <b>dentro de la consulta</b> — sin tocar los datos originales. <code>UPPER(x)</code> mayúsculas, <code>LOWER(x)</code> minúsculas, <code>LENGTH(x)</code> longitud, <code>TRIM(x)</code> quita espacios de los extremos, <code>SUBSTR(x, inicio, cuántos)</code> corta un pedazo (¡cuenta desde 1!), <code>REPLACE(x, busca, cambia)</code> sustituye, y <code>||</code> concatena (pega) textos.'},
    {t:'code', lang:'sql', title:'texto en acción', code:`SELECT UPPER(nombre) FROM clientes;                    -- ANA TORRES
SELECT LOWER(email) FROM clientes WHERE email IS NOT NULL;
SELECT titulo, LENGTH(titulo) AS letras FROM libros;
SELECT SUBSTR(fecha, 1, 7) AS mes FROM ventas;         -- '2025-03'
SELECT nombre || ' (' || ciudad || ')' AS etiqueta FROM clientes;`},
    {t:'info', title:'ℹ️ Diferencias entre motores', h:'<code>||</code> es el estándar y funciona en SQLite/PostgreSQL/Oracle; MySQL (sin configurar) usa <code>CONCAT(a, b)</code>; SQL Server usa <code>+</code> o <code>CONCAT</code>. <code>SUBSTR</code> se llama <code>SUBSTRING</code> en varios motores. La idea es la misma en todos: transformar texto en la consulta.'},
    {t:'sqlex', title:'🧪 Practica funciones de texto', tasks:[
      {q:'Los nombres de los autores EN MAYÚSCULAS, con alias <code>autor</code>.', check:{cols:['autor'], rows:9}, solution:'SELECT UPPER(nombre) AS autor FROM autores ORDER BY nombre;', pts:20},
      {q:'El MES de cada venta (2 caracteres, ejemplo «03»): usa SUBSTR sobre <code>fecha</code>, sin repetir meses, ordenados.', check:{rows:[['01'],['02'],['03'],['04'],['05']]}, solution:'SELECT DISTINCT SUBSTR(fecha, 6, 2) FROM ventas ORDER BY 1;', pts:30},
      {q:'Longitud del título de cada libro: <code>titulo</code> y <code>LENGTH(titulo)</code> como <code>letras</code>, solo los de 20+ letras.', hint:'WHERE con la función directamente: WHERE LENGTH(titulo) >= 20', check:{rows:8}, solution:'SELECT titulo, LENGTH(titulo) AS letras FROM libros WHERE LENGTH(titulo) >= 20 ORDER BY titulo;', pts:25},
      {q:'Etiqueta de cliente: <code>nombre || \' — \' || ciudad</code> con alias <code>etiqueta</code>, solo para clientes CON email.', check:{rows:5}, solution:'SELECT nombre || \' — \' || ciudad AS etiqueta FROM clientes WHERE email IS NOT NULL ORDER BY etiqueta;', pts:25}
    ]}
  ]},

  /* -------- 2-2 -------- */
  { id:'2-2', title:'Números, redondeo y fechas', time:'15 min', blocks:[
    {t:'p', h:'Para números: <code>ROUND(x, decimales)</code> redondea, <code>ABS(x)</code> valor absoluto, y la aritmética de siempre (<code>+ - * /</code>). Cuidado con la división entera: en algunos motores <code>7/2</code> da <code>3</code> (SQLite con enteros trunca; con decimales, no). Si dudas, fuerza decimales: <code>7 * 1.0 / 2</code>.'},
    {t:'p', h:'Las fechas en este curso (y en SQLite) se guardan como texto <b>\'YYYY-MM-DD\'</b> — y ese formato es un superpoder: el orden alfabético ES el orden cronológico, y <code>SUBSTR(fecha, 1, 7)</code> te da el mes «gratis». SQLite además trae <code>strftime(\'%Y\', fecha)</code> para extraer partes; MySQL usa <code>YEAR(fecha)</code>, <code>MONTH(fecha)</code>; SQL Server <code>YEAR()</code>/<code>FORMAT()</code>.'},
    {t:'code', lang:'sql', title:'redondeo y fechas', code:`SELECT ROUND(AVG(precio), 2) FROM libros;             -- 236.63
SELECT titulo, ROUND(precio * 1.16, 2) AS con_iva FROM libros;

SELECT strftime('%Y', fecha) AS anio FROM ventas;     -- 2025
SELECT SUBSTR(fecha, 1, 7) AS mes FROM ventas;        -- 2025-03

SELECT titulo FROM libros WHERE anio >= 1980;         -- fechas/años se comparan normal`},
    {t:'sqlex', title:'🧪 Practica números y fechas', tasks:[
      {q:'Precio con IVA (16%) de cada libro, REDONDEADO a 2 decimales: <code>titulo</code> y <code>con_iva</code>.', check:{cols:['titulo','con_iva'], rows:16}, solution:'SELECT titulo, ROUND(precio * 1.16, 2) AS con_iva FROM libros ORDER BY titulo;', pts:25},
      {q:'Ventas del primer trimestre (enero a marzo de 2025): <code>id</code> y <code>fecha</code>. Pista: las fechas ISO se comparan como texto.', check:{rows:15}, solution:'SELECT id, fecha FROM ventas WHERE fecha BETWEEN \'2025-01-01\' AND \'2025-03-31\' ORDER BY id;', pts:25},
      {q:'El año de cada venta con strftime: <code>strftime(\'%Y\', fecha)</code> como <code>anio</code>, sin repetir.', check:{cols:['anio'], rows:[[2025]]}, solution:'SELECT DISTINCT strftime(\'%Y\', fecha) AS anio FROM ventas;', pts:25},

    {t:'p', h:'<b>CASE</b> es el «if» de SQL: crea valores según condiciones, fila por fila. Dos formas: con condiciones (<code>CASE WHEN condición THEN resultado … ELSE otro END</code>) o comparando un valor contra opciones (<code>CASE estatus WHEN \'A\' THEN \'Activo\' END</code>). SIEMPRE cierra con <b>END</b> y conviene ponerle alias al resultado.'},
    {t:'code', lang:'sql', title:'etiquetas y categorías al vuelo', code:`SELECT titulo, precio,

MODULES.push({
  id:'m3', emoji:'📊', name:'Agregación: contar y resumir', color:'#34d399',
  desc:'COUNT, SUM, AVG, MIN, MAX, GROUP BY y HAVING: de miles de filas a un reporte.',
  lessons:[

  /* -------- 3-1 -------- */
  { id:'3-1', title:'Los cinco agregados: COUNT, SUM, AVG, MIN, MAX', time:'15 min', blocks:[
    {t:'p', h:'Un <b>agregado</b> colapsa muchas filas en UN valor. Los cinco que usas el 95% del tiempo: <code>COUNT(*)</code> cuenta filas, <code>COUNT(col)</code> cuenta filas donde col NO es NULL, <code>SUM(col)</code> suma, <code>AVG(col)</code> promedia (ignorando NULLs), <code>MIN</code>/<code>MAX</code> extremos (funcionan también con texto y fechas).'},
    {t:'code', lang:'sql', title:'el pulso del negocio en una consulta', code:`SELECT COUNT(*)    AS ventas,
       SUM(total)    AS ingreso,
       AVG(total)    AS ticket_promedio,
       MIN(total)    AS venta_menor,
       MAX(total)    AS venta_mayor
FROM ventas;`},
    {t:'warn', title:'⚠️ COUNT(*) vs COUNT(col)', h:'<code>COUNT(*)</code> cuenta TODAS las filas. <code>COUNT(cliente_id)</code> solo cuenta las que tienen cliente (los NULL no cuentan). En nuestra tabla: COUNT(*) = 22 ventas, COUNT(cliente_id) = 18 con cliente. La diferencia ES información: son las 4 ventas de mostrador.'},
    {t:'sqlex', title:'🧪 Practica agregados', tasks:[
      {q:'KPIs del catálogo en una fila: <code>COUNT(*)</code> como <code>libros</code>, <code>ROUND(AVG(precio),2)</code> como <code>precio_medio</code>, <code>MIN(precio)</code> como <code>minimo</code> y <code>MAX(precio)</code> como <code>maximo</code>.', check:{cols:[['COUNT(*)','libros'],'precio_medio','minimo','maximo'], rows:[[16,236.63,150,340]]}, solution:'SELECT COUNT(*) AS libros, ROUND(AVG(precio),2) AS precio_medio, MIN(precio) AS minimo, MAX(precio) AS maximo FROM libros;', pts:25},
      {q:'Ingreso total del año: <code>ROUND(SUM(total),2)</code> como <code>ingreso</code> de todas las ventas.', check:{cols:[['ingreso']], rows:[[7357.5]]}, solution:'SELECT ROUND(SUM(total), 2) AS ingreso FROM ventas;', pts:25},
      {q:'¿Cuántas ventas tienen cliente registrado? Usa COUNT de la columna (no *).', check:{cols:[['COUNT(cliente_id)','count(cliente_id)']], rows:[[18]]}, solution:'SELECT COUNT(cliente_id) FROM ventas;', pts:25},
      {q:'La venta más pequeña y la más grande: <code>MIN(total)</code> como <code>menor</code> y <code>MAX(total)</code> como <code>mayor</code> en una fila.', check:{cols:[['min','menor'],['max','mayor']], rows:[[165,641]]}, solution:'SELECT MIN(total) AS menor, MAX(total) AS mayor FROM ventas;', pts:25}
    ]}
  ]},

  /* -------- 3-2 -------- */
  { id:'3-2', title:'GROUP BY: resumir por grupos', time:'15 min', blocks:[
    {t:'p', h:'<b>GROUP BY</b> parte las filas en grupos y aplica los agregados <b>por grupo</b>: <code>SELECT categoria, COUNT(*) FROM libros GROUP BY categoria</code> da una fila por categoría con su número de libros. La columna que agrupa va en el SELECT tal cual; las demás columnas solo pueden aparecer DENTRO de un agregado — si pides una columna suelta que no agrupa, el resultado no tiene sentido (MySQL viejo lo permitía y era fuente de bugs legendarios).'},
    {t:'code', lang:'sql', title:'reportes agrupados', code:`SELECT categoria, COUNT(*) AS titulos, ROUND(AVG(precio),2) AS precio_medio
FROM libros
GROUP BY categoria;

-- ingresos por mes (SUBSTR crea el grupo)
SELECT SUBSTR(fecha, 1, 7) AS mes, SUM(total) AS ingreso
FROM ventas
GROUP BY mes
ORDER BY mes;`},
    {t:'info', title:'ℹ️ Agrupar por alias', h:'SQLite y MySQL permiten <code>GROUP BY mes</code> usando el alias definido en el SELECT. El estándar SQL solo permite columnas o expresiones (<code>GROUP BY SUBSTR(fecha,1,7)</code>). PostgreSQL es estricto: usa la expresión completa. En el playground ambos funcionan.'},
    {t:'sqlex', title:'🧪 Practica GROUP BY', tasks:[
      {q:'Cuántos libros hay por categoría: <code>categoria</code> y <code>COUNT(*)</code> como <code>titulos</code>, ordenado por titulos descendente.', check:{rows:[['Novela',7],['Cuentos',3],['Realismo mágico',2],['Romance',2],['Memorias',1],['Poesía',1]]}, solution:'SELECT categoria, COUNT(*) AS titulos FROM libros GROUP BY categoria ORDER BY titulos DESC, categoria;', pts:25},
      {q:'Autores por país: <code>pais</code> y cuántos autores (alias <code>cuantos</code>), orden alfabético por país.', check:{rows:[['Argentina',3],['Brasil',1],['Colombia',1],['Chile',1],['México',2],['Perú',1]]}, solution:'SELECT pais, COUNT(*) AS cuantos FROM autores GROUP BY pais ORDER BY pais;', pts:25},
      {q:'Ingreso por mes de 2025: <code>SUBSTR(fecha,6,2)</code> como <code>mes</code> y <code>ROUND(SUM(total),2)</code> como <code>ingreso</code>, ordenado por mes.', check:{rows:[['01',1161],['02',2030],['03',2076],['04',1605],['05',485.5]]}, solution:'SELECT SUBSTR(fecha,6,2) AS mes, ROUND(SUM(total),2) AS ingreso FROM ventas GROUP BY mes ORDER BY mes;', pts:25},
      {q:'Cuántas compras hizo cada cliente: <code>cliente_id</code> y <code>COUNT(*)</code> como <code>compras</code>, solo ventas con cliente, del mayor al menor número de compras.', check:{rows:[[1,3],[2,3],[3,3],[4,2],[5,2],[6,2],[7,2],[8,1]]}, solution:'SELECT cliente_id, COUNT(*) AS compras FROM ventas WHERE cliente_id IS NOT NULL GROUP BY cliente_id ORDER BY compras DESC, cliente_id;', pts:25}
    ]}
  ]},

  /* -------- 3-3 -------- */
  { id:'3-3', title:'HAVING: filtrar grupos (no filas)', time:'15 min', blocks:[
    {t:'p', h:'<b>WHERE</b> filtra FILAS antes de agrupar; <b>HAVING</b> filtra GRUPOS después de agregar. ¿Qué categorías tienen más de 2 libros? ¿Qué clientes compraron más de 2 veces? Eso es HAVING, porque la condición usa un agregado que solo existe tras agrupar. Regla mnemotécnica: <b>WHERE es antes del horno, HAVING es después de cocinar</b>.'},
    {t:'code', lang:'sql', title:'WHERE + GROUP BY + HAVING juntos', code:`SELECT cliente_id, COUNT(*) AS compras, SUM(total) AS gastado
FROM ventas
WHERE cliente_id IS NOT NULL     -- filtra FILAS (antes de agrupar)
GROUP BY cliente_id
HAVING COUNT(*) >= 3             -- filtra GRUPOS (después de agregar)
ORDER BY gastado DESC;`},
    {t:'sqlex', title:'🧪 Practica HAVING', tasks:[
      {q:'Categorías con más de 2 libros: <code>categoria</code> y <code>COUNT(*)</code> como <code>titulos</code>.', check:{rows:[['Novela',7],['Cuentos',3]]}, solution:'SELECT categoria, COUNT(*) AS titulos FROM libros GROUP BY categoria HAVING COUNT(*) > 2 ORDER BY titulos DESC;', pts:25},
      {q:'Clientes con 3 o más compras: <code>cliente_id</code> y <code>COUNT(*)</code> como <code>compras</code> (ignora ventas sin cliente).', check:{rows:[[1,3],[2,3],[3,3]]}, solution:'SELECT cliente_id, COUNT(*) AS compras FROM ventas WHERE cliente_id IS NOT NULL GROUP BY cliente_id HAVING COUNT(*) >= 3 ORDER BY cliente_id;', pts:25},
      {q:'Países con más de un autor: <code>pais</code> y cuántos (alias <code>cuantos</code>).', check:{rows:[['Argentina',3],['México',2]]}, solution:'SELECT pais, COUNT(*) AS cuantos FROM autores GROUP BY pais HAVING COUNT(*) > 1 ORDER BY cuantos DESC, pais;', pts:25},
      {q:'Meses cuyo ingreso superó 2000: <code>SUBSTR(fecha,6,2)</code> como <code>mes</code> y <code>ROUND(SUM(total),2)</code> como <code>ingreso</code>.', check:{rows:[['02',2030],['03',2076]]}, solution:'SELECT SUBSTR(fecha,6,2) AS mes, ROUND(SUM(total),2) AS ingreso FROM ventas GROUP BY mes HAVING SUM(total) > 2000 ORDER BY mes;', pts:25}
    ]},
    {t:'srs', deck:'sqlcore', sub:'Fija los conceptos de agregación (COUNT vs GROUP BY vs HAVING) con repetición espaciada.'}
  ]},

  /* -------- 3-4 -------- */
  { id:'3-4', title:'El orden completo de una consulta', time:'15 min', blocks:[
    {t:'p', h:'Ya conoces todas las piezas de lectura. Este es su orden ESCRITO (fijo) y su orden de EJECUCIÓN lógico (lo que el motor hace por dentro). Memorizarlo explica por qué un alias del SELECT sirve en ORDER BY pero el WHERE no lo ve aún, y por qué HAVING va después de GROUP BY.'},
    {t:'table', head:['Se escribe','Ejecución lógica','Para qué'], rows:[
      ['1. <code>SELECT …</code>','5. calcula columnas','qué columnas mostrar (aquí nacen los alias)'],
      ['2. <code>FROM / JOIN</code>','1. fuente de filas','de dónde salen los datos'],
      ['3. <code>WHERE</code>','2. filtra filas','condiciones por fila'],
      ['4. <code>GROUP BY</code>','3. agrupa','bolsas de filas'],
      ['5. <code>HAVING</code>','4. filtra grupos','condiciones con agregados'],
      ['6. <code>ORDER BY</code>','6. ordena','usa columnas y alias ya calculados'],
      ['7. <code>LIMIT</code>','7. recorta','las primeras n filas']
    ]},
    {t:'code', lang:'sql', title:'la consulta completa del curso', code:`SELECT SUBSTR(fecha, 6, 2)          AS mes,
       COUNT(*)                     AS ventas,
       ROUND(SUM(total), 2)         AS ingreso
FROM ventas
WHERE cliente_id IS NOT NULL
GROUP BY mes
HAVING COUNT(*) >= 4
ORDER BY ingreso DESC
LIMIT 5;`},
    {t:'sqlex', title:'🧪 Integradora: el reporte completo', tasks:[
      {q:'Ejecuta la consulta completa de la teoría y comprueba que corre. Luego edítala para que el HAVING sea <code>COUNT(*) >= 3</code>. Reporte: mes, ventas e ingreso de meses con 3+ ventas CON cliente, ordenado por ingreso descendente.', check:{rows:[['03',5,1826],['02',4,1535],['04',4,1310],['01',3,965.5]]}, solution:'SELECT SUBSTR(fecha,6,2) AS mes, COUNT(*) AS ventas, ROUND(SUM(total),2) AS ingreso FROM ventas WHERE cliente_id IS NOT NULL GROUP BY mes HAVING COUNT(*) >= 3 ORDER BY ingreso DESC;', pts:34},
      {q:'Top 2 de categorías por precio promedio: <code>categoria</code> y <code>ROUND(AVG(precio),2)</code> como <code>promedio</code>, ordenadas por promedio descendente, solo las 2 primeras.', check:{rows:[['Realismo mágico',315.25],['Romance',252.5]]}, solution:'SELECT categoria, ROUND(AVG(precio),2) AS promedio FROM libros GROUP BY categoria ORDER BY promedio DESC LIMIT 2;', pts:33},
      {q:'Reporte de stock: <code>categoria</code>, <code>SUM(stock)</code> como <code>piezas</code>, solo categorías con stock total mayor a 10, ordenadas por piezas descendente.', check:{rows:[['Novela',44],['Cuentos',26],['Realismo mágico',21],['Romance',15]]}, solution:'SELECT categoria, SUM(stock) AS piezas FROM libros GROUP BY categoria HAVING SUM(stock) > 10 ORDER BY piezas DESC;', pts:33}

    {t:'p', h:'La <b>llave primaria (PRIMARY KEY)</b> identifica cada fila: única, no nula, inmutable (el <code>id</code>). La <b>llave foránea (FOREIGN KEY)</b> es una columna que apunta a la llave primaria de OTRA tabla: <code>ventas.libro_id</code> apunta a <code>libros.id</code>. Con estas dos piezas se construyen todas las relaciones del mundo:'},

      ['<b>Uno a uno</b> (1:1)','Un país y su capital','FK con restricción UNIQUE']
    ]},
    {t:'p', h:'¿Por qué NO guardar el nombre del autor dentro de la tabla de libros? Porque «Gabriel García Márquez» se escribiría 2 veces con riesgo de escribirse distinto (¿con acento? ¿con segunda s?), y cambiar su nombre sería editar fila por fila. <b>Se guarda el id y los datos viven UNA sola vez</b> — ese principio se llama normalización y es la lección 4-4.'},
    {t:'quiz', questions:[

      {type:'mc', q:'¿Qué NO puede hacer una llave primaria?', options:['Ser un número','Repetirse en dos filas','Ser llamada id','Ser generada automáticamente'], correct:1, pts:10, explain:'Su esencia es la unicidad: dos filas jamás comparten PK.'},
      {type:'mc', q:'Libros y ventas: un libro aparece en muchas ventas y una venta tiene un libro. La relación es…', options:['1:1','1:N','N:M','Ninguna'], correct:1, pts:10, explain:'Un libro → muchas ventas: uno a muchos, implementada con la FK en ventas.'},
      {type:'tf', q:'Guardar el nombre del autor dentro de cada libro es buena práctica.', options:['Verdadero','Falso'], correct:1, pts:10, explain:'Duplica texto y crea inconsistencias: se guarda el id (normalización).'},
      {type:'mc', q:'Una tabla puente (como <code>ventas</code> entre libros y clientes) existe para…', options:['Hacer la base más lenta','Modelar relaciones muchos-a-muchos','Guardar contraseñas','Reemplazar al WHERE'], correct:1, pts:10, explain:'N:M se implementa con una tabla intermedia que lleva dos llaves foráneas.'}

  /* -------- 4-2 -------- */
  { id:'4-2', title:'INNER JOIN: cruzar dos tablas', time:'15 min', blocks:[
    {t:'p', h:'<b>JOIN</b> combina filas de dos tablas usando una condición (<b>ON</b>). El <b>INNER JOIN</b> devuelve solo las parejas que coinciden: cada libro junto a los datos de su autor. Las tablas reciben <b>alias cortos</b> (<code>libros l</code>, <code>autores a</code>) y las columnas se califican <code>l.titulo</code>, <code>a.nombre</code> — el programa profesional escribe SIEMPRE los alias.'},
    {t:'code', lang:'sql', title:'el patrón de unión universal', code:`SELECT l.titulo, a.nombre AS autor, l.precio
FROM libros l
INNER JOIN autores a ON l.autor_id = a.id;

-- equivalente sin la palabra INNER (JOIN a secas = INNER JOIN)
SELECT l.titulo, a.nombre FROM libros l JOIN autores a ON l.autor_id = a.id;`},
    {t:'info', title:'ℹ️ ¿Por qué calificar las columnas?', h:'<code>id</code> existe en libros Y en autores: sin calificar, el motor no sabe cuál quieres (y te lo dice en español). Calificar (<code>l.id</code>, <code>a.id</code>) elimina la ambigüedad y documenta la intención. En el playground, una columna ambigua produce el error «existe en varias tablas: califícala».'},
    {t:'sqlex', title:'🧪 Practica INNER JOIN', tasks:[
      {q:'Título y autor de cada libro: <code>l.titulo</code> y <code>a.nombre</code> como <code>autor</code>.', check:{cols:['titulo','autor'], rows:16}, solution:'SELECT l.titulo, a.nombre AS autor FROM libros l JOIN autores a ON l.autor_id = a.id ORDER BY l.titulo;', pts:25},
      {q:'Título, autor y país del autor, SOLO de los autores chilenos: <code>WHERE a.pais = \'Chile\'</code>.', check:{rows:3}, solution:'SELECT l.titulo, a.nombre AS autor, a.pais FROM libros l JOIN autores a ON l.autor_id = a.id WHERE a.pais = \'Chile\' ORDER BY l.titulo;', pts:25},
      {q:'Fecha, título y cantidad de cada venta: <code>v.fecha</code>, <code>l.titulo</code>, <code>v.cantidad</code>, de las ventas con cantidad 2 o más.', check:{rows:7}, solution:'SELECT v.fecha, l.titulo, v.cantidad FROM ventas v JOIN libros l ON v.libro_id = l.id WHERE v.cantidad >= 2 ORDER BY v.fecha, l.titulo;', pts:25},
      {q:'Cuántas veces se vendió cada autor (por unidades): <code>a.nombre</code> como <code>autor</code> y <code>SUM(v.cantidad)</code> como <code>unidades</code>, ordenado por unidades descendente.', hint:'Ventas → libros → autores: dos JOIN. Agrupa por autor.', check:{rows:9}, solution:'SELECT a.nombre AS autor, SUM(v.cantidad) AS unidades FROM ventas v JOIN libros l ON v.libro_id = l.id JOIN autores a ON l.autor_id = a.id GROUP BY a.nombre ORDER BY unidades DESC, autor;', pts:25}
    ]}
  ]},

  /* -------- 4-3 -------- */
  { id:'4-3', title:'LEFT JOIN: incluir a quien no tiene pareja', time:'15 min', blocks:[
    {t:'p', h:'El <b>LEFT JOIN</b> mantiene TODAS las filas de la tabla izquierda; si no hay coincidencia, las columnas de la derecha se llenan con NULL. Es la herramienta para preguntas del tipo «¿qué X NO tiene Y?»: libros que nunca se han vendido, clientes sin compras. El truco: <code>LEFT JOIN … WHERE derecha.id IS NULL</code>.'},
    {t:'code', lang:'sql', title:'los tres usos de oro', code:`-- 1) todo el inventario con sus ventas (o NULL si no tuvo)
SELECT l.titulo, v.fecha, v.total
FROM libros l LEFT JOIN ventas v ON l.id = v.libro_id;

-- 2) libros NUNCA vendidos
SELECT l.titulo
FROM libros l LEFT JOIN ventas v ON l.id = v.libro_id
WHERE v.id IS NULL;

-- 3) clientes con contador de compras (incluye a los de cero)
SELECT c.nombre, COUNT(v.id) AS compras

    {t:'warn', title:'⚠️ COUNT(*) vs COUNT(v.id) con LEFT JOIN', h:'En la consulta 3, <code>COUNT(*)</code> contaría también la fila «fantasma» del cliente sin compras y diría 1 en vez de 0. Por eso se cuenta la columna de la derecha: <code>COUNT(v.id)</code>, que vale NULL cuando no hubo coincidencia.'},
    {t:'sqlex', title:'🧪 Practica LEFT JOIN', tasks:[

      {q:'Cada cliente con su número de compras (incluye a quien no ha comprado): <code>c.nombre</code> y <code>COUNT(v.id)</code> como <code>compras</code>, ordenado por compras descendente y nombre ascendente.', check:{rows:[['Ana Torres',3],['Luis Ramírez',3],['María Fernanda López',3],['Carlos Sánchez',2],['Jorge Medina',2],['Lucía Herrera',2],['Sofía Castro',2],['Pedro Álvarez',1]]}, solution:'SELECT c.nombre, COUNT(v.id) AS compras FROM clientes c LEFT JOIN ventas v ON c.id = v.cliente_id GROUP BY c.nombre ORDER BY compras DESC, c.nombre;', pts:25},
      {q:'Autores sin libros en el catálogo… primero averigua si existen: corre <code>SELECT a.nombre FROM autores a LEFT JOIN libros l ON l.autor_id = a.id WHERE l.id IS NULL;</code> (si devuelve 0 filas, todos los autores tienen libros).', check:{rows:0}, solution:'SELECT a.nombre FROM autores a LEFT JOIN libros l ON l.autor_id = a.id WHERE l.id IS NULL;', pts:25},
      {q:'Título del libro y fecha de su venta, INCLUYENDO los libros sin ventas (la fecha saldrá NULL): <code>l.titulo</code> y <code>v.fecha</code>, solo de la categoría «Novela».', check:{rows:10}, solution:'SELECT l.titulo, v.fecha FROM libros l LEFT JOIN ventas v ON l.id = v.libro_id WHERE l.categoria = \'Novela\' ORDER BY l.titulo, v.fecha;', pts:25}

  { id:'4-4', title:'Normalización: de tabla- Frankenstein a diseño limpio', time:'15 min', blocks:[
    {t:'p', h:'La <b>normalización</b> es el arte de partir los datos en tablas para que cada hecho viva UNA sola vez. Las tres primeras formas normales (1FN, 2FN, 3FN) cubren el 99% del trabajo práctico:'},
    {t:'table', head:['Forma','Regla','Violación típica'], rows:[

    {t:'code', lang:'sql', title:'la misma información, mal y bien', code:`-- ❌ tabla única (1FN violada, redundancia total)

    {t:'quiz', questions:[

      {type:'tf', q:'La Librería Esperanza está normalizada: por eso ventas guarda ids y no textos.', options:['Verdadero','Falso'], correct:0, pts:10, explain:'ventas lleva libro_id y cliente_id: referencias, no copias. Por eso hacemos JOINs.'}

  /* -------- 4-5 -------- */
  { id:'4-5', title:'JOIN de 3+ tablas y el mapa completo', time:'15 min', blocks:[
    {t:'er', h:'Mapa visual de la Librería Esperanza: pasa el cursor por cada tabla. La llave foránea vive en la tabla del lado «muchos».'},
    {t:'p', h:'Los reportes reales cruzan 3 o más tablas encadenando JOINs: venta → libro → autor, o venta → cliente. Cada JOIN añade una tabla con su <code>ON</code>. La regla de supervivencia: <b>define el camino</b> (¿qué tabla conecta con cuál?) y usa alias cortos consistentes. El mapa de la Librería Esperanza:'},
    {t:'code', lang:'txt', title:'diagrama entidad-relación (texto)', code:`autores (id, nombre, pais)

MODULES.push({

    {t:'p', h:'<b>INSERT INTO tabla (columnas) VALUES (valores)</b> agrega filas. Nombrar las columnas explícitamente es la forma profesional: la tabla puede cambiar de orden o ganar columnas y tu INSERT sigue funcionando. Se pueden insertar varias filas de un golpe separando grupos de VALUES con comas. Las columnas omitidas toman su valor DEFAULT o NULL.'},
    {t:'code', lang:'sql', title:'insertar bien', code:`INSERT INTO autores (nombre, pais) VALUES ('Octavio Paz', 'México');

INSERT INTO clientes (nombre, ciudad, email) VALUES

-- INTEGER PRIMARY KEY se auto-numera si la omites (comportamiento SQLite)

    {t:'info', title:'ℹ️ ¿Y si repito una PK o violo UNIQUE?', h:'El motor TE DETIENE con un error (en el playground, en español). Eso es la integridad trabajando para ti: es infinitamente mejor que un dato duplicado en silencio. <code>INSERT OR IGNORE</code> (SQLite) o <code>ON CONFLICT</code> / <code>ON DUPLICATE KEY</code> permiten decidir qué hacer en esos choques.'},
    {t:'sqlex', title:'🧪 Practica INSERT (cada tarea parte de la base fresca)', tasks:[

      {q:'Inserta el libro «Piedra de sol» del autor 10 (Octavio Paz tras tu insert anterior NO existe: usa autor_id 1), categoría «Poesía», precio 185, stock 4, año 1957; y muestra su fila.', check:{rows:1}, solution:'INSERT INTO libros (titulo, autor_id, categoria, precio, stock, anio) VALUES (\'Piedra de sol\', 1, \'Poesía\', 185, 4, 1957); SELECT * FROM libros WHERE titulo = \'Piedra de sol\';', pts:25},

  /* -------- 5-2 -------- */
  { id:'5-2', title:'UPDATE y DELETE: con gran poder…', time:'15 min', blocks:[
    {t:'p', h:'<b>UPDATE tabla SET col = valor, … WHERE condición</b> modifica filas existentes; <b>DELETE FROM tabla WHERE condición</b> las borra. Ambos actúan sobre TODAS las filas que cumplan el WHERE — y si olvidas el WHERE, actúan sobre TODAS. La regla de seguridad profesional: escribes el WHERE PRIMERO, lo pruebas con un SELECT equivalente, y solo entonces cambias a UPDATE/DELETE.'},
    {t:'code', lang:'sql', title:'el ritual de seguridad', code:`-- 1) ¿QUÉ filas van a ser tocadas? (SELECT con el mismo WHERE)
SELECT titulo, precio FROM libros WHERE categoria = 'Poesía';

-- 3) verifica el resultado

    {t:'warn', title:'⚠️ Historia de terror (y por qué las transacciones existen)', h:'<code>DELETE FROM ventas;</code> sin WHERE borra las 22 ventas. Sin respaldo, no hay deshacer. Por eso la siguiente lección enseña transacciones: BEGIN antes, y si algo sale mal, ROLLBACK devuelve todo. Los DBMS serios además exigen confirmaciones y mantienen bitácora (log) — pero tu primer instinto siempre debe ser el SELECT de verificación.'},
    {t:'sqlex', title:'🧪 Practica UPDATE/DELETE', tasks:[

      {q:'Peligro controlado: <code>DELETE FROM proveedores;</code> sin WHERE y cuenta cuántas filas quedan en la tabla.', check:{cols:[['COUNT(*)','count(*)']], rows:[[0]]}, solution:'DELETE FROM proveedores; SELECT COUNT(*) FROM proveedores;', pts:25}

  /* -------- 5-3 -------- */
  { id:'5-3', title:'CREATE TABLE: diseño con reglas de integridad', time:'15 min', blocks:[

    {t:'code', lang:'sql', title:'una tabla bien nacida', code:`CREATE TABLE prestamos (

  /* -------- 5-4 -------- */
  { id:'5-4', title:'Transacciones e índices: seguridad y velocidad', time:'15 min', blocks:[
    {t:'p', h:'Una <b>transacción</b> agrupa varios cambios como una sola unidad: <code>BEGIN</code> abre, los cambios se ensayan, y decides <code>COMMIT</code> (confirmar) o <code>ROLLBACK</code> (deshacer TODO). Es el "deshacer" que te salva del DELETE sin WHERE. El ejemplo canónico es transferir dinero: restar de una cuenta y sumar en otra — si falla la mitad, el dinero desaparece; en transacción, ROLLBACK devuelve el mundo a su estado previo.'},
    {t:'code', lang:'sql', title:'el paracaídas del administrador', code:`BEGIN;
UPDATE libros SET stock = stock - 1 WHERE id = 5;
INSERT INTO ventas (libro_id, cliente_id, fecha, cantidad, total)
VALUES (5, 1, '2025-05-21', 1, 210);
-- todo bien → COMMIT;   algo salió mal → ROLLBACK;
COMMIT;`},
    {t:'p', h:'Un <b>índice</b> (CREATE INDEX) es la estructura que hace las búsquedas rápidas: en vez de leer la tabla completa fila por fila (full scan), el motor consulta el índice como el índice de un libro. Se crean solos para las PRIMARY KEY y UNIQUE; se agregan a mano para columnas muy filtradas (<code>CREATE INDEX idx_ventas_fecha ON ventas(fecha);</code>). El costo: cada INSERT/UPDATE actualiza el índice — no indexes todo, indexa lo que buscas.'},

      {type:'tf', q:'Un índice acelera las lecturas pero encarece las escrituras.', options:['Verdadero','Falso'], correct:0, pts:10, explain:'Cada INSERT/UPDATE debe actualizar los índices: por eso se indexa con criterio.'},
      {type:'mc', q:'¿Qué columnas merecen índice desde el diseño?', options:['Todas, por si acaso','Las llaves primarias (ya las traen) y las muy consultadas','Solo las de texto','Ninguna: los índices son de Oracle'], correct:1, pts:10, explain:'PK y UNIQUE ya crean su índice; agrega más solo donde el WHERE/JOIN lo pida.'},
      {type:'mc', q:'Después de <code>BEGIN;</code> <code>DELETE FROM ventas;</code> … te arrepientes. ¿Qué ejecutas?', options:['COMMIT;','ROLLBACK;','DELETE otra vez','SELECT * FROM ventas;'], correct:1, pts:10, explain:'ROLLBACK deshace el DELETE: las filas vuelven.'}
    ]},
    {t:'srs', deck:'sqlcore', sub:'Conceptos de modificación de datos y diseño físico para no olvidar.'}
  ]}
]});

MODULES.push({
  id:'m6', emoji:'🚀', name:'SQL avanzado', color:'#818cf8',
  desc:'Subconsultas, vistas, UNION y funciones de ventana: el salto a analista.',
  lessons:[

  /* -------- 6-1 -------- */
  { id:'6-1', title:'Subconsultas: consultas dentro de consultas', time:'15 min', blocks:[
    {t:'p', h:'Una <b>subconsulta</b> es un SELECT dentro de otro. Tres formas que cubren casi todo: <b>escalar</b> (produce un valor: <code>WHERE precio &gt; (SELECT AVG(precio)…)</code>), <b>de lista</b> (produce valores para IN: <code>WHERE id IN (SELECT libro_id…)</code>) y <b>correlacionada</b> (referencia columnas de la consulta externa: se evalúa fila por fila — potente pero cara en tablas enormes).'},
    {t:'code', lang:'sql', title:'las tres formas', code:`-- escalar: ¿qué libros están por encima del promedio?
SELECT titulo, precio FROM libros
WHERE precio > (SELECT AVG(precio) FROM libros);

-- de lista: ¿quiénes compraron algo caro (> 500)?
SELECT nombre FROM clientes
WHERE id IN (SELECT cliente_id FROM ventas WHERE total > 500);

-- correlacionada: ventas de cada cliente vs su propio promedio
SELECT v.id, v.total FROM ventas v
WHERE v.total > (SELECT AVG(v2.total) FROM ventas v2 WHERE v2.cliente_id = v.cliente_id);`},
    {t:'sqlex', title:'🧪 Practica subconsultas', tasks:[
      {q:'Libros con precio MAYOR al promedio general: <code>titulo</code> y <code>precio</code>, ordenados por precio descendente.', check:{rows:[['Rayuela',340],['Cien años de soledad',320.5],['La casa de los espíritus',310],['La ciudad y los perros',295],['El amor en los tiempos del cólera',280],['La casa verde',270],['De amor y de sombras',250]]}, solution:'SELECT titulo, precio FROM libros WHERE precio > (SELECT AVG(precio) FROM libros) ORDER BY precio DESC;', pts:25},
      {q:'Clientes que compraron ALGO con total mayor a 500: <code>nombre</code> sin repetir, con IN.', check:{rows:[['Carlos Sánchez'],['Pedro Álvarez']]}, solution:'SELECT nombre FROM clientes WHERE id IN (SELECT cliente_id FROM ventas WHERE total > 500) ORDER BY nombre;', pts:25},

    {t:'code', lang:'sql', title:'ranking y top-por-grupo', code:`-- ranking de libros por precio

-- el más caro DE CADA categoría (patrón top-N-per-group)
SELECT * FROM (
  SELECT titulo, categoria,
         ROW_NUMBER() OVER (PARTITION BY categoria ORDER BY precio DESC) AS rk
  FROM libros
) WHERE rk = 1;`},
