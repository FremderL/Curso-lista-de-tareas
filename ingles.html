/* ---------- router ---------- */
let CURRENT = { view:'home', id:null };
function parseHash(){
  try{
    const h = (location.hash || '').replace(/^#\/?/, '');
    if(!h) return { view:'home' };
    const parts = h.split('/');
    if(parts[0] === 'leccion' && LESSONS_BY_ID[parts[1]]) return { view:'lesson', id: parts[1] };
    if(parts[0] === 'examen') return { view:'exam' };
    if(parts[0] === 'proyecto') return { view:'project' };
    if(parts[0] === 'libro') return { view:'book', id: parts[1] || null };
    if(parts[0] === 'boleta') return { view:'report' };
    return { view:'home' };
  }catch(e){ return { view:'home' }; }
}
function routeHash(r){
  if(r.view === 'lesson' && r.id) return '#/leccion/' + r.id;
  if(r.view === 'exam') return '#/examen';
  if(r.view === 'project') return '#/proyecto';
  if(r.view === 'book') return r.id ? '#/libro/' + r.id : '#/libro';
  if(r.view === 'report') return '#/boleta';
  return '#/';
}
function go(route){
  CURRENT = route;
  const h = routeHash(route);
  try{ if(location.hash !== h) location.hash = h; }catch(e){}
  const sb = $('#sidebar'); if(sb) sb.classList.remove('open');
  const bd = document.getElementById('backdrop'); if(bd) bd.classList.remove('show');
  document.body.classList.remove('no-scroll');
  render();
}
function navTo(kind, id){
  go({ view: kind, id: id || null });
}
function render(){
  const route = CURRENT;
  EDITOR_CODES = [];
  const content = $('#content');
  if(route.view === 'home') content.innerHTML = viewHome();
  else if(route.view === 'lesson') content.innerHTML = viewLesson(route.id);
  else if(route.view === 'exam') content.innerHTML = viewExam();
  else if(route.view === 'project'){ content.innerHTML = viewProject(); }
  else if(route.view === 'book'){ content.innerHTML = viewBook(route.id); }
  else content.innerHTML = viewReport();
  initDemos(content);
  renderSidebar(route);
  updateChrome();
  try{ window.scrollTo({top:0,left:0,behavior:'instant'}); }
  catch(e){ window.scrollTo(0,0); }
  try{ content.scrollTop = 0; }catch(e){}
}

/* ---------- acciones globales (delegación) ---------- */
function copyText(text, btn){
  const done = function(ok){
    if(btn){
      const old = btn.textContent;
      btn.textContent = ok ? '✓ Copiado' : '⚠️ Selecciona y copia';
      setTimeout(function(){ btn.textContent = old; }, 1800);
    }
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){ done(true); }, function(){ fallbackCopy(text, btn, done); });
  } else fallbackCopy(text, btn, done);
}
function fallbackCopy(text, btn, done){
  try{
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    const ok = document.execCommand('copy');
    document.body.removeChild(ta);
    done(ok);
  }catch(e){ done(false); }
}

/* ---------- protección de errores en el acceso ---------- */
function safeAuth(fn){
  return function(){
    try{ return fn.apply(null, arguments); }
    catch(err){
      try{ showAuth({ text:'⚠️ Ocurrió un error inesperado: ' + String((err && err.message) || err) + '. Usa las opciones de recuperación.', ok:false }); }catch(e){}
      try{ fatal(err); }catch(e2){}
    }
  };
}
doLogin = safeAuth(doLogin);
doCreate = safeAuth(doCreate);
doGuest = safeAuth(doGuest);
doLogout = safeAuth(doLogout);

document.addEventListener('click', function(e){
  const t = e.target;
  const recBtn = t.closest ? t.closest('[data-rec]') : null;
  if(recBtn){ handleRecovery(recBtn.getAttribute('data-rec')); return; }
  /* opciones de quiz */
  const opt = t.closest ? t.closest('.opt:not(.locked)') : null;
  if(opt){
    const qEl = opt.closest('.qcard');
    $$('.opt', qEl).forEach(function(o){ o.classList.remove('sel'); });
    opt.classList.add('sel');
    const section = opt.closest('[data-quiz]');
    if(section){
      const isExam = section.getAttribute('data-quiz') === '__exam';
      updateRemain(section, isExam ? EXAM.questions : (LESSONS_BY_ID[section.getAttribute('data-quiz')] ? LESSONS_BY_ID[section.getAttribute('data-quiz')].blocks.filter(function(b){ return b.t === 'quiz'; })[0].questions : []));
    }
    return;
  }
  const nav = t.closest('[data-nav]');
  if(nav){ navTo(nav.getAttribute('data-nav'), nav.getAttribute('data-id')); return; }
  const actionEl = t.closest('[data-action]');
  if(!actionEl) return;
  const action = actionEl.getAttribute('data-action');
  if(action === 'toggle-module'){
    actionEl.closest('.sgroup').classList.toggle('open');
  } else if(action === 'copy'){
    copyText(CODE_STORE[Number(actionEl.getAttribute('data-code'))] || '', actionEl);
  } else if(action === 'run'){
    const w = actionEl.closest('.edwrap');
    $('.edprev', w).srcdoc = $('textarea', w).value;
  } else if(action === 'reset'){
    const w = actionEl.closest('.edwrap');
    const ta = $('textarea', w);
    ta.value = EDITOR_CODES[Number(w.getAttribute('data-ed'))] || '';
    $('.edprev', w).srcdoc = ta.value;
  } else if(action === 'grade-quiz'){
    const section = actionEl.closest('[data-quiz]');
    const lessonId = section.getAttribute('data-quiz');
    const lesson = LESSONS_BY_ID[lessonId];
    const quizBlock = lesson.blocks.filter(function(b){ return b.t === 'quiz'; })[0];
    gradeQuizSection(section, quizBlock.questions, lessonId);
  } else if(action === 'grade-exam'){
    const section = actionEl.closest('[data-quiz]');
    gradeQuizSection(section, EXAM.questions, '__exam');
  } else if(action === 'grade-ex'){
    gradeExercise(actionEl.closest('[data-ex]'));
  } else if(action === 'retry'){
    render();
  } else if(action === 'tab'){
    $$('.tab', actionEl.closest('.tabs')).forEach(function(b){ b.classList.remove('active'); });
    actionEl.classList.add('active');
    renderProjectTab(Number(actionEl.getAttribute('data-tab')));
  } else if(action === 'save-name'){
    const inp = $('#certName');
    state.name = inp ? inp.value.trim() : '';
    saveState();
    render();
  } else if(action === 'print-cert'){
    try{ window.print(); }catch(e){ alertFallback(); }
  } else if(action === 'auth-logout'){
    if(sessionUser()){ doLogout(); }
    else { showAuth(); }
  } else if(action === 'reset-progress'){
    if(actionEl.getAttribute('data-armed') === '1'){
      state = { scores:{}, examScore:null, name:'', lastLesson:'0-1', srs:{} };
      saveState();
      render();
    } else {
      actionEl.setAttribute('data-armed','1');
      actionEl.textContent = '⚠️ ¿Seguro? Clic de nuevo para borrar TODO';
      setTimeout(function(){ actionEl.setAttribute('data-armed','0'); actionEl.textContent = '🗑️ Borrar todo mi progreso'; }, 4000);
    }
  }
});

function handleRecovery(kind){
  try{
    if(kind === 'retry'){
      try{ location.reload(); return; }catch(e){}
      CURRENT = { view:'home' };
      try{ render(); window.__ccReady = true; }catch(e){ fatal(e); }
    } else if(kind === 'guest'){
      doGuest();
    } else if(kind === 'wipe-course'){
      safeStore.remove(LEGACY_KEY);
      const u = sessionUser();
      if(u && DB.users[u]){ DB.users[u].data = blankData(); DB.users[u].dataEn = blankData(); saveDB(); }
      state = blankData();
      CURRENT = { view:'home' };
      hideAuth();
      try{ render(); window.__ccReady = true; }catch(e){ fatal(e); return; }
      if(!sessionUser()){ showAuth({ text:'✅ Datos de este curso restablecidos. Crea tu cuenta o entra como invitado.', ok:true }); }
    } else if(kind === 'wipe-all'){
      try{
        const kills = [];
        for(let i = 0; i < localStorage.length; i++){
          const k = localStorage.key(i);
          if(k && String(k).indexOf('codecamp-') === 0) kills.push(k);
        }
        kills.forEach(function(k){ localStorage.removeItem(k); });
      }catch(e){}
      Object.keys(MEM).forEach(function(k){ delete MEM[k]; });
      DB = { users:{}, session:null };
      state = blankData();
      AUTH_MODE = 'login';
      CURRENT = { view:'home' };
      hideAuth();
      try{ render(); window.__ccReady = true; }catch(e){ fatal(e); return; }
      showAuth({ text:'✅ Todo restablecido: cuentas y progreso en cero. Crea tu cuenta para empezar.', ok:true });
    }
  }catch(err){ fatal(err); }
}
window.addEventListener('error', function(ev){
  if(!window.__ccReady){ try{ fatal(ev.error || ev.message || 'Error desconocido'); }catch(e){} }
});
window.addEventListener('unhandledrejection', function(ev){
  if(!window.__ccReady){ try{ fatal((ev && ev.reason) || 'Error de promesa'); }catch(e){} }
});

/* ---------- progreso por curso (lee la DB compartida) ---------- */
function courseProgress(course){
  try{
    const u = sessionUser();
    const rec = (u && DB.users[u]) ? DB.users[u] : null;
    const d = (rec && rec[course.dataKey]) || {};
    const scores = d.scores || {};
    let pts = 0, done = 0;
    Object.keys(scores).forEach(function(k){ done++; pts += (scores[k] || 0); });
    const pct = course.max ? Math.min(100, Math.round(pts / course.max * 100)) : 0;
    return { done:done, total:course.total, pts:pts, pct:pct, exam:(d.examScore != null ? d.examScore : null), examMax:course.examMax };
  }catch(e){ return { done:0, total:course.total, pts:0, pct:0, exam:null, examMax:course.examMax }; }
}

document.addEventListener('click', function(e){
  const tgt = e.target;
  const um = tgt.closest ? tgt.closest('[data-um]') : null;
  const btn = tgt.closest ? tgt.closest('#umenuBtn') : null;
  if(btn){ e.preventDefault(); toggleUmenu(); return; }
  if(um){
    const act = um.getAttribute('data-um');
    if(act === 'profile') openProfile();
    else if(act === 'close-profile') closeProfile();
    else if(act === 'login'){ toggleUmenu(false); try{ showAuth(); }catch(err){} }
    else if(act === 'logout'){ toggleUmenu(false); try{ if(sessionUser()) doLogout(); else showAuth(); }catch(err){} }

    else if(act === 'lang-en') setLang('en');
    return;
  }
  if(UMENU && !UMENU.contains(tgt)) toggleUmenu(false);
});

/* ---------- calificación tolerante de respuestas escritas ---------- */
(function(){
  const __norm = norm;
  norm = function(s){ return __norm(s).replace(/[;:,.\s]+$/,''); };
})();
(function(){
  const __fillOk = fillOk;
  fillOk = function(q, val){
    const v = String(val||'').trim();
    if(v === '') return false;
    // normalización defensiva: lo que los teclados reales escriben
    const limpiar = function(s){
      return String(s)
        .replace(/[\u00A0\u2000-\u200B\uFEFF]/g,' ')     // espacios invisibles → espacio
        .replace(/[\u2013\u2014\u2212]/g,'-')               // guiones "inteligentes" → -
        .replace(/[\u2018\u2019\u201B]/g,"'")               // apóstrofes curvos → '
        .replace(/[\u201C\u201D]/g,'"')                      // comillas curvas → "
        .replace(/\s+/g,' ')
        .trim();
    };
    const v2 = limpiar(v);
    try{ if(q.re && (new RegExp(q.re,'i').test(v) || new RegExp(q.re,'i').test(v2))) return true; }catch(e){}
    const nv = norm(v2).replace(/[<>]/g,'');
    if((q.accept||[]).some(function(a){ return norm(a).replace(/[<>]/g,'') === nv; })) return true;
    // la respuesta modelo (q.show) siempre es válida: comparación laxa sin símbolos
    try{
      if(q.show){
        const loose = function(s){ return norm(s).replace(/[^a-z0-9]/g,''); };
        if(loose(v2) !== '' && loose(v2) === loose(q.show)) return true;
      }
    }catch(e){}
    return false;
  };
})();

}
