<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Curso interactivo · JavaScript y el Juego de Memoria</title>
<meta name="description" content="Curso web interactivo en español: construye, estiliza, programa y publica una lista de tareas real.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📝</text></svg>">
<style>
/* ============================================================
   CodeCamp · Sistema de diseño profesional
   ============================================================ */
:root{
  --bg:#f5f6fa; --card:#ffffff; --ink:#101828; --muted:#667085; --line:#e6e8ef; --line2:#eef0f6;
  --brand:#4f46e5; --brand-2:#7c3aed; --brand-ink:#3730a3; --brand-soft:#eef1ff; --brand-line:#dee3ff;
  --ok:#12855f; --ok-bg:#effaf4; --ok-line:#bfe8d4;
  --bad:#d92d20; --bad-bg:#fef3f2; --bad-line:#f9cfc9;
  --warn:#b54708; --warn-bg:#fffaeb; --warn-line:#fbe5a8;
  --info:#175cd3; --info-bg:#f2f7ff; --info-line:#cfe1fb;
  --code-bg:#0c1222; --code-head:#111a35;
  --sh-xs:0 1px 2px rgba(16,24,40,.06);
  --sh-sm:0 1px 3px rgba(16,24,40,.07), 0 8px 20px -8px rgba(16,24,40,.1);
  --sh-md:0 4px 10px rgba(16,24,40,.08), 0 18px 40px -16px rgba(16,24,40,.18);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.65;font-size:15.5px;-webkit-font-smoothing:antialiased}
::selection{background:#ddd9ff}
body.no-scroll{overflow:hidden}
button{font-family:inherit}
a{color:var(--brand)}
code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px}
code.inline,.qfb code,.box code,li code,p code,td code,.exsub code,.lmeta code,.frame-note code,.rmsg code,.ad-note code,.nd-hint code,.lead-text code{background:var(--brand-soft);border:1px solid var(--brand-line);padding:1px 6px;border-radius:6px;font-size:.87em;color:var(--brand-ink)}

/* ===== Layout base ===== */
.app{display:grid;grid-template-columns:290px minmax(0,1fr);align-items:start}
.maincol{min-width:0}
#backdrop{display:none}
#topbar{display:flex;align-items:center;gap:16px;background:var(--card);border-bottom:1px solid var(--line);padding:0 20px;min-height:58px;position:sticky;top:0;z-index:120}
.brand{display:flex;align-items:center;gap:11px;white-space:nowrap}
.logo-mark{width:32px;height:32px;flex:none;border-radius:9px;background:linear-gradient(135deg,var(--brand),var(--brand-2));display:grid;place-items:center;font-size:16px;box-shadow:var(--sh-xs)}
.brand-text{line-height:1.2}
.brand-text b{font-size:14.5px;letter-spacing:-.01em}
.brand-text small{display:block;color:var(--muted);font-size:11px;font-weight:600;letter-spacing:.02em}
.topprogress{flex:1;display:flex;align-items:center;gap:10px;min-width:120px}
.topprogress .bar{flex:1;height:8px;background:var(--line2);border-radius:99px;overflow:hidden}
.topprogress .bar>div{height:100%;width:0%;background:linear-gradient(90deg,var(--brand),var(--brand-2));border-radius:99px;transition:width .6s cubic-bezier(.22,1,.36,1)}
.topprogress span{font-size:12px;font-weight:700;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.chip.grade{font-size:12.5px;font-weight:700;padding:6px 13px;border-radius:99px;background:var(--line2);color:var(--muted);white-space:nowrap}
.chip.grade.g-good{background:var(--ok-bg);color:var(--ok);box-shadow:inset 0 0 0 1px var(--ok-line)}
.chip.grade.g-mid{background:var(--warn-bg);color:var(--warn);box-shadow:inset 0 0 0 1px var(--warn-line)}
.chip.grade.g-bad{background:var(--bad-bg);color:var(--bad);box-shadow:inset 0 0 0 1px var(--bad-line)}
#menuBtn{display:none;border:1px solid var(--line);background:#fff;border-radius:9px;font-size:17px;padding:4px 11px;cursor:pointer;color:var(--ink)}

/* ===== Sidebar ===== */
#sidebar{position:sticky;top:0;height:100vh;height:100dvh;background:var(--card);border-right:1px solid var(--line);overflow-y:auto;padding:14px 12px 48px}
.side-sec{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:800;margin:12px 8px 6px}
.sgroup{margin-bottom:8px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
.sgroup-head{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:transparent;border:none;padding:10px 12px;cursor:pointer;font-weight:700;font-size:13px;color:var(--ink)}
.sgroup-head:hover{background:#f7f8fc}
.sgroup-head .emo{font-size:15px;flex:none}
.sgroup-head .stitle-g{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sgroup-head .chev{color:var(--muted);transition:transform .25s;font-size:10.5px;flex:none}
.sgroup.open .sgroup-head .chev{transform:rotate(90deg)}
.sgroup-body{display:none;border-top:1px solid var(--line2);background:#fcfcfe}
.sgroup.open .sgroup-body{display:block}
.slesson{display:flex;align-items:center;gap:9px;width:100%;text-align:left;border:none;background:transparent;padding:7px 12px 7px 12px;cursor:pointer;font-size:12.8px;color:#3d4657;border-left:2px solid transparent}
.slesson:hover{background:#f4f6fd}
.slesson.active{background:var(--brand-soft);border-left-color:var(--brand);font-weight:700;color:var(--brand-ink)}
.slesson .num{flex:none;width:20px;height:20px;border-radius:50%;background:var(--line2);color:#5a6474;font-size:10.5px;font-weight:800;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.slesson.done .num{background:var(--ok);color:#fff}
.slesson .stitle{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slesson .sscore,.sextra .sscore{flex:none;font-size:10px;font-weight:800;color:var(--ok);background:var(--ok-bg);box-shadow:inset 0 0 0 1px var(--ok-line);border-radius:99px;padding:2px 7px;font-variant-numeric:tabular-nums}
.sextra{display:flex;align-items:center;gap:9px;width:100%;text-align:left;border:none;background:transparent;padding:9px 12px;margin-top:2px;border-radius:10px;cursor:pointer;font-size:13px;font-weight:650;color:#3d4657}
.sextra:hover{background:#f4f6fd}
.sextra .ico{flex:none;width:22px;text-align:center}

/* ===== Contenido ===== */
#content{padding:32px 38px 90px}
.view{max-width:880px;margin:0 auto;animation:fadeUp .3s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.lesson-head{margin-bottom:22px;padding-bottom:18px;border-bottom:1px solid var(--line)}
.lmodule{display:inline-flex;align-items:center;gap:7px;font-size:11px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--brand-ink);background:var(--brand-soft);box-shadow:inset 0 0 0 1px var(--brand-line);padding:4px 11px;border-radius:99px;margin-bottom:12px}
h1.ltitle{font-size:27px;line-height:1.28;letter-spacing:-.02em;font-weight:800}
.lmeta{color:var(--muted);font-size:12.5px;margin-top:7px;font-weight:600}
h3.sec{font-size:18.5px;margin:28px 0 10px;letter-spacing:-.015em;font-weight:750}
p.lead-text{margin:10px 0}
ul.nice,ol.nice{margin:10px 0 10px 4px;padding-left:22px}
ul.nice li,ol.nice li{margin:6px 0}
ul.nice li::marker{color:var(--brand)}
.frame-note{font-size:12.5px;color:var(--muted);margin:-8px 0 0;font-weight:550}

/* ===== Cajas de mensaje ===== */
.box{border-radius:12px;padding:13px 16px;margin:16px 0;border:1px solid;border-left-width:4px;font-size:14.5px}
.box .box-title{display:block;font-weight:750;margin-bottom:3px;font-size:13.5px}
.box.tip{background:#f2fbf7;border-color:var(--ok-line);border-left-color:#2fbf8f;color:#0d5138}
.box.tip .box-title{color:#0e9f6e}
.box.warn{background:var(--warn-bg);border-color:var(--warn-line);border-left-color:#f79009;color:#71400a}
.box.warn .box-title{color:var(--warn)}
.box.info{background:var(--info-bg);border-color:var(--info-line);border-left-color:#528bff;color:#1a3d8f}
.box.info .box-title{color:var(--info)}
.box.milestone{background:linear-gradient(115deg,#f7f4ff,#fdf3f9);border-color:#e7dbff;border-left-color:#8b5cf6;color:#432e7a}
.box.milestone .box-title{color:#6d28d9}

/* ===== Tablas de referencia ===== */
table.ref{width:100%;border-collapse:separate;border-spacing:0;margin:14px 0;font-size:13.5px;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:var(--sh-xs)}
table.ref th{background:#f8f9fc;text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:9px 14px}
table.ref td{padding:9px 14px;border-top:1px solid var(--line2);vertical-align:top}
table.ref td:first-child{white-space:nowrap;font-weight:650}

/* ===== Bloques de código ===== */
.codewrap{background:var(--code-bg);border-radius:12px;margin:16px 0;overflow:hidden;box-shadow:var(--sh-sm);border:1px solid #1c2748}
.codehead{display:flex;align-items:center;gap:10px;padding:9px 14px;background:var(--code-head);border-bottom:1px solid #1c2748}
.dots{display:flex;gap:6px;flex:none}
.dots i{width:10px;height:10px;border-radius:50%;display:block}
.dots i:nth-child(1){background:#ff5f57}.dots i:nth-child(2){background:#febc2e}.dots i:nth-child(3){background:#28c840}
.langtag{font-size:11px;font-weight:700;color:#8fa0c9;letter-spacing:.08em;text-transform:uppercase;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.copybtn{border:1px solid #2c3a63;background:transparent;color:#aebbe4;font-size:11.5px;padding:4px 10px;border-radius:7px;cursor:pointer;font-weight:700;flex:none}
.copybtn:hover{background:#1b2647;color:#fff}
.codewrap pre{padding:16px 18px;overflow-x:auto;font-size:13px;line-height:1.65;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#d7e0f7}
.tok-c{color:#7d8898;font-style:italic}
.tok-tag{color:#6ee7a0}
.tok-attr{color:#82aaff}
.tok-str{color:#9ecbff}
.tok-kw{color:#f97583}
.tok-num{color:#f8c763}
.tok-builtin{color:#c39cff}
.tok-doctype{color:#c39cff;font-weight:700}
.tok-sel{color:#6ee7a0}
.tok-prop{color:#82aaff}
.tok-val{color:#9ecbff}

/* ===== Editor en vivo ===== */
.edwrap{border:1px solid var(--line);border-radius:14px;overflow:hidden;margin:18px 0;background:#fff;box-shadow:var(--sh-sm)}
.edbar{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#f8f9fc;border-bottom:1px solid var(--line);padding:8px 14px}
.edfile{font-size:12px;font-weight:700;color:var(--muted);font-family:ui-monospace,Menlo,Consolas,monospace}
.edbtns{display:flex;gap:8px}
.runbtn,.resetbtn{border:1px solid transparent;border-radius:8px;padding:6px 13px;font-size:12px;font-weight:750;cursor:pointer}
.runbtn{background:#12b76a;color:#fff}
.runbtn:hover{background:#0e9f5e}
.resetbtn{background:#fff;border-color:var(--line);color:#3d4657}
.resetbtn:hover{background:#f4f6fd}
.edpanes{display:grid;grid-template-columns:1fr 1fr;min-height:230px}
.edpanes textarea{border:none;resize:vertical;outline:none;padding:14px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.8px;line-height:1.6;background:var(--code-bg);color:#d7e0f7;min-height:230px;border-right:1px solid var(--line);tab-size:2}
.edpanes iframe{border:none;width:100%;min-height:230px;background:#fff}
.edhint{font-size:12.5px;color:var(--muted);margin-top:-10px;margin-bottom:14px;padding:0 4px}

/* ===== Ejercicios ===== */
.exercise{border:1.5px dashed #c3caff;border-radius:16px;padding:20px;margin:24px 0;background:#fdfdff}
.exhead{font-size:17.5px;font-weight:800;margin-bottom:5px;letter-spacing:-.01em}
.exsub{font-size:13.5px;color:var(--muted);margin-bottom:12px}
.checks{margin:14px 0 6px;display:grid;gap:6px}
.check{display:flex;align-items:center;gap:9px;font-size:13px;background:#f8f9fc;border:1px solid var(--line);border-radius:10px;padding:7px 12px;transition:all .2s}
.check .cic{flex:none;width:20px;height:20px;border-radius:50%;background:var(--line2);display:grid;place-items:center;font-size:11px;font-weight:900;color:#6a7386}
.check.okp{background:var(--ok-bg);border-color:var(--ok-line)}
.check.okp .cic{background:var(--ok);color:#fff}
.check.failp{background:var(--bad-bg);border-color:var(--bad-line)}
.check.failp .cic{background:var(--bad);color:#fff}
.check .pts{margin-left:auto;font-size:10.5px;font-weight:800;color:var(--muted);white-space:nowrap}

/* ===== Quizzes ===== */
.quiz{border:1px solid var(--line);border-radius:16px;padding:22px;margin:32px 0 10px;background:linear-gradient(180deg,#fbfcff,#f7f8fd);box-shadow:var(--sh-xs)}
.quiz-title{font-size:20px;margin-bottom:2px;font-weight:800;letter-spacing:-.01em}
.quiz-sub{font-size:13px;color:var(--muted);margin-bottom:16px}
.qcard{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin:12px 0;box-shadow:var(--sh-xs)}
.qq{font-weight:700;font-size:14.5px;margin-bottom:4px}
.qpts{display:inline-block;font-size:10.5px;font-weight:800;color:var(--brand-ink);background:var(--brand-soft);box-shadow:inset 0 0 0 1px var(--brand-line);border-radius:99px;padding:1px 9px;margin-bottom:10px}
.opts{display:grid;gap:8px;margin-top:8px}
.opt{text-align:left;border:1px solid #d4d9e3;background:#fff;border-radius:10px;padding:10px 14px;font-size:13.8px;cursor:pointer;transition:all .15s;display:flex;gap:10px;align-items:flex-start;color:var(--ink)}
.opt .ol{flex:none;width:22px;height:22px;border-radius:7px;background:#f2f4f7;display:grid;place-items:center;font-size:11px;font-weight:900;color:#5a6474;margin-top:1px}
.opt:hover{border-color:#a5acff;background:#f8f9ff}
.opt.sel{border-color:var(--brand);background:var(--brand-soft);box-shadow:0 0 0 1px var(--brand)}
.opt.sel .ol{background:var(--brand);color:#fff}
.opt.locked{cursor:default;pointer-events:none}
.opt.reveal{border-color:var(--ok-line);background:var(--ok-bg)}
.opt.reveal .ol{background:var(--ok);color:#fff}
.opt.correct{border-color:var(--ok);box-shadow:0 0 0 1px var(--ok)}
.opt.incorrect{border-color:var(--bad);box-shadow:0 0 0 1px var(--bad)}
.fillwrap{margin-top:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.fillwrap input{flex:1;min-width:200px;border:1px solid #d4d9e3;border-radius:10px;padding:9px 13px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;outline:none;background:#fff;color:var(--ink)}
.fillwrap input:focus{border-color:var(--brand);box-shadow:0 0 0 3px #e3e0ff}
.fillwrap .hint{font-size:11.5px;color:var(--muted)}
.quiz-actions{margin-top:16px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.quiz-remain{font-size:12px;color:var(--muted);font-weight:650}
.quiz-result{display:none;margin-top:16px;border-radius:14px;padding:18px;position:relative;text-align:center;border:1px solid var(--line);background:#fff;box-shadow:var(--sh-xs)}
.quiz-result.show{display:block}
.bigscore{font-size:36px;font-weight:850;letter-spacing:-.03em}
.bigscore small{font-size:15px;color:var(--muted);font-weight:700}
.rmsg{font-size:14px;margin-top:2px}

/* ===== Botones ===== */
.btn{border:none;border-radius:10px;padding:10px 18px;font-size:13.5px;font-weight:750;cursor:pointer;background:var(--brand);color:#fff;box-shadow:var(--sh-xs);transition:background .15s,transform .15s,box-shadow .15s;letter-spacing:.005em}
.btn:hover{background:#4338ca;transform:translateY(-1px);box-shadow:var(--sh-sm)}
.btn:active{transform:none}
.btn.ghost{background:#fff;color:#3d4657;border:1px solid #d4d9e3;box-shadow:none}
.btn.ghost:hover{background:#f7f8fc;color:var(--ink);box-shadow:none}
.btn.small{padding:7px 13px;font-size:12px;border-radius:9px}
.btn.green{background:#12b76a}
.btn.green:hover{background:#0e9f5e}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}

/* ===== Navegación entre lecciones ===== */
.navbtns{display:flex;justify-content:space-between;gap:12px;margin-top:36px;padding-top:18px;border-top:1px solid var(--line)}
.navbtns .btn{max-width:48%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ===== Árbol DOM ===== */
.domtree{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin:16px 0;box-shadow:var(--sh-xs);font-size:13px}
.domtree ul{list-style:none;padding-left:26px;border-left:2px dashed #d0d5e2;margin-left:8px}
.dnode{display:inline-block;border-radius:8px;padding:3px 11px;margin:3px 0;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;font-weight:700;border:1px solid}
.dnode.doc{background:#fffaeb;border-color:#fbe5a8;color:#7a4b06}
.dnode.tag{background:#effaf4;border-color:#bfe8d4;color:#0d5c42}
.dnode.idn{background:var(--brand-soft);border-color:var(--brand-line);color:var(--brand-ink)}
.dnode.text{background:#fdf2f8;border-color:#f9c7e2;color:#9d1e5f;font-weight:650}

/* ===== Demo appendChild ===== */
.appenddemo{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin:16px 0;box-shadow:var(--sh-xs)}
.ad-code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;background:var(--code-bg);color:#6ee7a0;padding:9px 13px;border-radius:9px;margin-bottom:12px}
.ad-list{list-style:none;padding:0;margin:12px 0}
.ad-list li{background:var(--brand-soft);border:1px solid var(--brand-line);color:var(--brand-ink);border-radius:9px;padding:6px 12px;font-size:12.5px;font-weight:700;margin:6px 0;animation:pop .3s cubic-bezier(.34,1.56,.64,1) both}
@keyframes pop{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:scale(1)}}
.ad-note{font-size:12.5px;color:var(--muted);margin-top:8px}
.ad-actions{display:flex;gap:8px;flex-wrap:wrap}

/* ===== Demo navbar ===== */
.navdemo{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin:16px 0;box-shadow:var(--sh-xs)}
.nd-bar{background:#0d6efd;border-radius:11px;padding:10px 16px;display:flex;align-items:center;gap:14px;color:#fff;position:relative}
.nd-brand{font-weight:750;font-size:15px}
.nd-tog{margin-left:auto;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:8px;padding:3px 10px;font-size:15px;cursor:pointer}
.nd-menu{display:flex;gap:18px;margin-left:auto}
.nd-menu a{color:#fff;text-decoration:none;font-size:13.5px;opacity:.9;cursor:pointer}
.nd-menu a:hover{opacity:1;text-decoration:underline}
.nd-menu.colapsado{display:none}
.nd-menu.abierto{display:flex !important;position:absolute;top:46px;right:14px;flex-direction:column;background:#0d6efd;padding:12px 18px;border-radius:11px;box-shadow:var(--sh-md);gap:10px;margin:0}
.nd-hint{font-size:12.5px;color:var(--muted);margin-top:10px}

/* ===== Demo localStorage ===== */
.storedemo{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin:16px 0;box-shadow:var(--sh-xs)}
.sd-row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.sd-row input{flex:1;min-width:180px;border:1px solid #d4d9e3;border-radius:10px;padding:9px 13px;font-size:14px;outline:none;background:#fff;color:var(--ink)}
.sd-row input:focus{border-color:var(--brand);box-shadow:0 0 0 3px #e3e0ff}
.sd-out{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;background:var(--code-bg);color:#9ecbff;border-radius:10px;padding:12px 14px;margin-top:10px;min-height:44px;white-space:pre-wrap}
.sd-note{font-size:12px;color:var(--warn);margin-top:8px;font-weight:600}

/* ===== Marco de demo de la app ===== */
.appframe-wrap{border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--sh-sm);margin:18px 0 8px;background:#fff}
.appframe-bar{display:flex;align-items:center;gap:7px;background:#f2f4f7;border-bottom:1px solid var(--line);padding:9px 13px}
.appframe-bar i{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.appframe-bar .url{flex:1;background:#fff;border:1px solid var(--line);border-radius:99px;font-size:11.5px;color:var(--muted);padding:3px 12px;font-family:ui-monospace,Menlo,Consolas,monospace;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.appframe{width:100%;height:440px;border:none;display:block;background:#eef2f7}

/* ===== Inicio ===== */
.hero{border-radius:20px;color:#fff;padding:46px 42px;margin-bottom:28px;position:relative;overflow:hidden;box-shadow:var(--sh-md);
  background:
    radial-gradient(640px 320px at 88% -12%, rgba(139,92,246,.45), transparent 62%),
    radial-gradient(520px 280px at -8% 112%, rgba(56,130,246,.38), transparent 62%),
    linear-gradient(135deg,#1b1740 0%,#282364 55%,#342a80 100%)}
.hero h1{font-size:33px;line-height:1.22;letter-spacing:-.025em;font-weight:800;max-width:600px;position:relative;z-index:1}
.hero h1 u{text-decoration-color:#a78bfa;text-decoration-thickness:3px;text-underline-offset:5px}
.hero p{margin:14px 0 0;max-width:590px;font-size:15px;color:#d4d9f6;position:relative;z-index:1}
.hero .hero-ctas{margin-top:24px;display:flex;gap:10px;flex-wrap:wrap;position:relative;z-index:1}
.hero .btn{background:#fff;color:#312e81;box-shadow:0 2px 8px rgba(10,8,40,.35)}
.hero .btn:hover{background:#f1efff;transform:translateY(-1px)}
.hero .btn.ghost{background:rgba(255,255,255,.1);color:#fff;border-color:rgba(255,255,255,.45);box-shadow:none}
.hero .btn.ghost:hover{background:rgba(255,255,255,.18);color:#fff}
.hero-stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:26px;position:relative;z-index:1}
.stat{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);border-radius:12px;padding:9px 15px;font-size:11.5px;font-weight:700;color:#cfd4f2;letter-spacing:.02em}
.stat b{display:block;font-size:18px;color:#fff;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.home-sec{margin:36px 0 14px;font-size:20px;font-weight:800;letter-spacing:-.02em;display:flex;align-items:center;gap:10px}
.home-sec::before{content:"";width:26px;height:4px;border-radius:99px;background:linear-gradient(90deg,var(--brand),var(--brand-2));flex:none}
.modules-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(252px,1fr));gap:14px}
.mcard{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--sh-xs);display:flex;flex-direction:column;gap:9px;transition:transform .18s,box-shadow .18s}
.mcard:hover{transform:translateY(-2px);box-shadow:var(--sh-sm)}
.mcard .mce{width:40px;height:40px;border-radius:10px;background:var(--brand-soft);display:grid;place-items:center;font-size:21px}
.mcard h4{font-size:15px;letter-spacing:-.01em}
.mcard p{font-size:12.5px;color:var(--muted);flex:1}
.mcard .mprog{height:7px;background:var(--line2);border-radius:99px;overflow:hidden}
.mcard .mprog>div{height:100%;background:linear-gradient(90deg,var(--brand),var(--brand-2));border-radius:99px;transition:width .5s}
.mcard .mlinks{font-size:11px;font-weight:750;color:var(--muted);letter-spacing:.03em;text-transform:uppercase}
.mcard .btn{align-self:flex-start}

/* ===== Boleta / certificado ===== */
.grade-hero{background:linear-gradient(135deg,#141a2e,#1d2647);border-radius:18px;color:#fff;padding:28px 30px;display:flex;gap:28px;align-items:center;flex-wrap:wrap;margin:18px 0;box-shadow:var(--sh-md)}
.bigpct{font-size:52px;font-weight:850;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
.bigpct small{font-size:17px;color:#8b96b8;font-weight:700}
.grade-hero .gh-info{flex:1;min-width:240px}
.grade-hero .gh-info h3{font-size:17px;letter-spacing:-.01em}
.grade-hero .gh-info p{color:#9aa6c8;font-size:13px;margin-top:5px}
table.rep{width:100%;border-collapse:separate;border-spacing:0;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:var(--sh-xs);font-size:13px;margin:14px 0}
table.rep th{background:#f8f9fc;text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:9px 14px}
table.rep td{padding:8px 14px;border-top:1px solid var(--line2)}
table.rep td .rbar{height:6px;background:var(--line2);border-radius:99px;overflow:hidden;min-width:90px}
table.rep td .rbar>div{height:100%;background:linear-gradient(90deg,var(--brand),var(--brand-2));border-radius:99px}
.st-chip{font-size:10.5px;font-weight:800;border-radius:99px;padding:3px 10px}
.st-done{background:var(--ok-bg);color:var(--ok);box-shadow:inset 0 0 0 1px var(--ok-line)}
.st-todo{background:var(--line2);color:var(--muted)}
.cert{border:1px solid var(--line);background:#fff;background-image:radial-gradient(420px 200px at 50% -40%,#f2f0ff,transparent 70%);border-radius:18px;padding:36px 28px;text-align:center;margin:26px 0;box-shadow:var(--sh-sm)}
.cert .cert-kicker{font-size:10.5px;letter-spacing:.3em;text-transform:uppercase;color:var(--muted);font-weight:800}
.cert h2{font-size:24px;margin:8px 0 2px;letter-spacing:-.02em}
.cert .cert-name{font-size:30px;font-weight:850;background:linear-gradient(90deg,var(--brand),var(--brand-2));-webkit-background-clip:text;background-clip:text;color:transparent;margin:12px 0 4px}
.cert .cert-meta{color:var(--muted);font-size:13px}
.namebox{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:14px 0}
.namebox input{border:1px solid #d4d9e3;border-radius:10px;padding:10px 15px;font-size:14px;outline:none;min-width:230px;background:#fff;color:var(--ink)}
.namebox input:focus{border-color:var(--brand);box-shadow:0 0 0 3px #e3e0ff}

/* ===== Proyecto final ===== */
.filetree{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;background:var(--code-bg);color:#c7d3f2;border-radius:12px;padding:16px 20px;margin:14px 0;white-space:pre;overflow-x:auto;line-height:1.75;box-shadow:var(--sh-sm)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:16px 0 0}
.tab{border:1px solid var(--line);border-bottom:none;background:#f4f6fd;border-radius:10px 10px 0 0;padding:8px 15px;font-size:12px;font-weight:750;cursor:pointer;color:#4a5468;font-family:ui-monospace,Menlo,Consolas,monospace}
.tab:hover{background:#ebeefb}
.tab.active{background:var(--code-bg);color:#8fe7b1;border-color:var(--code-bg)}
.tabfile .codewrap{margin-top:0;border-radius:0 12px 12px 12px}

/* ===== Pasos ===== */
ol.steps{counter-reset:paso;list-style:none;margin:14px 0;padding:0}
ol.steps li{counter-increment:paso;position:relative;padding:0 0 15px 46px;margin:0}
ol.steps li::before{content:counter(paso);position:absolute;left:0;top:0;width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff;font-weight:800;font-size:13px;display:grid;place-items:center;box-shadow:0 2px 6px rgba(79,70,229,.35)}
ol.steps li:not(:last-child)::after{content:"";position:absolute;left:13px;top:31px;bottom:3px;width:2px;background:var(--brand-line)}

/* ===== Confeti ===== */
.confetti-layer{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:5}
.confetti-layer i{position:absolute;top:-14px;width:8px;height:14px;border-radius:2px;animation:cfall linear forwards}
@keyframes cfall{to{transform:translateY(480px) rotate(720deg);opacity:.15}}

/* ===== Examen ===== */
.exam-head{background:linear-gradient(135deg,#171c33,#232a56);border-radius:18px;color:#fff;padding:30px 32px;margin-bottom:22px;box-shadow:var(--sh-md)}
.exam-head h1{font-size:24px;letter-spacing:-.02em}
.exam-head p{color:#c3cdf0;font-size:13.5px;margin-top:7px;max-width:640px}

/* ===== Scrollbars ===== */
#sidebar::-webkit-scrollbar{width:10px}
#sidebar::-webkit-scrollbar-thumb{background:#cfd4e0;border-radius:99px;border:2px solid var(--bg)}
#sidebar::-webkit-scrollbar-track{background:transparent}

/* ===== Libro de texto ===== */
.book-pills{display:flex;gap:7px;flex-wrap:wrap;margin:14px 0 20px}
.bpill{border:1px solid var(--line);background:#fff;border-radius:99px;padding:7px 13px;font-size:12px;font-weight:750;cursor:pointer;color:#3d4657}
.bpill:hover{background:#f4f6fd}
.bpill.active{background:var(--brand);border-color:var(--brand);color:#fff}

/* ===== Login / cuentas ===== */
.chip.user{display:none;font-size:12px;font-weight:750;padding:6px 12px;border-radius:99px;background:var(--brand-soft);color:var(--brand-ink);border:none;cursor:pointer;font-family:inherit;white-space:nowrap}
.chip.user:hover{background:#e2e6ff}
#authLayer{display:none}
#authLayer.show{display:block;position:fixed;inset:0;z-index:100;overflow-y:auto;
  background:
    radial-gradient(700px 340px at 85% -10%, rgba(139,92,246,.5), transparent 60%),
    radial-gradient(560px 300px at -5% 110%, rgba(56,130,246,.45), transparent 60%),
    linear-gradient(135deg,#171338 0%,#241f5c 55%,#302774 100%)}
.auth-wrap{min-height:100%;display:grid;place-items:center;padding:28px 16px}
.auth-card{width:100%;max-width:430px;background:#fff;border-radius:20px;box-shadow:0 24px 70px rgba(8,6,30,.5);overflow:hidden}
.auth-head{padding:26px 28px 0;text-align:center}
.auth-logo{width:52px;height:52px;border-radius:14px;background:linear-gradient(135deg,var(--brand),var(--brand-2));display:grid;place-items:center;font-size:26px;margin:0 auto 12px;box-shadow:0 8px 20px rgba(79,70,229,.4)}
.auth-head h1{font-size:20px;letter-spacing:-.02em}
.auth-head p{font-size:12.5px;color:var(--muted);margin-top:4px}
.auth-tabs{display:flex;gap:4px;margin:18px 20px 0;background:var(--line2);border-radius:11px;padding:4px}
.auth-tab{flex:1;border:none;background:transparent;border-radius:8px;padding:8px 10px;font-size:13px;font-weight:750;cursor:pointer;color:var(--muted);font-family:inherit}
.auth-tab.active{background:#fff;color:var(--ink);box-shadow:var(--sh-xs)}
.auth-body{padding:18px 24px 8px;display:grid;gap:11px}
.auth-field label{display:block;font-size:12px;font-weight:750;color:var(--muted);margin-bottom:4px}
.auth-field input{width:100%;border:1px solid #d4d9e3;border-radius:10px;padding:10px 13px;font-size:14px;outline:none;font-family:inherit;color:var(--ink)}
.auth-field input:focus{border-color:var(--brand);box-shadow:0 0 0 3px #e3e0ff}
.auth-msg{font-size:12.5px;font-weight:650;border-radius:9px;padding:8px 12px;display:none}
.auth-msg.show{display:block}
.auth-msg.err{background:var(--bad-bg);color:var(--bad);box-shadow:inset 0 0 0 1px var(--bad-line)}
.auth-msg.ok{background:var(--ok-bg);color:var(--ok);box-shadow:inset 0 0 0 1px var(--ok-line)}
.auth-users{font-size:11.5px;color:var(--muted);text-align:center}
.auth-actions{padding:6px 24px 4px;display:grid;gap:9px}
.auth-div{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:11.5px;font-weight:700}
.auth-div::before,.auth-div::after{content:"";flex:1;height:1px;background:var(--line)}
.auth-note{padding:10px 24px 4px;text-align:center;font-size:11px;color:var(--muted);line-height:1.55}
.auth-reset{background:none;border:none;color:var(--muted);font-size:11px;cursor:pointer;text-decoration:underline;display:block;margin:0 auto;padding:2px 24px 22px;font-family:inherit;width:100%}
.auth-reset:hover{color:var(--bad)}

/* ===== Responsive ===== */
@media (max-width:920px){
  .app{grid-template-columns:1fr}
  #sidebar{position:fixed;z-index:60;width:296px;top:0;bottom:0;left:-316px;transition:left .28s ease;box-shadow:var(--sh-md)}
  #sidebar.open{left:0}
  #backdrop{display:none;position:fixed;inset:0;background:rgba(16,24,40,.45);z-index:55}
  #backdrop.show{display:block}
  #menuBtn{display:block}
  .topprogress span{display:none}
  .brand-text small{display:none}
  #content{padding:22px 16px 80px}
  .edpanes{grid-template-columns:1fr}
  .edpanes textarea{border-right:none;border-bottom:1px solid var(--line);min-height:170px}
  .edpanes iframe{min-height:200px}
  .hero{padding:32px 22px}
  .hero h1{font-size:25px}
  .grade-hero{padding:22px}
}
@media print{
  #sidebar,#topbar,#backdrop,.navbtns,.namebox,.frame-note{display:none !important}
  body{background:#fff}
  .app{display:block}
  #content{padding:0}
}

<body>
<div class="app">
  <aside id="sidebar" aria-label="Índice del curso"></aside>

      <button id="menuBtn" title="Abrir índice" aria-label="Abrir índice">☰</button>
      <div class="brand">
        <span class="logo-mark">🎮</span>
        <span class="brand-text"><b>CodeCamp</b><small>Curso interactivo · JavaScript y el Juego de Memoria</small></span>

      <div class="topprogress"><div class="bar"><div id="topBar"></div></div><span id="topPct">0%</span></div>
      <span class="chip grade" id="topGrade">Calificación: —</span>

      <noscript>

          <div class="box warn">

            Este curso es interactivo y necesita JavaScript para mostrarse. Habilítalo en tu navegador
            o descarga el archivo <code>index.html</code> y ábrelo en Chrome, Edge o Firefox.
          </div>
        </div>
      </noscript>
    </main>
  </div>
</div>
<div id="authLayer"></div>
<script>

'use strict';
/* ============================================================
   CONTENIDO DEL CURSO — Módulos 1 y 2
   ============================================================ */
'use strict';
/* ============================================================
   CURSO 2 · JAVASCRIPT Y EL JUEGO DE MEMORIA
   Plataforma compartida con el Curso 1 (misma base de cuentas)
   ============================================================ */
'use strict';
/* ============================================================
   CURSO 2 · JAVASCRIPT Y EL JUEGO DE MEMORIA — Contenido
   ============================================================ */
'use strict';
const MODULES = [];

/* ============================ MÓDULO 1: ARRAYS ============================ */
MODULES.push({
  id:'m1', emoji:'📦', name:'Arrays a fondo', color:'#4f46e5',
  desc:'La caja con tus 16 cartas: crear, acceder, mutar, transformar, ordenar y mezclar — y cómo funcionan por dentro.',
  lessons:[

  /* -------- 1.1 -------- */
  { id:'1-1', title:'Tu segundo proyecto: el juego de Memoria 🃏', time:'14 min', blocks:[
    {t:'p', h:'En el curso anterior construiste una app con estado y persistencia. Ahora subimos de nivel: un <b>juego de Memoria</b> completo — el clásico de voltear cartas y encontrar pares 🎯. Va a parecer “solo un juego”, pero para programarlo necesitarás exactamente las herramientas de un desarrollador profesional: <b>arrays, objetos, clases, los 4 pilares de la POO, DOM y eventos</b>. Este curso los enseña todos, uno por uno, y cada lección termina con su <b>ejercicio calificado</b>.'},
    {t:'h', h:'Las reglas (primero piensa como diseñador)'},
    {t:'list', items:[
      'Hay un tablero con cartas <b>boca abajo</b> (8 pares de símbolos en el modo clásico).',
      'El jugador voltea <b>una carta</b>… y luego <b>otra</b>.',
      'Si los símbolos <b>coinciden</b>: quedan descubiertas para siempre. ✅',
      'Si <b>no</b> coinciden: se voltean de nuevo tras un instante. ❌',
      'El juego termina cuando <b>todos los pares</b> están encontrados.'
    ]},
    {t:'p', h:'▶ <b>Juega ahora la versión final</b> (es el proyecto de este curso). Nota los ingredientes: un mazo que se mezcla, un tablero, reglas de turno, contador de intentos, cronómetro y récords guardados. Cada lección construye una pieza:'},
    {t:'appdemo'},
    {t:'steps', items:[
      '<b>Módulo 1</b>: arrays — el mazo y el tablero son listas (incluida una lección sobre cómo funcionan POR DENTRO).',
      '<b>Módulo 2</b>: objetos y funciones — cada carta es un objeto con datos y comportamiento.',
      '<b>Módulo 3</b>: clases y los 4 pilares de la POO — <code>Carta</code> y <code>JuegoMemoria</code>.',
      '<b>Módulo 4</b>: DOM y eventos — dibujar el tablero y reaccionar a los clics.',
      '<b>Módulo 5</b>: el juego completo con CSS 3D, cronómetro y récords.',
      '<b>Módulo 6</b>: publicación, rúbrica de entrega y roadmap.'
    ]},
    {t:'info', title:'🔑 Requisitos', h:'Este curso asume lo que aprendiste en el de la Lista de Tareas: variables, funciones, <code>getElementById</code>, <code>addEventListener</code>, <code>createElement/appendChild</code>, <code>classList</code> y <code>localStorage</code>. Si algo se te olvidó, el <a href="index.html#/libro">libro de texto del curso 1</a> y su examen te refrescan en minutos.'},
    {t:'tip', title:'💡 Cómo estudiar este curso', h:'1) Lee la lección con calma (hay analogías a propósito). 2) Ejecuta los ejemplos y <b>rompe</b> cosas en los editores. 3) Haz el ejercicio final SIN mirar la solución. 4) Repite el quiz hasta 100. La constancia diaria de 20 minutos le gana a una maratón de 4 horas.'},
    {t:'quiz', questions:[
      {type:'mc', q:'En el juego de Memoria, ¿qué estructura guarda mejor las 16 cartas del tablero?', options:['Un número','Un array de cartas','Un string enorme','Una sola variable por carta'], correct:1, pts:10, explain:'16 cartas relacionadas entre sí = un array. Es la estructura natural para “muchos elementos iguales”.'},
      {type:'mc', q:'¿Qué debe pasar cuando dos cartas NO coinciden?', options:['Se quedan volteadas','Se recarga la página','Se voltean de nuevo tras un instante (con un temporizador)','Ganas automáticamente'], correct:2, pts:10, explain:'El jugador necesita verlas un momento: setTimeout las voltea de nuevo después de ~700 ms.'},
      {type:'mc', q:'¿Cuándo termina el juego?', options:['Al primer par encontrado','Cuando todas las cartas están marcadas como encontradas','A los 5 minutos','Cuando se acaban los intentos'], correct:1, pts:10, explain:'La condición de victoria: todos los pares encontrados, es decir, todas las cartas con encontrado = true.'}
    ]},
    {t:'exercise', title:'🛠️ Ejercicio 1 · Declara el material del juego',
      sub:'Todo juego empieza definiendo sus datos. En el editor: 1) crea la constante <code>EMOJIS</code> con exactamente 8 emojis, 2) imprime cuántos hay usando <code>length</code>, 3) imprime el primero y el último. ▶ Ejecuta y califica.',
      file:'ejercicio-1.html', height:300,
      code:
`<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"><title>Ejercicio 1</title></head>
<body>
  <p style="font-family:system-ui">Abre la consola (F12) para ver los resultados.</p>
  <script>
    // TODO 1: crea la constante EMOJIS con 8 emojis de tu elección
    // (ej: '🎃', '👻', '🦇', '🕷️', '🍬', '🧙', '💀', '🕸️')


    // TODO 2: imprime cuántos emojis hay (usa .length)
    console.log('Total de emojis: ', ...);

    // TODO 3: imprime el PRIMERO y el ÚLTIMO
    // (pista: el último está en la posición length - 1)
    console.log('Primero: ', ...);
    console.log('Último: ', ...);
  <\/script>
</body>
</html>
`,
      checks:[
        {label:'Declara <code>const EMOJIS</code> como array', re:'const\\s+EMOJIS\\s*=\\s*\\[', pts:20},
        {label:'El array tiene al menos 8 elementos (comas)', re:'\\[\\s*[\'"][^\'"]+[\'"]\\s*(,\\s*[\'"][^\'"]+[\'"]\\s*){7,}\\]', pts:20},
        {label:'Usa <code>.length</code> para contar', re:'EMOJIS\\s*\\.\\s*length|\\.length', pts:15},
        {label:'Accede al primer elemento con índice <code>0</code>', re:'EMOJIS\\s*\\[\\s*0\\s*\\]', pts:15},
        {label:'Accede al último con <code>length - 1</code> (o pop)', re:'length\\s*-\\s*1|\\.pop\\s*\\(\\s*\\)', pts:20},
        {label:'Usa <code>console.log</code> para mostrar resultados', re:'console\\.log', pts:10}
      ]}
  ]},

  /* -------- 1.2 -------- */
  { id:'1-2', title:'Arrays: crear, acceder y modificar', time:'16 min', blocks:[
    {t:'p', h:'Un <b>array</b> es una lista ordenada de valores dentro de una sola variable. Piensa en un <b>tren de vagones</b> 🚂: cada vagón tiene un número de posición (índice) y el array sabe cuántos vagones tiene (<code>length</code>). <b>Detalle crucial: las posiciones empiezan en 0</b>, no en 1. El programador que olvida esto le paga con bugs.'},
    {t:'code', lang:'js', title:'anatomía de un array', code:
`const emojis = ['🎃', '👻', '🦇', '🕷️'];
//               índice 0   1     2     3

emojis.length      // 4  (cuántos hay)
emojis[0]          // '🎃'  (el primero)
emojis[3]          // '🕷️'  (el último = length - 1)
emojis[4]          // undefined (¡la posición 4 NO existe!)

// Leer una posición que no existe NO da error:
// devuelve undefined. Es un bug silencioso clásico.`},
    {t:'h', h:'Los métodos que modifican el array (mutadores)'},
    {t:'table', head:['Método','Qué hace','Devuelve'], rows:[

    {t:'code', lang:'js', title:'las tres formas de copiar y cuándo usarlas', code:
`const mazo = [{ id: 1, emoji: '🎃' }, { id: 2, emoji: '👻' }];

    {t:'p', h:'Recorrer arrays es el pan de cada día. JS moderno te da <b>herramientas declarativas</b>: en vez de decir “cómo” contar pasos, dices <b>qué quieres</b> y el método hace el bucle. La diferencia se nota (y se agradece) al leer código ajeno — y al escribir el tuyo tres semanas después.'},

      ['<code>findIndex(fn)</code>','Posición del primero que cumple','Índice o -1'],

    {t:'code', lang:'js', title:'las cuatro herramientas estrella', code:
`const emojis = ['🎃', '👻', '🦇', '🕷️', '🍬'];

// map: TRANSFORMA cada elemento (nuevo array del mismo tamaño)
const etiquetas = emojis.map(function (e, i) {
  return 'Carta ' + (i + 1) + ': ' + e;
});

// filter: SELECCIONA los que cumplen
const sinFantasmas = emojis.filter(function (e) { return e !== '👻'; });

// find: el PRIMERO que cumple (y findIndex: su posición)
const murcielago = emojis.find(function (e) { return e === '🦇'; });
const posicion = emojis.findIndex(function (e) { return e === '🦇'; });

// every/some: preguntas de sí/no
const todosTienenLetra = emojis.every(function (e) { return e.length >= 1; });
const hayDulce = emojis.some(function (e) { return e === '🍬'; });`},

// Con comparador numérico:
[10, 9, 100].sort(function (a, b) { return a - b; }); // [9, 10, 100]

// Regla del comparador:
// resultado negativo → a va ANTES que b
// resultado positivo → b va antes que a
// cero → empatan (deja como esté)

// Descendente: invierte la resta
[10, 9, 100].sort(function (a, b) { return b - a; }); // [100, 10, 9]

// Y ordena récords de mejor a peor:
records.sort(function (a, b) { return a.intentos - b.intentos; });`},

    {t:'warn', title:'⚠️ La “mezcla ingenua” está sesgada', h:'En internet verás <code>cartas.sort(() => Math.random() - 0.5)</code>. <b>No la uses</b>: es una mezcla sesgada (algunas posiciones salen mucho más a menudo) porque sort asume un comparador CONSISTENTE y uno aleatorio viola esa regla. Para un juego (y para aprender) existe el algoritmo correcto y sencillo: <b>Fisher-Yates</b>.'},
    {t:'info', title:'🔑 ¿Cómo funciona Fisher-Yates?', h:'Recorre el array del final hacia el principio; en cada paso elige un índice aleatorio <b>entre 0 y la posición actual</b>, e intercambia ambos elementos. Como cada posición ya “cerrada” nunca vuelve a tocarse, TODAS las permutaciones terminan con exactamente la misma probabilidad: es la mezcla que usan los casinos digitales. Con 16 cartas hay 20,922,789,888,000 órdenes posibles — y Fisher-Yates los trata a todos por igual.'},
    {t:'code', lang:'js', title:'Fisher-Yates (la usaremos en el juego)', code:
`function barajar(array) {
  const copia = [...array];                  // no tocamos el original
  for (let i = copia.length - 1; i > 0; i--) {  // del final al inicio
    const j = Math.floor(Math.random() * (i + 1)); // j aleatorio en [0, i]
    [copia[i], copia[j]] = [copia[j], copia[i]];   // intercambio
  }
  return copia;
}

// Nota moderna: [a, b] = [b, a] es "destructuring de arrays":
// intercambia dos valores sin variable temporal. La forma clásica:
// const temp = copia[i]; copia[i] = copia[j]; copia[j] = temp;`},

    {t:'code', lang:'js', title:'herencia con extends y super', code:
`class Carta {                        // clase padre
  constructor(emoji) {

  }
  voltear() {
    this.volteada = !this.volteada;
  }
  descripcion() {
    return 'Carta ' + this.emoji;
  }
}

class CartaComodin extends Carta {   // clase hija
  constructor(emoji, poder) {
    super(emoji);        // llama al constructor del PADRE (obligatorio)
    this.poder = poder;  // lo nuevo de la hija
  }
  usarPoder() {
    console.log('✨ Poder: ' + this.poder);
  }
  // POLIMORFISMO: sobrescribimos el método del padre
  descripcion() {
    return 'COMODÍN ' + this.emoji + ' (' + this.poder + ')';
  }
}

const comodin = new CartaComodin('🃏', 'voltea todas');

normal.descripcion();    // 'Carta 🎃'
comodin.descripcion();   // 'COMODÍN 🃏 (voltea todas)'
comodin.voltear();       // heredado del padre, funciona igual
comodin.usarPoder();     // solo la hija lo tiene
comodin instanceof CartaComodin  // true

`const tablero = document.getElementById('tablero');

function renderizar(juego) {
  tablero.innerHTML = '';            // limpiamos el tablero

  const fragmento = document.createDocumentFragment();

  juego.mazo.forEach(function (carta) {
    const div = document.createElement('div');
    div.className = 'carta' + (carta.volteada ? ' volteada' : '');
    div.dataset.id = carta.id;       // ← guardamos el id en el HTML
    div.innerHTML =
      '<div class="carta-interior">' +
      '  <div class="carta-frente">?</div>' +
      '  <div class="carta-atras">' + carta.emoji + '</div>' +
      '</div>';
    fragmento.appendChild(div);
  });

  tablero.appendChild(fragmento);    // UN solo golpe de render
}`},

`let primera = null;

tablero.addEventListener('click', function (evento) {
  const el = evento.target.closest('.carta');
  if (!el || bloqueado) return;

  const carta = mazo.find(c => c.id === Number(el.dataset.id));
  if (!carta || carta.volteada || carta.encontrada) return;

  carta.volteada = true;
  el.classList.add('volteada');

  if (!primera) {
    primera = carta;                 // turno incompleto
  } else {
    segunda = carta;                 // turno completo
    bloqueado = true;                // cerramos el portón
    setTimeout(comparar, 700);       // milisegundos para VER ambas
  }
});

function comparar() {

    primera.encontrada = true;
    segunda.encontrada = true;

  }
  primera = null;
  segunda = null;
  bloqueado = false;
}`},

`.carta-interior {
  position: relative;
  width: 100%; height: 100%;
  transform-style: preserve-3d;        /* respeta el espacio 3D */
  transition: transform 0.4s;          /* el giro se anima solo */
}

.carta.volteada .carta-interior {
  transform: rotateY(180deg);          /* ¡el volteo! */
}

.carta-frente, .carta-atras {
  position: absolute;
  width: 100%; height: 100%;
  display: grid; place-items: center;
  border-radius: 12px;
  backface-visibility: hidden;         /* cada cara se oculta al girar */
  font-size: 34px;
}

.carta-frente {                        /* el reverso "con dibujo" */
  background: linear-gradient(135deg, #4f46e5, #7c3aed);
  color: #fff;
}

.carta-atras {                         /* el símbolo */
  background: #fff;
  border: 2px solid #e2e8f0;
  transform: rotateY(180deg);          /* vive volteada de fábrica */
}

.carta.encontrada .carta-interior {
  animation: pulso 0.5s;               /* mini celebración */
}
@keyframes pulso { 50% { transform: rotateY(180deg) scale(1.08); } }`},

    {t:'code', lang:'js', title:'js/game.js — la estructura general', code:
`const EMOJIS = ['🎃','👻','🦇','🕷️','🍬','🧙','💀','🕸️'];

class Carta { /* Módulo 3: estado privado + voltear() + revelar() */ }

class JuegoMemoria {
  #mazo = []; #primera = null; #segunda = null;
  #bloqueado = false; #intentos = 0;

  constructor(emojis) { this.#mazo = this.#crearMazo(emojis); }

  #crearMazo(emojis) {
    const duplicados = [...emojis, ...emojis];
    for (let i = duplicados.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [duplicados[i], duplicados[j]] = [duplicados[j], duplicados[i]];
    }
    return duplicados.map((e, i) => new Carta(i, e));
  }

  get mazo() { return this.#mazo; }
  get intentos() { return this.#intentos; }

  voltearCarta(id) {
    if (this.#bloqueado) return 'bloqueado';
    const carta = this.#mazo.find(c => c.id === id);
    if (!carta || carta.volteada || carta.encontrada) return 'invalida';
    carta.voltear();
    if (!this.#primera) { this.#primera = carta; return 'primera'; }
    this.#segunda = carta;
    this.#intentos++;
    this.#bloqueado = true;
    return 'segunda';
  }

  resolver() {
    const a = this.#primera, b = this.#segunda;
    const acierto = a && b && a.emoji === b.emoji;
    if (acierto) { a.revelar(); b.revelar(); }
    else { a.voltear(); b.voltear(); }
    this.#primera = null; this.#segunda = null; this.#bloqueado = false;
    return acierto;
  }

  estaResuelto() { return this.#mazo.every(c => c.encontrada); }
}`},
    {t:'code', lang:'js', title:'js/game.js — render y eventos (delegación)', code:
`const juego = new JuegoMemoria(EMOJIS);
const tablero = document.getElementById('tablero');

function renderizar() {
  tablero.innerHTML = '';
  const frag = document.createDocumentFragment();
  juego.mazo.forEach(carta => {
    const div = document.createElement('div');
    div.className = 'carta' + (carta.volteada || carta.encontrada ? ' volteada' : '')
                  + (carta.encontrada ? ' encontrada' : '');
    div.dataset.id = carta.id;
    div.innerHTML = '<div class="carta-interior">'
                  + '<div class="carta-frente">🎴</div>'
                  + '<div class="carta-atras">' + carta.emoji + '</div></div>';
    frag.appendChild(div);
  });
  tablero.appendChild(frag);
}

tablero.addEventListener('click', evento => {
  const el = evento.target.closest('.carta');
  if (!el) return;
  const resultado = juego.voltearCarta(Number(el.dataset.id));
  if (resultado === 'invalida' || resultado === 'bloqueado') return;
  renderizar();
  if (resultado === 'segunda') {
    setTimeout(() => {
      const acierto = juego.resolver();
      renderizar();
      if (juego.estaResuelto()) celebrar();
    }, 700);
  }
});

renderizar();`},

    {t:'h', h:'1) Cronómetro con setInterval'},
    {t:'code', lang:'js', title:'cronómetro mm:ss', code:
`let segundos = 0;
let cronometro = null;

function iniciarCronometro() {
  detenerCronometro();            // evita timers duplicados
  segundos = 0;
  cronometro = setInterval(function () {
    segundos++;
    const min = String(Math.floor(segundos / 60)).padStart(2, '0');
    const seg = String(segundos % 60).padStart(2, '0');
    document.getElementById('tiempo').textContent = min + ':' + seg;
  }, 1000);
}

function detenerCronometro() {
  clearInterval(cronometro);   // SIEMPRE detén lo que inicias
}`},
    {t:'info', title:'🔑 setInterval y su pareja clearInterval', h:'<code>setInterval(fn, ms)</code> repite el callback cada ms; <code>clearInterval(id)</code> lo detiene. Regla de oro: guarda el id que devuelve y deténlo cuando corresponda (victoria, reinicio). Un cronómetro que sigue corriendo tras ganar es el bug #1 de los juegos caseros. Y llamar <code>detenerCronometro()</code> ANTES de iniciar uno nuevo evita que dos timers corran a la vez tras reiniciar.'},

    {t:'code', lang:'js', title:'guardar y leer récords', code:
`const CLAVE_RECORD = 'memoria-record';

function guardarRecord(intentos, segundos) {
  const actual = obtenerRecord();
  const mejor = !actual
    || intentos < actual.intentos
    || (intentos === actual.intentos && segundos < actual.segundos);

  if (mejor) {
    localStorage.setItem(CLAVE_RECORD, JSON.stringify({
      intentos: intentos,
      segundos: segundos,
      fecha: new Date().toLocaleDateString('es-MX')
    }));
  }
  return mejor;   // true si es nuevo récord 🎉
}

function obtenerRecord() {
  try {
    const datos = localStorage.getItem(CLAVE_RECORD);
    return datos ? JSON.parse(datos) : null;
  } catch (e) {
    return null;   // storage bloqueado o texto corrupto: sin récord
  }
}`},

  { n:1, emoji:'🔀', short:'Algoritmos del juego', title:'Algoritmos del juego: mezclar, comparar y ganar', time:'15 min', blocks:[
    {t:'p', h:'Tu juego usa tres algoritmos que vale la pena entender “por dentro”. <b>1) Fisher-Yates</b> (mezcla uniforme): cada permutación del mazo tiene probabilidad exacta 1/16! — es la misma idea que usan mazos digitales de casinos y plataformas de cartas. La versión ingenua <code>sort(() => Math.random() - 0.5)</code> está <b>sesgada</b>, porque sort asume un comparador consistente y uno aleatorio viola esa suposición (algunos navegadores incluso pueden comportarse distinto entre ejecuciones).'},
    {t:'code', lang:'js', title:'Fisher-Yates anotado', code:
`function barajar(array) {
  const copia = [...array];                 // 1. no mutar el original
  for (let i = copia.length - 1; i > 0; i--) {  // 2. del final al inicio
    const j = Math.floor(Math.random() * (i + 1)); // 3. j en [0, i]
    [copia[i], copia[j]] = [copia[j], copia[i]];   // 4. intercambio
  }
  return copia;
}
// ¿Por qué j en [0, i] y no [0, n-1]? Porque intercambiar con el
// futuro rompería la uniformidad (variante "naive" sesgada).`},
    {t:'p', h:'<b>2) Búsqueda lineal con find</b>: <code>mazo.find(c => c.id === id)</code> recorre hasta 16 elementos. Para tableros chicos es perfecto. Si tuvieras millones de cartas usarías un <b>Map</b> (diccionario id→carta) con búsqueda O(1). <b>3) Detección de victoria</b>: <code>every</code> corta en el primer false (evaluación de cortocircuito): no recorre más de lo necesario.'},
    {t:'table', head:['Concepto','Notación','En tu juego'], rows:[
      ['Búsqueda lineal','O(n)','find del id en el mazo'],
      ['Mezcla Fisher-Yates','O(n)','barajar()'],
      ['Comparación de par','O(1)','a.emoji === b.emoji'],
      ['Verificación de victoria','O(n) con cortocircuito','every(encontrada)']
    ]},
    {t:'info', title:'📚 Para profundizar', h:'Marijn Haverbeke, <i>Eloquent JavaScript</i>, 4.ª ed. (No Starch Press, 2024; gratuita en eloquentjavascript.net), caps. de estructuras de datos · Aditya Bhargava, <i>Grokking Algorithms</i> (Manning, 2.ª ed. 2024): algoritmos ilustrados para principiantes.'}
  ]},
  { n:2, emoji:'⏱️', short:'Timers y event loop', title:'setTimeout, setInterval y el event loop a fondo', time:'15 min', blocks:[
    {t:'p', h:'Tu cronómetro y la pausa de 700 ms usan <b>timers</b>. Detalle clave: JavaScript es de un solo hilo, así que <code>setTimeout(fn, 700)</code> NO garantiza ejecución exactamente a los 700 ms — garantiza <b>al menos</b> 700 ms. La función entra a una cola y se ejecuta cuando el hilo queda libre. Si tu página está calculando algo pesado, el timer espera.'},
    {t:'code', lang:'js', title:'el orden sorprendente', code:
`console.log('A');
setTimeout(() => console.log('B'), 0);
console.log('C');
// Imprime A, C, B: los timers SIEMPRE esperan a que
// termine el código sincrono, aunque pidan 0 ms.

let id;
function iniciar() { id = setInterval(tic, 1000); }
function detener() { clearInterval(id); }   // pareja inseparable
// Tip: si un timer puede lanzarse dos veces, guarda y limpia antes:
if (id) clearInterval(id); id = setInterval(tic, 1000);`},
    {t:'p', h:'Para animaciones suaves (juegos con movimiento continuo), el estándar no es setInterval sino <b>requestAnimationFrame</b>: sincroniza con el refresco de pantalla (~60 veces por segundo) y se pausa si la pestaña no está visible. Tu Memoria es por turnos, así que transition CSS + setTimeout bastan; para tu próximo arcade, rAF es el camino.'},
    {t:'table', head:['Herramienta','Úsala para','Cuidado'], rows:[
      ['<code>setTimeout</code>','Pausas puntuales (voltear de nuevo)','El tiempo es “mínimo”, no exacto'],
      ['<code>setInterval</code>','Relojes y repetición fija','SIEMPRE limpiar con clearInterval'],
      ['<code>requestAnimationFrame</code>','Animación fluida por fotogramas','Se detiene en pestañas ocultas (bien!)']
    ]},

  { n:3, emoji:'🏛️', short:'POO y estilo de código', title:'POO en JavaScript: clases, prototipos y buen estilo', time:'16 min', blocks:[
    {t:'p', h:'Las clases ES6 son azúcar sobre <b>prototipos</b>: <code>Carta.prototype.voltear</code> existe de verdad y todos los objetos creados con <code>new Carta()</code> delegan en él. Conocer esto te ahorrará confusiones cuando leas código antiguo (<code>function Carta(){...}; Carta.prototype.voltear = ...</code>) y te prepara para preguntas de entrevista.'},
    {t:'code', lang:'js', title:'la misma clase, dos eras', code:
`// Estilo clásico (pre-2015) — lo verás en tutoriales viejos:
function Carta(emoji) {
  this.emoji = emoji;
  this.volteada = false;
}
Carta.prototype.voltear = function () {
  this.volteada = !this.volteada;
};

// Estilo moderno (ES6+) — el que aprendiste:
class Carta {
  constructor(emoji) { this.emoji = emoji; this.volteada = false; }
  voltear() { this.volteada = !this.volteada; }
}
// Ambas crean objetos con el mismo prototipo por debajo.`},

    {t:'list', items:[
      '<b>const por defecto</b>, let solo si la variable cambia; var, nunca más.',
      '<b>Nombres que cuentan</b>: <code>resolverTurno()</code> > <code>func2()</code>. Una función = una responsabilidad.',
      '<b>Inmutabilidad razonable</b>: copia antes de transformar (<code>[...mazo]</code>, <code>{...carta}</code>).',
      '<b>Estado privado</b> (<code>#</code>) para lo interno; interfaz pública mínima.',
      '<b>Separación modelo/UI</b>: la clase decide, el render pinta (lo que hiciste con JuegoMemoria).',
      '<b>Comenta el POR QUÉ</b>, no el qué (el qué ya lo dice el código).'
    ]},

  ]},
  { n:4, emoji:'🧬', short:'Tipos y coerción', title:'Tipos, referencias y coerción en profundidad', time:'20 min', blocks:[
    {t:'p', h:'Los <b>primitivos</b> (string, number, boolean, undefined, null, symbol, bigint) se copian por <b>valor</b>: cada variable tiene su propia caja. Los <b>objetos</b> (arrays incluidos, funciones también) se copian por <b>referencia</b>: la variable guarda la DIRECCIÓN del objeto, no el objeto. Por eso <code>const b = a</code> con arrays no copia: <code>b.push(9)</code> “aparece” en a. Y por eso el juego compara cartas por <code>id</code>, nunca por <code>===</code> entre objetos.'},
    {t:'code', lang:'js', title:'valor vs referencia, el experimento definitivo', code:`let x = 10;
let y = x;
y = 99;
console.log(x);   // 10  → los primitivos viven separados

const mazoA = ["🎃", "👻"];
const mazoB = mazoA;          // ¡misma dirección de memoria!
mazoB.push("🧟");
console.log(mazoA);           // ["🎃", "👻", "🧟"]  😱

const mazoC = [...mazoA];     // copia superficial NUEVA
mazoC.push("🧙");
console.log(mazoA);           // intacto ✅`},
    {t:'table', head:['Operación','Resultado','Por qué'], rows:[
      ['"1" + 1','"11"','+ con un string CONCATENA: todo se vuelve texto'],
      ['"5" * 2','10','*, -, / SÍ convierten a número'],
      ['1 &lt; 2 &lt; 3','true','(1&lt;2)=true → true&lt;3 → 1&lt;3'],
      ['null == undefined','true','la pareja rara del =='],
      ['NaN === NaN','false','NaN no es igual ni a sí mismo'],
      ['[] + []','""','ambos se vuelven string vacío'],
      ['!!"hola"','true','doble negación = conversión a boolean']
    ]},
    {t:'p', h:'<b>La regla del curso:</b> usa SIEMPRE <code>===</code> y <code>!==</code>. El <code>==</code> intenta “ayudarte” convirtiendo tipos y su tabla de coerciones tiene 40 entradas ilegibles. Los únicos <b>falsy</b> de JavaScript: <code>false, 0, -0, 0n, "", null, undefined, NaN</code>. Todo lo demás — incluyendo "0", "false", [] y {} — es <b>truthy</b>. Por eso <code>if (tareas.length)</code> funciona y <code>if (tareas)</code> pasa con un array vacío.'},
    {t:'p', h:'<b>Spread (…expande) y rest (…junta):</b> en llamadas y literales, <code>...</code> expande un iterable: <code>[...mazo]</code> copia, <code>Math.max(...puntos)</code> pasa el array como argumentos sueltos, <code>{...config, debug:true}</code> clona con sobrescritura. En PARÁMETROS hace lo contrario: <code>function sumar(...nums)</code> junta todos los argumentos en un array real. Es la sintaxis más usada del JS moderno junto con la destructuración.'},
    {t:'code', lang:'js', title:'destructuring: desempaqueta en una línea', code:`const [primera, segunda, ...resto] = ["🎃", "👻", "🧟", "🧙"];
// primera="🎃"  segunda="👻"  resto=["🧟","🧙"]

const carta = { id: 7, emoji: "🎴", encontrada: false };
const { id, emoji, encontrada = false } = carta;

function pintarCarta({ id, emoji }) {        // opciones con nombre
  return \`Carta #\${id}: \${emoji}\`;
}
console.log(pintarCarta(carta));             // Carta #7: 🎴`},
    {t:'p', h:'<b>Operadores modernos:</b> <code>??</code> (nullish) da el valor por defecto SOLO con null/undefined — perfecto cuando 0 o "" son valores legítimos: <code>const puntos = guardados ?? 0</code>. <code>?.</code> (optional chaining) corta la cadena si algo es null: <code>estado.srs?.[id]</code> no explota si srs no existe. Y <code>??=</code>, <code>||=</code>, <code>&amp;&amp;=</code> asignan condicionalmente. Combinados matan media docena de ifs defensivos por archivo.'},
    {t:'warn', title:'⚠️ Comparar objetos y arrays', h:'<code>[1,2] === [1,2]</code> es FALSE: son dos cajas distintas en memoria. Para comparar contenido: <code>JSON.stringify(a) === JSON.stringify(b)</code> (rápido, orden de claves sensible) o compara campo a campo. Con objetos anidados, una copia con spread solo copia el primer nivel: el resto sigue compartido — usa <code>structuredClone()</code> para copias profundas reales.'},
    {t:'info', title:'📚 Para profundizar', h:'Kyle Simpson, <i>You Don’t Know JS Yet: Types &amp; Grammar</i> (2.ª ed., 2020, gratis en GitHub) — el tratamiento definitivo de coerción · MDN: <i>Equality comparisons and sameness</i> con la tabla completa del ==.'}
  ]},
  { n:5, emoji:'🔭', short:'Scope y closures', title:'Scope, closures y this: la memoria de las funciones', time:'20 min', blocks:[
    {t:'p', h:'<b>Scope léxico:</b> una función ve las variables del lugar donde fue ESCRITA, no de donde se ejecuta. Cada bloque <code>{ }</code> de let/const es una burbuja; las burbujas interiores ven hacia afuera, jamás al revés. Cuando una función sale de su burbuja natal pero la LLEVA PUESTA (porque la guardas, la devuelves o la pasas como callback), se dice que forma una <b>closure</b>: sus variables natales siguen vivas, invisibles para todos menos para ella.'},
    {t:'code', lang:'js', title:'closure: memoria privada sin clases', code:`function crearContador(inicio = 0) {
  let cuenta = inicio;            // vive en la closure
  return {
    incrementar() { return ++cuenta; },
    valor() { return cuenta; }
  };
}
const movimientos = crearContador();
movimientos.incrementar();
movimientos.incrementar();
console.log(movimientos.valor());   // 2
// "cuenta" NO es accesible desde fuera: privacidad real`},
    {t:'p', h:'Las closures explican media industria JS: los <b>hooks</b> de React guardan su estado en closures, los <b>debounce/throttle</b> recuerdan el último timer, los módulos clásicos escondían privados dentro de una IIFE. Y explican un bug legendario: con <code>var i</code> en un bucle, todos los setTimeout comparten LA MISMA i y terminan imprimiendo el valor final; con <code>let i</code> cada vuelta crea una i nueva — prueba ambos y verás la diferencia en consola.'},
    {t:'p', h:'<b>this</b> no mira dónde nació la función sino CÓMO se llama: <code>objeto.metodo()</code> pone this = objeto; una función llamada suelta pone this = undefined (modo estricto) o window; <code>new Clase()</code> pone this = la instancia nueva. Las <b>arrow functions</b> son la excepción hermosa: NO tienen this propio, toman prestado el del scope donde se escribieron. Por eso en el juego los callbacks de <code>addEventListener</code> dentro de métodos de clase funcionan como arrow: <code>() =&gt; this.voltear(carta)</code> mantiene this = el juego.'},
    {t:'code', lang:'js', title:'por qué el juego usa arrows en sus listeners', code:`class Juego {
  constructor() { this.intentos = 0; }
  iniciar() {
    // ❌ función clásica: this === undefined dentro
    // btn.addEventListener("click", function() { this.registrar(); });

    // ✅ arrow: hereda el this del método iniciar
    document.getElementById("tablero")
      .addEventListener("click", (e) => {
        const carta = e.target.closest(".carta");
        if (carta) this.voltear(carta);      // this sigue siendo el Juego
      });
  }
  voltear(carta) { this.intentos++; /* ... */ }
}`},
    {t:'p', h:'<b>Funciones de orden superior:</b> son funciones que reciben o devuelven funciones — <code>map</code>, <code>filter</code>, <code>reduce</code> lo son, y tú puedes escribir las tuyas: una <code>porCada(fn)</code> casilla enseña el mecanismo. Combinadas con closures dan patrones potentes: <code>memoizar(fn)</code> devuelve una versión que cachea resultados en un Map (caro → una sola vez), <code>unaVez(fn)</code> solo deja ejecutar la primera, <code>debounce(fn, ms)</code> espera a que pares de escribir (búsquedas en vivo).'},
    {t:'code', lang:'js', title:'memoización: la closure como caché', code:`function memoizar(fn) {
  const cache = new Map();               // closure: vive entre llamadas
  return function(...args) {
    const clave = JSON.stringify(args);
    if (!cache.has(clave)) {
      cache.set(clave, fn(...args));     // solo la primera vez
    }
    return cache.get(clave);
  };
}
const fibonacciLento = (n) => n < 2 ? n : fibonacciLento(n-1) + fibonacciLento(n-2);
const fibonacci = memoizar(function(n) {
  return n < 2 ? n : fibonacci(n-1) + fibonacci(n-2);
});
console.time("con memo");  console.log(fibonacci(40));  console.timeEnd("con memo");`},
    {t:'tip', title:'💡 Cómo estudiar closures sin morir', h:'Tres pasos: 1) escribe crearContador a mano (no copies) y explica en voz alta por qué cuenta sigue vivo; 2) agrega un reset() y un Historial; 3) refactoriza un pedazo del juego para que el marcador use una closure en vez de una variable global. Si puedes explicar el paso 1 a otra persona (o a un pato de goma), ya entendiste.'}
  ]},
  { n:6, emoji:'🧰', short:'Manual de arrays', title:'Arrays y objetos: manual de referencia completa', time:'25 min', blocks:[
    {t:'table', head:['Grupo','Métodos','¿Mutan el original?'], rows:[
      ['<b>Agregar/quitar</b>','push, pop, shift, unshift, splice','SÍ'],
      ['<b>Ordenar</b>','sort, reverse, fill, copyWithin','SÍ'],

    ]},
    {t:'p', h:'<b>sort es el villano favorito de los bugs:</b> sin comparador ordena como STRINGS — <code>[1, 10, 2, 21].sort()</code> da <code>[1, 10, 2, 21]</code> (“10” &lt; “2” letra a letra). Con números usa <code>sort((a, b) =&gt; a - b)</code> ascendente o <code>b - a</code> descendente. Y MUTA el array original: si no quieres deformar tu mazo, clona antes: <code>[...puntos].sort((a,b) =&gt; b-a)</code>. Para strings, <code>localeCompare</code> respeta acentos: <code>nombres.sort((a,b) =&gt; a.localeCompare(b, "es"))</code>.'},
    {t:'code', lang:'js', title:'reduce: los tres patrones que cubren el 95%', code:`const compras = [
  { item: "café",   tipo: "mercado",  precio: 120 },
  { item: "libro",  tipo: "ocio",     precio: 350 },
  { item: "azúcar", tipo: "mercado",  precio: 45  }
];

// 1) Acumular un total
const total = compras.reduce((suma, c) => suma + c.precio, 0);   // 515

// 2) Contar por categoría
const conteo = compras.reduce((acc, c) =>
  (acc[c.tipo] = (acc[c.tipo] || 0) + 1, acc), {});              // {mercado:2, ocio:1}

// 3) Agrupar elementos
const grupos = compras.reduce((acc, c) => {
  (acc[c.tipo] = acc[c.tipo] || []).push(c.item);
  return acc;
}, {});                                                          // {mercado:["café","azúcar"], ...}`},
    {t:'p', h:'<b>Encadenar es fluir:</b> <code>tareas.filter(t =&gt; !t.done).map(t =&gt; t.titulo).join(" · ")</code> lee como una frase: filtra pendientes, saca títulos, únelos. Cada eslabón recibe un array y devuelve otro. Regla de oro: <b>filter antes que map</b> (procesa menos elementos), y si necesitas UN valor final, reduce. Si tu cadena pasa de tres eslabones y nadie la entiende, extrae funciones con nombre: <code>pendientes(tareas).titulos().lista()</code> documenta mejor.'},
    {t:'p', h:'<b>Objetos como diccionarios:</b> <code>Object.keys(o)</code> / <code>Object.values(o)</code> / <code>Object.entries(o)</code> te los vuelven array para map/filter. <code>for...in</code> recorre claves de objetos (cuidado con herencia: usa hasOwnProperty o entries); <code>for...of</code> recorre VALORES de iterables (arrays, strings, Map, Set) — no funcionan igual, no los confundas. El spread también clona objetos: <code>{...tarea, done: true}</code> crea la versión completada SIN tocar la original — inmutabilidad en una línea.'},
    {t:'code', lang:'js', title:'Map y Set: los primos que resuelven rápido', code:`// Map: claves de CUALQUIER tipo + tamaño + orden de inserción
const vistos = new Map();
vistos.set("🎃", 3); vistos.set(42, "respuesta");
console.log(vistos.get("🎃"), vistos.size);      // 3 2

// Set: valores únicos (dedupe instantáneo)
const conRepetidos = ["🎃","👻","🎃","🧟","👻"];
const unicos = [...new Set(conRepetidos)];       // ["🎃","👻","🧟"]

// El patrón del juego: ¿ya pasé por esta carta?
const pares = new Set();
function yaEmparejada(id) { return pares.has(id) || (pares.add(id), false); }`},
    {t:'p', h:'<b>Copias superficiales vs profundas:</b> <code>[...arr]</code> y <code>{...obj}</code> copian solo el primer nivel — los objetos internos siguen compartidos. <code>structuredClone(x)</code> (nativo desde 2022) copia TODO de verdad, incluyendo fechas y arrays anidados. El truco histórico <code>JSON.parse(JSON.stringify(x))</code> funciona para datos planos (tareas, configuración) pero pierde funciones, undefined y Dates. Para el modelo de datos de una app como la lista de tareas: JSON round-trip es más que suficiente.'},
    {t:'warn', title:'⚠️ forEach vs map, y el arte de no mutar', h:'forEach existe para EFECTOS (pintar, guardar, console.log) y devuelve undefined: encadenarle algo es un error clásico. map existe para TRANSFORMAR y devuelve array. Mutar dentro de un map (push a un array externo) es usar el martillo como llave: funciona pero delata. Y ojo con sort/reverse/splice en datos que otros usan: clona primero, muta la copia.'},
    {t:'info', title:'📚 Para profundizar', h:'MDN JavaScript reference (cada método con ejemplos) · Axel Rauschmayer, <i>Exploring JavaScript</i> (gratis en exploringjs.com) caps. de arrays y colecciones · Phu Nguyen, <i>JavaScript: from ES2015 to ES2023</i> — referencia rápida de cada versión.'}
  ]},
  { n:7, emoji:'⚙️', short:'Asíncronía', title:'Asíncronía: el event loop, promesas y async/await', time:'20 min', blocks:[
    {t:'p', h:'JavaScript es <b>un solo hilo</b>: ejecuta una instrucción a la vez en su <b>call stack</b>. La magia de “hacer varias cosas” vive FUERA del lenguaje: el navegador (o Node) administra timers, red y eventos, y cuando terminan depositan tu callback en la <b>cola de tareas</b>. El <b>event loop</b> es el carcelero: cuando el stack queda vacío, saca la siguiente tarea de la cola. Por eso el JS bloqueante (un while infinito) congela la página entera: nada más puede entrar al stack.'},
    {t:'code', lang:'js', title:'predice el orden antes de ejecutarlo', code:`console.log("1. síncrono");

setTimeout(() => console.log("2. timeout"), 0);

Promise.resolve().then(() => console.log("3. promesa"));

console.log("4. síncrono");

// Salida real: 1, 4, 3, 2
// Los callbacks síncronos primero; luego MICROTAREAS (promesas, cola aparte
// y prioritaria); por último MACROTAREAS (setTimeout, incluso con 0 ms).`},
    {t:'p', h:'<b>Timers:</b> <code>setTimeout(fn, ms)</code> agenda UNA vez; <code>setInterval(fn, ms)</code> repite hasta <code>clearInterval(id)</code>. El cronómetro del juego de este curso es exactamente eso: guarda el id al arrancar y lo limpia al ganar o reiniciar — olvidarlo es el bug de “el tiempo sigue corriendo” clásico. Dos detalles finos: el ms es MÍNIMO (no prometido, la cola manda) y un intervalo puede solaparse si fn tarda más que el intervalo; el patrón seguro es re-agendar con setTimeout dentro del propio callback.'},
    {t:'p', h:'<b>Promesas:</b> un recibo de trabajo futuro. Estados: <i>pending</i> → <i>fulfilled</i> (con valor) o <i>rejected</i> (con error), sin vuelta atrás. <code>promesa.then(v =&gt; ...)</code> encadena; cada then devuelve una promesa nueva (por eso se pueden apilar); <code>.catch(e =&gt; ...)</code> atrapa errores de TODA la cadena aguas arriba; <code>.finally(() =&gt; ...)</code> corre pase lo que pase (quitar spinners). Devolver una promesa dentro de un then “aplanará” la cadena: el siguiente then espera su resultado.'},
    {t:'code', lang:'js', title:'async/await: asincronía con cara de síncrono', code:`async function cargarRécords() {
  try {
    const res = await fetch("https://api.ejemplo.com/records");
    if (!res.ok) throw new Error("HTTP " + res.status);   // fetch NO lanza con 404
    const datos = await res.json();
    pintarTabla(datos);
  } catch (e) {
    console.error("No pude cargar récords:", e.message);

`// =====================================================
// Juego de Memoria · js/game.js
// Curso: JavaScript y el Juego de Memoria
// Arquitectura: clases Carta/JuegoMemoria (modelo) +
// render y eventos (vista). Estado -> render -> verificar.
// =====================================================

const EMOJIS = ['🎃','👻','🦇','🕷️','🍬','🧙','💀','🕸️','🐲','🍄','🌈','⚡'];
const NIVELES = {
  facil:   { pares: 6,  columnas: 4 },
  normal:  { pares: 8,  columnas: 4 },
  dificil: { pares: 12, columnas: 6 }
};
const CLAVE_RECORD = 'memoria-record-v1';

// ============ Modelo: la carta ============
class Carta {
  #emoji;
  #volteada = false;
  #encontrada = false;

  constructor(id, emoji) {
    this.id = id;
    this.#emoji = emoji;
  }

  get emoji() { return this.#emoji; }
  get volteada() { return this.#volteada; }
  get encontrada() { return this.#encontrada; }

  voltear() { this.#volteada = !this.#volteada; }
  revelar() { this.#volteada = true; this.#encontrada = true; }
  ocultar() { this.#volteada = false; }
}

// ============ Modelo: el juego ============
class JuegoMemoria {
  #mazo = [];
  #primera = null;
  #segunda = null;
  #bloqueado = false;
  #intentos = 0;

  constructor(emojis) { this.#mazo = this.#crearMazo(emojis); }

  get mazo() { return this.#mazo; }
  get intentos() { return this.#intentos; }

  #crearMazo(emojis) {
    const duplicados = [...emojis, ...emojis];
    // Fisher-Yates: mezcla uniforme
    for (let i = duplicados.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [duplicados[i], duplicados[j]] = [duplicados[j], duplicados[i]];
    }
    return duplicados.map((emoji, i) => new Carta(i, emoji));
  }

  // Devuelve: 'invalida' | 'bloqueado' | 'primera' | 'segunda'
  voltearCarta(id) {
    if (this.#bloqueado) return 'bloqueado';
    const carta = this.#mazo.find(c => c.id === id);
    if (!carta || carta.volteada || carta.encontrada) return 'invalida';

    carta.voltear();
    if (!this.#primera) {
      this.#primera = carta;
      return 'primera';
    }
    this.#segunda = carta;
    this.#intentos++;
    this.#bloqueado = true;
    return 'segunda';
  }

  // Resuelve el par. Devuelve true si fue acierto.
  resolver() {
    const a = this.#primera, b = this.#segunda;
    const acierto = !!(a && b && a.emoji === b.emoji);
    if (acierto) { a.revelar(); b.revelar(); }
    else { a.ocultar(); b.ocultar(); }
    this.#primera = null;
    this.#segunda = null;
    this.#bloqueado = false;
    return acierto;
  }

  estaResuelto() {
    return this.#mazo.every(c => c.encontrada);
  }
}

// ============ Vista: render y eventos ============
const tablero  = document.getElementById('tablero');
const elIntent = document.getElementById('intentos');
const elTiempo = document.getElementById('tiempo');
const elRecord = document.getElementById('record');
const elMensaje = document.getElementById('mensaje');

let juego = null;
let segundos = 0;
let idCronometro = null;

function renderizar() {
  tablero.innerHTML = '';
  const frag = document.createDocumentFragment();
  juego.mazo.forEach(carta => {
    const div = document.createElement('div');
    div.className = 'carta'
      + (carta.volteada || carta.encontrada ? ' volteada' : '')
      + (carta.encontrada ? ' encontrada' : '');
    div.dataset.id = carta.id;
    div.innerHTML = '<div class="carta-interior">'
      + '<div class="carta-frente">🎴</div>'
      + '<div class="carta-atras">' + carta.emoji + '</div></div>';
    frag.appendChild(div);
  });
  tablero.appendChild(frag);
  elIntent.textContent = juego.intentos;
}

// ===== Delegación de eventos: UN listener para todo =====
tablero.addEventListener('click', function (evento) {
  const el = evento.target.closest('.carta');
  if (!el) return;

  const resultado = juego.voltearCarta(Number(el.dataset.id));
  if (resultado === 'invalida' || resultado === 'bloqueado') return;

  renderizar();

  if (resultado === 'segunda') {
    setTimeout(function () {
      const acierto = juego.resolver();
      renderizar();
      mostrarMensaje(acierto ? '¡Par! 🎯' : 'Casi…', acierto ? 'ok' : 'error');
      if (juego.estaResuelto()) celebrar();
    }, 700);
  }
});

// ===== Cronómetro =====
function iniciarCronometro() {
  detenerCronometro();
  segundos = 0;
  elTiempo.textContent = '00:00';
  idCronometro = setInterval(function () {
    segundos++;
    const min = String(Math.floor(segundos / 60)).padStart(2, '0');
    const seg = String(segundos % 60).padStart(2, '0');
    elTiempo.textContent = min + ':' + seg;
  }, 1000);
}
function detenerCronometro() {
  if (idCronometro) { clearInterval(idCronometro); idCronometro = null; }
}

// ===== Récords con localStorage =====
function obtenerRecord() {
  try {
    const datos = localStorage.getItem(CLAVE_RECORD);
    return datos ? JSON.parse(datos) : null;
  } catch (e) { return null; }
}
function guardarRecord(intentos, segundos) {
  const actual = obtenerRecord();
  const mejor = !actual
    || intentos < actual.intentos
    || (intentos === actual.intentos && segundos < actual.segundos);
  if (mejor) {
    try {
      localStorage.setItem(CLAVE_RECORD, JSON.stringify({
        intentos: intentos, segundos: segundos,
        fecha: new Date().toLocaleDateString('es-MX')
      }));
    } catch (e) { /* storage lleno o bloqueado */ }
  }
  return mejor;
}
function mostrarRecord() {
  const r = obtenerRecord();
  elRecord.textContent = r ? r.intentos + ' intentos' : '—';
}

// ===== Mensajes y victoria =====
let idMensaje = null;
function mostrarMensaje(texto, tipo) {
  clearTimeout(idMensaje);
  elMensaje.textContent = texto;
  elMensaje.className = tipo || '';
  idMensaje = setTimeout(function () {
    elMensaje.textContent = ''; elMensaje.className = '';
  }, 1200);
}

function celebrar() {
  detenerCronometro();
  const recordPrevio = obtenerRecord();
  const esRecord = guardarRecord(juego.intentos, segundos);
  mostrarRecord();
  mostrarMensaje(
    (esRecord ? '🎉 ¡Nuevo récord! ' : '🎉 ¡Ganaste! ')
    + juego.intentos + ' intentos · ' + elTiempo.textContent
    + (recordPrevio && !esRecord ? ' (récord: ' + recordPrevio.intentos + ')' : ''),
    'ok'
  );
}

// ===== Nuevo juego / reinicio =====
function nuevoJuego(nivel) {
  const config = NIVELES[nivel] || NIVELES.normal;
  tablero.style.gridTemplateColumns = 'repeat(' + config.columnas + ', 1fr)';
  juego = new JuegoMemoria(EMOJIS.slice(0, config.pares));
  detenerCronometro();
  iniciarCronometro();
  elMensaje.textContent = '';
  renderizar();
}

document.getElementById('reiniciar').addEventListener('click', function () {
  nuevoJuego(document.getElementById('nivel').value);
});
document.getElementById('nivel').addEventListener('change', function (e) {
  nuevoJuego(e.target.value);
});

// ===== Arranque =====
mostrarRecord();
nuevoJuego('normal');
`},
