<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Curso interactivo · Unity desde cero (C#)</title>
<meta name="description" content="Curso interactivo de Unity 6.3 LTS en español: aprende C# desde cero con un mini-interpreter en tu navegador — WriteLine, ciclos, clases, List, Vector3, Random con semilla y un juego final calificado por salida.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🕹️</text></svg>">
<style>
/* ============================================================
   CodeCamp · Sistema de diseño profesional
   ============================================================ */
:root{
  --bg:#f5f6fa; --card:#ffffff; --ink:#101828; --muted:#667085; --line:#e6e8ef; --line2:#eef0f6;
  --brand:#4f46e5; --brand-2:#7c3aed; --brand-ink:#3730a3; --brand-soft:#eef1ff; --brand-line:#dee3ff;
  --ok:#12855f; --ok-bg:#effaf4; --ok-line:#bfe8d4;
  --bad:#d92d20; --bad-bg:#fef3f2; --bad-line:#f9cfc9;
  --warn:#b54708; --warn-bg:#fffaeb; --warn-line:#fbe5a8;
  --info:#175cd3; --info-bg:#f2f7ff; --info-line:#cfe1fb;
  --code-bg:#0c1222; --code-head:#111a35;
  --sh-xs:0 1px 2px rgba(16,24,40,.06);
  --sh-sm:0 1px 3px rgba(16,24,40,.07), 0 8px 20px -8px rgba(16,24,40,.1);
  --sh-md:0 4px 10px rgba(16,24,40,.08), 0 18px 40px -16px rgba(16,24,40,.18);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.65;font-size:15.5px;-webkit-font-smoothing:antialiased}
::selection{background:#ddd9ff}
body.no-scroll{overflow:hidden}
button{font-family:inherit}
a{color:var(--brand)}
code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px}
code.inline,.qfb code,.box code,li code,p code,td code,.exsub code,.lmeta code,.frame-note code,.rmsg code,.ad-note code,.nd-hint code,.lead-text code{background:var(--brand-soft);border:1px solid var(--brand-line);padding:1px 6px;border-radius:6px;font-size:.87em;color:var(--brand-ink)}

/* ===== Layout base ===== */
.app{display:grid;grid-template-columns:290px minmax(0,1fr);align-items:start}
.maincol{min-width:0}
#backdrop{display:none}
#topbar{display:flex;align-items:center;gap:16px;background:var(--card);border-bottom:1px solid var(--line);padding:0 20px;min-height:58px;position:sticky;top:0;z-index:120}
.brand{display:flex;align-items:center;gap:11px;white-space:nowrap}
.logo-mark{width:32px;height:32px;flex:none;border-radius:9px;background:linear-gradient(135deg,var(--brand),var(--brand-2));display:grid;place-items:center;font-size:16px;box-shadow:var(--sh-xs)}
.brand-text{line-height:1.2}
.brand-text b{font-size:14.5px;letter-spacing:-.01em}
.brand-text small{display:block;color:var(--muted);font-size:11px;font-weight:600;letter-spacing:.02em}
.topprogress{flex:1;display:flex;align-items:center;gap:10px;min-width:120px}
.topprogress .bar{flex:1;height:8px;background:var(--line2);border-radius:99px;overflow:hidden}
.topprogress .bar>div{height:100%;width:0%;background:linear-gradient(90deg,var(--brand),var(--brand-2));border-radius:99px;transition:width .6s cubic-bezier(.22,1,.36,1)}
.topprogress span{font-size:12px;font-weight:700;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.chip.grade{font-size:12.5px;font-weight:700;padding:6px 13px;border-radius:99px;background:var(--line2);color:var(--muted);white-space:nowrap}
.chip.grade.g-good{background:var(--ok-bg);color:var(--ok);box-shadow:inset 0 0 0 1px var(--ok-line)}
.chip.grade.g-mid{background:var(--warn-bg);color:var(--warn);box-shadow:inset 0 0 0 1px var(--warn-line)}
.chip.grade.g-bad{background:var(--bad-bg);color:var(--bad);box-shadow:inset 0 0 0 1px var(--bad-line)}
#menuBtn{display:none;border:1px solid var(--line);background:#fff;border-radius:9px;font-size:17px;padding:4px 11px;cursor:pointer;color:var(--ink)}

/* ===== Sidebar ===== */
#sidebar{position:sticky;top:0;height:100vh;height:100dvh;background:var(--card);border-right:1px solid var(--line);overflow-y:auto;padding:14px 12px 48px}
.side-sec{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:800;margin:12px 8px 6px}
.sgroup{margin-bottom:8px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
.sgroup-head{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:transparent;border:none;padding:10px 12px;cursor:pointer;font-weight:700;font-size:13px;color:var(--ink)}
.sgroup-head:hover{background:#f7f8fc}
.sgroup-head .emo{font-size:15px;flex:none}
.sgroup-head .stitle-g{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sgroup-head .chev{color:var(--muted);transition:transform .25s;font-size:10.5px;flex:none}
.sgroup.open .sgroup-head .chev{transform:rotate(90deg)}
.sgroup-body{display:none;border-top:1px solid var(--line2);background:#fcfcfe}
.sgroup.open .sgroup-body{display:block}
.slesson{display:flex;align-items:center;gap:9px;width:100%;text-align:left;border:none;background:transparent;padding:7px 12px 7px 12px;cursor:pointer;font-size:12.8px;color:#3d4657;border-left:2px solid transparent}
.slesson:hover{background:#f4f6fd}
.slesson.active{background:var(--brand-soft);border-left-color:var(--brand);font-weight:700;color:var(--brand-ink)}
.slesson .num{flex:none;width:20px;height:20px;border-radius:50%;background:var(--line2);color:#5a6474;font-size:10.5px;font-weight:800;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.slesson.done .num{background:var(--ok);color:#fff}
.slesson .stitle{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slesson .sscore,.sextra .sscore{flex:none;font-size:10px;font-weight:800;color:var(--ok);background:var(--ok-bg);box-shadow:inset 0 0 0 1px var(--ok-line);border-radius:99px;padding:2px 7px;font-variant-numeric:tabular-nums}
.sextra{display:flex;align-items:center;gap:9px;width:100%;text-align:left;border:none;background:transparent;padding:9px 12px;margin-top:2px;border-radius:10px;cursor:pointer;font-size:13px;font-weight:650;color:#3d4657}
.sextra:hover{background:#f4f6fd}
.sextra .ico{flex:none;width:22px;text-align:center}

/* ===== Contenido ===== */
#content{padding:32px 38px 90px}
.view{max-width:880px;margin:0 auto;animation:fadeUp .3s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.lesson-head{margin-bottom:22px;padding-bottom:18px;border-bottom:1px solid var(--line)}
.lmodule{display:inline-flex;align-items:center;gap:7px;font-size:11px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--brand-ink);background:var(--brand-soft);box-shadow:inset 0 0 0 1px var(--brand-line);padding:4px 11px;border-radius:99px;margin-bottom:12px}
h1.ltitle{font-size:27px;line-height:1.28;letter-spacing:-.02em;font-weight:800}
.lmeta{color:var(--muted);font-size:12.5px;margin-top:7px;font-weight:600}
h3.sec{font-size:18.5px;margin:28px 0 10px;letter-spacing:-.015em;font-weight:750}
p.lead-text{margin:10px 0}
ul.nice,ol.nice{margin:10px 0 10px 4px;padding-left:22px}
ul.nice li,ol.nice li{margin:6px 0}
ul.nice li::marker{color:var(--brand)}
.frame-note{font-size:12.5px;color:var(--muted);margin:-8px 0 0;font-weight:550}

/* ===== Cajas de mensaje ===== */
.box{border-radius:12px;padding:13px 16px;margin:16px 0;border:1px solid;border-left-width:4px;font-size:14.5px}
.box .box-title{display:block;font-weight:750;margin-bottom:3px;font-size:13.5px}
.box.tip{background:#f2fbf7;border-color:var(--ok-line);border-left-color:#2fbf8f;color:#0d5138}
.box.tip .box-title{color:#0e9f6e}
.box.warn{background:var(--warn-bg);border-color:var(--warn-line);border-left-color:#f79009;color:#71400a}
.box.warn .box-title{color:var(--warn)}
.box.info{background:var(--info-bg);border-color:var(--info-line);border-left-color:#528bff;color:#1a3d8f}
.box.info .box-title{color:var(--info)}
.box.milestone{background:linear-gradient(115deg,#f7f4ff,#fdf3f9);border-color:#e7dbff;border-left-color:#8b5cf6;color:#432e7a}
.box.milestone .box-title{color:#6d28d9}

/* ===== Tablas de referencia ===== */
table.ref{width:100%;border-collapse:separate;border-spacing:0;margin:14px 0;font-size:13.5px;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:var(--sh-xs)}
table.ref th{background:#f8f9fc;text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:9px 14px}
table.ref td{padding:9px 14px;border-top:1px solid var(--line2);vertical-align:top}
table.ref td:first-child{white-space:nowrap;font-weight:650}

/* ===== Bloques de código ===== */
.codewrap{background:var(--code-bg);border-radius:12px;margin:16px 0;overflow:hidden;box-shadow:var(--sh-sm);border:1px solid #1c2748}
.codehead{display:flex;align-items:center;gap:10px;padding:9px 14px;background:var(--code-head);border-bottom:1px solid #1c2748}
.dots{display:flex;gap:6px;flex:none}
.dots i{width:10px;height:10px;border-radius:50%;display:block}
.dots i:nth-child(1){background:#ff5f57}.dots i:nth-child(2){background:#febc2e}.dots i:nth-child(3){background:#28c840}
.langtag{font-size:11px;font-weight:700;color:#8fa0c9;letter-spacing:.08em;text-transform:uppercase;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.copybtn{border:1px solid #2c3a63;background:transparent;color:#aebbe4;font-size:11.5px;padding:4px 10px;border-radius:7px;cursor:pointer;font-weight:700;flex:none}
.copybtn:hover{background:#1b2647;color:#fff}
.codewrap pre{padding:16px 18px;overflow-x:auto;font-size:13px;line-height:1.65;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#d7e0f7}
.tok-c{color:#7d8898;font-style:italic}
.tok-tag{color:#6ee7a0}
.tok-attr{color:#82aaff}
.tok-str{color:#9ecbff}
.tok-kw{color:#f97583}
.tok-num{color:#f8c763}
.tok-builtin{color:#c39cff}
.tok-doctype{color:#c39cff;font-weight:700}
.tok-sel{color:#6ee7a0}
.tok-prop{color:#82aaff}
.tok-val{color:#9ecbff}

/* ===== Editor en vivo ===== */
.edwrap{border:1px solid var(--line);border-radius:14px;overflow:hidden;margin:18px 0;background:#fff;box-shadow:var(--sh-sm)}
.edbar{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#f8f9fc;border-bottom:1px solid var(--line);padding:8px 14px}
.edfile{font-size:12px;font-weight:700;color:var(--muted);font-family:ui-monospace,Menlo,Consolas,monospace}
.edbtns{display:flex;gap:8px}
.runbtn,.resetbtn{border:1px solid transparent;border-radius:8px;padding:6px 13px;font-size:12px;font-weight:750;cursor:pointer}
.runbtn{background:#12b76a;color:#fff}
.runbtn:hover{background:#0e9f5e}
.resetbtn{background:#fff;border-color:var(--line);color:#3d4657}
.resetbtn:hover{background:#f4f6fd}
.edpanes{display:grid;grid-template-columns:1fr 1fr;min-height:230px}
.edpanes textarea{border:none;resize:vertical;outline:none;padding:14px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.8px;line-height:1.6;background:var(--code-bg);color:#d7e0f7;min-height:230px;border-right:1px solid var(--line);tab-size:2}
.edpanes iframe{border:none;width:100%;min-height:230px;background:#fff}
.edhint{font-size:12.5px;color:var(--muted);margin-top:-10px;margin-bottom:14px;padding:0 4px}

/* ===== Ejercicios ===== */
.exercise{border:1.5px dashed #c3caff;border-radius:16px;padding:20px;margin:24px 0;background:#fdfdff}
.exhead{font-size:17.5px;font-weight:800;margin-bottom:5px;letter-spacing:-.01em}
.exsub{font-size:13.5px;color:var(--muted);margin-bottom:12px}
.checks{margin:14px 0 6px;display:grid;gap:6px}
.check{display:flex;align-items:center;gap:9px;font-size:13px;background:#f8f9fc;border:1px solid var(--line);border-radius:10px;padding:7px 12px;transition:all .2s}
.check .cic{flex:none;width:20px;height:20px;border-radius:50%;background:var(--line2);display:grid;place-items:center;font-size:11px;font-weight:900;color:#6a7386}
.check.okp{background:var(--ok-bg);border-color:var(--ok-line)}
.check.okp .cic{background:var(--ok);color:#fff}
.check.failp{background:var(--bad-bg);border-color:var(--bad-line)}
.check.failp .cic{background:var(--bad);color:#fff}
.check .pts{margin-left:auto;font-size:10.5px;font-weight:800;color:var(--muted);white-space:nowrap}

/* ===== Quizzes ===== */
.quiz{border:1px solid var(--line);border-radius:16px;padding:22px;margin:32px 0 10px;background:linear-gradient(180deg,#fbfcff,#f7f8fd);box-shadow:var(--sh-xs)}
.quiz-title{font-size:20px;margin-bottom:2px;font-weight:800;letter-spacing:-.01em}
.quiz-sub{font-size:13px;color:var(--muted);margin-bottom:16px}
.qcard{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin:12px 0;box-shadow:var(--sh-xs)}
.qq{font-weight:700;font-size:14.5px;margin-bottom:4px}
.qpts{display:inline-block;font-size:10.5px;font-weight:800;color:var(--brand-ink);background:var(--brand-soft);box-shadow:inset 0 0 0 1px var(--brand-line);border-radius:99px;padding:1px 9px;margin-bottom:10px}
.opts{display:grid;gap:8px;margin-top:8px}
.opt{text-align:left;border:1px solid #d4d9e3;background:#fff;border-radius:10px;padding:10px 14px;font-size:13.8px;cursor:pointer;transition:all .15s;display:flex;gap:10px;align-items:flex-start;color:var(--ink)}
.opt .ol{flex:none;width:22px;height:22px;border-radius:7px;background:#f2f4f7;display:grid;place-items:center;font-size:11px;font-weight:900;color:#5a6474;margin-top:1px}
.opt:hover{border-color:#a5acff;background:#f8f9ff}
.opt.sel{border-color:var(--brand);background:var(--brand-soft);box-shadow:0 0 0 1px var(--brand)}
.opt.sel .ol{background:var(--brand);color:#fff}
.opt.locked{cursor:default;pointer-events:none}
.opt.reveal{border-color:var(--ok-line);background:var(--ok-bg)}
.opt.reveal .ol{background:var(--ok);color:#fff}
.opt.correct{border-color:var(--ok);box-shadow:0 0 0 1px var(--ok)}
.opt.incorrect{border-color:var(--bad);box-shadow:0 0 0 1px var(--bad)}
.fillwrap{margin-top:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.fillwrap input{flex:1;min-width:200px;border:1px solid #d4d9e3;border-radius:10px;padding:9px 13px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;outline:none;background:#fff;color:var(--ink)}
.fillwrap input:focus{border-color:var(--brand);box-shadow:0 0 0 3px #e3e0ff}
.fillwrap .hint{font-size:11.5px;color:var(--muted)}
.quiz-actions{margin-top:16px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.quiz-remain{font-size:12px;color:var(--muted);font-weight:650}
.quiz-result{display:none;margin-top:16px;border-radius:14px;padding:18px;position:relative;text-align:center;border:1px solid var(--line);background:#fff;box-shadow:var(--sh-xs)}
.quiz-result.show{display:block}
.bigscore{font-size:36px;font-weight:850;letter-spacing:-.03em}
.bigscore small{font-size:15px;color:var(--muted);font-weight:700}
.rmsg{font-size:14px;margin-top:2px}

/* ===== Botones ===== */
.btn{border:none;border-radius:10px;padding:10px 18px;font-size:13.5px;font-weight:750;cursor:pointer;background:var(--brand);color:#fff;box-shadow:var(--sh-xs);transition:background .15s,transform .15s,box-shadow .15s;letter-spacing:.005em}
.btn:hover{background:#4338ca;transform:translateY(-1px);box-shadow:var(--sh-sm)}
.btn:active{transform:none}
.btn.ghost{background:#fff;color:#3d4657;border:1px solid #d4d9e3;box-shadow:none}
.btn.ghost:hover{background:#f7f8fc;color:var(--ink);box-shadow:none}
.btn.small{padding:7px 13px;font-size:12px;border-radius:9px}
.btn.green{background:#12b76a}
.btn.green:hover{background:#0e9f5e}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}

/* ===== Navegación entre lecciones ===== */
.navbtns{display:flex;justify-content:space-between;gap:12px;margin-top:36px;padding-top:18px;border-top:1px solid var(--line)}
.navbtns .btn{max-width:48%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ===== Árbol DOM ===== */
.domtree{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin:16px 0;box-shadow:var(--sh-xs);font-size:13px}
.domtree ul{list-style:none;padding-left:26px;border-left:2px dashed #d0d5e2;margin-left:8px}
.dnode{display:inline-block;border-radius:8px;padding:3px 11px;margin:3px 0;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;font-weight:700;border:1px solid}
.dnode.doc{background:#fffaeb;border-color:#fbe5a8;color:#7a4b06}
.dnode.tag{background:#effaf4;border-color:#bfe8d4;color:#0d5c42}
.dnode.idn{background:var(--brand-soft);border-color:var(--brand-line);color:var(--brand-ink)}
.dnode.text{background:#fdf2f8;border-color:#f9c7e2;color:#9d1e5f;font-weight:650}

/* ===== Demo appendChild ===== */
.appenddemo{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin:16px 0;box-shadow:var(--sh-xs)}
.ad-code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;background:var(--code-bg);color:#6ee7a0;padding:9px 13px;border-radius:9px;margin-bottom:12px}
.ad-list{list-style:none;padding:0;margin:12px 0}
.ad-list li{background:var(--brand-soft);border:1px solid var(--brand-line);color:var(--brand-ink);border-radius:9px;padding:6px 12px;font-size:12.5px;font-weight:700;margin:6px 0;animation:pop .3s cubic-bezier(.34,1.56,.64,1) both}
@keyframes pop{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:scale(1)}}
.ad-note{font-size:12.5px;color:var(--muted);margin-top:8px}
.ad-actions{display:flex;gap:8px;flex-wrap:wrap}

/* ===== Demo navbar ===== */
.navdemo{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin:16px 0;box-shadow:var(--sh-xs)}
.nd-bar{background:#0d6efd;border-radius:11px;padding:10px 16px;display:flex;align-items:center;gap:14px;color:#fff;position:relative}
.nd-brand{font-weight:750;font-size:15px}
.nd-tog{margin-left:auto;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:8px;padding:3px 10px;font-size:15px;cursor:pointer}
.nd-menu{display:flex;gap:18px;margin-left:auto}
.nd-menu a{color:#fff;text-decoration:none;font-size:13.5px;opacity:.9;cursor:pointer}
.nd-menu a:hover{opacity:1;text-decoration:underline}
.nd-menu.colapsado{display:none}
.nd-menu.abierto{display:flex !important;position:absolute;top:46px;right:14px;flex-direction:column;background:#0d6efd;padding:12px 18px;border-radius:11px;box-shadow:var(--sh-md);gap:10px;margin:0}
.nd-hint{font-size:12.5px;color:var(--muted);margin-top:10px}

/* ===== Demo localStorage ===== */
.storedemo{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin:16px 0;box-shadow:var(--sh-xs)}
.sd-row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.sd-row input{flex:1;min-width:180px;border:1px solid #d4d9e3;border-radius:10px;padding:9px 13px;font-size:14px;outline:none;background:#fff;color:var(--ink)}
.sd-row input:focus{border-color:var(--brand);box-shadow:0 0 0 3px #e3e0ff}
.sd-out{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;background:var(--code-bg);color:#9ecbff;border-radius:10px;padding:12px 14px;margin-top:10px;min-height:44px;white-space:pre-wrap}
.sd-note{font-size:12px;color:var(--warn);margin-top:8px;font-weight:600}

/* ===== Marco de demo de la app ===== */
.appframe-wrap{border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--sh-sm);margin:18px 0 8px;background:#fff}
.appframe-bar{display:flex;align-items:center;gap:7px;background:#f2f4f7;border-bottom:1px solid var(--line);padding:9px 13px}
.appframe-bar i{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.appframe-bar .url{flex:1;background:#fff;border:1px solid var(--line);border-radius:99px;font-size:11.5px;color:var(--muted);padding:3px 12px;font-family:ui-monospace,Menlo,Consolas,monospace;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.appframe{width:100%;height:440px;border:none;display:block;background:#eef2f7}

/* ===== Inicio ===== */
.hero{border-radius:20px;color:#fff;padding:46px 42px;margin-bottom:28px;position:relative;overflow:hidden;box-shadow:var(--sh-md);
  background:
    radial-gradient(640px 320px at 88% -12%, rgba(139,92,246,.45), transparent 62%),
    radial-gradient(520px 280px at -8% 112%, rgba(56,130,246,.38), transparent 62%),
    linear-gradient(135deg,#1b1740 0%,#282364 55%,#342a80 100%)}
.hero h1{font-size:33px;line-height:1.22;letter-spacing:-.025em;font-weight:800;max-width:600px;position:relative;z-index:1}
.hero h1 u{text-decoration-color:#a78bfa;text-decoration-thickness:3px;text-underline-offset:5px}
.hero p{margin:14px 0 0;max-width:590px;font-size:15px;color:#d4d9f6;position:relative;z-index:1}
.hero .hero-ctas{margin-top:24px;display:flex;gap:10px;flex-wrap:wrap;position:relative;z-index:1}
.hero .btn{background:#fff;color:#312e81;box-shadow:0 2px 8px rgba(10,8,40,.35)}
.hero .btn:hover{background:#f1efff;transform:translateY(-1px)}
.hero .btn.ghost{background:rgba(255,255,255,.1);color:#fff;border-color:rgba(255,255,255,.45);box-shadow:none}
.hero .btn.ghost:hover{background:rgba(255,255,255,.18);color:#fff}
.hero-stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:26px;position:relative;z-index:1}
.stat{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);border-radius:12px;padding:9px 15px;font-size:11.5px;font-weight:700;color:#cfd4f2;letter-spacing:.02em}
.stat b{display:block;font-size:18px;color:#fff;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.home-sec{margin:36px 0 14px;font-size:20px;font-weight:800;letter-spacing:-.02em;display:flex;align-items:center;gap:10px}
.home-sec::before{content:"";width:26px;height:4px;border-radius:99px;background:linear-gradient(90deg,var(--brand),var(--brand-2));flex:none}
.modules-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(252px,1fr));gap:14px}
.mcard{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--sh-xs);display:flex;flex-direction:column;gap:9px;transition:transform .18s,box-shadow .18s}
.mcard:hover{transform:translateY(-2px);box-shadow:var(--sh-sm)}
.mcard .mce{width:40px;height:40px;border-radius:10px;background:var(--brand-soft);display:grid;place-items:center;font-size:21px}
.mcard h4{font-size:15px;letter-spacing:-.01em}
.mcard p{font-size:12.5px;color:var(--muted);flex:1}
.mcard .mprog{height:7px;background:var(--line2);border-radius:99px;overflow:hidden}
.mcard .mprog>div{height:100%;background:linear-gradient(90deg,var(--brand),var(--brand-2));border-radius:99px;transition:width .5s}
.mcard .mlinks{font-size:11px;font-weight:750;color:var(--muted);letter-spacing:.03em;text-transform:uppercase}
.mcard .btn{align-self:flex-start}

/* ===== Boleta / certificado ===== */
.grade-hero{background:linear-gradient(135deg,#141a2e,#1d2647);border-radius:18px;color:#fff;padding:28px 30px;display:flex;gap:28px;align-items:center;flex-wrap:wrap;margin:18px 0;box-shadow:var(--sh-md)}
.bigpct{font-size:52px;font-weight:850;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
.bigpct small{font-size:17px;color:#8b96b8;font-weight:700}
.grade-hero .gh-info{flex:1;min-width:240px}
.grade-hero .gh-info h3{font-size:17px;letter-spacing:-.01em}
.grade-hero .gh-info p{color:#9aa6c8;font-size:13px;margin-top:5px}
table.rep{width:100%;border-collapse:separate;border-spacing:0;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:var(--sh-xs);font-size:13px;margin:14px 0}
table.rep th{background:#f8f9fc;text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:9px 14px}
table.rep td{padding:8px 14px;border-top:1px solid var(--line2)}
table.rep td .rbar{height:6px;background:var(--line2);border-radius:99px;overflow:hidden;min-width:90px}
table.rep td .rbar>div{height:100%;background:linear-gradient(90deg,var(--brand),var(--brand-2));border-radius:99px}
.st-chip{font-size:10.5px;font-weight:800;border-radius:99px;padding:3px 10px}
.st-done{background:var(--ok-bg);color:var(--ok);box-shadow:inset 0 0 0 1px var(--ok-line)}
.st-todo{background:var(--line2);color:var(--muted)}
.cert{border:1px solid var(--line);background:#fff;background-image:radial-gradient(420px 200px at 50% -40%,#f2f0ff,transparent 70%);border-radius:18px;padding:36px 28px;text-align:center;margin:26px 0;box-shadow:var(--sh-sm)}
.cert .cert-kicker{font-size:10.5px;letter-spacing:.3em;text-transform:uppercase;color:var(--muted);font-weight:800}
.cert h2{font-size:24px;margin:8px 0 2px;letter-spacing:-.02em}
.cert .cert-name{font-size:30px;font-weight:850;background:linear-gradient(90deg,var(--brand),var(--brand-2));-webkit-background-clip:text;background-clip:text;color:transparent;margin:12px 0 4px}
.cert .cert-meta{color:var(--muted);font-size:13px}
.namebox{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:14px 0}
.namebox input{border:1px solid #d4d9e3;border-radius:10px;padding:10px 15px;font-size:14px;outline:none;min-width:230px;background:#fff;color:var(--ink)}
.namebox input:focus{border-color:var(--brand);box-shadow:0 0 0 3px #e3e0ff}

/* ===== Proyecto final ===== */
.filetree{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;background:var(--code-bg);color:#c7d3f2;border-radius:12px;padding:16px 20px;margin:14px 0;white-space:pre;overflow-x:auto;line-height:1.75;box-shadow:var(--sh-sm)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:16px 0 0}
.tab{border:1px solid var(--line);border-bottom:none;background:#f4f6fd;border-radius:10px 10px 0 0;padding:8px 15px;font-size:12px;font-weight:750;cursor:pointer;color:#4a5468;font-family:ui-monospace,Menlo,Consolas,monospace}
.tab:hover{background:#ebeefb}
.tab.active{background:var(--code-bg);color:#8fe7b1;border-color:var(--code-bg)}
.tabfile .codewrap{margin-top:0;border-radius:0 12px 12px 12px}

/* ===== Pasos ===== */
ol.steps{counter-reset:paso;list-style:none;margin:14px 0;padding:0}
ol.steps li{counter-increment:paso;position:relative;padding:0 0 15px 46px;margin:0}
ol.steps li::before{content:counter(paso);position:absolute;left:0;top:0;width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff;font-weight:800;font-size:13px;display:grid;place-items:center;box-shadow:0 2px 6px rgba(79,70,229,.35)}
ol.steps li:not(:last-child)::after{content:"";position:absolute;left:13px;top:31px;bottom:3px;width:2px;background:var(--brand-line)}

/* ===== Confeti ===== */
.confetti-layer{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:5}
.confetti-layer i{position:absolute;top:-14px;width:8px;height:14px;border-radius:2px;animation:cfall linear forwards}
@keyframes cfall{to{transform:translateY(480px) rotate(720deg);opacity:.15}}

/* ===== Examen ===== */
.exam-head{background:linear-gradient(135deg,#171c33,#232a56);border-radius:18px;color:#fff;padding:30px 32px;margin-bottom:22px;box-shadow:var(--sh-md)}
.exam-head h1{font-size:24px;letter-spacing:-.02em}
.exam-head p{color:#c3cdf0;font-size:13.5px;margin-top:7px;max-width:640px}

/* ===== Scrollbars ===== */
#sidebar::-webkit-scrollbar{width:10px}
#sidebar::-webkit-scrollbar-thumb{background:#cfd4e0;border-radius:99px;border:2px solid var(--bg)}
#sidebar::-webkit-scrollbar-track{background:transparent}

/* ===== Libro de texto ===== */
.book-pills{display:flex;gap:7px;flex-wrap:wrap;margin:14px 0 20px}
.bpill{border:1px solid var(--line);background:#fff;border-radius:99px;padding:7px 13px;font-size:12px;font-weight:750;cursor:pointer;color:#3d4657}
.bpill:hover{background:#f4f6fd}
.bpill.active{background:var(--brand);border-color:var(--brand);color:#fff}

/* ===== Login / cuentas ===== */
.chip.user{display:none;font-size:12px;font-weight:750;padding:6px 12px;border-radius:99px;background:var(--brand-soft);color:var(--brand-ink);border:none;cursor:pointer;font-family:inherit;white-space:nowrap}
.chip.user:hover{background:#e2e6ff}
#authLayer{display:none}
#authLayer.show{display:block;position:fixed;inset:0;z-index:100;overflow-y:auto;
  background:
    radial-gradient(700px 340px at 85% -10%, rgba(139,92,246,.5), transparent 60%),
    radial-gradient(560px 300px at -5% 110%, rgba(56,130,246,.45), transparent 60%),
    linear-gradient(135deg,#171338 0%,#241f5c 55%,#302774 100%)}
.auth-wrap{min-height:100%;display:grid;place-items:center;padding:28px 16px}
.auth-card{width:100%;max-width:430px;background:#fff;border-radius:20px;box-shadow:0 24px 70px rgba(8,6,30,.5);overflow:hidden}
.auth-head{padding:26px 28px 0;text-align:center}
.auth-logo{width:52px;height:52px;border-radius:14px;background:linear-gradient(135deg,var(--brand),var(--brand-2));display:grid;place-items:center;font-size:26px;margin:0 auto 12px;box-shadow:0 8px 20px rgba(79,70,229,.4)}
.auth-head h1{font-size:20px;letter-spacing:-.02em}
.auth-head p{font-size:12.5px;color:var(--muted);margin-top:4px}
.auth-tabs{display:flex;gap:4px;margin:18px 20px 0;background:var(--line2);border-radius:11px;padding:4px}
.auth-tab{flex:1;border:none;background:transparent;border-radius:8px;padding:8px 10px;font-size:13px;font-weight:750;cursor:pointer;color:var(--muted);font-family:inherit}
.auth-tab.active{background:#fff;color:var(--ink);box-shadow:var(--sh-xs)}
.auth-body{padding:18px 24px 8px;display:grid;gap:11px}
.auth-field label{display:block;font-size:12px;font-weight:750;color:var(--muted);margin-bottom:4px}
.auth-field input{width:100%;border:1px solid #d4d9e3;border-radius:10px;padding:10px 13px;font-size:14px;outline:none;font-family:inherit;color:var(--ink)}
.auth-field input:focus{border-color:var(--brand);box-shadow:0 0 0 3px #e3e0ff}
.auth-msg{font-size:12.5px;font-weight:650;border-radius:9px;padding:8px 12px;display:none}
.auth-msg.show{display:block}
.auth-msg.err{background:var(--bad-bg);color:var(--bad);box-shadow:inset 0 0 0 1px var(--bad-line)}
.auth-msg.ok{background:var(--ok-bg);color:var(--ok);box-shadow:inset 0 0 0 1px var(--ok-line)}
.auth-users{font-size:11.5px;color:var(--muted);text-align:center}
.auth-actions{padding:6px 24px 4px;display:grid;gap:9px}
.auth-div{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:11.5px;font-weight:700}
.auth-div::before,.auth-div::after{content:"";flex:1;height:1px;background:var(--line)}
.auth-note{padding:10px 24px 4px;text-align:center;font-size:11px;color:var(--muted);line-height:1.55}
.auth-reset{background:none;border:none;color:var(--muted);font-size:11px;cursor:pointer;text-decoration:underline;display:block;margin:0 auto;padding:2px 24px 22px;font-family:inherit;width:100%}
.auth-reset:hover{color:var(--bad)}

/* ===== Responsive ===== */
@media (max-width:920px){
  .app{grid-template-columns:1fr}
  #sidebar{position:fixed;z-index:60;width:296px;top:0;bottom:0;left:-316px;transition:left .28s ease;box-shadow:var(--sh-md)}
  #sidebar.open{left:0}
  #backdrop{display:none;position:fixed;inset:0;background:rgba(16,24,40,.45);z-index:55}
  #backdrop.show{display:block}
  #menuBtn{display:block}
  .topprogress span{display:none}
  .brand-text small{display:none}
  #content{padding:22px 16px 80px}
  .edpanes{grid-template-columns:1fr}
  .edpanes textarea{border-right:none;border-bottom:1px solid var(--line);min-height:170px}
  .edpanes iframe{min-height:200px}
  .hero{padding:32px 22px}
  .hero h1{font-size:25px}
  .grade-hero{padding:22px}
}
@media print{
  #sidebar,#topbar,#backdrop,.navbtns,.namebox,.frame-note{display:none !important}
  body{background:#fff}
  .app{display:block}
  #content{padding:0}
}

/* ===== Curso SQL: ejercicios, resultados y playground ===== */
.sqltask{border:1px solid #e2e8f0;border-radius:14px;padding:14px;margin:12px 0;background:#fff}
.sqltask.solved{border-color:#86efac;background:#f6fef9}
.sqlq{display:flex;gap:10px;align-items:flex-start;font-weight:600;font-size:14.5px}
.sqlq .tnum{flex:none;background:#eef2ff;color:#4338ca;border-radius:8px;padding:2px 9px;font-weight:800}
.sqlq .tq{flex:1;min-width:0}
.sqlq .qpts{flex:none;color:#64748b;font-size:12px;font-weight:800;background:#f1f5f9;padding:2px 8px;border-radius:99px}
.sqlq .tst{flex:none;color:#16a34a;font-weight:800;font-size:12.5px;white-space:nowrap}
.sqlta{width:100%;min-height:96px;margin-top:10px;font:13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;border:1.5px solid #cbd5e1;border-radius:12px;padding:10px 12px;resize:vertical;background:#0f172a;color:#e2e8f0;line-height:1.5;box-sizing:border-box}
.sqlta:focus{outline:none;border-color:#6366f1;box-shadow:0 0 0 3px rgba(99,102,241,.15)}
.sqlbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.btn.small.good{background:#16a34a;color:#fff}
.sqlout{margin-top:10px}
.sql-twrap{overflow-x:auto;border:1px solid #e2e8f0;border-radius:12px}
table.sqlrt{border-collapse:collapse;width:100%;font-size:13px;background:#fff}
.sqlrt th{background:#f1f5f9;text-align:left;padding:8px 10px;border-bottom:2px solid #e2e8f0;white-space:nowrap;font-size:12px;letter-spacing:.02em}
.sqlrt td{padding:7px 10px;border-bottom:1px solid #eef2f7;white-space:nowrap}
.sqlrt tr:last-child td{border-bottom:none}
.sqlrt td.nulld{color:#94a3b8;font-style:italic;background:#fafafa}
.sql-note{font-size:12px;color:#64748b;font-weight:700;margin:6px 2px 0}
.sqlerr{background:#fef2f2;border:1px solid #fecaca;color:#b91c1c;border-radius:12px;padding:10px 14px;font-size:13.5px;font-weight:600;white-space:pre-wrap}
.sqlmsg{background:#f8fafc;border:1px dashed #cbd5e1;border-radius:12px;padding:10px 14px;font-size:13.5px;color:#475569}
.sql-empty{background:#f0fdf4;border:1px solid #bbf7d0;border-radius:12px;padding:10px 14px;font-size:13.5px;color:#166534;font-weight:600}
.sqlok{background:#f0fdf4;border:1px solid #bbf7d0;border-radius:12px;padding:10px 14px;font-size:13.5px;color:#166534;font-weight:600}
.sqlno{background:#fffbeb;border:1px solid #fde68a;border-radius:12px;padding:10px 14px;font-size:13.5px;color:#92400e}
.sqlhint{margin-top:8px}
.sqlhint summary,.sqlsol summary{cursor:pointer;font-size:13px;font-weight:700;color:#4f46e5}
.sqlhint p{margin:6px 0 0;font-size:13.5px;color:#475569}
.sqlsol{margin-top:8px}
.sqlsolcode{background:#0f172a;color:#a5f3fc;font:12.5px ui-monospace,SFMono-Regular,Menlo,monospace;border-radius:12px;padding:12px;overflow-x:auto;white-space:pre}
.sqlscore{margin-top:10px;font-weight:800;color:#4338ca;font-size:13.5px}
.pgwrap{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(260px,1fr);gap:18px;align-items:start}
@media(max-width:900px){.pgwrap{grid-template-columns:1fr}}
.pgta{min-height:180px}
.pgchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chipq{border:1px solid #e2e8f0;background:#f8fafc;border-radius:99px;padding:5px 11px;font:12px ui-monospace,monospace;color:#334155;cursor:pointer}
.chipq:hover{background:#eef2ff;border-color:#c7d2fe}
.pgschema details{border:1px solid #eef2f7;border-radius:10px;padding:8px 10px;margin:6px 0}
.pgschema summary{cursor:pointer;font-weight:700;font-size:13.5px}
.pgschema ul{margin:6px 0 0;padding-left:18px;font-size:12.5px}
.pgschema small{color:#94a3b8}
.pgview{font-size:12.5px;color:#64748b;margin:4px 0}
.pgcheat{background:#f8fafc;border:1px solid #eef2f7;border-radius:12px;padding:10px 12px}
.pgcheat p{margin:4px 0;font:12px ui-monospace,monospace;color:#334155}
.pgnote{margin-top:10px}
.pgnote summary{cursor:pointer;font-weight:700;font-size:13px;color:#4f46e5}
.ersvg{width:100%;height:auto;background:#fff;border:1px solid #eef2f7;border-radius:14px}
.erwrap{margin:14px 0}

/* ===== Curso Python: salidas, entradas y diagramas ===== */
.pytask{border:1px solid #e2e8f0;border-radius:14px;padding:14px;margin:12px 0;background:#fff}
.pytask.solved{border-color:#86efac;background:#f6fef9}
.pyq{display:flex;gap:10px;align-items:flex-start;font-weight:600;font-size:14.5px}
.pyq .tnum{flex:none;background:#dcfce7;color:#166534;border-radius:8px;padding:2px 9px;font-weight:800}
.pyq .tq{flex:1;min-width:0}
.pyq .qpts{flex:none;color:#64748b;font-size:12px;font-weight:800;background:#f1f5f9;padding:2px 8px;border-radius:99px}
.pyq .tst{flex:none;color:#16a34a;font-weight:800;font-size:12.5px;white-space:nowrap}
.pyta{width:100%;min-height:110px;margin-top:10px;font:13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;border:1.5px solid #cbd5e1;border-radius:12px;padding:10px 12px;resize:vertical;background:#0f172a;color:#e2e8f0;line-height:1.55;box-sizing:border-box}
.pyta:focus{outline:none;border-color:#16a34a;box-shadow:0 0 0 3px rgba(22,163,74,.18)}
.pystdin-wrap{margin-top:8px}
.pystdin-label{display:block;font-size:12px;font-weight:800;color:#475569;margin-bottom:4px}
.pystdin{width:100%;font:12.5px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;border:1.5px dashed #cbd5e1;border-radius:10px;padding:8px 10px;resize:vertical;background:#f8fafc;color:#0f172a;box-sizing:border-box}
.pystdin:focus{outline:none;border-color:#16a34a;background:#fff}
.pyout{background:#0f172a;border-radius:12px;padding:0;margin-top:10px;overflow:hidden}
.pyout-head{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:800;color:#94a3b8;padding:8px 12px 0}
.pyout pre{margin:0;padding:8px 12px 12px;color:#bbf7d0;font:13px ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap;word-break:break-word}
.pyout-empty{color:#94a3b8;font-size:13px;padding:12px;background:#f8fafc;border:1px dashed #cbd5e1;border-radius:12px}
.pyerr{background:#fef2f2;border:1px solid #fecaca;color:#b91c1c;border-radius:12px;padding:10px 14px;font-size:13.5px;font-weight:600;white-space:pre-wrap;margin-top:10px}
.pyhint{margin-top:8px}
.pyhint summary{cursor:pointer;font-size:13px;font-weight:700;color:#16a34a}
.pyhint p{margin:6px 0 0;font-size:13.5px;color:#475569}
.flowsvg{width:100%;max-width:420px;display:block;margin:0 auto;background:#fff;border:1px solid #eef2f7;border-radius:14px}
.pydemo-code{background:#0f172a;color:#a5f3fc;font:12.5px ui-monospace,SFMono-Regular,Menlo,monospace;border-radius:12px;padding:14px;overflow-x:auto;white-space:pre;line-height:1.55}
</style>

<body>
<div class="app">
  <aside id="sidebar" aria-label="Índice del curso"></aside>
  <div id="backdrop"></div>
  <div class="maincol">
    <header id="topbar">
      <button id="menuBtn" title="Abrir índice" aria-label="Abrir índice">☰</button>
      <div class="brand">
        <span class="logo-mark">🕹️</span>
        <span class="brand-text"><b>CodeCamp</b><small>Curso interactivo · Unity desde cero</small></span>
      </div>
      <div class="topprogress"><div class="bar"><div id="topBar"></div></div><span id="topPct">0%</span></div>
      <span class="chip grade" id="topGrade">Calificación: —</span>
      <button class="chip user" id="topUser" data-action="auth-logout" title="Cerrar sesión">👤</button>
    </header>
    <main id="content" tabindex="-1">
      <noscript>
        <div class="view" style="padding-top:40px">

    {t:'code', lang:'csharp', title:'comportamiento', code:`class Heroe {

  }

  public bool Vivo() {
    return Vida > 0;
  }

  public string Estado() {
    if (Vida >= 50) return "Entero";
    if (Vida > 0) return "Herido";
    return "Derrotado";
  }
}

}

    {t:'code', lang:'csharp', title:'MiPrimerScript.cs — archivo real de Unity', code:`using UnityEngine;

/* ============================================================
   UCS — mini-interpreter de C# para el curso «Unity desde cero»
   ------------------------------------------------------------
   Subconjunto docente de C# moderno (top-level statements):
   · tipos int/float/bool/string/var (+ double→float, char→string)
   · aritmética C#: int/int trunca hacia cero, DivideByZeroException
   · interpolación $"…{expr:F2}…", operadores, casts (int)/(float)
   · if/else, while, do-while, for, foreach, break/continue, return
   · arrays new int[]{…}/new int[n], .Length; List<T> Add/Count/…
   · métodos (default params, recursión), clases (campos, ctor, métodos)
   · Console.WriteLine/Write/ReadLine · Debug.Log · int.Parse
   · Math.* (Round bancario) y Mathf.* (Round aleja de cero)
   · Random.InitState / Random.Range (INCLUSIVO, estilo Unity) / .value
   · Vector3 (+ - * , magnitude, ToString «(1.0, 0.0, -2.0)»)
   · try/catch/finally, throw, excepciones con nombre real
   Errores SIEMPRE en español con línea: «⚠️ Línea 4 · CS0103: …»
   API: UCS.run(src,{stdin,wantVars,maxSteps}) → {ok,output,vars}|{ok:false,error}
        UCS.gradeOutput(esperadas, obtenidas, {trim}) → {ok,why}
   ============================================================ */
var UCS = (function(){
'use strict';

/* ============================ utilidades ============================ */
function err(line, msg){ var e = new Error('⚠️ Línea ' + (line || 0) + ' · ' + msg); e.ucs = true; return e; }
function isIntV(v){ return typeof v === 'number' && isFinite(v) && Math.floor(v) === v; }
function isNumV(v){ return typeof v === 'number' && isFinite(v); }
function fmtNum(v){ return String(+(v.toPrecision(12))); }
function f1(v){ return (Math.round(v * 10) / 10).toFixed(1); }
function v3(x, y, z){ return { __v3:[x, y, z] }; }
function v3ToString(a){ return '(' + f1(a.__v3[0]) + ', ' + f1(a.__v3[1]) + ', ' + f1(a.__v3[2]) + ')'; }
function toStr(v){
  if(v === null || v === undefined) return '';
  if(typeof v === 'boolean') return v ? 'True' : 'False';
  if(typeof v === 'number') return fmtNum(v);
  if(typeof v === 'string') return v;
  if(v && v.__v3) return v3ToString(v);
  if(v && v.__ex) return v.msg || '';
  throw new Error('No se puede convertir una colección a texto');
}
function V(x){ return { __bfn:x }; }          /* función builtin */

/* ============================ lexer ============================ */
var KEYWORDS = { int:1, float:1, double:1, bool:1, string:1, var:1, void:1, if:1, else:1, while:1, do:1,
  for:1, foreach:1, in:1, return:1, break:1, continue:1, new:1, true:1, false:1, null:1, static:1,
  class:1, public:1, private:1, protected:1, internal:1, this:1, try:1, catch:1, finally:1, throw:1,
  using:1, char:1, object:1 };
var OPS2 = ['==','!=','<=','>=','&&','||','+=','-=','*=','/=','%=','++','--'];
var OPS1 = '+-*/%=<>!(){}[];, .?:';

function lex(src){
  var toks = [], i = 0, line = 1;
  while(i < src.length){
    var c = src[i];
    if(c === '\n'){ line++; i++; continue; }
    if(c === ' ' || c === '\t' || c === '\r'){ i++; continue; }
    if(c === '/' && src[i+1] === '/'){ while(i < src.length && src[i] !== '\n') i++; continue; }
    if(c === '/' && src[i+1] === '*'){
      i += 2;
      while(i < src.length && !(src[i] === '*' && src[i+1] === '/')){ if(src[i] === '\n') line++; i++; }
      i += 2; continue;
    }
    if(c === '"'){
      var s = '', sl = line; i++;
      while(i < src.length && src[i] !== '"'){
        if(src[i] === '\\'){ var e2 = src[i+1]; s += (e2 === 'n' ? '\n' : e2 === 't' ? '\t' : e2); i += 2; }
        else { if(src[i] === '\n') line++; s += src[i]; i++; }
      }
      i++; toks.push({k:'str', v:s, line:sl}); continue;
    }
    if(c === '$' && src[i+1] === '"'){
      var parts = [], sl2 = line; i += 2;
      var buf = '';
      while(i < src.length && src[i] !== '"'){
        if(src[i] === '{'){
          if(src[i+1] === '{'){ buf += '{'; i += 2; continue; }
          if(buf){ parts.push({lit:buf}); buf = ''; }
          var depth = 1, expr = ''; i++;
          while(i < src.length && depth > 0){
            if(src[i] === '{') depth++;
            else if(src[i] === '}'){ depth--; if(depth === 0) break; }
            expr += src[i]; i++;
          }
          i++;
          var spec = null, ci = expr.indexOf(':');
          if(ci >= 0){ spec = expr.slice(ci+1).trim(); expr = expr.slice(0, ci); }
          parts.push({expr:expr.trim(), spec:spec});
          continue;
        }
        if(src[i] === '}' && src[i+1] === '}'){ buf += '}'; i += 2; continue; }
        if(src[i] === '\\'){ var e3 = src[i+1]; buf += (e3 === 'n' ? '\n' : e3 === 't' ? '\t' : e3); i += 2; continue; }
        if(src[i] === '\n') line++;
        buf += src[i]; i++;
      }
      i++;
      if(buf) parts.push({lit:buf});
      toks.push({k:'interp', v:parts, line:sl2}); continue;
    }
    if(c === "'"){
      var chv = '', cl4 = line; i++;
      if(i < src.length && src[i] === '\\'){ i++; chv += (src[i] === 'n') ? '\n' : (src[i] === 't') ? '\t' : src[i]; i++; }
      else if(i < src.length){ chv += src[i]; i++; }
      if(src[i] !== "'") throw err(cl4, 'CS1012: un literal char solo puede contener UN carácter');
      i++;
      toks.push({ k:'char', v:chv, line:cl4 }); continue;
    }
    if(/[0-9]/.test(c)){
      var n2 = '', sl3 = line, isF = false;
      while(i < src.length && /[0-9]/.test(src[i])){ n2 += src[i]; i++; }
      if(src[i] === '.' && /[0-9]/.test(src[i+1] || '')){ isF = true; n2 += '.'; i++; while(i < src.length && /[0-9]/.test(src[i])){ n2 += src[i]; i++; } }
      if(src[i] === 'f' || src[i] === 'F' || src[i] === 'd' || src[i] === 'D' || src[i] === 'm' || src[i] === 'M'){ isF = true; i++; }
      toks.push({k:'num', v:parseFloat(n2), isF:isF, line:sl3}); continue;
    }
    if(/[A-Za-z_]/.test(c)){
      var id = '', sl4 = line;
      while(i < src.length && /[A-Za-z0-9_]/.test(src[i])){ id += src[i]; i++; }
      toks.push({k: KEYWORDS[id] ? 'kw' : 'id', v:id, line:sl4}); continue;
    }
    var two = src.substr(i, 2);
    if(OPS2.indexOf(two) >= 0){ toks.push({k:'op', v:two, line:line}); i += 2; continue; }
    if(OPS1.indexOf(c) >= 0){ toks.push({k:'op', v:c, line:line}); i++; continue; }
    throw err(line, 'CS1056: carácter inesperado «' + c + '»');
  }
  toks.push({k:'eof', v:'', line:line});
  return toks;
}

/* ============================ parser ============================ */
var MODS = { public:1, private:1, protected:1, internal:1, static:1 };
var BUILTIN_TYPES = { int:'int', float:'float', double:'float', bool:'bool', string:'string', var:'var', char:'string', object:'var', void:'void' };

function parseProgram(toks){
  var p = 0;
  function peek(o){ return toks[p + (o || 0)]; }
  function at(v){ var t = peek(); return (t.k === 'op' || t.k === 'kw') && t.v === v; }
  function next(){ return toks[p++]; }
  function expect(v, msg){
    if(at(v)) return next();
    var t = peek();
    throw err(t.line, 'CS1003: se esperaba «' + v + '»' + (msg ? ', ' + msg : ''));
  }
  function expectSemi(){
    if(at(';')){ next(); return; }
    var t = peek();
    throw err(t.line, 'CS1002: se esperaba «;»');
  }
  function isTypeTok(t){ return (t.k === 'kw' && BUILTIN_TYPES[t.v]) || t.k === 'id'; }

  function parseType(){
    var t = peek();
    if(t.k === 'kw' && BUILTIN_TYPES[t.v]){
      if(t.v === 'void') throw err(t.line, 'CS1525: void solo puede ser tipo de retorno de un método');
      next(); var name = BUILTIN_TYPES[t.v]; return finishType(name);
    }
    if(t.k === 'id'){ next(); return finishType(t.v); }
    throw err(t.line, 'CS1525: se esperaba un tipo');
  }
  function finishType(name){
    if(at('<')){
      next();
      var inner = parseType();
      expect('>');
      if(name !== 'List') throw err(peek().line, 'CS0246: el tipo genérico «' + name + '» no está disponible en este curso (solo List<T>)');
      return 'List<' + inner + '>';
    }
    if(at('[')){ next(); expect(']'); return name + '[]'; }
    return name;
  }
  function isDeclStart(){
    var t = peek();
    if(t.k === 'kw' && BUILTIN_TYPES[t.v] && t.v !== 'void'){
      var t1 = peek(1);
      if(t1.k === 'id') return true;
      if(t1.k === 'op' && t1.v === '[' && peek(2).v === ']' && peek(3).k === 'id') return true;
      return false;
    }
    if(t.k !== 'id') return false;
    var t1 = peek(1);
    if(t1.k === 'id') return true;                                 /* Clase nombre */
    if(t1.k === 'op' && t1.v === '<') return true;                 /* List<int> x */
    if(t1.k === 'op' && t1.v === '[' && peek(2).v === ']' && peek(3).k === 'id') return true;
    return false;
  }
  function isMethodStart(){
    var t = peek();
    if(t.k === 'kw' && t.v === 'void') return peek(1).k === 'id' && peek(2).v === '(';
    if(!isTypeTok(t)) return false;
    return peek(1).k === 'id' && peek(2).v === '(';
  }

  function parseProgramNodes(){
    var nodes = [];
    while(peek().k !== 'eof'){
      if(peek().k === 'kw' && peek().v === 'using'){ while(!at(';') && peek().k !== 'eof') next(); expectSemi(); continue; }
      var sawMod = false;
      while(peek().k === 'kw' && MODS[peek().v]){ next(); sawMod = true; }
      if(peek().k === 'kw' && peek().v === 'class'){ nodes.push(parseClass()); continue; }
      if(isMethodStart()){ nodes.push(parseMethod()); continue; }
      if(sawMod){
        var t0 = peek();
        throw err(t0.line, 'CS0116: esto parece un miembro suelto: los campos y métodos viven DENTRO de una clase (o quita «static» y escribe la instrucción directamente)');
      }
      if(isDeclStart()){ nodes.push(parseDeclaration()); continue; }
      nodes.push(parseStatement());
    }
    return nodes;
  }

  function parseClass(){
    var line = peek().line;
    expect('class');
    var nameTok = peek();
    if(nameTok.k !== 'id') throw err(nameTok.line, 'CS1001: se esperaba el nombre de la clase');
    next();
    var cls = { t:'class', line:line, name:nameTok.v, fields:[], methods:{}, ctor:null };
    expect('{', 'para abrir el cuerpo de la clase');
    while(!at('}') && peek().k !== 'eof'){
      while(peek().k === 'kw' && MODS[peek().v]) next();
      if(peek().k === 'eof') break;
      var mline = peek().line;
      /* constructor: Nombre(...) */
      if(peek().k === 'id' && peek().v === nameTok.v && peek(1).v === '('){
        next();
        var params = parseParams();
        var body = parseBlock();
        cls.ctor = { params:params, body:body, line:mline };
        continue;
      }
      var isVoidMethod = peek().k === 'kw' && peek().v === 'void' && peek(1).k === 'id' && peek(2).v === '(';
      if(!isTypeTok(peek()) && !isVoidMethod){ var bad = peek(); throw err(bad.line, 'CS1525: miembro de clase no válido'); }
      if(isVoidMethod) next();
      var ftype = isVoidMethod ? 'void' : parseType();
      var fname = peek();
      if(fname.k !== 'id') throw err(fname.line, 'CS1001: se esperaba el nombre del miembro');
      next();
      if(at('(')){
        var ps = parseParams();
        var b = parseBlock();
        cls.methods[fname.v] = { name:fname.v, params:ps, body:b, line:mline };
      } else {
        var init = null;
        if(at('=')){ next(); init = parseAssignment(); }
        expectSemi();
        cls.fields.push({ name:fname.v, type:ftype, init:init, line:mline });
      }
    }
    expect('}');
    return cls;
  }

  function parseParams(){
    expect('(');
    var ps = [];
    while(!at(')')){
      while(peek().k === 'kw' && MODS[peek().v]) next();
      var pt = parseType();
      var pn = peek();
      if(pn.k !== 'id') throw err(pn.line, 'CS1001: se esperaba el nombre del parámetro');
      next();
      var def = null;
      if(at('=')){ next(); def = parseAssignment(); }
      ps.push({ name:pn.v, type:pt, def:def });
      if(at(',')){ next(); continue; }
      break;
    }
    expect(')');
    return ps;
  }

  function parseMethod(){
    var line = peek().line;
    if(peek().k === 'kw' && peek().v === 'void') next();   /* void Nombre(...) */
    else parseType();                   /* tipo de retorno */
    var nameTok = next();
    if(nameTok.k !== 'id') throw err(nameTok.line, 'CS1001: se esperaba el nombre del método');
    var params = parseParams();
    var body = parseBlock();
    return { t:'method', line:line, name:nameTok.v, params:params, body:body };
  }

  function parseBlock(){
    var t = peek();
    if(!at('{')) throw err(t.line, 'CS1513: se esperaba «{»');
    next();
    var stmts = [];
    while(!at('}') && peek().k !== 'eof') stmts.push(parseStatement());
    expect('}');
    return { t:'block', stmts:stmts, line:t.line };
  }

  function parseDeclaration(){
    var line = peek().line;
    var type = parseType();
    var decls = [];
    do {
      var nt = peek();
      if(nt.k !== 'id') throw err(nt.line, 'CS1001: se esperaba el nombre de la variable');
      next();
      var init = null;
      if(at('=')){
        next();
        if(peek().k === 'op' && peek().v === '{' && /\[\]$/.test(type)){
          next();
          var items = [];
          if(!(peek().k === 'op' && peek().v === '}')){
            items.push(parseAssignment());
            while(at(',')){ next(); items.push(parseAssignment()); }
          }
          expect('}');
          init = { t:'newarr', line:line, items:items };
        } else init = parseAssignment();
      }
      decls.push({ name:nt.v, init:init });
    } while(at(',') && next());
    expectSemi();
    return { t:'decl', line:line, type:type, decls:decls };
  }

  function parseStatement(){
    var t = peek();
    if(t.k === 'op' && t.v === '{') return parseBlock();
    if(t.k === 'kw'){
      switch(t.v){
        case 'if': {
          next(); expect('(');
          var cond = parseExpr();
          expect(')');
          var then = parseStatement();
          var els = null;
          if(at('else')){ next(); els = parseStatement(); }
          return { t:'if', line:t.line, cond:cond, then:then, els:els };
        }
        case 'while': {
          next(); expect('(');
          var c = parseExpr();
          expect(')');
          return { t:'while', line:t.line, cond:c, body:parseStatement() };
        }
        case 'do': {
          next();
          var b = parseStatement();
          if(!(peek().k === 'kw' && peek().v === 'while')) throw err(peek().line, 'CS1003: se esperaba «while» después de do');
          next(); expect('(');
          var cd = parseExpr(); expect(')'); expectSemi();
          return { t:'dowhile', line:t.line, body:b, cond:cd };
        }
        case 'for': {
          next(); expect('(');
          var init = null;
          if(!at(';')){
            if(isDeclStart()) init = parseDeclaration();
            else { init = { t:'exprstmt', line:t.line, expr:parseExpr() }; expectSemi(); }
          } else next();
          var cond2 = at(';') ? null : parseExpr();
          expectSemi();
          var upd = at(')') ? null : parseExpr();
          expect(')');
          return { t:'for', line:t.line, init:init, cond:cond2, upd:upd, body:parseStatement() };
        }
        case 'foreach': {
          next(); expect('(');
          if(isDeclStart()) parseType();
          var vn = peek();
          if(vn.k !== 'id') throw err(vn.line, 'CS1001: se esperaba el nombre de la variable del foreach');
          next();
          if(!(peek().k === 'kw' && peek().v === 'in')) throw err(peek().line, 'CS1003: se esperaba «in» en el foreach');
          next();
          var seq = parseExpr();
          expect(')');
          return { t:'foreach', line:t.line, varName:vn.v, seq:seq, body:parseStatement() };
        }
        case 'return': {
          next();
          var rv = at(';') ? null : parseExpr();
          expectSemi();
          return { t:'return', line:t.line, value:rv };
        }
        case 'break': next(); expectSemi(); return { t:'break', line:t.line };
        case 'continue': next(); expectSemi(); return { t:'continue', line:t.line };
        case 'throw': {
          next();
          var ev = at(';') ? null : parseExpr();
          expectSemi();
          return { t:'throw', line:t.line, value:ev };
        }
        case 'try': {
          next();
          var tb = parseBlock();
          var catches = [];
          while(peek().k === 'kw' && peek().v === 'catch'){
            var cl = peek().line; next();
            var ct = 'Exception', cv = null;
            if(peek().k === 'op' && peek().v === '('){
              next();
              ct = parseType();
              if(peek().k === 'id'){ cv = next().v; }
              expect(')');
            }
            catches.push({ type:ct, varName:cv, block:parseBlock(), line:cl });
          }
          var fin = null;
          if(peek().k === 'kw' && peek().v === 'finally'){ next(); fin = parseBlock(); }
          return { t:'try', line:t.line, body:tb, catches:catches, fin:fin };
        }
      }
    }
    if(isDeclStart()) return parseDeclaration();
    var ex = parseExpr();
    expectSemi();
    return { t:'exprstmt', line:t.line, expr:ex };
  }

  /* ---------- expresiones ---------- */
  function parseExpr(){ return parseAssignment(); }
  function mark(n){ return n; }
  function line0(){ return peek().line; }

  function parseAssignment(){
    var left = parseTernary();
    var t = peek();
    if(t.k === 'op' && ['=','+=','-=','*=','/=','%='].indexOf(t.v) >= 0){
      next();
      var right = parseAssignment();
      return { t:'assign', line:t.line, op:t.v, target:left, value:right };
    }
    return left;
  }
  function parseTernary(){
    var c = parseOr();
    if(at('?')){
      var q = next();
      var a = parseAssignment();
      expect(':');
      var b = parseAssignment();
      return { t:'ternary', line:q.line, cond:c, a:a, b:b };
    }
    return c;
  }
  function binSub(nextLvl, ops){
    return function(){
      var left = nextLvl.call(this);
      while(true){
        var t = peek();
        if(t.k === 'op' && ops.indexOf(t.v) >= 0){
          next();
          var right = nextLvl.call(this);
          left = { t:'bin', line:t.line, op:t.v, l:left, r:right };
        } else break;
      }
      return left;
    };
  }
  var parseOr = binSub(function(){ return parseAnd(); }, ['||']);
  var parseAnd = binSub(function(){ return parseEq(); }, ['&&']);
  var parseEq = binSub(function(){ return parseRel(); }, ['==','!=']);
  var parseRel = binSub(function(){ return parseAdd(); }, ['<','>','<=','>=']);
  var parseAdd = binSub(function(){ return parseMul(); }, ['+','-']);
  var parseMul = binSub(function(){ return parseUnary(); }, ['*','/','%']);

  function parseUnary(){
    var t = peek();
    if(t.k === 'op' && t.v === '!'){ next(); return { t:'not', line:t.line, e:parseUnary() }; }
    if(t.k === 'op' && t.v === '-'){ next(); return { t:'neg', line:t.line, e:parseUnary() }; }
    if(t.k === 'op' && t.v === '+'){ next(); return parseUnary(); }
    if(t.k === 'op' && t.v === '++' || t.k === 'op' && t.v === '--'){
      next();
      var tgt = parseUnary();
      return { t:'assign', line:t.line, op:t.v === '++' ? '+=' : '-=', target:tgt, value:{ t:'num', line:t.line, v:1 } };
    }
    /* casts (int)x, (float)x */
    if(t.k === 'op' && t.v === '(' && peek(1).k === 'kw' && BUILTIN_TYPES[peek(1).v] && peek(2).v === ')'){
      var cl = t.line, ct = BUILTIN_TYPES[peek(1).v];
      next(); next(); next();
      return { t:'cast', line:cl, type:ct, e:parseUnary() };
    }
    return parsePostfix();
  }
  function parsePostfix(){
    var e = parsePrimary();
    while(true){
      var t = peek();
      if(t.k === 'op' && t.v === '.'){
        next();
        var nm = peek();
        if(nm.k !== 'id' && !(nm.k === 'kw')) throw err(nm.line, 'CS1001: se esperaba el nombre del miembro');
        next();
        e = { t:'member', line:t.line, obj:e, name:nm.v };
      } else if(t.k === 'op' && t.v === '['){
        next();
        var ix = parseExpr();
        expect(']');
        e = { t:'index', line:t.line, obj:e, index:ix };
      } else if(t.k === 'op' && t.v === '('){
        var args = parseArgs();
        e = { t:'call', line:t.line, callee:e, args:args };
      } else if(t.k === 'op' && (t.v === '++' || t.v === '--')){
        next();
        e = { t:'assign', line:t.line, op:t.v === '++' ? '+=' : '-=', target:e, value:{ t:'num', line:t.line, v:1 }, postfix:true };
      } else break;
    }
    return e;
  }
  function parseArgs(){
    expect('(');
    var args = [];
    while(!at(')')){
      args.push(parseAssignment());
      if(at(',')){ next(); continue; }
      break;
    }
    expect(')');
    return args;
  }
  function parsePrimary(){
    var t = peek();
    if(t.k === 'num'){ next(); return { t:'num', line:t.line, v:t.v, isF:t.isF === true }; }
    if(t.k === 'char'){ next(); return { t:'str', line:t.line, v:t.v }; }
    if(t.k === 'str'){ next(); return { t:'str', line:t.line, v:t.v }; }
    if(t.k === 'interp'){
      next();
      var parts = t.v.map(function(pt){
        if(pt.lit !== undefined) return { lit:pt.lit };
        var sub = UCS_parseExprSource(pt.expr, t.line);
        return { expr:sub, spec:pt.spec };
      });
      return { t:'interp', line:t.line, parts:parts };
    }
    if(t.k === 'kw'){
      if(t.v === 'true' || t.v === 'false'){ next(); return { t:'bool', line:t.line, v:(t.v === 'true') }; }
      if(t.v === 'null'){ next(); return { t:'null', line:t.line }; }
      if(t.v === 'new'){ return parseNew(); }
      if(t.v === 'this'){ next(); return { t:'this', line:t.line }; }
      if(BUILTIN_TYPES[t.v] && peek(1) && peek(1).k === 'op' && peek(1).v === '.'){
        next();
        return { t:'name', line:t.line, name:t.v };
      }
    }
    if(t.k === 'op' && t.v === '('){
      next();
      var e = parseExpr();
      expect(')');
      return e;
    }
    if(t.k === 'id'){
      next();
      if(at('<') && t.v === 'List'){ /* List<int> en expresión no válida aquí */ }
      return { t:'name', line:t.line, name:t.v };
    }
    throw err(t.line, 'CS1525: expresión no válida');
  }
  function parseNew(){
    var t = next(); /* new */
    var tn = peek();
    if(!(tn.k === 'id' || tn.k === 'kw')) throw err(tn.line, 'CS1526: se esperaba un tipo después de new');
    var type;
    if(tn.k === 'kw' && BUILTIN_TYPES[tn.v]){ next(); type = BUILTIN_TYPES[tn.v]; }
    else { next(); type = tn.v; }
    if(at('<')){
      next();
      var inner = parseType();
      expect('>');
      type = 'List<' + inner + '>';
    }
    if(at('[')){
      next();
      if(at(']')){
        next();
        expect('{');
        var items = [];
        while(!at('}')){ items.push(parseAssignment()); if(at(',')){ next(); continue; } break; }
        expect('}');
        return { t:'newarr', line:t.line, items:items };
      }
      var len = parseExpr();
      expect(']');
      return { t:'newarrlen', line:t.line, type:type, len:len };
    }
    if(at('(')){
      var args = parseArgs();
      return { t:'newobj', line:t.line, type:type, args:args };
    }
    throw err(peek().line, 'CS1526: new requiere paréntesis «(…)» o corchetes «[…]»');
  }

  var program = parseProgramNodes();
  return program;
}

/* parse de sub-expresiones para interpolación */
function UCS_parseExprSource(src, line){
  var toks = lex(src);
  toks.push({k:'eof', v:'', line:line});
  var p = 0;
  function peek(){ return toks[p]; }
  function at(v){ var t = peek(); return (t.k === 'op' || t.k === 'kw') && t.v === v; }
  function next(){ return toks[p++]; }
  function parseAssignment(){
    var left = parseTernary();
    var t = peek();
    if(t.k === 'op' && ['=','+=','-=','*=','/=','%='].indexOf(t.v) >= 0){
      next(); var right = parseAssignment();
      return { t:'assign', line:t.line, op:t.v, target:left, value:right };
    }
    return left;
  }
  function parseTernary(){
    var c = parseOr();
    if(at('?')){
      var q = next(); var a = parseAssignment(); /* ':' */ next(); var b = parseAssignment();
      return { t:'ternary', line:q.line, cond:c, a:a, b:b };
    }
    return c;
  }
  function binSub(nl, ops){
    return function(){
      var left = nl();
      while(true){
        var t = peek();
        if(t.k === 'op' && ops.indexOf(t.v) >= 0){ next(); left = { t:'bin', line:t.line, op:t.v, l:left, r:nl() }; }
        else break;
      }
      return left;
    };
  }
  var parseOr = binSub(function(){ return parseAnd(); }, ['||']);
  var parseAnd = binSub(function(){ return parseEq(); }, ['&&']);
  var parseEq = binSub(function(){ return parseRel(); }, ['==','!=']);
  var parseRel = binSub(function(){ return parseAdd(); }, ['<','>','<=','>=']);
  var parseAdd = binSub(function(){ return parseMul(); }, ['+','-']);
  var parseMul = binSub(function(){ return parseUnary(); }, ['*','/','%']);
  function parseUnary(){
    var t = peek();
    if(t.k === 'op' && t.v === '!'){ next(); return { t:'not', line:t.line, e:parseUnary() }; }
    if(t.k === 'op' && t.v === '-'){ next(); return { t:'neg', line:t.line, e:parseUnary() }; }
    if(t.k === 'op' && t.v === '(' && peek(1).k === 'kw' && BUILTIN_TYPES[peek(1).v] && peek(2).v === ')'){
      var cl = t.line, ct = BUILTIN_TYPES[peek(1).v]; next(); next(); next();
      return { t:'cast', line:cl, type:ct, e:parseUnary() };
    }
    return parsePostfix();
  }
  function parsePostfix(){
    var e = parsePrimary();
    while(true){
      var t = peek();
      if(t.k === 'op' && t.v === '.'){ next(); var nm = next(); e = { t:'member', line:t.line, obj:e, name:nm.v }; }
      else if(t.k === 'op' && t.v === '['){ next(); var ix = parseAssignment(); /*']'*/ next(); e = { t:'index', line:t.line, obj:e, index:ix }; }
      else if(t.k === 'op' && t.v === '('){
        next();
        var args = [];
        while(!at(')')){ args.push(parseAssignment()); if(at(',')){ next(); continue; } break; }
        next();
        e = { t:'call', line:t.line, callee:e, args:args };
      }
      else break;
    }
    return e;
  }
  function parsePrimary(){
    var t = peek();
    if(t.k === 'num'){ next(); return { t:'num', line:t.line, v:t.v, isF:t.isF === true }; }
    if(t.k === 'char'){ next(); return { t:'str', line:t.line, v:t.v }; }
    if(t.k === 'str'){ next(); return { t:'str', line:t.line, v:t.v }; }
    if(t.k === 'kw'){
      if(t.v === 'true' || t.v === 'false'){ next(); return { t:'bool', line:t.line, v:(t.v === 'true') }; }
      if(t.v === 'null'){ next(); return { t:'null', line:t.line }; }
      if(t.v === 'new'){ return parseNew(); }
    }
    if(t.k === 'op' && t.v === '('){ next(); var e = parseAssignment(); next(); return e; }
    if(t.k === 'id'){ next(); return { t:'name', line:t.line, name:t.v }; }
    throw err(line, 'CS1525: expresión no válida dentro de la interpolación');
  }
  function parseNew(){
    var t = next();
    var tn = next();
    var type = (tn.k === 'kw') ? BUILTIN_TYPES[tn.v] : tn.v;
    if(at('<')){ next(); /*inner*/ next(); next(); /*>*/ type = 'List<' + 'x' + '>'; }
    var args = [];
    if(at('(')){
      next();
      while(!at(')')){ args.push(parseAssignment()); if(at(',')){ next(); continue; } break; }
      next();
    }
    return { t:'newobj', line:t.line, type:type, args:args };
  }
  var e2 = parseAssignment();
  return e2;
}

/* ============================ ejecutor ============================ */
function Scope(parent){
  this.vars = {};
  this.parent = parent;
  this.thisObj = null;
}
Scope.prototype.find = function(name){
  var s = this;
  while(s){ if(Object.prototype.hasOwnProperty.call(s.vars, name)) return s; s = s.parent; }
  return null;
};

var RNG = { state:987654321 };
function rngNext(){
  RNG.state |= 0; RNG.state = (RNG.state + 0x6D2B79F5) | 0;
  var t = Math.imul(RNG.state ^ (RNG.state >>> 15), 1 | RNG.state);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}

function run(src, opts){
  opts = opts || {};
  var maxSteps = opts.maxSteps || 400000;
  var steps = 0;
  var outBuf = [], curLine = '';
  var stdin = (opts.stdin || []).slice();
  var callDepth = 0;
  var globals = new Scope(null);
  var classes = {}, methods = {};

  function tick(line){
    if(++steps > maxSteps) throw err(line, 'Tu programa tardó demasiado: posible ciclo infinito (revisa while/for).');
  }
  function write(s){ curLine += s; }
  function writeLine(s){ outBuf.push(curLine + s); curLine = ''; }
  function readLine(line){
    if(stdin.length) return String(stdin.shift());
    throw err(line, 'Console.ReadLine: no quedan más entradas (revisa cuántas ReadLine haces).');
  }

  /* ---------- señales de control ---------- */
  function Sig(kind, v){ this.__sig = kind; this.v = v; }

  /* ---------- errores de runtime con tipo de excepción ---------- */
  function rtex(line, type, msg){
    var e = new Error('⚠️ Línea ' + line + ' · ' + type + ': ' + msg);
    e.ucs = true; e.exType = type; e.exMsg = msg; e.line = line;
    return e;
  }

  /* ---------- valores ---------- */
  function defaultFor(type){
    if(type === 'int' || type === 'float') return 0;
    if(type === 'bool') return false;
    if(type === 'string') return '';
    if(type === 'int[]' || type.indexOf('[]') >= 0) return null;
    return null;
  }
  function typeName(v){
    if(v === null || v === undefined) return 'null';
    if(typeof v === 'number') return isIntV(v) ? 'int' : 'float';
    if(typeof v === 'boolean') return 'bool';
    if(typeof v === 'string') return 'string';
    if(Array.isArray(v)) return v.__list ? 'List' : 'array';
    if(v.__v3) return 'Vector3';
    if(v.__obj) return v.__obj.cls.name;
    return 'object';
  }

  /* ---------- resolución de nombres ---------- */
  var NAMESPACES = { Console:1, Debug:1, Mathf:1, Math:1, Random:1, Convert:1, Vector3:1, int:1, float:1, string:1, bool:1 };
  function resolveName(name, scope, line){
    if(NAMESPACES[name]) return { __ns:name };
    var s = scope.find(name);
    if(s) return s.vars[name];
    if(scope.thisObj){
      var o = scope.thisObj;
      if(Object.prototype.hasOwnProperty.call(o.__obj.fields, name)) return o.__obj.fields[name];
      if(o.__obj.cls.methods[name]) return { __m:{ m:o.__obj.cls.methods[name], obj:o } };
    }
    if(methods[name]) return { __m:{ m:methods[name], obj:null } };
    if(classes[name]) return { __cls:classes[name] };
    throw err(line, 'CS0103: el nombre «' + name + '» no existe en este contexto (¿está bien escrito? ¿se declaró antes?)');
  }
  function assignName(name, v, scope, line){
    var s = scope.find(name);
    if(s){ s.vars[name] = v; return; }
    if(scope.thisObj){
      var o = scope.thisObj;
      var hasField = o.__obj.cls.fields.some(function(f){ return f.name === name; });
      if(hasField){ o.__obj.fields[name] = v; return; }
    }
    throw err(line, 'CS0103: el nombre «' + name + '» no existe en este contexto (decláralo con su tipo: int ' + name + ' = …)');
  }

  /* ---------- llamadas ---------- */
  function callUserMethod(m, args, thisObj, line){
    if(callDepth > 900) throw rtex(line, 'StackOverflowException', 'recursión demasiado profunda (¿falta un caso base?)');
    var sc = new Scope(globals);
    sc.thisObj = thisObj;
    for(var i = 0; i < m.params.length; i++){
      var pm = m.params[i];
      if(i < args.length) sc.vars[pm.name] = args[i];
      else if(pm.def !== null) sc.vars[pm.name] = evalExpr(pm.def, sc);
      else throw err(line, 'CS7036: falta un argumento para el parámetro requerido «' + pm.name + '» de «' + m.name + '»');
    }
    callDepth++;
    try{
      execBlock(m.body, sc);
    } catch(sig){
      if(sig && sig.__sig === 'return'){ callDepth--; return sig.v; }
      callDepth--; throw sig;
    }
