    var lm = /^List<(.+)>$/.exec(type);
    if(lm){
      var args = [];
      for(var i = 0; i < n.args.length; i++) args.push(evalExpr(n.args[i], sc));
      var lst = args.slice();
      lst.__list = true;
      return lst;
    }
    if(type === 'Vector3'){
      var va = [];
      for(var k = 0; k < 3; k++) va.push(n.args[k] !== undefined ? evalExpr(n.args[k], sc) : 0);
      if(va.length < 3) va = va.concat([0,0,0]).slice(0,3);
      if(!va.every(isNumV)) throw rtex(n.line, 'CS1503: Vector3 espera números (x, y, z)');
      return v3(va[0], va[1], va[2]);
    }
    if(type === 'Random'){ RNG.state = 987654321; return { __ns:'SystemRandom' }; }
    if(/^Exception$|Exception$/.test(type)){
      var msg = n.args.length ? toStr(evalExpr(n.args[0], sc)) : 'Exception of type \'' + type + '\' was thrown.';
      return { __ex:{ type:type, msg:msg } };
    }
    var cls = classes[type];
    if(!cls) throw err(n.line, 'CS0246: el tipo «' + type + '» no existe (¿se declaró la clase? ¿está bien escrito?)');
    var inst = { __obj:{ cls:cls, fields:{} } };
    cls.fields.forEach(function(f){
      inst.__obj.fields[f.name] = (f.init !== null) ? evalExpr(f.init, sc) : defaultFor(f.type);
    });
    var cargs = [];
    for(var c2 = 0; c2 < n.args.length; c2++) cargs.push(evalExpr(n.args[c2], sc));
    if(cls.ctor){
      var sc2 = new Scope(globals);
      sc2.thisObj = inst;
      for(var p2 = 0; p2 < cls.ctor.params.length; p2++){
        var pm = cls.ctor.params[p2];
        if(p2 < cargs.length) sc2.vars[pm.name] = cargs[p2];
        else if(pm.def !== null) sc2.vars[pm.name] = evalExpr(pm.def, sc2);
        else throw err(n.line, 'CS7036: el constructor de «' + type + '» requiere el argumento «' + pm.name + '»');
      }
      callDepth++;
      try{ execBlock(cls.ctor.body, sc2); } catch(sig){ if(sig && sig.__sig === 'return'){ /* ctor no regresa valor */ } else { callDepth--; throw sig; } }
      callDepth--;
    } else if(cargs.length){
      throw err(n.line, 'CS1729: «' + type + '» no tiene un constructor que reciba ' + cargs.length + ' argumento(s)');
    }
    return inst;
  }

  function evalCall(n, sc){
    var cal = evalExpr(n.callee, sc);
    var args = [];
    for(var i = 0; i < n.args.length; i++) args.push(evalExpr(n.args[i], sc));
    if(cal && cal.__m) return callUserMethod(cal.__m.m, args, cal.__m.obj, n.line);
    if(cal && cal.__bfn) return callBuiltin(cal, args, n.line);
    throw err(n.line, 'CS0149: se esperaba un nombre de método para llamar con ( )');
  }

  /* ---------- ejecución de sentencias ---------- */
  function execBlock(block, sc){
    var stmts = block.stmts || block;
    for(var i = 0; i < stmts.length; i++) execStmt(stmts[i], sc);
  }
  function execStmt(n, sc){
    tick(n.line || 0);
    switch(n.t){
      case 'block': execBlock(n, sc); return;
      case 'class': return;                        /* ya registrada */
      case 'method': return;                       /* ya registrado */
      case 'decl': {
        if(!sc.types) sc.types = {};
        for(var i = 0; i < n.decls.length; i++){
          var d = n.decls[i];
          sc.types[d.name] = n.type;
          sc.vars[d.name] = (d.init !== null) ? evalExpr(d.init, sc) : defaultFor(n.type);
        }
        return;
      }
      case 'exprstmt': evalExpr(n.expr, sc); return;
      case 'if':
        if(truthy(evalExpr(n.cond, sc), n.line)) execStmt(n.then, sc);
        else if(n.els) execStmt(n.els, sc);
        return;
      case 'while':
        while(truthy(evalExpr(n.cond, sc), n.line)){
          tick(n.line);
          try{ execStmt(n.body, sc); }
          catch(sig){ if(sig && sig.__sig === 'break') break; if(sig && sig.__sig === 'continue') continue; throw sig; }
        }
        return;
      case 'dowhile':
        do {
          tick(n.line);
          try{ execStmt(n.body, sc); }
          catch(sig){ if(sig && sig.__sig === 'break') break; if(sig && sig.__sig === 'continue') continue; throw sig; }
        } while(truthy(evalExpr(n.cond, sc), n.line));
        return;
      case 'for': {
        if(n.init) execStmt(n.init, sc);
        while(n.cond === null || truthy(evalExpr(n.cond, sc), n.line)){
          tick(n.line);
          try{ execStmt(n.body, sc); }
          catch(sig){
            if(sig && sig.__sig === 'break') break;
            if(!(sig && sig.__sig === 'continue')) throw sig;
          }
          if(n.upd) evalExpr(n.upd, sc);
        }
        return;
      }
      case 'foreach': {
        var seq = evalExpr(n.seq, sc);
        var items;
        if(Array.isArray(seq)) items = seq.slice();
        else if(typeof seq === 'string') items = seq.split('');
        else throw rtex(n.line, 'CS1579: foreach no puede iterar sobre ' + typeName(seq));
        for(var f2 = 0; f2 < items.length; f2++){
          tick(n.line);
          sc.vars[n.varName] = items[f2];
          try{ execStmt(n.body, sc); }
          catch(sig){
            if(sig && sig.__sig === 'break') break;
            if(!(sig && sig.__sig === 'continue')) throw sig;
          }
        }
        return;
      }
      case 'return': throw new Sig('return', n.value ? evalExpr(n.value, sc) : null);
      case 'break': throw new Sig('break');
      case 'continue': throw new Sig('continue');
      case 'throw': {
        var tv = n.value ? evalExpr(n.value, sc) : null;
        if(tv && tv.__ex) throw rtex(n.line, tv.__ex.type, tv.__ex.msg);
        throw rtex(n.line, 'Exception', toStr(tv));
      }
      case 'try': {
        try{
          execBlock(n.body, sc);
        } catch(e){
          if(!(e && e.ucs && e.exType)) throw e;
          var handled = false;
          for(var c3 = 0; c3 < n.catches.length; c3++){
            var ct = n.catches[c3];
            var wants = ct.type === 'Exception' || ct.type === 'SystemException';
            if(wants || ct.type === e.exType){
              var sc2 = new Scope(sc);
              if(ct.varName) sc2.vars[ct.varName] = { __ex:{ type:e.exType, msg:e.exMsg } };
              execBlock(ct.block, sc2);
              handled = true;
              break;
            }
          }
          if(!handled && !n.fin) throw e;
        } finally {
          /* finally se ejecuta siempre */
          if(n.fin) execBlock(n.fin, sc);
        }
        return;
      }
    }
    throw err(n.line || 0, 'CS1026: sentencia no soportada: ' + n.t);
  }

  /* ---------- arranque ---------- */
  try{
    var program = parseProgram(lex(src));
    /* registrar declaraciones primero (como C# compila todo antes de correr) */
    var stmts = [];
    for(var i = 0; i < program.length; i++){
      var nd = program[i];
      if(nd.t === 'class'){ classes[nd.name] = nd; continue; }
      if(nd.t === 'method'){ methods[nd.name] = nd; continue; }
      stmts.push(nd);
    }
    var mainScope = new Scope(null);
    globals = mainScope;
    for(var s2 = 0; s2 < stmts.length; s2++){
      if(stmts[s2].t === 'decl'){
        for(var d2 = 0; d2 < stmts[s2].decls.length; d2++){
          var dd = stmts[s2].decls[d2];
          mainScope.vars[dd.name] = (dd.init !== null) ? evalExpr(dd.init, mainScope) : defaultFor(stmts[s2].type);
        }
        continue;
      }
      execStmt(stmts[s2], mainScope);
    }
    flushLine();
    var vars = {};
    var want = opts.wantVars || [];
    if(want.length){
      for(var w = 0; w < want.length; w++){
        if(Object.prototype.hasOwnProperty.call(mainScope.vars, want[w])) vars[want[w]] = mainScope.vars[want[w]];
      }
    }
    return { ok:true, output:outBuf.join('\n') + (outBuf.length ? '\n' : ''), vars:vars };
  } catch(e){
    try{ flushLine(); } catch(e2){}
    if(e && e.ucs) return { ok:false, error:e.message };
    if(e instanceof Sig) return { ok:false, error:'⚠️ «break»/«continue»/«return» fuera de su lugar' };
    return { ok:false, error:'⚠️ ' + (e && e.message ? e.message : 'Error inesperado') };
  }

  function flushLine(){ if(curLine !== ''){ outBuf.push(curLine); curLine = ''; } }
}

/* ---------- calificación por salida (idéntica a PYE) ---------- */
function gradeOutput(expected, got, opts){
  opts = opts || {};
  var E = (expected || []).slice(), G = String(got == null ? '' : got).split('\n');
  if(G.length && G[G.length-1] === '') G.pop();
  if(opts.trim){ E = E.map(function(l){ return l.trim(); }); G = G.map(function(l){ return l.trim(); }); }
  for(var i = 0; i < Math.max(E.length, G.length); i++){
    var e = E[i], g = G[i];
    if(e === undefined) return { ok:false, why:'Tu programa imprimió líneas de más. La primera sobrante fue «' + g + '» (línea ' + (i+1) + ').' };
    if(g === undefined) return { ok:false, why:'A tu programa le faltaron líneas: esperaba «' + e + '» en la línea ' + (i+1) + ' y ahí se terminó la salida.' };
    if(e !== g) return { ok:false, why:'En la línea ' + (i+1) + ' esperaba «' + e + '» y salió «' + g + '».' };
  }
  return { ok:true };
}

return { run:run, gradeOutput:gradeOutput };

/* ---------- Web Speech API (con degradación elegante) ---------- */
function speechAvailable(){ try{ return typeof window.speechSynthesis !== 'undefined' && typeof window.SpeechSynthesisUtterance !== 'undefined'; }catch(e){ return false; } }
function sayText(text, rate){
  if(!speechAvailable() || !text) return;
  try{
    window.speechSynthesis.cancel();
    const u = new window.SpeechSynthesisUtterance(String(text));
    u.lang = 'en-GB'; u.rate = rate || 1; u.pitch = 1;
    try{
      const vs = window.speechSynthesis.getVoices() || [];
      const v = vs.filter(function(x){ return (x.lang || '').indexOf('en-GB') === 0; })[0]
             || vs.filter(function(x){ return (x.lang || '').indexOf('en') === 0; })[0];
      if(v) u.voice = v;
    }catch(e){}
    window.speechSynthesis.speak(u);
  }catch(e){}
}
function audioBtnsHtml(text){
  if(!speechAvailable()){
    return '<div class="audiobox"><span class="anote">🔊 Audio no disponible en este visor: usa la 📄 transcripción (o abre el curso en Chrome/Edge para escuchar).</span></div>';
  }
  return '<div class="audiobox">' +
    '<button type="button" class="saybtn" data-say="' + esc(text) + '" data-rate="1">▶ Escuchar</button>' +
    '<button type="button" class="saybtn slow" data-say="' + esc(text) + '" data-rate="0.72">🐢 Lento</button>' +
    '<button type="button" class="saybtn" data-say=" " data-rate="1" title="Detener" style="background:#e2e8f0;color:#475569">⏹</button>' +
    '</div>';
}
function transcriptHtml(text){
  if(!text) return '';
  return '<details class="tscript"><summary>📄 Transcripción</summary><p>' + esc(text) + '</p></details>';
}

const SRS_INTERVALS = [1, 2, 4, 8, 16];
function srsStore(){ try{ if(!state.srs) state.srs = {}; return state.srs; }catch(e){ const f={}; try{ state = blankData(); state.srs = f; }catch(e2){} return f; } }
function srsDueCards(deck){
  const st = srsStore(), now = Date.now(), due = [];
  (SRS_DECKS[deck].cards || []).forEach(function(c, i){
    const key = deck + '-' + i;
    const rec = st[key];
    if(!rec || !rec.due || rec.due <= now) due.push(i);
  });
  return due;
}
function srsCounts(deck){
  const st = srsStore(), now = Date.now();
  let total = (SRS_DECKS[deck].cards || []).length, newc = 0, review = 0;
  (SRS_DECKS[deck].cards || []).forEach(function(c, i){
    const rec = st[deck + '-' + i];
    if(!rec) newc++;
    else if(rec.due <= now) review++;
  });
  return { total:total, nuevas:newc, repaso:review };
}
let SRS_SESSION = null;
function srsStartSession(deck){
  const due = srsDueCards(deck);
  const st = srsStore();
  const nuevas = due.filter(function(i){ return !st[deck + '-' + i]; }).slice(0, 10);
  const repaso = due.filter(function(i){ return st[deck + '-' + i]; }).slice(0, 10);
  SRS_SESSION = { deck:deck, queue:nuevas.concat(repaso), i:0, good:0, again:0, revealed:false };
}
function srsCardHtml(){
  const s = SRS_SESSION;
  const deck = SRS_DECKS[s.deck];
  if(!s.queue.length){
    return '<div class="srs-card"><div class="front">🎉</div><div class="es">No hay tarjetas para hoy de este mazo. ¡Vuelve mañana!</div></div>' +
      '<div class="srs-actions"><button type="button" class="hear" data-srs="exit">Volver</button></div>';
  }
  if(s.i >= s.queue.length){
    saveState();
    return '<div class="srs-card"><div class="front">✅ ¡Sesión lista!</div><div class="back">Correctas: <b>' + s.good + '</b> · A repasar: <b>' + s.again + '</b><br>Tu progreso quedó guardado en tu cuenta.</div></div>' +
      '<div class="srs-actions"><button type="button" class="hear" data-srs="exit">Volver</button></div>';
  }
  const idx = s.queue[s.i];
  const c = deck.cards[idx];
  let body;
  if(s.deck === 'verbs'){
    body = s.revealed
      ? '<div class="back"><b>' + esc(c.f) + '</b> → pasado: <b>' + esc(c.b) + '</b> · participio: <b>' + esc(c.pp) + '</b><br>3.ª pers.: ' + esc(c.s) + ' · -ing: ' + esc(c.ing) + '</div>'
      : '<div class="front">' + esc(c.f) + '</div><div class="es">' + esc(c.es) + '</div><div class="es" style="color:#94a3b8">¿Recuerdas las 5 formas? Toca «Ver respuesta».</div>';
  } else {
    body = s.revealed
      ? '<div class="back"><b>' + esc(c.f) + '</b> = ' + esc(c.es) + '<br><i>“' + esc(c.ex) + '”</i></div>'
      : '<div class="front">' + esc(c.f) + '</div><div class="es" style="color:#94a3b8">¿Qué significa? Toca «Ver respuesta».</div>';
  }
  const hearText = s.deck === 'verbs' ? (c.f + '. ' + c.b + '. ' + c.pp) : (c.f + '. ' + (c.ex || c.es));
  return '<div class="srs-card">' + body + '</div>' +
    '<div class="srs-actions">' +
    (speechAvailable() ? '<button type="button" class="hear" data-say="' + esc(hearText) + '" data-rate="0.9">🎧 Escuchar</button>' : '') +
    (s.revealed
      ? '<button type="button" class="good" data-srs="good">😎 Lo sabía</button>' +
        '<button type="button" class="again" data-srs="again">😕 Otra vez</button>'
      : '<button type="button" class="good" data-srs="reveal">👀 Ver respuesta</button>') +
    '</div>' +
    '<div class="srs-prog">Tarjeta ' + (s.i + 1) + ' de ' + s.queue.length + ' · Caja ' + ((srsStore()[s.deck + '-' + idx] || {}).box != null ? (srsStore()[s.deck + '-' + idx].box + 1) : 1) + '/5</div>';
}
function srsHtml(b){
  const deck = SRS_DECKS[b.deck];
  if(!deck) return '';
  const c = srsCounts(b.deck);
  return '<div class="srsbox" data-srsbox="' + b.deck + '">' +
    '<h3 class="quiz-title">🃏 ' + deck.emoji + ' ' + deck.name + '</h3>' +
    '<p class="quiz-sub">' + (b.sub || deck.desc) + '</p>' +
    '<div class="srs-stats"><span class="srs-chip">🆕 Nuevas: ' + c.nuevas + '</span>' +
    '<span class="srs-chip">🔁 Por repasar: ' + c.repaso + '</span>' +
    '<span class="srs-chip">📚 Total: ' + c.total + '</span></div>' +
    '<div class="srs-zone">' + (SRS_SESSION && SRS_SESSION.deck === b.deck ? srsCardHtml() :
      '<button type="button" class="btn" data-srs="start" data-deck="' + b.deck + '">▶ Repasar (' + (c.nuevas + c.repaso) + ' pendientes)</button>') + '</div>' +
    '</div>';
}
function srsAction(el){
  const act = el.getAttribute('data-srs');
  const box = el.closest('[data-srsbox]');
  const deck = box ? box.getAttribute('data-srsbox') : (el.getAttribute('data-deck') || (SRS_SESSION && SRS_SESSION.deck));
  if(act === 'start'){ srsStartSession(deck); }
  else if(act === 'exit'){ SRS_SESSION = null; saveState(); if(box){ const zone2 = box.querySelector('.srs-zone'); if(zone2) zone2.innerHTML = ''; } try{ renderSidebar(CURRENT); }catch(e2){} return; }
  else if(!SRS_SESSION) return;
  else if(act === 'reveal'){ SRS_SESSION.revealed = true; }
  else if(act === 'good' || act === 'again'){
    const s = SRS_SESSION;
    const idx = s.queue[s.i];
    const st = srsStore();
    const rec = st[deck + '-' + idx] || { box:0, due:0 };
    if(act === 'good'){ rec.box = Math.min(4, (rec.box || 0) + 1); s.good++; }
    else { rec.box = 0; s.again++; if(s.queue.indexOf(idx) === s.queue.lastIndexOf(idx)) s.queue.push(idx); }
    rec.due = Date.now() + SRS_INTERVALS[rec.box] * 86400000;
    st[deck + '-' + idx] = rec;
    SRS_SESSION.i++;
    SRS_SESSION.revealed = false;
    saveState();
  } else return;
  if(box){ const zone = box.querySelector('.srs-zone'); if(zone) zone.innerHTML = srsCardHtml(); }
  try{ renderSidebar(CURRENT); }catch(e){}
}

function activityItemHtml(it, i, b){
  if(it.sec && !it.type) return '<div class="qsec">' + it.sec + '</div>';

  const audio = it.audio ? audioBtnsHtml(it.audio) : '';
  const tscript = it.transcript ? transcriptHtml(it.transcript) : '';

    body = '<div class="opts">' + (it.options || []).map(function(o, oi){
      return '<button type="button" class="opt" data-ao="' + oi + '"><span class="ol">' + String.fromCharCode(65 + oi) + '</span><span>' + o + '</span></button>';
    }).join('') + '</div>';
  } else if(it.type === 'gap'){
    body = '<div class="fillwrap"><input type="text" data-gap="' + i + '" autocomplete="off" spellcheck="false" placeholder="Escribe tu respuesta…"><span class="hint">' + (it.hint || '') + '</span></div>';
  }
  return '<div class="qcard" data-qi="' + i + '">' +
    '<div class="qq">' + it.q + '</div><span class="qpts">' + pts + ' pts</span>' + audio + body + tscript +
    '<div class="afb" data-fb></div></div>';
}

function actAnswered(section){
  let n = 0, total = 0;
  section.querySelectorAll('.qcard[data-qi]').forEach(function(q){
    total++;
    const gap = q.querySelector('input[data-gap]');
    if(gap && gap.value.trim() !== '') n++;
    if(q.querySelector('.opt.sel')) n++;
  });
  const w = section.querySelector('[data-write]');
  if(w){ total++; if(w.value.trim().split(/\s+/).filter(Boolean).length > 0) n++; }
  const chks = section.querySelectorAll('input[data-chk]');
  if(chks.length){ total += chks.length; chks.forEach(function(c){ if(c.checked) n++; }); }
  const span = section.querySelector('[data-act-respondidas]');
  if(span) span.textContent = 'Respondidas: ' + n + '/' + total;

function gradeActivity(section){
  const lessonId = section.getAttribute('data-activity');
  const lesson = LESSONS_BY_ID[lessonId];
  if(!lesson) return;
  const actBlock = lesson.blocks.filter(function(b){ return b.t === 'activity'; })[0];
  if(!actBlock) return;
  let earned = 0, max = 0;
  const items = actBlock.items || [];
  section.querySelectorAll('.qcard[data-qi]').forEach(function(q){
    const i = parseInt(q.getAttribute('data-qi'), 10);
    const it = items[i];
    if(!it || !it.type) return;
    const pts = it.pts || 10;
    max += pts;
    let ok = false;
    if(it.type === 'mc'){
      const sel = q.querySelector('.opt.sel');
      ok = sel && parseInt(sel.getAttribute('data-ao'), 10) === it.correct;
    } else if(it.type === 'gap'){
      const inp = q.querySelector('input[data-gap]');
      ok = inp ? fillOk(it, inp.value) : false;
    }
    q.classList.remove('okp', 'failp');
    q.classList.add(ok ? 'okp' : 'failp');
    const fb = q.querySelector('[data-fb]');
    if(fb) fb.innerHTML = '<span class="' + (ok ? 'okm' : 'nom') + '">' + (ok ? '✓' : '✗') + '</span>' + (it.explain ? ' ' + it.explain : '');
    if(ok) earned += pts;
  });
  const chks = section.querySelectorAll('input[data-chk]');
  if(chks.length){
    (actBlock.checklist || []).forEach(function(c, i){
      const pts = c.pts || 10;
      max += pts;
      const el = section.querySelector('input[data-chk="' + i + '"]');
      if(el && el.checked) earned += pts;
    });
  }
  const w = section.querySelector('[data-write]');
  let note = '';
  if(w && actBlock.minWords){
    const words = w.value.trim().split(/\s+/).filter(Boolean).length;
    if(words > 0 && words < actBlock.minWords){
      earned = Math.round(earned / 2);
      note = '<p style="color:#b45309;font-weight:700;font-size:13px">⚠️ Escribiste ' + words + ' palabras (mínimo ' + actBlock.minWords + '): la calificación quedó a la mitad. Completa tu texto y vuelve a intentar.</p>';
    }
  }
  const result = section.querySelector('[data-result]');
  if(result){
    result.innerHTML = note + resultBoxHtml(earned, max, true);
    result.classList.add('show');
    const pct = max ? Math.round(earned / max * 100) : 0;
    if(pct >= 70) try{ confetti(result); }catch(e){}
  }
  const prev = state.scores[lessonId];
  if(prev == null || earned > prev) state.scores[lessonId] = earned;
  saveState();
  updateChrome();
  renderSidebar(parseHash());
}

const $ = function(sel, root){ return (root||document).querySelector(sel); };
const $$ = function(sel, root){ return Array.prototype.slice.call((root||document).querySelectorAll(sel)); };
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

/* ---------- almacenamiento seguro (fallback si sandbox bloquea localStorage) ---------- */
const MEM = {};
let LS_OK = true;
try { localStorage.setItem('__t','1'); localStorage.removeItem('__t'); } catch(e){ LS_OK = false; }
const safeStore = {
  get: function(k){ if(LS_OK){ try{ return localStorage.getItem(k); }catch(e){} } return (k in MEM ? MEM[k] : null); },
  set: function(k,v){ if(LS_OK){ try{ localStorage.setItem(k,v); return; }catch(e){} } MEM[k]=v; },
  remove: function(k){ if(LS_OK){ try{ localStorage.removeItem(k); }catch(e){} } delete MEM[k]; }
};
const LEGACY_KEY = 'codecamp-en-v1';
const DB_KEY = 'codecamp-db-v2';
let DB = { users:{}, session:null };
let AUTH_MODE = 'login';
function blankData(){ return { scores:{}, examScore:null, name:'', lastLesson:'0-1', srs:{}, ucsCode:{}, ucsOk:{}, play:'', playIn:'' }; }
function hashPin(s){
  let h = 5381;
  const t = String(s);
  for(let i=0;i<t.length;i++){ h = ((h<<5) + h + t.charCodeAt(i)) >>> 0; }
  return 'h' + h.toString(36) + '-' + t.length;
}
function loadDB(){
  try{ const raw = safeStore.get(DB_KEY); if(raw){ const d = JSON.parse(raw); if(d && d.users) DB = d; } }catch(e){}
  if(!DB.users) DB.users = {};
  if(!('session' in DB)) DB.session = null;
}
function saveDB(){ safeStore.set(DB_KEY, JSON.stringify(DB)); }
/* ---------- migración de progreso pre-cuentas (versiones viejas) ----------
   Las versiones anteriores guardaban el progreso SIN cuentas en claves sueltas.
   Al crear cuenta, iniciar sesión o entrar como invitado, ese progreso "huérfano"
   se hereda UNA sola vez al campo correcto de la cuenta — y solo si el campo está
   vacío, para no pisar nunca progreso más nuevo. Las claves viejas NO se borran
   (quedan como respaldo). */
const LEGACY_ALL = { data:'codecamp-lista-tareas-v1', dataJs:'codecamp-js-v1', dataUnity:'codecamp-unity-v1' };
function legacyData(key){
  try{
    const raw = safeStore.get(key);
    if(raw){ const o = JSON.parse(raw); if(o && ((o.scores && Object.keys(o.scores).length) || o.examScore != null)) return o; }
  }catch(e){}
  return null;
}
function cursoVacio(d){ return !d || !((d.scores && Object.keys(d.scores).length) || d.examScore != null); }
function migrarHuerfanos(){
  const u = sessionUser();
  if(!u || !DB.users[u]) return;
  const rec = DB.users[u];
  let movido = false;
  if(cursoVacio(rec.data)){   const o = legacyData(LEGACY_ALL.data);   if(o){ rec.data   = Object.assign(rec.data || {}, o); movido = true; } }
  if(cursoVacio(rec.dataJs)){ const o = legacyData(LEGACY_ALL.dataJs); if(o){ rec.dataJs = o; movido = true; } }
  if(cursoVacio(rec.dataUnity)){ const o = legacyData(LEGACY_ALL.dataUnity); if(o){ rec.dataUnity = Object.assign(blankData(), o); movido = true; } }
  if(movido){ saveDB(); try{ console.info('[migración] progreso de versiones anteriores heredado a la cuenta «' + u + '»'); }catch(e){} }
}
function sessionUser(){ return (DB.session && DB.users[DB.session]) ? DB.session : null; }
let state = blankData();   // estado del curso (declarado: evita ReferenceError)
function loadState(){
  let base = blankData();
  const u = sessionUser();
  if(u){ base = Object.assign(base, DB.users[u].dataUnity || {}); }
  else{
    try{ const raw = safeStore.get(LEGACY_KEY); if(raw){ base = Object.assign(base, JSON.parse(raw)); } }catch(e){}
  }
  state = base;
}
function saveState(){
  const u = sessionUser();
  if(u){ DB.users[u].dataUnity = state; saveDB(); }
  else{ safeStore.set(LEGACY_KEY, JSON.stringify(state)); }
}

function doLogin(){
  const uEl = $('#authUser'), pEl = $('#authPin');
  const u = (uEl && uEl.value || '').trim().toLowerCase();

function lessonMax(l){
  let max = 0;
  (l.blocks||[]).forEach(function(b){
    if(b.t==='quiz'){ b.questions.forEach(function(q){ max += (q.pts||10); }); }
    if(b.t==='exercise'){ b.checks.forEach(function(c){ max += (c.pts||10); }); }
    if(b.t==='pyex'){ (b.tasks||[]).forEach(function(tk){ max += (tk.pts||10); }); }
  });
  return max;
}
const EXAM_MAX = EXAM.questions.reduce(function(a,q){ return a + (q.pts||10); }, 0);
const TOTAL_MAX = ALL_LESSONS.reduce(function(a,l){ return a + lessonMax(l); }, 0) + EXAM_MAX;
function pointsEarned(){
  let p = 0;
  ALL_LESSONS.forEach(function(l){ p += (state.scores[l.id]||0); });
  p += (state.examScore||0);
  return p;
}
function gradePct(){ return TOTAL_MAX ? Math.round(pointsEarned()/TOTAL_MAX*100) : 0; }

/* ---------- resaltador de sintaxis ---------- */
function ph(i){ return '\uE000' + String.fromCharCode(0xE100+i) + '\uE001'; }
let MARKS = [];
function markPass(str, re, builder){
  return str.replace(re, function(){
    const args = Array.prototype.slice.call(arguments);
    MARKS.push(builder ? builder.apply(null, args.slice(0,-2)) : args[0]);
    return ph(MARKS.length-1);
  });
}
function restoreMarks(s){
  return s.replace(/\uE000([\uE100-\uE1FF])\uE001/g, function(m,c){
    const v = MARKS[c.charCodeAt(0)-0xE100];
    return v === undefined ? '' : v;
  });
}
function hlTag(t){
  const marks = [];
  t = t.replace(/([\w-]+)=("[^"]*")/g, function(m,a,v){
    marks.push('<span class="tok-attr">'+a+'</span>=<span class="tok-str">'+v+'</span>');
    return ph(marks.length-1);
  });
  t = t.replace(/^(&lt;\/?)([\w-]+)([\s\S]*?)(\/?&gt;)$/, function(m,open,tag,rest,slash){
    return open+'<span class="tok-tag">'+tag+'</span>'+rest+slash;
  });
  return t.replace(/\uE000([\uE100-\uE1FF])\uE001/g, function(m,c){
    const v = marks[c.charCodeAt(0)-0xE100];
    return v === undefined ? '' : v;
  });
}
function highlight(src, lang){
  if(lang === 'txt' || lang === 'bash'){ return esc(src); }
  MARKS = [];
  let s = esc(src);
  if(lang === 'html'){
    s = markPass(s, /&lt;!--[\s\S]*?--&gt;/g, null);
    MARKS[MARKS.length-1] = '<span class="tok-c">'+MARKS[MARKS.length-1]+'</span>';
    s = markPass(s, /&lt;!DOCTYPE[^&]*&gt;/gi, function(m){ return '<span class="tok-doctype">'+m+'</span>'; });
    s = markPass(s, /&lt;\/?[a-zA-Z][^&]*?&gt;/g, hlTag);
  } else if(lang === 'css'){
    s = markPass(s, /\/\*[\s\S]*?\*\//g, function(m){ return '<span class="tok-c">'+m+'</span>'; });
    s = markPass(s, /(^|\n)([ \t]*[^{}\n;]+)(?=[ \t]*\{)/g, function(m,pre,sel){ return pre+'<span class="tok-sel">'+sel+'</span>'; });
    s = markPass(s, /([-\w]+)(\s*:\s*)([^;\n]+)(;)/g, function(m,p,c,v,semi){
      return '<span class="tok-prop">'+p+'</span>'+c+'<span class="tok-val">'+v+'</span>'+semi;
    });
  } else {
    s = markPass(s, /\/\/[^\n]*|\/\*[\s\S]*?\*\//g, function(m){ return '<span class="tok-c">'+m+'</span>'; });
    s = markPass(s, /'(?:[^'\\\n]|\\.)*'|"(?:[^"\\\n]|\\.)*"/g, function(m){ return '<span class="tok-str">'+m+'</span>'; });
    s = markPass(s, /\b(const|let|var|function|return|if|else|for|forEach|while|new|typeof|true|false|null|undefined|this)\b/g, function(m){ return '<span class="tok-kw">'+m+'</span>'; });
    s = markPass(s, /\b(document|window|console|navigator|caches|self|JSON|localStorage)\b/g, function(m){ return '<span class="tok-builtin">'+m+'</span>'; });
    s = markPass(s, /\b(\d+(?:\.\d+)?)\b/g, function(m){ return '<span class="tok-num">'+m+'</span>'; });
  }
  return restoreMarks(s);
}

function updateRemain(section, questions){
  let n = 0;
  questions.forEach(function(q,i){
    const qEl = section.querySelector('[data-q="'+i+'"]');
    if(!qEl) return;
    if(q.type === 'fill'){
      const inp = qEl.querySelector('input');
      if(inp && inp.value.trim() !== '') n++;
    } else if(qEl.querySelector('.opt.sel')) n++;
  });
  const span = section.querySelector('[data-respondidas]');
  if(span) span.textContent = 'Respondidas: '+n+'/'+questions.length;
}
function fillOk(q, val){
  const v = String(val||'').trim();
  if(v === '') return false;
  if(q.re){ try{ return new RegExp(q.re,'i').test(v); }catch(e){} }
  const nv = norm(v).replace(/[<>]/g,'');
  return (q.accept||[]).some(function(a){ return norm(a).replace(/[<>]/g,'') === nv; });
}
function tierOf(pct){
  if(pct >= 90) return { e:'🏆', t:'¡Excelente! Dominas esta lección.' };
  if(pct >= 70) return { e:'🎉', t:'¡Muy bien! Lección aprobada.' };
  if(pct >= 50) return { e:'📚', t:'Vas por buen camino. Repasa y vuelve a intentar.' };
  return { e:'💪', t:'No te rindas: rele la lección e inténtalo de nuevo.' };
}
function resultBoxHtml(earned, max, withRetry){
  const pct = max ? Math.round(earned/max*100) : 0;
  const tier = tierOf(pct);
  let extra = '';
  if(withRetry) extra = '<button type="button" class="btn ghost small" data-action="retry">🔄 Intentar de nuevo</button>';
  return '<div class="bigscore">'+tier.e+' '+pct+'<small>/100</small></div>'+
    '<div class="rmsg"><b>'+earned+' de '+max+' puntos</b> · '+tier.t+'</div>'+
    '<div class="quiz-actions" style="justify-content:center;margin-top:12px">'+extra+'</div>';
}
function gradeQuizSection(section, questions, lessonId){
  let earned = 0, max = 0;
  questions.forEach(function(q, qi){
    const pts = q.pts || 10;
    max += pts;
    const qEl = section.querySelector('[data-q="'+qi+'"]');
    if(!qEl) return;
    const fb = qEl.querySelector('[data-fb]');
    if(q.type === 'fill'){
      const inp = qEl.querySelector('input');
      const ok = fillOk(q, inp ? inp.value : '');
      if(inp) inp.disabled = true;
      qEl.classList.add(ok ? 'q-ok' : 'q-bad');
      fb.innerHTML = ok
        ? '<span class="ok">✅ ¡Correcto! +'+pts+' pts.</span>'+(q.explain||'')
        : '<span class="bad">❌ No era eso.</span> Respuesta: <code>'+esc(q.show||'—')+'</code>. '+(q.explain||'');
      if(ok) earned += pts;
    } else {
      const sel = qEl.querySelector('.opt.sel');
      const opts = $$('.opt', qEl);
      opts.forEach(function(o){ o.classList.add('locked'); });
      const ok = !!sel && Number(sel.getAttribute('data-opt')) === q.correct;
      opts.forEach(function(o){
        if(Number(o.getAttribute('data-opt')) === q.correct) o.classList.add('reveal');
      });
      if(sel) sel.classList.add(ok ? 'correct' : 'incorrect');
      fb.innerHTML = !sel
        ? '<span class="bad">⚪ Sin responder (0 pts).</span> '+(q.explain||'')
        : ok
          ? '<span class="ok">✅ ¡Correcto! +'+pts+' pts.</span> '+(q.explain||'')
          : '<span class="bad">❌ Casi… la respuesta correcta está marcada en verde.</span> '+(q.explain||'');
      if(ok) earned += pts;
    }
    fb.classList.add('show');
  });
  const result = section.querySelector('[data-result]');
  result.innerHTML = resultBoxHtml(earned, max, true);
  result.classList.add('show');
  const pct = max ? Math.round(earned/max*100) : 0;
  if(pct >= 70) confetti(result);
  /* persistir mejor calificación */
  if(lessonId === '__exam'){
    if(state.examScore == null || earned > state.examScore) state.examScore = earned;
  } else if(lessonId){
    const prev = state.scores[lessonId];
    if(prev == null || earned > prev) state.scores[lessonId] = earned;
  }
  saveState();
  updateChrome();
  renderSidebar(parseHash());
}

function gradeExercise(exEl){
  const lessonId = exEl.getAttribute('data-ex');
  const lesson = LESSONS_BY_ID[lessonId];
  const exBlock = lesson.blocks.filter(function(b){ return b.t === 'exercise'; })[0];
  const code = $('textarea', exEl).value;
  let earned = 0, max = 0;
  exBlock.checks.forEach(function(c, i){
    const pts = c.pts || 10;
    max += pts;
    let ok = false;
    try{ ok = new RegExp(c.re, c.flags || 'i').test(code); }catch(e){}
    const row = exEl.querySelector('[data-check="'+i+'"]');
    row.classList.remove('okp','failp');
    row.classList.add(ok ? 'okp' : 'failp');
    $('.cic', row).textContent = ok ? '✓' : '✗';
    if(ok) earned += pts;
  });
  const result = exEl.querySelector('[data-result]');
  result.innerHTML = resultBoxHtml(earned, max, true);
  result.classList.add('show');
  const pct = max ? Math.round(earned/max*100) : 0;
  if(pct >= 70) confetti(result);
  const prev = state.scores[lessonId];
  if(prev == null || earned > prev) state.scores[lessonId] = earned;
  saveState();
  updateChrome();
  renderSidebar(parseHash());
}

/* ---------- confeti ---------- */
function confetti(host){
  const layer = document.createElement('div');
  layer.className = 'confetti-layer';
  const colors = ['#6366f1','#ec4899','#f59e0b','#22c55e','#0ea5e9','#a855f7'];
  for(let i=0;i<40;i++){
    const s = document.createElement('i');
    s.style.left = (Math.random()*100)+'%';
    s.style.background = colors[i % colors.length];
    s.style.animationDelay = (Math.random()*0.7)+'s';
    s.style.animationDuration = (1.5 + Math.random()*1.5)+'s';
    s.style.transform = 'rotate('+(Math.random()*360)+'deg)';
    layer.appendChild(s);
  }
  host.appendChild(layer);
  setTimeout(function(){ if(layer.parentNode) layer.parentNode.removeChild(layer); }, 3600);
}

function initDemos(root){

  $$('.edwrap', root).forEach(function(w){

    const frame = $('.edprev', w);
    if(ta && frame) frame.srcdoc = ta.value;
  });
  /* appendChild */
  $$('[data-demo="append"]', root).forEach(function(d){
    let n = 0;
    const list = $('[data-list]', d), count = $('[data-count]', d), note = $('[data-note]', d);
    $('[data-ad="add"]', d).addEventListener('click', function(){
      n++;
      const li = document.createElement('li');
      li.textContent = 'li #' + n + ' · tarea ' + n;
      list.appendChild(li);
      count.textContent = list.children.length;
      note.innerHTML = 'appendChild lo colgó como <b>último hijo</b>. El padre ahora tiene ' + list.children.length + ' hijo(s).';
    });
    $('[data-ad="move"]', d).addEventListener('click', function(){
      if(list.children.length < 2){ note.innerHTML = 'Agrega al menos 2 li para ver la magia del movimiento.'; return; }
      const primero = list.firstElementChild;
      list.appendChild(primero);
      note.innerHTML = '💥 <b>Se movió</b>: appendChild arrancó al primer li de su posición y lo colgó al final. Un nodo solo vive en UN lugar del árbol.';
    });
    $('[data-ad="clear"]', d).addEventListener('click', function(){
      list.innerHTML = ''; n = 0; count.textContent = '0';
      note.innerHTML = 'Lista limpia. ¿La llenamos otra vez?';
    });
  });
  /* navbar */
  $$('[data-demo="nav"]', root).forEach(function(d){
    const btn = $('[data-nd="tog"]', d), menu = $('[data-nd="menu"]', d);
    btn.addEventListener('click', function(){ menu.classList.toggle('abierto'); menu.classList.toggle('colapsado'); });
  });
  /* localStorage */
  $$('[data-demo="store"]', root).forEach(function(d){
    const out = $('[data-sd="out"]', d), inp = $('[data-sd="val"]', d), note = $('[data-sd="note"]', d);
    let db = null, temporal = false;
    try{ localStorage.setItem('__x','1'); localStorage.removeItem('__x'); db = localStorage; }
    catch(e){
      temporal = true;
      const mem = {};
      db = { setItem:function(k,v){ mem[k]=String(v); }, getItem:function(k){ return (k in mem)?mem[k]:null; }, removeItem:function(k){ delete mem[k]; } };
      note.textContent = '⚠️ Esta vista previa integrada bloquea localStorage por seguridad; se usa una copia temporal. Descarga el curso y ábrelo en tu navegador para que los datos persistan de verdad.';
    }
    $('[data-sd="save"]', d).addEventListener('click', function(){
      db.setItem('saludo', inp.value);
      out.textContent = 'localStorage.setItem("saludo", "' + inp.value + '")  // guardado ✓';
    });
    $('[data-sd="load"]', d).addEventListener('click', function(){
      const v = db.getItem('saludo');
      out.textContent = 'localStorage.getItem("saludo") → ' + (v === null ? 'null  // no hay nada guardado' : '"' + v + '"');
    });
    $('[data-sd="remove"]', d).addEventListener('click', function(){
      db.removeItem('saludo');
      out.textContent = 'localStorage.removeItem("saludo")  // borrado ✓';
    });
  });
  /* app final */
}

/* ---------- calificación por salida ---------- */
function ucsGradeTask(check, r){
  if(!r) return {ok:false, why:'No hubo resultado.'};
  var g = UCS.gradeOutput(check.lines || [], r.output, {});
  if(!g.ok) return g;
  if(check.vars){
    for(var k in check.vars){
      var exp = check.vars[k], got = r.vars ? r.vars[k] : undefined;
      var same = (typeof exp === 'number') ? (got === exp) : JSON.stringify(got) === JSON.stringify(exp);
      if(!same) return {ok:false, why:'La variable '+k+' debía valer '+JSON.stringify(exp)+' y valió '+JSON.stringify(got)+'.'};
    }
  }
  return {ok:true};
}

/* ---------- render de salida ---------- */
function pyOutHtml(output){
  if(!output) return '<div class="pyout pyout-empty">(sin salida en pantalla)</div>';
  return '<div class="pyout"><div class="pyout-head">Salida del programa</div><pre>'+esc(output.replace(/\n$/,''))+'</pre></div>';
}
function pyErrorHtml(msg){ return '<div class="pyerr">'+esc(String(msg||'Error desconocido'))+'</div>'; }

/* ---------- ejercicios ucs ---------- */
function pyTaskKey(lessonId, ti){ return lessonId + '#' + ti; }
function pyTaskSolved(lessonId, ti){ return !!(state.ucsOk && state.ucsOk[pyTaskKey(lessonId, ti)]); }
function pyFindBlock(lessonId){
  var l = LESSONS_BY_ID[lessonId];
  if(!l) return null;
  var blocks = l.blocks || [];
  for(var i=0;i<blocks.length;i++){ if(blocks[i].t === 'pyex') return blocks[i]; }
  return null;
}
function pyLessonScore(lessonId){
  var b = pyFindBlock(lessonId);
  if(!b) return null;
  var total = 0;
  (b.tasks||[]).forEach(function(tk, ti){ if(pyTaskSolved(lessonId, ti)) total += (tk.pts || 10); });
  return total;
}
function pyExBlockHtml(b, lessonId){
  var h = '<section class="pyex" data-pyex="'+lessonId+'">';
  h += '<h3 class="quiz-title">'+(b.title||'🧪 Practica en el laboratorio C#')+'</h3>';
  var solvedCount = 0;
  (b.tasks||[]).forEach(function(tk, ti){ if(pyTaskSolved(lessonId, ti)) solvedCount++; });
  h += '<p class="quiz-sub">Escribe tu programa, dale <b>▶ Ejecutar</b> (con las entradas indicadas) y cuando la salida te convenza presiona <b>✓ Calificar</b>: se compara tu SALIDA con la esperada, línea por línea.</p>';
  (b.tasks||[]).forEach(function(tk, ti){
    var saved = (state.ucsCode && state.ucsCode[pyTaskKey(lessonId, ti)]) || '';
    var solved = pyTaskSolved(lessonId, ti);
    var stdinTxt = (tk.stdin || []).join('\n');
    h += '<div class="pytask'+(solved?' solved':'')+'" data-task="'+lessonId+'#'+ti+'">';
    h += '<div class="pyq"><span class="tnum">'+(ti+1)+'</span><span class="tq">'+tk.q+'</span><span class="qpts">'+(tk.pts||10)+' pts</span><span class="tst">'+(solved?'✓ resuelta':'')+'</span></div>';
    if(tk.hint) h += '<details class="pyhint"><summary>💡 Ver pista</summary><p>'+tk.hint+'</p></details>';
    h += '<textarea class="pyta" id="pyta-'+lessonId+'-'+ti+'" spellcheck="false" autocomplete="off" placeholder="// tu programa C# aquí…">'+esc(saved)+'</textarea>';
    if((tk.stdin || []).length){
      h += '<div class="pystdin-wrap"><label class="pystdin-label">⌨️ Entradas (una por línea, se las entrega Console.ReadLine en orden):</label>'+
           '<textarea class="pystdin" id="pystdin-'+lessonId+'-'+ti+'" spellcheck="false" rows="'+Math.max(2, Math.min(6, tk.stdin.length))+'" readonly>'+esc(stdinTxt)+'</textarea></div>';
    }
    h += '<div class="sqlbtns">'+
      '<button type="button" class="btn small" data-ucsaction="run" data-lesson="'+lessonId+'" data-ti="'+ti+'">▶ Ejecutar</button>'+
      '<button type="button" class="btn small good" data-ucsaction="grade" data-lesson="'+lessonId+'" data-ti="'+ti+'">✓ Calificar</button>'+
      '<button type="button" class="btn ghost small" data-ucsaction="clear" data-lesson="'+lessonId+'" data-ti="'+ti+'">↺ Vaciar</button>'+
      '</div>';
    h += '<div class="sqlout" data-out></div>';
    h += '<details class="sqlsol"><summary>🔎 Ver solución (intenta primero de verdad)</summary><pre class="sqlsolcode">'+esc(tk.solution)+'</pre></details>';
    h += '</div>';
  });
  h += '<div class="sqlscore" data-pyscore>'+solvedCount+' de '+(b.tasks||[]).length+' tareas resueltas</div>';
  h += '</section>';
  return h;
}
function pyTaskOut(taskEl, html){
  var out = taskEl.querySelector('[data-out]');
  if(out) out.innerHTML = html;
}
function pyGetTa(lessonId, ti){ return document.getElementById('pyta-'+lessonId+'-'+ti); }
/* lee las entradas del textarea; si no existe usa las de la tarea */
function pyTaskInputs(lessonId, ti, task, forGrade){
  var box = document.getElementById('pystdin-'+lessonId+'-'+ti);
  if(forGrade || !box) return (task.stdin || []).slice();
  var txt = box.value.replace(/\r/g,'');
  if(txt === '' ) return [];
  return txt.split('\n');
}
function pyRunTaskCode(lessonId, ti, forGrade){
  var l = LESSONS_BY_ID[lessonId];
  var task = null;
  (l.blocks||[]).forEach(function(b){ if(b.t==='pyex') task = (b.tasks||[])[ti]; });
  if(!task) return {empty:true};
  var ta = pyGetTa(lessonId, ti);
  var code = ta ? ta.value.trim() : '';
  if(!code) return {empty:true};
  if(!state.ucsCode) state.ucsCode = {};
  state.ucsCode[pyTaskKey(lessonId, ti)] = ta.value;
  saveState();
  var inputs = pyTaskInputs(lessonId, ti, task, forGrade);
  var wantVars = task.wantVars || Object.keys((task.check && task.check.vars) || {});
  var r = UCS.run(code, { stdin: inputs, wantVars: wantVars });
  return { empty:false, task:task, r:r };
}
function pyActionRun(el){
  var lessonId = el.getAttribute('data-lesson'), ti = Number(el.getAttribute('data-ti'));
  var taskEl = el.closest('.pytask');
  var run = pyRunTaskCode(lessonId, ti, false);
  if(run.empty){ pyTaskOut(taskEl, '<div class="sqlmsg">✍️ Escribe tu programa primero.</div>'); return; }
  var r = run.r;
  if(!r.ok){ pyTaskOut(taskEl, pyErrorHtml(r.error) + (r.output ? pyOutHtml(r.output) : '')); return; }
  pyTaskOut(taskEl, pyOutHtml(r.output));
}
function pyActionGrade(el){
  var lessonId = el.getAttribute('data-lesson'), ti = Number(el.getAttribute('data-ti'));
  var taskEl = el.closest('.pytask');
  var run = pyRunTaskCode(lessonId, ti, true);
  if(run.empty){ pyTaskOut(taskEl, '<div class="sqlmsg">✍️ Escribe tu programa primero.</div>'); return; }
  var task = run.task, r = run.r;
  var ok = false, why = '';
  if(task.check && task.check.expectError){
    if(!r.ok && String(r.error).indexOf(task.check.expectError) >= 0){ ok = true; why = 'El programa falló con la excepción pedida: así se aprende a leer errores.'; }
    else if(!r.ok){ why = 'Falló, pero con OTRO error: '+r.error; }
    else { why = 'Tu programa corrió SIN error… y la tarea pide provocar '+task.check.expectError+'.'; }
  } else if(!r.ok){
    why = 'Tu programa lanzó un error: '+r.error;
  } else {
    var g = ucsGradeTask(task.check, r);
    ok = !!g.ok;
    why = g.why || '';
  }
  if(ok){
    if(!state.ucsOk) state.ucsOk = {};
    state.ucsOk[pyTaskKey(lessonId, ti)] = 1;
    var sc = pyLessonScore(lessonId);
    if(sc != null && (state.scores[lessonId] == null || sc > state.scores[lessonId])) state.scores[lessonId] = sc;
    saveState(); updateChrome(); renderSidebar(parseHash());
    taskEl.classList.add('solved');
    var tst = taskEl.querySelector('.tst'); if(tst) tst.textContent = '✓ resuelta';
    var block = pyFindBlock(lessonId);
    var allOk = (block.tasks||[]).every(function(_, i){ return pyTaskSolved(lessonId, i); });
    pyTaskOut(taskEl, '<div class="sqlok">✅ ¡Salida exacta! '+(allOk?' <b>¡Lección completada! 🎉</b>':'')+'</div>');
    try{ confetti(taskEl); }catch(e){}
    var sec = taskEl.closest('[data-pyex]');
    if(sec){
      var solved = (block.tasks||[]).filter(function(_, i){ return pyTaskSolved(lessonId, i); }).length;
      var sp = sec.querySelector('[data-pyscore]');
      if(sp) sp.textContent = solved+' de '+(block.tasks||[]).length+' tareas resueltas';
    }
  } else {
    pyTaskOut(taskEl, '<div class="sqlno">❌ Aún no. '+esc(why)+' Compara tu salida con lo pedido y corrige: no hay castigo.</div>' + ((r && r.ok) ? pyOutHtml(r.output) : (r && r.output ? pyOutHtml(r.output) : '')));
  }
}

function pyRenderOut(){
  var out = document.getElementById('pgOut');
  if(!out) return;
  var ta = document.getElementById('pgEditor');
  var code = ta ? ta.value : '';
  if(state.play !== code){ state.play = code; saveState(); }
  var inBox = document.getElementById('pgStdin');
  if(inBox && state.playIn !== inBox.value){ state.playIn = inBox.value; saveState(); }
  if(!code.trim()){ out.innerHTML = '<div class="sqlmsg">✍️ Escribe un programa y presiona ▶ Ejecutar.</div>'; return; }
  var inputs = [];
  if(inBox && inBox.value.trim() !== '') inputs = inBox.value.replace(/\r/g,'').split('\n');
  var r = UCS.run(code, { stdin: inputs });
  out.innerHTML = r.ok ? pyOutHtml(r.output) : pyErrorHtml(r.error) + (r.output ? pyOutHtml(r.output) : '');
}

/* ---------- eventos delegados del módulo Unity ---------- */
document.addEventListener('click', function(ev){
  var el = ev.target.closest ? ev.target.closest('[data-ucsaction]') : null;
  if(!el) return;
  var act = el.getAttribute('data-ucsaction');
  try{
    if(act === 'run') pyActionRun(el);
    else if(act === 'grade') pyActionGrade(el);
    else if(act === 'clear'){
      var lessonId = el.getAttribute('data-lesson'), ti = Number(el.getAttribute('data-ti'));
      var ta = pyGetTa(lessonId, ti);
      if(ta){ ta.value = ''; ta.focus(); }
      var taskEl = el.closest('.pytask'); if(taskEl) pyTaskOut(taskEl, '');
    }
    else if(act === 'pg-run'){ pyRenderOut(); }
    else if(act === 'pg-clear'){
      var out = document.getElementById('pgOut');
      if(out) out.innerHTML = '<div class="sqlmsg">🧹 Salida limpia. Ejecuta de nuevo cuando quieras.</div>';
    }
    else if(act === 'pg-chip'){
      var ta2 = document.getElementById('pgEditor');
      if(ta2){ ta2.value = el.getAttribute('data-q') || ''; pyRenderOut(); }
    }
  }catch(e){ try{ console.error('[ucs]', e); }catch(e2){} }
});

function blockHtml(b, lessonId){
  switch(b.t){
    case 'p': return '<p class="lead-text">'+b.h+'</p>';
    case 'h': return '<h3 class="sec">'+b.h+'</h3>';
    case 'list': return '<ul class="nice">'+b.items.map(function(i){ return '<li>'+i+'</li>'; }).join('')+'</ul>';
    case 'steps': return '<ol class="steps">'+b.items.map(function(i){ return '<li>'+i+'</li>'; }).join('')+'</ol>';
    case 'code': return codeBlockHtml(b);

let CURRENT = { view:'home', id:null };
function parseHash(){
  try{
    const h = (location.hash || '').replace(/^#\/?/, '');
    if(!h) return { view:'home' };
    const parts = h.split('/');
    if(parts[0] === 'leccion' && LESSONS_BY_ID[parts[1]]) return { view:'lesson', id: parts[1] };
    if(parts[0] === 'examen') return { view:'exam' };
    if(parts[0] === 'proyecto') return { view:'project' };
    if(parts[0] === 'libro') return { view:'book', id: parts[1] || null };
    if(parts[0] === 'boleta') return { view:'report' };
    return { view:'home' };
  }catch(e){ return { view:'home' }; }
}
function routeHash(r){
  if(r.view === 'lesson' && r.id) return '#/leccion/' + r.id;
  if(r.view === 'exam') return '#/examen';
  if(r.view === 'project') return '#/proyecto';
  if(r.view === 'book') return r.id ? '#/libro/' + r.id : '#/libro';
  if(r.view === 'report') return '#/boleta';
  return '#/';
}
function go(route){
  CURRENT = route;
  const h = routeHash(route);
  try{ if(location.hash !== h) location.hash = h; }catch(e){}
  const sb = $('#sidebar'); if(sb) sb.classList.remove('open');
  const bd = document.getElementById('backdrop'); if(bd) bd.classList.remove('show');
  document.body.classList.remove('no-scroll');
  render();
}
function navTo(kind, id){
  go({ view: kind, id: id || null });
}
function render(){
  const route = CURRENT;
  EDITOR_CODES = [];
  const content = $('#content');
  if(route.view === 'home') content.innerHTML = viewHome();
  else if(route.view === 'lesson') content.innerHTML = viewLesson(route.id);
  else if(route.view === 'exam') content.innerHTML = viewExam();
  else if(route.view === 'project'){ content.innerHTML = viewProject(); }
  else if(route.view === 'book'){ content.innerHTML = viewBook(route.id); }
  else content.innerHTML = viewReport();
  initDemos(content);
  renderSidebar(route);
  updateChrome();
  try{ window.scrollTo({top:0,left:0,behavior:'instant'}); }
  catch(e){ window.scrollTo(0,0); }
  try{ content.scrollTop = 0; }catch(e){}
}

/* ---------- acciones globales (delegación) ---------- */
function copyText(text, btn){
  const done = function(ok){
    if(btn){
      const old = btn.textContent;
      btn.textContent = ok ? '✓ Copiado' : '⚠️ Selecciona y copia';
      setTimeout(function(){ btn.textContent = old; }, 1800);
    }
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){ done(true); }, function(){ fallbackCopy(text, btn, done); });
  } else fallbackCopy(text, btn, done);
}
function fallbackCopy(text, btn, done){
  try{
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    const ok = document.execCommand('copy');
    document.body.removeChild(ta);
    done(ok);
  }catch(e){ done(false); }
}

/* ---------- protección de errores en el acceso ---------- */
function safeAuth(fn){
  return function(){
    try{ return fn.apply(null, arguments); }
    catch(err){
      try{ showAuth({ text:'⚠️ Ocurrió un error inesperado: ' + String((err && err.message) || err) + '. Usa las opciones de recuperación.', ok:false }); }catch(e){}
      try{ fatal(err); }catch(e2){}
    }
  };
}
doLogin = safeAuth(doLogin);
doCreate = safeAuth(doCreate);
doGuest = safeAuth(doGuest);
doLogout = safeAuth(doLogout);

document.addEventListener('click', function(e){
  const t = e.target;
  const recBtn = t.closest ? t.closest('[data-rec]') : null;
  if(recBtn){ handleRecovery(recBtn.getAttribute('data-rec')); return; }
  /* opciones de quiz */
  const opt = t.closest ? t.closest('.opt:not(.locked)') : null;
  if(opt){
    const qEl = opt.closest('.qcard');
    $$('.opt', qEl).forEach(function(o){ o.classList.remove('sel'); });
    opt.classList.add('sel');
    const section = opt.closest('[data-quiz]');
    if(section){
      const isExam = section.getAttribute('data-quiz') === '__exam';
      updateRemain(section, isExam ? EXAM.questions : (LESSONS_BY_ID[section.getAttribute('data-quiz')] ? LESSONS_BY_ID[section.getAttribute('data-quiz')].blocks.filter(function(b){ return b.t === 'quiz'; })[0].questions : []));
    }
    return;
  }
  const nav = t.closest('[data-nav]');
  if(nav){ navTo(nav.getAttribute('data-nav'), nav.getAttribute('data-id')); return; }
  const actionEl = t.closest('[data-action]');
  if(!actionEl) return;
  const action = actionEl.getAttribute('data-action');
  if(action === 'toggle-module'){
    actionEl.closest('.sgroup').classList.toggle('open');
  } else if(action === 'copy'){
    copyText(CODE_STORE[Number(actionEl.getAttribute('data-code'))] || '', actionEl);
  } else if(action === 'run'){
    const w = actionEl.closest('.edwrap');
    $('.edprev', w).srcdoc = $('textarea', w).value;
  } else if(action === 'reset'){
    const w = actionEl.closest('.edwrap');
    const ta = $('textarea', w);
    ta.value = EDITOR_CODES[Number(w.getAttribute('data-ed'))] || '';
    $('.edprev', w).srcdoc = ta.value;
  } else if(action === 'grade-quiz'){
    const section = actionEl.closest('[data-quiz]');
    const lessonId = section.getAttribute('data-quiz');
    const lesson = LESSONS_BY_ID[lessonId];
    const quizBlock = lesson.blocks.filter(function(b){ return b.t === 'quiz'; })[0];
    gradeQuizSection(section, quizBlock.questions, lessonId);
  } else if(action === 'grade-exam'){
    const section = actionEl.closest('[data-quiz]');
    gradeQuizSection(section, EXAM.questions, '__exam');
  } else if(action === 'grade-ex'){
    gradeExercise(actionEl.closest('[data-ex]'));
  } else if(action === 'retry'){
    render();
  } else if(action === 'tab'){
    $$('.tab', actionEl.closest('.tabs')).forEach(function(b){ b.classList.remove('active'); });
    actionEl.classList.add('active');
    renderProjectTab(Number(actionEl.getAttribute('data-tab')));
  } else if(action === 'save-name'){
    const inp = $('#certName');
    state.name = inp ? inp.value.trim() : '';
    saveState();
    render();
  } else if(action === 'print-cert'){
    try{ window.print(); }catch(e){ alertFallback(); }
  } else if(action === 'auth-logout'){
    if(sessionUser()){ doLogout(); }
    else { showAuth(); }
  } else if(action === 'reset-progress'){
    if(actionEl.getAttribute('data-armed') === '1'){
      state = { scores:{}, examScore:null, name:'', lastLesson:'0-1', srs:{} };
      saveState();
      render();
    } else {
      actionEl.setAttribute('data-armed','1');
      actionEl.textContent = '⚠️ ¿Seguro? Clic de nuevo para borrar TODO';
      setTimeout(function(){ actionEl.setAttribute('data-armed','0'); actionEl.textContent = '🗑️ Borrar todo mi progreso'; }, 4000);
    }
  }
});

let LAST_ERROR = null;
function fatal(err){
  window.__ccReady = false;
  LAST_ERROR = err;
  const detalle = String((err && (err.stack || err.message)) || err);
  const card = '<div class="box warn" style="margin:0 0 12px">' +
    '<span class="box-title">⚠️ El curso no pudo iniciarse</span>' +

    '<button type="button" class="btn small" data-rec="retry">🔄 Reintentar</button>' +
    '<button type="button" class="btn small ghost" data-rec="guest">👤 Entrar como invitado</button>' +
    '<button type="button" class="btn small ghost" data-rec="wipe-course">🧹 Reiniciar datos de este curso</button>' +
    '<button type="button" class="btn small ghost" data-rec="wipe-all">🏭 Restablecer todo</button>' +
    '</div>' +
    '<details style="margin-top:12px;font-size:12px;color:var(--muted)"><summary style="cursor:pointer;font-weight:700">Detalle técnico (clic para ver)</summary>' +
    '<div class="sd-out" style="margin-top:8px;max-height:150px;overflow:auto">' + esc(detalle) + '</div></details>' +
    '<p style="font-size:12px;color:var(--muted);margin-top:10px">💾 Si nada funciona, descarga este archivo HTML y ábrelo con doble clic en tu navegador: ahí el curso corre siempre completo.</p>';
  const layer = document.getElementById('authLayer');
  if(layer && layer.classList.contains('show')){
    layer.innerHTML = '<div class="auth-wrap"><div class="auth-card" style="padding:26px 24px">' +
      '<div class="auth-head" style="padding:0 0 14px"><div class="auth-logo">🛟</div><h1>Modo de recuperación</h1></div>' +
      card + '</div></div>';
    return;
  }
  const c = document.getElementById('content');
  if(!c) return;
  c.innerHTML = '<div class="view" style="padding-top:40px"><div class="auth-card" style="max-width:640px;margin:0 auto;padding:26px 26px">' +
    '<div class="auth-head" style="padding:0 0 14px;text-align:left"><div class="auth-logo">🛟</div><h1 style="font-size:18px">Modo de recuperación</h1></div>' +
    card + '</div></div>';
}
function handleRecovery(kind){
  try{
    if(kind === 'retry'){
      try{ location.reload(); return; }catch(e){}
      CURRENT = { view:'home' };
      try{ render(); window.__ccReady = true; }catch(e){ fatal(e); }
    } else if(kind === 'guest'){
      doGuest();
    } else if(kind === 'wipe-course'){
      safeStore.remove(LEGACY_KEY);
      const u = sessionUser();
      if(u && DB.users[u]){ DB.users[u].data = blankData(); DB.users[u].dataUnity = blankData(); saveDB(); }
      state = blankData();
      CURRENT = { view:'home' };
      hideAuth();
      try{ render(); window.__ccReady = true; }catch(e){ fatal(e); return; }
      if(!sessionUser()){ showAuth({ text:'✅ Datos de este curso restablecidos. Crea tu cuenta o entra como invitado.', ok:true }); }
    } else if(kind === 'wipe-all'){
      try{
        const kills = [];
        for(let i = 0; i < localStorage.length; i++){
          const k = localStorage.key(i);
          if(k && String(k).indexOf('codecamp-') === 0) kills.push(k);
        }
        kills.forEach(function(k){ localStorage.removeItem(k); });
      }catch(e){}
      Object.keys(MEM).forEach(function(k){ delete MEM[k]; });
      DB = { users:{}, session:null };
      state = blankData();
      AUTH_MODE = 'login';
      CURRENT = { view:'home' };
      hideAuth();
      try{ render(); window.__ccReady = true; }catch(e){ fatal(e); return; }
      showAuth({ text:'✅ Todo restablecido: cuentas y progreso en cero. Crea tu cuenta para empezar.', ok:true });
    }
  }catch(err){ fatal(err); }
}
window.addEventListener('error', function(ev){
  if(!window.__ccReady){ try{ fatal(ev.error || ev.message || 'Error desconocido'); }catch(e){} }
});
window.addEventListener('unhandledrejection', function(ev){
  if(!window.__ccReady){ try{ fatal((ev && ev.reason) || 'Error de promesa'); }catch(e){} }
});

/* ---------- progreso por curso (lee la DB compartida) ---------- */
function courseProgress(course){
  try{
    const u = sessionUser();
    const rec = (u && DB.users[u]) ? DB.users[u] : null;
    const d = (rec && rec[course.dataKey]) || {};
    const scores = d.scores || {};
    let pts = 0, done = 0;
    Object.keys(scores).forEach(function(k){ done++; pts += (scores[k] || 0); });
    const pct = course.max ? Math.min(100, Math.round(pts / course.max * 100)) : 0;
    return { done:done, total:course.total, pts:pts, pct:pct, exam:(d.examScore != null ? d.examScore : null), examMax:course.examMax };
  }catch(e){ return { done:0, total:course.total, pts:0, pct:0, exam:null, examMax:course.examMax }; }
}

/* ---------- calificación tolerante de respuestas escritas ---------- */
(function(){
  const __norm = norm;
  norm = function(s){ return __norm(s).replace(/[;:,.\s]+$/,''); };
})();
(function(){
  const __fillOk = fillOk;
  fillOk = function(q, val){
    const v = String(val||'').trim();
    if(v === '') return false;
    // normalización defensiva: lo que los teclados reales escriben
    const limpiar = function(s){
      return String(s)
        .replace(/[\u00A0\u2000-\u200B\uFEFF]/g,' ')     // espacios invisibles → espacio
        .replace(/[\u2013\u2014\u2212]/g,'-')               // guiones "inteligentes" → -
        .replace(/[\u2018\u2019\u201B]/g,"'")               // apóstrofes curvos → '
        .replace(/[\u201C\u201D]/g,'"')                      // comillas curvas → "
        .replace(/\s+/g,' ')
        .trim();
    };
    const v2 = limpiar(v);
    try{ if(q.re && (new RegExp(q.re,'i').test(v) || new RegExp(q.re,'i').test(v2))) return true; }catch(e){}
    const nv = norm(v2).replace(/[<>]/g,'');
    if((q.accept||[]).some(function(a){ return norm(a).replace(/[<>]/g,'') === nv; })) return true;
    // la respuesta modelo (q.show) siempre es válida: comparación laxa sin símbolos
    try{
      if(q.show){
        const loose = function(s){ return norm(s).replace(/[^a-z0-9]/g,''); };
        if(loose(v2) !== '' && loose(v2) === loose(q.show)) return true;
      }
    }catch(e){}
    return false;
  };
})();

function i18nChrome(html){
  if(langPref() !== 'en') return html;
  let h = String(html);
  CHROME_I18N.forEach(function(p){ h = h.split(p[0]).join(p[1]); });
  return h;
}
(function(){

    const r = __r();
    try{

        const c = document.getElementById('content');
        if(c && c.innerHTML) c.innerHTML = i18nChrome(c.innerHTML);
      }
    }catch(e){ try{ console.error('[campus] i18n render:', e); }catch(e2){} }
    return r;
  };
})();

(function(){

  showAuth = function(msg, vals){
    const r = __origShowAuth(msg, vals);
    try{
      const layer = document.getElementById('authLayer');
      if(layer && layer.classList.contains('show') && !layer.querySelector('.campus-nav')){
        const L = langPref();
        const nav = document.createElement('div');
        nav.className = 'campus-nav';
        nav.innerHTML = '<span class="cn-t">' + t('menu_courses') + ':</span>' + CAMPUS.courses.map(function(c){
          if(c.id === CAMPUS.thisCourse) return '<span class="cn-now">' + c.emoji + ' ' + (c.name[L] || c.name.es) + '</span>';
          return '<a href="' + c.file + '">' + c.emoji + ' ' + (c.name[L] || c.name.es) + '</a>';
        }).join('');
        layer.appendChild(nav);
      }
    }catch(e){ try{ console.error('[campus] nav login:', e); }catch(e2){} }
    return r;
  };
})();
