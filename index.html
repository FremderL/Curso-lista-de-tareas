<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Curso interactivo · Crea tu Lista de Tareas con HTML, CSS y JS</title>
<meta name="description" content="Curso web interactivo en español: construye, estiliza, programa y publica una lista de tareas real.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📝</text></svg>">
<style>
/* ============================================================
   CodeCamp · Sistema de diseño profesional
   ============================================================ */
:root{
  --bg:#f5f6fa; --card:#ffffff; --ink:#101828; --muted:#667085; --line:#e6e8ef; --line2:#eef0f6;
  --brand:#4f46e5; --brand-2:#7c3aed; --brand-ink:#3730a3; --brand-soft:#eef1ff; --brand-line:#dee3ff;
  --ok:#12855f; --ok-bg:#effaf4; --ok-line:#bfe8d4;
  --bad:#d92d20; --bad-bg:#fef3f2; --bad-line:#f9cfc9;
  --warn:#b54708; --warn-bg:#fffaeb; --warn-line:#fbe5a8;
  --info:#175cd3; --info-bg:#f2f7ff; --info-line:#cfe1fb;
  --code-bg:#0c1222; --code-head:#111a35;
  --sh-xs:0 1px 2px rgba(16,24,40,.06);
  --sh-sm:0 1px 3px rgba(16,24,40,.07), 0 8px 20px -8px rgba(16,24,40,.1);
  --sh-md:0 4px 10px rgba(16,24,40,.08), 0 18px 40px -16px rgba(16,24,40,.18);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.65;font-size:15.5px;-webkit-font-smoothing:antialiased}
::selection{background:#ddd9ff}
body.no-scroll{overflow:hidden}
button{font-family:inherit}
a{color:var(--brand)}
code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px}
code.inline,.qfb code,.box code,li code,p code,td code,.exsub code,.lmeta code,.frame-note code,.rmsg code,.ad-note code,.nd-hint code,.lead-text code{background:var(--brand-soft);border:1px solid var(--brand-line);padding:1px 6px;border-radius:6px;font-size:.87em;color:var(--brand-ink)}

/* ===== Layout base ===== */
.app{display:grid;grid-template-columns:290px minmax(0,1fr);align-items:start}
.maincol{min-width:0}
#backdrop{display:none}
#topbar{display:flex;align-items:center;gap:16px;background:var(--card);border-bottom:1px solid var(--line);padding:0 20px;min-height:58px;position:sticky;top:0;z-index:40}
.brand{display:flex;align-items:center;gap:11px;white-space:nowrap}
.logo-mark{width:32px;height:32px;flex:none;border-radius:9px;background:linear-gradient(135deg,var(--brand),var(--brand-2));display:grid;place-items:center;font-size:16px;box-shadow:var(--sh-xs)}
.brand-text{line-height:1.2}
.brand-text b{font-size:14.5px;letter-spacing:-.01em}
.brand-text small{display:block;color:var(--muted);font-size:11px;font-weight:600;letter-spacing:.02em}
.topprogress{flex:1;display:flex;align-items:center;gap:10px;min-width:120px}
.topprogress .bar{flex:1;height:8px;background:var(--line2);border-radius:99px;overflow:hidden}
.topprogress .bar>div{height:100%;width:0%;background:linear-gradient(90deg,var(--brand),var(--brand-2));border-radius:99px;transition:width .6s cubic-bezier(.22,1,.36,1)}
.topprogress span{font-size:12px;font-weight:700;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.chip.grade{font-size:12.5px;font-weight:700;padding:6px 13px;border-radius:99px;background:var(--line2);color:var(--muted);white-space:nowrap}
.chip.grade.g-good{background:var(--ok-bg);color:var(--ok);box-shadow:inset 0 0 0 1px var(--ok-line)}
.chip.grade.g-mid{background:var(--warn-bg);color:var(--warn);box-shadow:inset 0 0 0 1px var(--warn-line)}
.chip.grade.g-bad{background:var(--bad-bg);color:var(--bad);box-shadow:inset 0 0 0 1px var(--bad-line)}
#menuBtn{display:none;border:1px solid var(--line);background:#fff;border-radius:9px;font-size:17px;padding:4px 11px;cursor:pointer;color:var(--ink)}

/* ===== Sidebar ===== */
#sidebar{position:sticky;top:0;height:100vh;height:100dvh;background:var(--card);border-right:1px solid var(--line);overflow-y:auto;padding:14px 12px 48px}
.side-sec{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:800;margin:12px 8px 6px}
.sgroup{margin-bottom:8px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
.sgroup-head{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:transparent;border:none;padding:10px 12px;cursor:pointer;font-weight:700;font-size:13px;color:var(--ink)}
.sgroup-head:hover{background:#f7f8fc}
.sgroup-head .emo{font-size:15px;flex:none}
.sgroup-head .stitle-g{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sgroup-head .chev{color:var(--muted);transition:transform .25s;font-size:10.5px;flex:none}
.sgroup.open .sgroup-head .chev{transform:rotate(90deg)}
.sgroup-body{display:none;border-top:1px solid var(--line2);background:#fcfcfe}
.sgroup.open .sgroup-body{display:block}
.slesson{display:flex;align-items:center;gap:9px;width:100%;text-align:left;border:none;background:transparent;padding:7px 12px 7px 12px;cursor:pointer;font-size:12.8px;color:#3d4657;border-left:2px solid transparent}
.slesson:hover{background:#f4f6fd}
.slesson.active{background:var(--brand-soft);border-left-color:var(--brand);font-weight:700;color:var(--brand-ink)}
.slesson .num{flex:none;width:20px;height:20px;border-radius:50%;background:var(--line2);color:#5a6474;font-size:10.5px;font-weight:800;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.slesson.done .num{background:var(--ok);color:#fff}
.slesson .stitle{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slesson .sscore,.sextra .sscore{flex:none;font-size:10px;font-weight:800;color:var(--ok);background:var(--ok-bg);box-shadow:inset 0 0 0 1px var(--ok-line);border-radius:99px;padding:2px 7px;font-variant-numeric:tabular-nums}
.sextra{display:flex;align-items:center;gap:9px;width:100%;text-align:left;border:none;background:transparent;padding:9px 12px;margin-top:2px;border-radius:10px;cursor:pointer;font-size:13px;font-weight:650;color:#3d4657}
.sextra:hover{background:#f4f6fd}
.sextra .ico{flex:none;width:22px;text-align:center}

/* ===== Contenido ===== */
#content{padding:32px 38px 90px}
.view{max-width:880px;margin:0 auto;animation:fadeUp .3s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.lesson-head{margin-bottom:22px;padding-bottom:18px;border-bottom:1px solid var(--line)}
.lmodule{display:inline-flex;align-items:center;gap:7px;font-size:11px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--brand-ink);background:var(--brand-soft);box-shadow:inset 0 0 0 1px var(--brand-line);padding:4px 11px;border-radius:99px;margin-bottom:12px}
h1.ltitle{font-size:27px;line-height:1.28;letter-spacing:-.02em;font-weight:800}
.lmeta{color:var(--muted);font-size:12.5px;margin-top:7px;font-weight:600}
h3.sec{font-size:18.5px;margin:28px 0 10px;letter-spacing:-.015em;font-weight:750}
p.lead-text{margin:10px 0}
ul.nice,ol.nice{margin:10px 0 10px 4px;padding-left:22px}
ul.nice li,ol.nice li{margin:6px 0}
ul.nice li::marker{color:var(--brand)}
.frame-note{font-size:12.5px;color:var(--muted);margin:-8px 0 0;font-weight:550}

/* ===== Cajas de mensaje ===== */
.box{border-radius:12px;padding:13px 16px;margin:16px 0;border:1px solid;border-left-width:4px;font-size:14.5px}
.box .box-title{display:block;font-weight:750;margin-bottom:3px;font-size:13.5px}
.box.tip{background:#f2fbf7;border-color:var(--ok-line);border-left-color:#2fbf8f;color:#0d5138}
.box.tip .box-title{color:#0e9f6e}
.box.warn{background:var(--warn-bg);border-color:var(--warn-line);border-left-color:#f79009;color:#71400a}
.box.warn .box-title{color:var(--warn)}
.box.info{background:var(--info-bg);border-color:var(--info-line);border-left-color:#528bff;color:#1a3d8f}
.box.info .box-title{color:var(--info)}
.box.milestone{background:linear-gradient(115deg,#f7f4ff,#fdf3f9);border-color:#e7dbff;border-left-color:#8b5cf6;color:#432e7a}
.box.milestone .box-title{color:#6d28d9}

/* ===== Tablas de referencia ===== */
table.ref{width:100%;border-collapse:separate;border-spacing:0;margin:14px 0;font-size:13.5px;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:var(--sh-xs)}
table.ref th{background:#f8f9fc;text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:9px 14px}
table.ref td{padding:9px 14px;border-top:1px solid var(--line2);vertical-align:top}
table.ref td:first-child{white-space:nowrap;font-weight:650}

/* ===== Bloques de código ===== */
.codewrap{background:var(--code-bg);border-radius:12px;margin:16px 0;overflow:hidden;box-shadow:var(--sh-sm);border:1px solid #1c2748}
.codehead{display:flex;align-items:center;gap:10px;padding:9px 14px;background:var(--code-head);border-bottom:1px solid #1c2748}
.dots{display:flex;gap:6px;flex:none}
.dots i{width:10px;height:10px;border-radius:50%;display:block}
.dots i:nth-child(1){background:#ff5f57}.dots i:nth-child(2){background:#febc2e}.dots i:nth-child(3){background:#28c840}
.langtag{font-size:11px;font-weight:700;color:#8fa0c9;letter-spacing:.08em;text-transform:uppercase;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.copybtn{border:1px solid #2c3a63;background:transparent;color:#aebbe4;font-size:11.5px;padding:4px 10px;border-radius:7px;cursor:pointer;font-weight:700;flex:none}
.copybtn:hover{background:#1b2647;color:#fff}
.codewrap pre{padding:16px 18px;overflow-x:auto;font-size:13px;line-height:1.65;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#d7e0f7}
.tok-c{color:#7d8898;font-style:italic}
.tok-tag{color:#6ee7a0}
.tok-attr{color:#82aaff}
.tok-str{color:#9ecbff}
.tok-kw{color:#f97583}
.tok-num{color:#f8c763}
.tok-builtin{color:#c39cff}
.tok-doctype{color:#c39cff;font-weight:700}
.tok-sel{color:#6ee7a0}
.tok-prop{color:#82aaff}
.tok-val{color:#9ecbff}

/* ===== Editor en vivo ===== */
.edwrap{border:1px solid var(--line);border-radius:14px;overflow:hidden;margin:18px 0;background:#fff;box-shadow:var(--sh-sm)}
.edbar{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#f8f9fc;border-bottom:1px solid var(--line);padding:8px 14px}
.edfile{font-size:12px;font-weight:700;color:var(--muted);font-family:ui-monospace,Menlo,Consolas,monospace}
.edbtns{display:flex;gap:8px}
.runbtn,.resetbtn{border:1px solid transparent;border-radius:8px;padding:6px 13px;font-size:12px;font-weight:750;cursor:pointer}
.runbtn{background:#12b76a;color:#fff}
.runbtn:hover{background:#0e9f5e}
.resetbtn{background:#fff;border-color:var(--line);color:#3d4657}
.resetbtn:hover{background:#f4f6fd}
.edpanes{display:grid;grid-template-columns:1fr 1fr;min-height:230px}
.edpanes textarea{border:none;resize:vertical;outline:none;padding:14px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.8px;line-height:1.6;background:var(--code-bg);color:#d7e0f7;min-height:230px;border-right:1px solid var(--line);tab-size:2}
.edpanes iframe{border:none;width:100%;min-height:230px;background:#fff}
.edhint{font-size:12.5px;color:var(--muted);margin-top:-10px;margin-bottom:14px;padding:0 4px}

/* ===== Ejercicios ===== */
.exercise{border:1.5px dashed #c3caff;border-radius:16px;padding:20px;margin:24px 0;background:#fdfdff}
.exhead{font-size:17.5px;font-weight:800;margin-bottom:5px;letter-spacing:-.01em}
.exsub{font-size:13.5px;color:var(--muted);margin-bottom:12px}
.checks{margin:14px 0 6px;display:grid;gap:6px}
.check{display:flex;align-items:center;gap:9px;font-size:13px;background:#f8f9fc;border:1px solid var(--line);border-radius:10px;padding:7px 12px;transition:all .2s}
.check .cic{flex:none;width:20px;height:20px;border-radius:50%;background:var(--line2);display:grid;place-items:center;font-size:11px;font-weight:900;color:#6a7386}
.check.okp{background:var(--ok-bg);border-color:var(--ok-line)}
.check.okp .cic{background:var(--ok);color:#fff}
.check.failp{background:var(--bad-bg);border-color:var(--bad-line)}
.check.failp .cic{background:var(--bad);color:#fff}
.check .pts{margin-left:auto;font-size:10.5px;font-weight:800;color:var(--muted);white-space:nowrap}

/* ===== Quizzes ===== */
.quiz{border:1px solid var(--line);border-radius:16px;padding:22px;margin:32px 0 10px;background:linear-gradient(180deg,#fbfcff,#f7f8fd);box-shadow:var(--sh-xs)}
.quiz-title{font-size:20px;margin-bottom:2px;font-weight:800;letter-spacing:-.01em}
.quiz-sub{font-size:13px;color:var(--muted);margin-bottom:16px}
.qcard{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin:12px 0;box-shadow:var(--sh-xs)}
.qq{font-weight:700;font-size:14.5px;margin-bottom:4px}
.qpts{display:inline-block;font-size:10.5px;font-weight:800;color:var(--brand-ink);background:var(--brand-soft);box-shadow:inset 0 0 0 1px var(--brand-line);border-radius:99px;padding:1px 9px;margin-bottom:10px}
.opts{display:grid;gap:8px;margin-top:8px}
.opt{text-align:left;border:1px solid #d4d9e3;background:#fff;border-radius:10px;padding:10px 14px;font-size:13.8px;cursor:pointer;transition:all .15s;display:flex;gap:10px;align-items:flex-start;color:var(--ink)}
.opt .ol{flex:none;width:22px;height:22px;border-radius:7px;background:#f2f4f7;display:grid;place-items:center;font-size:11px;font-weight:900;color:#5a6474;margin-top:1px}
.opt:hover{border-color:#a5acff;background:#f8f9ff}
.opt.sel{border-color:var(--brand);background:var(--brand-soft);box-shadow:0 0 0 1px var(--brand)}
.opt.sel .ol{background:var(--brand);color:#fff}
.opt.locked{cursor:default;pointer-events:none}
.opt.reveal{border-color:var(--ok-line);background:var(--ok-bg)}
.opt.reveal .ol{background:var(--ok);color:#fff}
.opt.correct{border-color:var(--ok);box-shadow:0 0 0 1px var(--ok)}
.opt.incorrect{border-color:var(--bad);box-shadow:0 0 0 1px var(--bad)}
.fillwrap{margin-top:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.fillwrap input{flex:1;min-width:200px;border:1px solid #d4d9e3;border-radius:10px;padding:9px 13px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;outline:none;background:#fff;color:var(--ink)}
.fillwrap input:focus{border-color:var(--brand);box-shadow:0 0 0 3px #e3e0ff}
.fillwrap .hint{font-size:11.5px;color:var(--muted)}
.quiz-actions{margin-top:16px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.quiz-remain{font-size:12px;color:var(--muted);font-weight:650}
.quiz-result{display:none;margin-top:16px;border-radius:14px;padding:18px;position:relative;text-align:center;border:1px solid var(--line);background:#fff;box-shadow:var(--sh-xs)}
.quiz-result.show{display:block}
.bigscore{font-size:36px;font-weight:850;letter-spacing:-.03em}
.bigscore small{font-size:15px;color:var(--muted);font-weight:700}
.rmsg{font-size:14px;margin-top:2px}

/* ===== Botones ===== */
.btn{border:none;border-radius:10px;padding:10px 18px;font-size:13.5px;font-weight:750;cursor:pointer;background:var(--brand);color:#fff;box-shadow:var(--sh-xs);transition:background .15s,transform .15s,box-shadow .15s;letter-spacing:.005em}
.btn:hover{background:#4338ca;transform:translateY(-1px);box-shadow:var(--sh-sm)}
.btn:active{transform:none}
.btn.ghost{background:#fff;color:#3d4657;border:1px solid #d4d9e3;box-shadow:none}
.btn.ghost:hover{background:#f7f8fc;color:var(--ink);box-shadow:none}
.btn.small{padding:7px 13px;font-size:12px;border-radius:9px}
.btn.green{background:#12b76a}
.btn.green:hover{background:#0e9f5e}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}

/* ===== Navegación entre lecciones ===== */
.navbtns{display:flex;justify-content:space-between;gap:12px;margin-top:36px;padding-top:18px;border-top:1px solid var(--line)}
.navbtns .btn{max-width:48%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ===== Árbol DOM ===== */
.domtree{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin:16px 0;box-shadow:var(--sh-xs);font-size:13px}
.domtree ul{list-style:none;padding-left:26px;border-left:2px dashed #d0d5e2;margin-left:8px}
.dnode{display:inline-block;border-radius:8px;padding:3px 11px;margin:3px 0;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;font-weight:700;border:1px solid}
.dnode.doc{background:#fffaeb;border-color:#fbe5a8;color:#7a4b06}
.dnode.tag{background:#effaf4;border-color:#bfe8d4;color:#0d5c42}
.dnode.idn{background:var(--brand-soft);border-color:var(--brand-line);color:var(--brand-ink)}
.dnode.text{background:#fdf2f8;border-color:#f9c7e2;color:#9d1e5f;font-weight:650}

/* ===== Demo appendChild ===== */
.appenddemo{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin:16px 0;box-shadow:var(--sh-xs)}
.ad-code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;background:var(--code-bg);color:#6ee7a0;padding:9px 13px;border-radius:9px;margin-bottom:12px}
.ad-list{list-style:none;padding:0;margin:12px 0}
.ad-list li{background:var(--brand-soft);border:1px solid var(--brand-line);color:var(--brand-ink);border-radius:9px;padding:6px 12px;font-size:12.5px;font-weight:700;margin:6px 0;animation:pop .3s cubic-bezier(.34,1.56,.64,1) both}
@keyframes pop{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:scale(1)}}
.ad-note{font-size:12.5px;color:var(--muted);margin-top:8px}
.ad-actions{display:flex;gap:8px;flex-wrap:wrap}

/* ===== Demo navbar ===== */
.navdemo{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin:16px 0;box-shadow:var(--sh-xs)}
.nd-bar{background:#0d6efd;border-radius:11px;padding:10px 16px;display:flex;align-items:center;gap:14px;color:#fff;position:relative}
.nd-brand{font-weight:750;font-size:15px}
.nd-tog{margin-left:auto;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:8px;padding:3px 10px;font-size:15px;cursor:pointer}
.nd-menu{display:flex;gap:18px;margin-left:auto}
.nd-menu a{color:#fff;text-decoration:none;font-size:13.5px;opacity:.9;cursor:pointer}
.nd-menu a:hover{opacity:1;text-decoration:underline}
.nd-menu.colapsado{display:none}
.nd-menu.abierto{display:flex !important;position:absolute;top:46px;right:14px;flex-direction:column;background:#0d6efd;padding:12px 18px;border-radius:11px;box-shadow:var(--sh-md);gap:10px;margin:0}
.nd-hint{font-size:12.5px;color:var(--muted);margin-top:10px}

/* ===== Demo localStorage ===== */
.storedemo{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin:16px 0;box-shadow:var(--sh-xs)}
.sd-row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.sd-row input{flex:1;min-width:180px;border:1px solid #d4d9e3;border-radius:10px;padding:9px 13px;font-size:14px;outline:none;background:#fff;color:var(--ink)}
.sd-row input:focus{border-color:var(--brand);box-shadow:0 0 0 3px #e3e0ff}
.sd-out{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;background:var(--code-bg);color:#9ecbff;border-radius:10px;padding:12px 14px;margin-top:10px;min-height:44px;white-space:pre-wrap}
.sd-note{font-size:12px;color:var(--warn);margin-top:8px;font-weight:600}

/* ===== Marco de demo de la app ===== */
.appframe-wrap{border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--sh-sm);margin:18px 0 8px;background:#fff}
.appframe-bar{display:flex;align-items:center;gap:7px;background:#f2f4f7;border-bottom:1px solid var(--line);padding:9px 13px}
.appframe-bar i{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.appframe-bar .url{flex:1;background:#fff;border:1px solid var(--line);border-radius:99px;font-size:11.5px;color:var(--muted);padding:3px 12px;font-family:ui-monospace,Menlo,Consolas,monospace;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.appframe{width:100%;height:440px;border:none;display:block;background:#eef2f7}

/* ===== Inicio ===== */
.hero{border-radius:20px;color:#fff;padding:46px 42px;margin-bottom:28px;position:relative;overflow:hidden;box-shadow:var(--sh-md);
  background:
    radial-gradient(640px 320px at 88% -12%, rgba(139,92,246,.45), transparent 62%),
    radial-gradient(520px 280px at -8% 112%, rgba(56,130,246,.38), transparent 62%),
    linear-gradient(135deg,#1b1740 0%,#282364 55%,#342a80 100%)}
.hero h1{font-size:33px;line-height:1.22;letter-spacing:-.025em;font-weight:800;max-width:600px;position:relative;z-index:1}
.hero h1 u{text-decoration-color:#a78bfa;text-decoration-thickness:3px;text-underline-offset:5px}
.hero p{margin:14px 0 0;max-width:590px;font-size:15px;color:#d4d9f6;position:relative;z-index:1}
.hero .hero-ctas{margin-top:24px;display:flex;gap:10px;flex-wrap:wrap;position:relative;z-index:1}
.hero .btn{background:#fff;color:#312e81;box-shadow:0 2px 8px rgba(10,8,40,.35)}
.hero .btn:hover{background:#f1efff;transform:translateY(-1px)}
.hero .btn.ghost{background:rgba(255,255,255,.1);color:#fff;border-color:rgba(255,255,255,.45);box-shadow:none}
.hero .btn.ghost:hover{background:rgba(255,255,255,.18);color:#fff}
.hero-stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:26px;position:relative;z-index:1}
.stat{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);border-radius:12px;padding:9px 15px;font-size:11.5px;font-weight:700;color:#cfd4f2;letter-spacing:.02em}
.stat b{display:block;font-size:18px;color:#fff;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.home-sec{margin:36px 0 14px;font-size:20px;font-weight:800;letter-spacing:-.02em;display:flex;align-items:center;gap:10px}
.home-sec::before{content:"";width:26px;height:4px;border-radius:99px;background:linear-gradient(90deg,var(--brand),var(--brand-2));flex:none}
.modules-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(252px,1fr));gap:14px}
.mcard{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--sh-xs);display:flex;flex-direction:column;gap:9px;transition:transform .18s,box-shadow .18s}
.mcard:hover{transform:translateY(-2px);box-shadow:var(--sh-sm)}
.mcard .mce{width:40px;height:40px;border-radius:10px;background:var(--brand-soft);display:grid;place-items:center;font-size:21px}
.mcard h4{font-size:15px;letter-spacing:-.01em}
.mcard p{font-size:12.5px;color:var(--muted);flex:1}
.mcard .mprog{height:7px;background:var(--line2);border-radius:99px;overflow:hidden}
.mcard .mprog>div{height:100%;background:linear-gradient(90deg,var(--brand),var(--brand-2));border-radius:99px;transition:width .5s}
.mcard .mlinks{font-size:11px;font-weight:750;color:var(--muted);letter-spacing:.03em;text-transform:uppercase}
.mcard .btn{align-self:flex-start}

/* ===== Boleta / certificado ===== */
.grade-hero{background:linear-gradient(135deg,#141a2e,#1d2647);border-radius:18px;color:#fff;padding:28px 30px;display:flex;gap:28px;align-items:center;flex-wrap:wrap;margin:18px 0;box-shadow:var(--sh-md)}
.bigpct{font-size:52px;font-weight:850;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
.bigpct small{font-size:17px;color:#8b96b8;font-weight:700}
.grade-hero .gh-info{flex:1;min-width:240px}
.grade-hero .gh-info h3{font-size:17px;letter-spacing:-.01em}
.grade-hero .gh-info p{color:#9aa6c8;font-size:13px;margin-top:5px}
table.rep{width:100%;border-collapse:separate;border-spacing:0;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:var(--sh-xs);font-size:13px;margin:14px 0}
table.rep th{background:#f8f9fc;text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:9px 14px}
table.rep td{padding:8px 14px;border-top:1px solid var(--line2)}
table.rep td .rbar{height:6px;background:var(--line2);border-radius:99px;overflow:hidden;min-width:90px}
table.rep td .rbar>div{height:100%;background:linear-gradient(90deg,var(--brand),var(--brand-2));border-radius:99px}
.st-chip{font-size:10.5px;font-weight:800;border-radius:99px;padding:3px 10px}
.st-done{background:var(--ok-bg);color:var(--ok);box-shadow:inset 0 0 0 1px var(--ok-line)}
.st-todo{background:var(--line2);color:var(--muted)}
.cert{border:1px solid var(--line);background:#fff;background-image:radial-gradient(420px 200px at 50% -40%,#f2f0ff,transparent 70%);border-radius:18px;padding:36px 28px;text-align:center;margin:26px 0;box-shadow:var(--sh-sm)}
.cert .cert-kicker{font-size:10.5px;letter-spacing:.3em;text-transform:uppercase;color:var(--muted);font-weight:800}
.cert h2{font-size:24px;margin:8px 0 2px;letter-spacing:-.02em}
.cert .cert-name{font-size:30px;font-weight:850;background:linear-gradient(90deg,var(--brand),var(--brand-2));-webkit-background-clip:text;background-clip:text;color:transparent;margin:12px 0 4px}
.cert .cert-meta{color:var(--muted);font-size:13px}
.namebox{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:14px 0}
.namebox input{border:1px solid #d4d9e3;border-radius:10px;padding:10px 15px;font-size:14px;outline:none;min-width:230px;background:#fff;color:var(--ink)}
.namebox input:focus{border-color:var(--brand);box-shadow:0 0 0 3px #e3e0ff}

/* ===== Proyecto final ===== */
.filetree{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;background:var(--code-bg);color:#c7d3f2;border-radius:12px;padding:16px 20px;margin:14px 0;white-space:pre;overflow-x:auto;line-height:1.75;box-shadow:var(--sh-sm)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:16px 0 0}
.tab{border:1px solid var(--line);border-bottom:none;background:#f4f6fd;border-radius:10px 10px 0 0;padding:8px 15px;font-size:12px;font-weight:750;cursor:pointer;color:#4a5468;font-family:ui-monospace,Menlo,Consolas,monospace}
.tab:hover{background:#ebeefb}
.tab.active{background:var(--code-bg);color:#8fe7b1;border-color:var(--code-bg)}
.tabfile .codewrap{margin-top:0;border-radius:0 12px 12px 12px}

/* ===== Pasos ===== */
ol.steps{counter-reset:paso;list-style:none;margin:14px 0;padding:0}
ol.steps li{counter-increment:paso;position:relative;padding:0 0 15px 46px;margin:0}
ol.steps li::before{content:counter(paso);position:absolute;left:0;top:0;width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff;font-weight:800;font-size:13px;display:grid;place-items:center;box-shadow:0 2px 6px rgba(79,70,229,.35)}
ol.steps li:not(:last-child)::after{content:"";position:absolute;left:13px;top:31px;bottom:3px;width:2px;background:var(--brand-line)}

/* ===== Confeti ===== */
.confetti-layer{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:5}
.confetti-layer i{position:absolute;top:-14px;width:8px;height:14px;border-radius:2px;animation:cfall linear forwards}
@keyframes cfall{to{transform:translateY(480px) rotate(720deg);opacity:.15}}

/* ===== Examen ===== */
.exam-head{background:linear-gradient(135deg,#171c33,#232a56);border-radius:18px;color:#fff;padding:30px 32px;margin-bottom:22px;box-shadow:var(--sh-md)}
.exam-head h1{font-size:24px;letter-spacing:-.02em}
.exam-head p{color:#c3cdf0;font-size:13.5px;margin-top:7px;max-width:640px}

/* ===== Scrollbars ===== */
#sidebar::-webkit-scrollbar{width:10px}
#sidebar::-webkit-scrollbar-thumb{background:#cfd4e0;border-radius:99px;border:2px solid var(--bg)}
#sidebar::-webkit-scrollbar-track{background:transparent}

/* ===== Responsive ===== */
@media (max-width:920px){
  .app{grid-template-columns:1fr}
  #sidebar{position:fixed;z-index:60;width:296px;top:0;bottom:0;left:-316px;transition:left .28s ease;box-shadow:var(--sh-md)}
  #sidebar.open{left:0}
  #backdrop{display:none;position:fixed;inset:0;background:rgba(16,24,40,.45);z-index:55}
  #backdrop.show{display:block}
  #menuBtn{display:block}
  .topprogress span{display:none}
  .brand-text small{display:none}
  #content{padding:22px 16px 80px}
  .edpanes{grid-template-columns:1fr}
  .edpanes textarea{border-right:none;border-bottom:1px solid var(--line);min-height:170px}
  .edpanes iframe{min-height:200px}
  .hero{padding:32px 22px}
  .hero h1{font-size:25px}
  .grade-hero{padding:22px}
}
@media print{
  #sidebar,#topbar,#backdrop,.navbtns,.namebox,.frame-note{display:none !important}
  body{background:#fff}
  .app{display:block}
  #content{padding:0}
}
</style>
</head>
<body>
<div class="app">
  <aside id="sidebar" aria-label="Índice del curso"></aside>
  <div id="backdrop"></div>
  <div class="maincol">
    <header id="topbar">
      <button id="menuBtn" title="Abrir índice" aria-label="Abrir índice">☰</button>
      <div class="brand">
        <span class="logo-mark">📝</span>
        <span class="brand-text"><b>CodeCamp</b><small>Curso interactivo · Lista de Tareas con HTML, CSS y JS</small></span>
      </div>
      <div class="topprogress"><div class="bar"><div id="topBar"></div></div><span id="topPct">0%</span></div>
      <span class="chip grade" id="topGrade">Calificación: —</span>
    </header>
    <main id="content" tabindex="-1">
      <noscript>
        <div class="view" style="padding-top:40px">
          <div class="box warn">
            <span class="box-title">⚠️ JavaScript está desactivado</span>
            Este curso es interactivo y necesita JavaScript para mostrarse. Habilítalo en tu navegador
            o descarga el archivo <code>index.html</code> y ábrelo en Chrome, Edge o Firefox.
          </div>
        </div>
      </noscript>
    </main>
  </div>
</div>
<script>
'use strict';
/* ============================================================
   CONTENIDO DEL CURSO — Módulos 1 y 2
   ============================================================ */
const MODULES = [];

/* ============================ MÓDULO 1: HTML ============================ */
MODULES.push({
  id:'m1', emoji:'🧱', name:'HTML · La estructura', color:'#6366f1',
  desc:'Los cimientos de tu página: etiquetas, encabezado, formularios y listas.',
  lessons:[

  /* -------- 1.1 -------- */
  { id:'1-1', title:'¿Qué es HTML? Tu primer archivo', time:'10 min', blocks:[
    {t:'p', h:'Imagina que construir una página web es como construir una casa 🏠. Necesitas tres cosas: una <b>estructura</b> (los muros y cimientos), una <b>decoración</b> (la pintura y los muebles) y <b>electricidad</b> (que las cosas funcionen al presionar un interruptor). En la web eso se traduce así:'},
    {t:'list', items:[
      '<b>HTML</b> → la estructura y el contenido (qué hay en la página).',
      '<b>CSS</b> → los estilos (cómo se ve: colores, tamaños, posiciones).',
      '<b>JavaScript</b> → el comportamiento (qué hace al hacer clic, guardar datos, etc.).'
    ]},
    {t:'p', h:'En este módulo nos enfocamos en el primero: <b>HTML</b>, que significa <b>H</b>yper<b>T</b>ext <b>M</b>arkup <b>L</b>anguage (Lenguaje de Marcado de Hipertexto). No es un lenguaje de programación: es un lenguaje de <b>marcado</b>, es decir, un sistema de etiquetas que <i>describen</i> qué es cada parte del contenido.'},
    {t:'info', title:'🔑 Concepto clave: la etiqueta', h:'Una etiqueta (tag) se escribe entre signos de menor y mayor. Casi todas abren y cierran: <code>&lt;p&gt;Hola&lt;/p&gt;</code>. La de apertura es <code>&lt;p&gt;</code>, la de cierre repite el nombre con una barra: <code>&lt;/p&gt;</code>. Todo junto (apertura + contenido + cierre) forma un <b>elemento</b>.'},
    {t:'code', lang:'html', title:'Anatomía de un elemento', code:
`<p>Este es el contenido del parrafo.</p>

 ^  ^                        ^^
 |  |                        ||
 |  +---> contenido          |+---> barra de cierre
 +---> etiqueta de apertura  +---> etiqueta de cierre`},
    {t:'h', h:'El esqueleto de toda página web'},
    {t:'p', h:'Todo archivo HTML empieza con la misma estructura básica. Créala tú también: abre un editor (recomendamos <b>Visual Studio Code</b>, gratuito), escribe esto y guarda el archivo como <code>index.html</code>:'},
    {t:'code', lang:'html', title:'plantilla base', code:
`<!DOCTYPE html>
<html lang="es">
  <head>
    <!-- Informacion PARA el navegador (no se ve en la pagina) -->
    <meta charset="UTF-8">
    <title>Mis Tareas</title>
  </head>
  <body>
    <!-- Todo lo que el usuario SI ve va aqui -->
    <h1>Hola, mundo</h1>
  </body>
</html>`},
    {t:'list', items:[
      '<code>&lt;!DOCTYPE html&gt;</code> → le dice al navegador: “esto es HTML5 moderno”. Siempre va primero.',
      '<code>&lt;html lang="es"&gt;</code> → el elemento raíz que contiene todo. <code>lang="es"</code> indica que la página está en español.',
      '<code>&lt;head&gt;</code> → la “zona técnica”: información para el navegador (título de la pestaña, codificación, estilos). No se ve en la página.',
      '<code>&lt;body&gt;</code> → el cuerpo: <b>todo lo que el usuario ve</b> vive aquí.'
    ]},
    {t:'h', h:'Etiquetas esenciales que usarás siempre'},
    {t:'table', head:['Etiqueta','¿Para qué sirve?'], rows:[
      ['<code>&lt;h1&gt;</code> … <code>&lt;h6&gt;</code>','Títulos y subtítulos, del más importante (h1) al menos (h6).'],
      ['<code>&lt;p&gt;</code>','Un párrafo de texto.'],
      ['<code>&lt;a&gt;</code>','Un enlace a otra página (anchor).'],
      ['<code>&lt;img&gt;</code>','Una imagen. Es “autocerrada”: no lleva <code>&lt;/img&gt;</code>.'],
      ['<code>&lt;ul&gt;</code> y <code>&lt;li&gt;</code>','Lista sin orden y sus elementos. ¡La usaremos para las tareas!'],
      ['<code>&lt;form&gt;</code>','Un formulario para capturar datos del usuario.'],
      ['<code>&lt;input&gt;</code>','Un campo de datos (texto, contraseña, etc.).'],
      ['<code>&lt;button&gt;</code>','Un botón.']
    ]},
    {t:'tip', title:'💡 Tip de pro', h:'Guarda tu archivo principal siempre con el nombre <code>index.html</code>: los servidores web (como GitHub Pages) buscan ese nombre por defecto para mostrar tu página.'},
    {t:'warn', title:'⚠️ Error común de principiantes', h:'Olvidar cerrar una etiqueta: <code>&lt;p&gt;Hola</code> sin su <code>&lt;/p&gt;</code>. El navegador intentará adivinar y puede “tragarse” el resto del contenido. Acostúmbrate desde hoy: abres etiqueta → escribes contenido → la cierras.'},
    {t:'quiz', questions:[
      {type:'mc', q:'¿Qué significa HTML?', options:['How To Make Links','HyperText Markup Language','Home Tool Markup Language','HighTech Modern Language'], correct:1, pts:10, explain:'HTML = HyperText Markup Language: un lenguaje de marcado con etiquetas que describen la estructura del contenido.'},
      {type:'mc', q:'¿Dentro de qué etiqueta va TODO lo que el usuario ve?', options:['&lt;head&gt;','&lt;title&gt;','&lt;body&gt;','&lt;html&gt;'], correct:2, pts:10, explain:'El &lt;body&gt; es el cuerpo visible de la página. El &lt;head&gt; contiene información para el navegador.'},
      {type:'fill', q:'Escribe la primera línea de todo documento HTML5, la que le avisa al navegador que es HTML5:', accept:['<!doctype html>','<! doctype html>','<!doctype>','doctype'], re:'<!\\s*doctype\\s+html\\s*>', show:'&lt;!DOCTYPE html&gt;', pts:10, hint:'Empieza con &lt;! y no distingue mayúsculas.'}
    ]}
  ]},

  /* -------- 1.2 -------- */
  { id:'1-2', title:'El &lt;head&gt;: la sala de máquinas', time:'8 min', blocks:[
    {t:'p', h:'El <code>&lt;head&gt;</code> es como la <b>sala de máquinas de un barco</b> ⚙️: el pasajero no la ve, pero sin ella nada funciona bien. Ahí living la información que el navegador necesita <i>antes</i> de dibujar la página.'},
    {t:'code', lang:'html', title:'el <head> de nuestro proyecto', code:
`<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mis Tareas</title>
  <link rel="stylesheet" href="styles.css">
</head>`},
    {t:'p', h:'Línea por línea:'},
    {t:'list', items:[
      '<code>&lt;meta charset="UTF-8"&gt;</code> → define la <b>codificación de caracteres</b>. Sin ella, las tildes y la ñ se ven como símbolos raros: “Mis TÃºtareas” 😱.',
      '<code>&lt;meta name="viewport" ...&gt;</code> → hace que la página se <b>adapte al celular</b> (diseño responsive). Imprescindible hoy en día.',
      '<code>&lt;title&gt;</code> → el texto que aparece en la <b>pestaña</b> del navegador y en los resultados de Google.',
      '<code>&lt;link rel="stylesheet" href="styles.css"&gt;</code> → conecta tu archivo CSS externo con esta página (lo crearemos en el Módulo 2).'
    ]},
    {t:'info', title:'ℹ️ ¿Qué significa “meta”?', h:'Las etiquetas <code>&lt;meta&gt;</code> guardan <b>metadatos</b>: información <i>sobre</i> la página (codificación, autor, descripción, palabras clave). No representan contenido visible.'},
    {t:'tip', title:'💡 Tip', h:'El orden dentro de &lt;head&gt; importa poco para el navegador, pero la convención profesional es: charset → viewport → title → estilos. Así se lee mejor.'},
    {t:'quiz', questions:[
      {type:'mc', q:'Si olvidas &lt;meta charset="UTF-8"&gt;, ¿qué puede pasar?', options:['La página se vuelve más lenta','Los acentos y eñes se ven con símbolos extraños','El CSS deja de funcionar','No pasa nada, es opcional siempre'], correct:1, pts:10, explain:'Sin UTF-8 el navegador puede interpretar mal los caracteres: “día” se vería como “dÃ­a”.'},
      {type:'mc', q:'¿Dónde ve el usuario el contenido de &lt;title&gt;?', options:['Dentro de la página, arriba del todo','En la pestaña del navegador','Solo en el celular','En el pie de página'], correct:1, pts:10, explain:'El &lt;title&gt; aparece en la pestaña del navegador y como título en los buscadores; nunca dentro de la página.'},
      {type:'fill', q:'¿Qué etiqueta conecta un archivo CSS externo con tu HTML? Escribe SOLO el nombre de la etiqueta:', accept:['link','<link>','link rel'], re:'^\\s*<?\\s*link\\s*>?\\s*$', show:'&lt;link rel="stylesheet" href="styles.css"&gt;', pts:10, hint:'Se escribe dentro del <head> y es autocerrada… casi: <link ...> no lleva cierre.'}
    ]}
  ]},

  /* -------- 1.3 -------- */
  { id:'1-3', title:'El cuerpo: título y textos de la app', time:'9 min', blocks:[
    {t:'p', h:'Ya tienes el esqueleto y la sala de máquinas. Ahora sí: <b>lo que se ve</b>. Nuestra lista de tareas necesita un encabezado que diga de qué trata la app. Para eso existen los títulos HTML.'},
    {t:'h', h:'La jerarquía de títulos: de h1 a h6'},
    {t:'code', lang:'html', title:'jerarquía de títulos', code:
`<h1>Titulo mas importante (solo uno por pagina)</h1>
<h2>Secciones principales</h2>
<h3>Subsecciones</h3>
<!-- ... hasta h6, el menos importante -->`},
    {t:'p', h:'Piensa en ellos como los títulos de un libro de texto: el <code>&lt;h1&gt;</code> es el título del libro, los <code>&lt;h2&gt;</code> son los capítulos, los <code>&lt;h3&gt;</code> las secciones. <b>Regla de oro:</b> usa un solo <code>&lt;h1&gt;</code> por página y no saltes niveles sin motivo.'},
    {t:'h', h:'El encabezado de nuestra app'},
    {t:'code', lang:'html', title:'index.html', code:
`<body>
  <header class="encabezado">
    <h1>📝 Mis Tareas</h1>
    <p>Organiza tu dia, una tarea a la vez.</p>
  </header>
</body>`},
    {t:'info', title:'🔑 HTML semántico', h:'Usamos <code>&lt;header&gt;</code> porque es una etiqueta <b>semántica</b>: describe el <i>significado</i> de su contenido (aquí va el encabezado). Otras: <code>&lt;nav&gt;</code>, <code>&lt;main&gt;</code>, <code>&lt;footer&gt;</code>, <code>&lt;section&gt;</code>. Podríamos usar solo <code>&lt;div&gt;</code> para todo, pero la semántica ayuda al <b>SEO</b> (que Google entienda tu página) y a la <b>accesibilidad</b> (que lectores de pantalla guíen a personas con discapacidad visual).'},
    {t:'warn', title:'⚠️ Error común', h:'Elegir títulos por su tamaño y no por su significado. El tamaño y grosor se arreglan con CSS; en HTML lo que importa es la jerarquía lógica.'},

`const formulario = document.getElementById('formulario-tarea');

function agregarTarea() {

  }

  entrada.value = '';

    {t:'editor', file:'practica-funcion.html', height:290, code:
`<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"><title>Practica: agregarTarea</title></head>
<body>
  <form id="formulario">
    <input type="text" id="entrada" placeholder="Escribe algo...">
    <button type="submit">Agregar</button>
  </form>
  <p id="vista-previa"></p>

  <script>
    const formulario = document.getElementById('formulario');
    const entrada = document.getElementById('entrada');
    const vistaPrevia = document.getElementById('vista-previa');

    function agregarTarea() {
      const texto = entrada.value.trim();
      if (texto === '') {
        vistaPrevia.textContent = 'Escribe algo primero :)';
        return;
      }
      vistaPrevia.textContent = 'Vas a agregar: "' + texto + '"';
      entrada.value = '';   // limpia el input
      entrada.focus();      // deja el cursor listo

      evento.preventDefault();
      agregarTarea();

    {t:'code', lang:'js', title:'app.js — la función completa', code:
`function agregarTarea() {
  const texto = entrada.value.trim();
  if (texto === '') {
    return;                       // nada de tareas vacias
  }

  // 1. Crear el elemento (solo existe en memoria)
  const li = document.createElement('li');
  li.className = 'tarea';          // le ponemos clase CSS
  li.textContent = texto;          // le ponemos contenido

  // 2. Colgarlo de la lista (AHORA aparece en pantalla)
  lista.appendChild(li);

  // 3. Limpiar el input para la siguiente tarea
  entrada.value = '';
  entrada.focus();
}`},

`<!DOCTYPE html>
<html lang="es">
<head>

<style>
  body { font-family: system-ui, sans-serif; background: #eef2f7;
         display: grid; place-items: center; min-height: 100vh; }
  .caja { background: #fff; padding: 20px; border-radius: 14px;
          width: 320px; box-shadow: 0 8px 24px rgba(0,0,0,.1); }
  form { display: flex; gap: 8px; }
  input { flex: 1; padding: 8px; border: 1px solid #cbd5e1;
          border-radius: 8px; }
  button { background: #6366f1; color: #fff; border: none;
           padding: 8px 14px; border-radius: 8px; cursor: pointer; }
  ul { list-style: none; padding: 0; margin: 14px 0 0; }
  li { background: #eef2ff; border: 1px solid #c7d2fe; color: #3730a3;
       padding: 8px 12px; border-radius: 8px; margin-top: 6px;
       font-size: 14px; font-weight: 600;
       animation: aparecer .25s; }
  @keyframes aparecer { from { opacity: 0; transform: translateY(6px); } }
</style>
</head>
<body>
  <div class="caja">
    <h1 style="font-size:20px">Mis tareas</h1>
    <form id="formulario-tarea">

    </form>

    const entrada = document.getElementById('entrada-tarea');

      const texto = entrada.value.trim();
      if (texto === '') return;

      const li = document.createElement('li');
      li.textContent = texto;
      lista.appendChild(li);

      entrada.focus();

      agregarTarea();
    });

    {t:'p', h:'Una lista sin borrar es un cuaderno sin goma ✏️. El plan: cada tarea llevará su propio botón <code>✕</code>. Al pulsarlo, el <code>&lt;li&gt;</code> se elimina del DOM y desaparece. Como cada li necesita SU botón con SU listener, conviene fabricar la tarea completa en una función aparte:'},
    {t:'code', lang:'js', title:'app.js — fabricar tareas con botón de borrado', code:
`function crearTarea(texto) {
  // La fila (li) que contiene todo
  const li = document.createElement('li');
  li.className = 'tarea';

  // El span con el texto de la tarea
  const span = document.createElement('span');
  span.className = 'texto-tarea';
  span.textContent = texto;

  // El boton de borrar
  const botonBorrar = document.createElement('button');
  botonBorrar.className = 'boton-borrar';
  botonBorrar.textContent = '✕';
  botonBorrar.title = 'Borrar tarea';

  // Cerrar (borrar): quitar el li del DOM
  botonBorrar.addEventListener('click', function () {
    li.remove();   // remove() elimina el nodo del arbol
  });

  // Armar la fila: texto + boton dentro del li
  li.appendChild(span);
  li.appendChild(botonBorrar);

  return li;   // la fabrica entrega el li listo
}

function agregarTarea() {
  const texto = entrada.value.trim();
  if (texto === '') return;

  const li = crearTarea(texto);  // fabricamos
  lista.appendChild(li);         // y colgamos

  entrada.value = '';
  entrada.focus();
}`},

    {t:'code', lang:'js', title:'app.js — versión final del motor', code:
`// ===== 1. Referencias al DOM =====
const formulario = document.getElementById('formulario-tarea');
const entrada    = document.getElementById('entrada-tarea');
const lista      = document.getElementById('lista-tareas');

// ===== 2. Estado: la fuente de la verdad =====
let tareas = [];

// ===== 3. Persistencia =====
function guardarTareas() {
  localStorage.setItem('mis-tareas', JSON.stringify(tareas));
}

function cargarTareas() {
  const datos = localStorage.getItem('mis-tareas');
  if (datos) {
    tareas = JSON.parse(datos);
  }
}

// ===== 4. Renderizar (dibujar el estado en pantalla) =====
function renderizarTareas() {
  lista.innerHTML = '';   // borramos y redibujamos todo

  tareas.forEach(function (tarea, indice) {
    const li = document.createElement('li');
    li.className = 'list-group-item d-flex justify-content-between align-items-center'
                   + (tarea.completada ? ' completada' : '');

    const span = document.createElement('span');
    span.textContent = tarea.texto;
    span.addEventListener('click', function () {
      tareas[indice].completada = !tareas[indice].completada;
      guardarTareas();
      renderizarTareas();
    });

    const boton = document.createElement('button');
    boton.className = 'btn btn-sm btn-danger';
    boton.textContent = '✕';
    boton.addEventListener('click', function () {
      tareas.splice(indice, 1);   // quita 1 elemento en esa posicion
      guardarTareas();
      renderizarTareas();
    });

    li.appendChild(span);
    li.appendChild(boton);
    lista.appendChild(li);
  });
}

// ===== 5. Eventos =====
formulario.addEventListener('submit', function (evento) {
  evento.preventDefault();
  const texto = entrada.value.trim();
  if (texto === '') return;

  tareas.push({ texto: texto, completada: false });  // 1. estado
  guardarTareas();                                   // 2. guardar
  renderizarTareas();                                // 3. pintar

  entrada.value = '';
  entrada.focus();
});

// ===== 6. Arranque =====
cargarTareas();
renderizarTareas();`},

  { id:'5-4', title:'El Service Worker: tu empleado offline 🤖', time:'13 min', blocks:[
    {t:'p', h:'El manifest da el ícono, pero el <b>modo offline</b> lo entrega otra pieza: el <b>Service Worker</b> (SW). Es un script que el navegador ejecuta <b>en segundo plano</b>, separado de tu página, y que actúa como <b>intermediario</b> entre tu app y la red 📡. Especie de mayordomo: cada petición (HTML, CSS, JS…) pasa por él, y él decide si pedírsela a internet o servirla desde una <b>caché local</b>.'},
    {t:'steps', items:[
      '<b>Registro</b>: tu app.js le dice al navegador “contrata a sw.js”.',
      '<b>install</b>: el SW, al instalarse, guarda en caché la lista de archivos esenciales.',
      '<b>fetch</b>: desde entonces, cada petición de la página pasa por el SW; si el archivo está en caché, responde al instante — <b>aun sin internet</b>.'
    ]},
    {t:'code', lang:'js', title:'sw.js (en la raíz, junto a index.html)', code:
`const CACHE_NAME = 'mis-tareas-v1';
const ARCHIVOS = [
  'index.html',
  'css/styles.css',
  'js/app.js',
  'manifest.json'
];

// INSTALL: guarda los archivos esenciales en la cache
self.addEventListener('install', function (evento) {
  evento.waitUntil(
    caches.open(CACHE_NAME).then(function (cache) {
      return cache.addAll(ARCHIVOS);
    })
  );
});

// FETCH: intercepta cada peticion
// 1. Busca en la cache...  2. si no esta, va a la red
self.addEventListener('fetch', function (evento) {
  evento.respondWith(
    caches.match(evento.request).then(function (respuesta) {
      return respuesta || fetch(evento.request);
    })
  );
});`},
    {t:'code', lang:'js', title:'registrarlo desde app.js (2 líneas)', code:
`if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js');

    {t:'warn', title:'⚠️ Tres reglas del service worker', h:'1) Requiere <b>HTTPS</b> (o <code>localhost</code> para pruebas): es un script con mucho poder, la web lo protege. 2) El <code>sw.js</code> debe estar en la <b>raíz</b> para controlar todo el sitio (eso es su “scope”). 3) El SW <b>no puede tocar el DOM</b> directamente: vive en otro hilo; su trabajo es la red y la caché.'},
    {t:'info', title:'🔑 Por qué “mis-tareas-v1”', h:'El nombre del caché lleva <b>versión</b> a propósito. Cuando publiques cambios, sube la versión (<code>mis-tareas-v2</code>): el navegador detecta el SW nuevo, instala la caché actualizada y puedes borrar la vieja en el evento <code>activate</code>. Sin versiones, tus usuarios podrían quedarse años con la versión antigua (¡un clásico!).'},

    {t:'code', lang:'js', title:'activate: limpiar cachés viejas al actualizar', code:
`// Cuando subes a v2, borra las cachés de versiones anteriores
self.addEventListener('activate', function (evento) {
  evento.waitUntil(
    caches.keys().then(function (nombres) {
      return Promise.all(
        nombres
          .filter(function (nombre) { return nombre !== CACHE_NAME; })
          .map(function (nombre) { return caches.delete(nombre); })
      );
    })
  );
});`},

`// =====================
// Mis Tareas - app.js
// Patrón: estado -> guardar -> renderizar
// =====================

// 1. Referencias al DOM
const formulario = document.getElementById('formulario-tarea');
const entrada    = document.getElementById('entrada-tarea');
const lista      = document.getElementById('lista-tareas');
const contador   = document.getElementById('contador');

// 2. Estado (fuente única de verdad)
let tareas = [];

// 3. Persistencia con localStorage
function guardarTareas() {
  localStorage.setItem('mis-tareas', JSON.stringify(tareas));
}

function cargarTareas() {
  const datos = localStorage.getItem('mis-tareas');
  if (datos) {
    tareas = JSON.parse(datos);
  }
}

// 4. Renderizar: dibuja el estado en pantalla
function renderizarTareas() {
  lista.innerHTML = '';

  tareas.forEach(function (tarea, indice) {
    const li = document.createElement('li');
    li.className = 'list-group-item d-flex justify-content-between align-items-center'
                 + (tarea.completada ? ' completada' : '');

    const span = document.createElement('span');
    span.textContent = tarea.texto;
    span.title = 'Clic para marcar/desmarcar';
    span.addEventListener('click', function () {
      tareas[indice].completada = !tareas[indice].completada; // interruptor
      guardarTareas();
      renderizarTareas();
    });

    const boton = document.createElement('button');
    boton.className = 'btn btn-sm btn-danger';
    boton.textContent = '✕';
    boton.addEventListener('click', function () {
      tareas.splice(indice, 1); // elimina 1 elemento en esa posición
      guardarTareas();
      renderizarTareas();
    });

    li.appendChild(span);
    li.appendChild(boton);
    lista.appendChild(li);
  });

  const pendientes = tareas.filter(function (t) { return !t.completada; }).length;
  contador.textContent = tareas.length
    ? pendientes + ' pendiente(s) de ' + tareas.length + ' en total'
    : 'Sin tareas aún. ¡Agrega la primera! 🎉';
}

// 5. Eventos
formulario.addEventListener('submit', function (evento) {
  evento.preventDefault(); // sin recargas
  const texto = entrada.value.trim();
  if (texto === '') return; // sin tareas vacías

  tareas.push({ texto: texto, completada: false }); // estado
  guardarTareas();                                  // persistir
  renderizarTareas();                               // pintar

  entrada.value = '';
  entrada.focus();
});

// 6. Service Worker (PWA / offline)
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js');
}

// 7. Arranque
cargarTareas();
renderizarTareas();
`},

  'manifest.json'
];

// INSTALL: cachea lo esencial
self.addEventListener('install', function (evento) {
  evento.waitUntil(
    caches.open(CACHE_NAME).then(function (cache) {
      return cache.addAll(ARCHIVOS);
    })
  );
});

// ACTIVATE: limpia cache de versiones anteriores
self.addEventListener('activate', function (evento) {
  evento.waitUntil(
    caches.keys().then(function (nombres) {
      return Promise.all(
        nombres
          .filter(function (n) { return n !== CACHE_NAME; })
          .map(function (n) { return caches.delete(n); })
      );
    })
  );
});

// FETCH: cache primero, red despues
self.addEventListener('fetch', function (evento) {
  evento.respondWith(
    caches.match(evento.request).then(function (respuesta) {
      return respuesta || fetch(evento.request);
    })
  );
});
`}
];

/* ============================================================
   APLICACIÓN — router, render, quizzes, editores y calificaciones

const $ = function(sel, root){ return (root||document).querySelector(sel); };
const $$ = function(sel, root){ return Array.prototype.slice.call((root||document).querySelectorAll(sel)); };
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function norm(s){
  return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ').trim();
}

/* ---------- almacenamiento seguro (fallback si sandbox bloquea localStorage) ---------- */
const MEM = {};
let LS_OK = true;
try { localStorage.setItem('__t','1'); localStorage.removeItem('__t'); } catch(e){ LS_OK = false; }
const safeStore = {
  get: function(k){ if(LS_OK){ try{ return localStorage.getItem(k); }catch(e){} } return (k in MEM ? MEM[k] : null); },
  set: function(k,v){ if(LS_OK){ try{ localStorage.setItem(k,v); return; }catch(e){} } MEM[k]=v; }
};
const STATE_KEY = 'codecamp-lista-tareas-v1';

/* ---------- registro de lecciones y calificación global ---------- */
const ALL_LESSONS = [];

const LESSONS_BY_ID = {};
ALL_LESSONS.forEach(function(l){ LESSONS_BY_ID[l.id] = l; });
function lessonMax(l){

  (l.blocks||[]).forEach(function(b){
    if(b.t==='quiz'){ b.questions.forEach(function(q){ max += (q.pts||10); }); }

const EXAM_MAX = EXAM.questions.reduce(function(a,q){ return a + (q.pts||10); }, 0);

/* ---------- resaltador de sintaxis ---------- */
function ph(i){ return '\uE000' + String.fromCharCode(0xE100+i) + '\uE001'; }
let MARKS = [];
function markPass(str, re, builder){
  return str.replace(re, function(){
    const args = Array.prototype.slice.call(arguments);
    MARKS.push(builder ? builder.apply(null, args.slice(0,-2)) : args[0]);
    return ph(MARKS.length-1);
  });
}
function restoreMarks(s){
  return s.replace(/\uE000([\uE100-\uE1FF])\uE001/g, function(m,c){
    const v = MARKS[c.charCodeAt(0)-0xE100];
    return v === undefined ? '' : v;
  });
}
function hlTag(t){
  const marks = [];
  t = t.replace(/([\w-]+)=("[^"]*")/g, function(m,a,v){
    marks.push('<span class="tok-attr">'+a+'</span>=<span class="tok-str">'+v+'</span>');
    return ph(marks.length-1);
  });
  t = t.replace(/^(&lt;\/?)([\w-]+)([\s\S]*?)(\/?&gt;)$/, function(m,open,tag,rest,slash){
    return open+'<span class="tok-tag">'+tag+'</span>'+rest+slash;
  });
  return t.replace(/\uE000([\uE100-\uE1FF])\uE001/g, function(m,c){
    const v = marks[c.charCodeAt(0)-0xE100];
    return v === undefined ? '' : v;
  });
}
function highlight(src, lang){
  MARKS = [];
  let s = esc(src);
  if(lang === 'html'){
    s = markPass(s, /&lt;!--[\s\S]*?--&gt;/g, null);
    MARKS[MARKS.length-1] = '<span class="tok-c">'+MARKS[MARKS.length-1]+'</span>';
    s = markPass(s, /&lt;!DOCTYPE[^&]*&gt;/gi, function(m){ return '<span class="tok-doctype">'+m+'</span>'; });
    s = markPass(s, /&lt;\/?[a-zA-Z][^&]*?&gt;/g, hlTag);
  } else if(lang === 'css'){
    s = markPass(s, /\/\*[\s\S]*?\*\//g, function(m){ return '<span class="tok-c">'+m+'</span>'; });
    s = markPass(s, /(^|\n)([ \t]*[^{}\n;]+)(?=[ \t]*\{)/g, function(m,pre,sel){ return pre+'<span class="tok-sel">'+sel+'</span>'; });
    s = markPass(s, /([-\w]+)(\s*:\s*)([^;\n]+)(;)/g, function(m,p,c,v,semi){
      return '<span class="tok-prop">'+p+'</span>'+c+'<span class="tok-val">'+v+'</span>'+semi;
    });
  } else {
    s = markPass(s, /\/\/[^\n]*|\/\*[\s\S]*?\*\//g, function(m){ return '<span class="tok-c">'+m+'</span>'; });
    s = markPass(s, /'(?:[^'\\\n]|\\.)*'|"(?:[^"\\\n]|\\.)*"/g, function(m){ return '<span class="tok-str">'+m+'</span>'; });
    s = markPass(s, /\b(const|let|var|function|return|if|else|for|forEach|while|new|typeof|true|false|null|undefined|this)\b/g, function(m){ return '<span class="tok-kw">'+m+'</span>'; });
    s = markPass(s, /\b(document|window|console|navigator|caches|self|JSON|localStorage)\b/g, function(m){ return '<span class="tok-builtin">'+m+'</span>'; });
    s = markPass(s, /\b(\d+(?:\.\d+)?)\b/g, function(m){ return '<span class="tok-num">'+m+'</span>'; });
  }
  return restoreMarks(s);
}

/* ---------- quizzes ---------- */
function qHtml(q, qi){
  const pts = q.pts || 10;
  let body = '';
  if(q.type === 'fill'){
    body = '<div class="fillwrap"><input type="text" data-fill="'+qi+'" autocomplete="off" spellcheck="false" placeholder="Escribe tu respuesta…"><span class="hint">'+(q.hint||'')+'</span></div>';

function quizBlockHtml(lessonId, quiz){
  return '<section class="quiz" data-quiz="'+lessonId+'">'+
    '<h3 class="quiz-title">📝 Ponte a prueba</h3>'+
    '<p class="quiz-sub">Responde y presiona «Calificar». Puedes repetir el quiz todas las veces que quieras: se guarda tu <b>mejor calificación</b>.</p>'+
    quiz.questions.map(function(q,i){ return qHtml(q,i); }).join('')+
    '<div class="quiz-actions"><button type="button" class="btn" data-action="grade-quiz" data-lesson="'+lessonId+'">✅ Calificar mis respuestas</button>'+
    '<span class="quiz-remain" data-respondidas>Respondidas: 0/'+quiz.questions.length+'</span></div>'+
    '<div class="quiz-result" data-result></div></section>';
}
function updateRemain(section, questions){
  let n = 0;
  questions.forEach(function(q,i){
    const qEl = section.querySelector('[data-q="'+i+'"]');
    if(!qEl) return;
    if(q.type === 'fill'){
      const inp = qEl.querySelector('input');
      if(inp && inp.value.trim() !== '') n++;
    } else if(qEl.querySelector('.opt.sel')) n++;
  });
  const span = section.querySelector('[data-respondidas]');
  if(span) span.textContent = 'Respondidas: '+n+'/'+questions.length;
}
function fillOk(q, val){
  const v = String(val||'').trim();
  if(v === '') return false;
  if(q.re){ try{ return new RegExp(q.re,'i').test(v); }catch(e){} }
  const nv = norm(v).replace(/[<>]/g,'');
  return (q.accept||[]).some(function(a){ return norm(a).replace(/[<>]/g,'') === nv; });
}
function tierOf(pct){
  if(pct >= 90) return { e:'🏆', t:'¡Excelente! Dominas esta lección.' };
  if(pct >= 70) return { e:'🎉', t:'¡Muy bien! Lección aprobada.' };
  if(pct >= 50) return { e:'📚', t:'Vas por buen camino. Repasa y vuelve a intentar.' };
  return { e:'💪', t:'No te rindas: rele la lección e inténtalo de nuevo.' };
}
function resultBoxHtml(earned, max, withRetry){
  const pct = max ? Math.round(earned/max*100) : 0;
  const tier = tierOf(pct);
  let extra = '';
  if(withRetry) extra = '<button type="button" class="btn ghost small" data-action="retry">🔄 Intentar de nuevo</button>';
  return '<div class="bigscore">'+tier.e+' '+pct+'<small>/100</small></div>'+
    '<div class="rmsg"><b>'+earned+' de '+max+' puntos</b> · '+tier.t+'</div>'+
    '<div class="quiz-actions" style="justify-content:center;margin-top:12px">'+extra+'</div>';
}
function gradeQuizSection(section, questions, lessonId){
  let earned = 0, max = 0;
  questions.forEach(function(q, qi){
    const pts = q.pts || 10;
    max += pts;
    const qEl = section.querySelector('[data-q="'+qi+'"]');
    if(!qEl) return;
    const fb = qEl.querySelector('[data-fb]');
    if(q.type === 'fill'){
      const inp = qEl.querySelector('input');
      const ok = fillOk(q, inp ? inp.value : '');
      if(inp) inp.disabled = true;
      qEl.classList.add(ok ? 'q-ok' : 'q-bad');
      fb.innerHTML = ok
        ? '<span class="ok">✅ ¡Correcto! +'+pts+' pts.</span>'+(q.explain||'')
        : '<span class="bad">❌ No era eso.</span> Respuesta: <code>'+esc(q.show||'—')+'</code>. '+(q.explain||'');
      if(ok) earned += pts;
    } else {
      const sel = qEl.querySelector('.opt.sel');
      const opts = $$('.opt', qEl);
      opts.forEach(function(o){ o.classList.add('locked'); });
      const ok = !!sel && Number(sel.getAttribute('data-opt')) === q.correct;
      opts.forEach(function(o){
        if(Number(o.getAttribute('data-opt')) === q.correct) o.classList.add('reveal');
      });
      if(sel) sel.classList.add(ok ? 'correct' : 'incorrect');
      fb.innerHTML = !sel
        ? '<span class="bad">⚪ Sin responder (0 pts).</span> '+(q.explain||'')
        : ok
          ? '<span class="ok">✅ ¡Correcto! +'+pts+' pts.</span> '+(q.explain||'')
          : '<span class="bad">❌ Casi… la respuesta correcta está marcada en verde.</span> '+(q.explain||'');
      if(ok) earned += pts;
    }
    fb.classList.add('show');
  });
  const result = section.querySelector('[data-result]');
  result.innerHTML = resultBoxHtml(earned, max, true);
  result.classList.add('show');
  const pct = max ? Math.round(earned/max*100) : 0;
  if(pct >= 70) confetti(result);
  /* persistir mejor calificación */
  if(lessonId === '__exam'){
    if(state.examScore == null || earned > state.examScore) state.examScore = earned;
  } else if(lessonId){
    const prev = state.scores[lessonId];
    if(prev == null || earned > prev) state.scores[lessonId] = earned;
  }
  saveState();
  updateChrome();
  renderSidebar(parseHash());
}

/* ---------- confeti ---------- */
function confetti(host){
  const layer = document.createElement('div');
  layer.className = 'confetti-layer';
  const colors = ['#6366f1','#ec4899','#f59e0b','#22c55e','#0ea5e9','#a855f7'];
  for(let i=0;i<40;i++){
    const s = document.createElement('i');
    s.style.left = (Math.random()*100)+'%';
    s.style.background = colors[i % colors.length];
    s.style.animationDelay = (Math.random()*0.7)+'s';
    s.style.animationDuration = (1.5 + Math.random()*1.5)+'s';
    s.style.transform = 'rotate('+(Math.random()*360)+'deg)';
    layer.appendChild(s);
  }
  host.appendChild(layer);

function initDemos(root){
  /* editores */
  $$('.edwrap', root).forEach(function(w){
    const ta = $('textarea', w);
    const frame = $('.edprev', w);
    if(ta && frame) frame.srcdoc = ta.value;
  });
  /* appendChild */
  $$('[data-demo="append"]', root).forEach(function(d){
    let n = 0;
    const list = $('[data-list]', d), count = $('[data-count]', d), note = $('[data-note]', d);
    $('[data-ad="add"]', d).addEventListener('click', function(){
      n++;
      const li = document.createElement('li');
      li.textContent = 'li #' + n + ' · tarea ' + n;
      list.appendChild(li);
      count.textContent = list.children.length;
      note.innerHTML = 'appendChild lo colgó como <b>último hijo</b>. El padre ahora tiene ' + list.children.length + ' hijo(s).';
    });
    $('[data-ad="move"]', d).addEventListener('click', function(){
      if(list.children.length < 2){ note.innerHTML = 'Agrega al menos 2 li para ver la magia del movimiento.'; return; }
      const primero = list.firstElementChild;
      list.appendChild(primero);
      note.innerHTML = '💥 <b>Se movió</b>: appendChild arrancó al primer li de su posición y lo colgó al final. Un nodo solo vive en UN lugar del árbol.';
    });
    $('[data-ad="clear"]', d).addEventListener('click', function(){
      list.innerHTML = ''; n = 0; count.textContent = '0';
      note.innerHTML = 'Lista limpia. ¿La llenamos otra vez?';
    });
  });
  /* navbar */
  $$('[data-demo="nav"]', root).forEach(function(d){
    const btn = $('[data-nd="tog"]', d), menu = $('[data-nd="menu"]', d);
    btn.addEventListener('click', function(){ menu.classList.toggle('abierto'); menu.classList.toggle('colapsado'); });
  });
  /* localStorage */
  $$('[data-demo="store"]', root).forEach(function(d){
    const out = $('[data-sd="out"]', d), inp = $('[data-sd="val"]', d), note = $('[data-sd="note"]', d);
    let db = null, temporal = false;
    try{ localStorage.setItem('__x','1'); localStorage.removeItem('__x'); db = localStorage; }
    catch(e){
      temporal = true;
      const mem = {};
      db = { setItem:function(k,v){ mem[k]=String(v); }, getItem:function(k){ return (k in mem)?mem[k]:null; }, removeItem:function(k){ delete mem[k]; } };
      note.textContent = '⚠️ Esta vista previa integrada bloquea localStorage por seguridad; se usa una copia temporal. Descarga el curso y ábrelo en tu navegador para que los datos persistan de verdad.';
    }
    $('[data-sd="save"]', d).addEventListener('click', function(){
      db.setItem('saludo', inp.value);
      out.textContent = 'localStorage.setItem("saludo", "' + inp.value + '")  // guardado ✓';
    });
    $('[data-sd="load"]', d).addEventListener('click', function(){
      const v = db.getItem('saludo');
      out.textContent = 'localStorage.getItem("saludo") → ' + (v === null ? 'null  // no hay nada guardado' : '"' + v + '"');
    });
    $('[data-sd="remove"]', d).addEventListener('click', function(){
      db.removeItem('saludo');
      out.textContent = 'localStorage.removeItem("saludo")  // borrado ✓';
    });
  });
  /* app final */
  $$('[data-appframe]', root).forEach(function(f){ f.srcdoc = FINAL_DEMO; });
}

/* ---------- render de bloques ---------- */
function boxHtml(cls, title, h){
  return '<div class="box '+cls+'"><span class="box-title">'+title+'</span>'+h+'</div>';
}
function tableHtml(b){
  return '<table class="ref"><thead><tr>'+b.head.map(function(h){ return '<th>'+h+'</th>'; }).join('')+'</tr></thead><tbody>'+
    b.rows.map(function(r){ return '<tr>'+r.map(function(c){ return '<td>'+c+'</td>'; }).join('')+'</tr>'; }).join('')+
    '</tbody></table>';
}
function blockHtml(b, lessonId){
  switch(b.t){
    case 'p': return '<p class="lead-text">'+b.h+'</p>';
    case 'h': return '<h3 class="sec">'+b.h+'</h3>';
    case 'list': return '<ul class="nice">'+b.items.map(function(i){ return '<li>'+i+'</li>'; }).join('')+'</ul>';
    case 'steps': return '<ol class="steps">'+b.items.map(function(i){ return '<li>'+i+'</li>'; }).join('')+'</ol>';
    case 'code': return codeBlockHtml(b);
    case 'tip': return boxHtml('tip', b.title||'💡 Tip', b.h);
    case 'warn': return boxHtml('warn', b.title||'⚠️ Cuidado', b.h);
    case 'info': return boxHtml('info', b.title||'ℹ️ Info', b.h);
    case 'milestone': return boxHtml('milestone', b.title||'🏆 Hito', b.h);
    case 'table': return tableHtml(b);
    case 'editor': return editorHtmlInner(b);
    case 'exercise': return exerciseHtml(b, lessonId);
    case 'quiz': return quizBlockHtml(lessonId, b);
    case 'domtree': return DOMTREE_HTML;
    case 'appenddemo': return appendDemoHtml();
    case 'navdemo': return navDemoHtml();
    case 'storedemo': return storeDemoHtml();
    case 'appdemo': return appDemoHtml();
    default: return '';
  }
}

    '<p class="lead-text">Después activa <b>Settings → Pages → Deploy from a branch → main → Save</b> y en un par de minutos tu app estará en <code>https://TU-USUARIO.github.io/mi-lista-de-tareas/</code>. Repasa la <a href="#/leccion/6-2">lección 6.2</a> y la <a href="#/leccion/6-3">lección 6.3</a> si tienes dudas.</p>'+
    '<div class="box tip"><span class="box-title">☁️ ¿Prefieres Render?</span>Este proyecto trae <code>render.yaml</code>, <code>server.js</code> y <code>README.md</code> listos para desplegar en Render (Static Site) o ejecutar en tu computadora con <code>npm start</code>. Sigue la <a href="#/leccion/6-4">lección 6.4 · Bonus: publicar en Render</a>.</div>'+

    '</div>';
}
function renderProjectTab(i){
  const f = FINAL_FILES[i];
  $('#tabfile').innerHTML = codeBlockHtml({ lang:f.lang, title:f.name, code:f.code });
}

/* ---------- sidebar ---------- */
function renderSidebar(route){
  const side = $('#sidebar');
  let gi = 0;
  let h = '<div style="padding:2px 4px 10px"><button class="sextra" data-nav="home">🏠 Inicio del curso</button></div>';
  MODULES.forEach(function(m){
    const containsCurrent = route.view === 'lesson' && route.id && m.lessons.some(function(l){ return l.id === route.id; });
    const open = containsCurrent || (route.view === 'home' && m.id === 'm1') || (route.view !== 'lesson' && route.view !== 'home' && m.id === 'm6');
    h += '<div class="sgroup'+(open ? ' open' : '')+'">';
    h += '<button type="button" class="sgroup-head" data-action="toggle-module"><span class="emo">'+m.emoji+'</span><span>'+m.name+'</span><span class="chev">▶</span></button>';
    h += '<div class="sgroup-body">';
    m.lessons.forEach(function(l){
      gi++;
      const sc = state.scores[l.id];
      const active = route.view === 'lesson' && route.id === l.id;
      h += '<button type="button" class="slesson'+(sc != null ? ' done' : '')+(active ? ' active' : '')+'" data-nav="lesson" data-id="'+l.id+'">'+
        '<span class="num">'+(sc != null ? '✓' : gi)+'</span><span class="stitle">'+l.title+'</span>'+
        (sc != null ? '<span class="sscore">'+sc+'/'+lessonMax(l)+'</span>' : '')+'</button>';
    });
    h += '</div></div>';
  });
  h += '<div style="height:6px"></div>';
  h += '<button class="sextra" data-nav="exam">📝 Examen final'+(state.examScore != null ? '<span class="sscore" style="margin-left:auto">'+state.examScore+'/'+EXAM_MAX+'</span>' : '')+'</button>';
  h += '<button class="sextra" data-nav="project">📦 Proyecto final (código)</button>';
  h += '<button class="sextra" data-nav="report">📄 Boleta de calificaciones</button>';
  side.innerHTML = h;
}

/* ---------- chrome (barra superior) ---------- */
function updateChrome(){
  const pct = gradePct();
  const hasPoints = pointsEarned() > 0;
  $('#topBar').style.width = pct + '%';
  $('#topPct').textContent = pct + '% del curso';
  const chip = $('#topGrade');
  if(!hasPoints){ chip.textContent = 'Calificación: —'; chip.className = 'chip grade'; }
  else{
    chip.textContent = 'Calificación: ' + pct + '/100';
    chip.className = 'chip grade ' + (pct >= 70 ? 'g-good' : pct >= 50 ? 'g-mid' : 'g-bad');
  }
}

/* ---------- router ---------- */
let CURRENT = { view:'home', id:null };
function parseHash(){
  try{
    const h = (location.hash || '').replace(/^#\/?/, '');
    if(!h) return { view:'home' };
    const parts = h.split('/');
    if(parts[0] === 'leccion' && LESSONS_BY_ID[parts[1]]) return { view:'lesson', id: parts[1] };
    if(parts[0] === 'examen') return { view:'exam' };
    if(parts[0] === 'proyecto') return { view:'project' };
    if(parts[0] === 'boleta') return { view:'report' };
    return { view:'home' };
  }catch(e){ return { view:'home' }; }
}
function routeHash(r){
  if(r.view === 'lesson' && r.id) return '#/leccion/' + r.id;
  if(r.view === 'exam') return '#/examen';
  if(r.view === 'project') return '#/proyecto';
  if(r.view === 'report') return '#/boleta';
  return '#/';
}
function go(route){
  CURRENT = route;
  const h = routeHash(route);
  try{ if(location.hash !== h) location.hash = h; }catch(e){}
  const sb = $('#sidebar'); if(sb) sb.classList.remove('open');
  const bd = document.getElementById('backdrop'); if(bd) bd.classList.remove('show');
  document.body.classList.remove('no-scroll');
  render();
}
function navTo(kind, id){
  go({ view: kind, id: id || null });
}
function render(){
  const route = CURRENT;
  EDITOR_CODES = [];
  const content = $('#content');
  if(route.view === 'home') content.innerHTML = viewHome();
  else if(route.view === 'lesson') content.innerHTML = viewLesson(route.id);
  else if(route.view === 'exam') content.innerHTML = viewExam();
  else if(route.view === 'project'){ content.innerHTML = viewProject(); renderProjectTab(0); }
  else content.innerHTML = viewReport();
  initDemos(content);
  renderSidebar(route);
  updateChrome();
  try{ window.scrollTo({top:0,left:0,behavior:'instant'}); }
  catch(e){ window.scrollTo(0,0); }
  try{ content.scrollTop = 0; }catch(e){}
}

/* ---------- acciones globales (delegación) ---------- */
function copyText(text, btn){
  const done = function(ok){
    if(btn){
      const old = btn.textContent;
      btn.textContent = ok ? '✓ Copiado' : '⚠️ Selecciona y copia';
      setTimeout(function(){ btn.textContent = old; }, 1800);
    }
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){ done(true); }, function(){ fallbackCopy(text, btn, done); });
  } else fallbackCopy(text, btn, done);
}
function fallbackCopy(text, btn, done){
  try{
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    const ok = document.execCommand('copy');
    document.body.removeChild(ta);
    done(ok);
  }catch(e){ done(false); }
}

document.addEventListener('click', function(e){
  const t = e.target;
  /* opciones de quiz */
  const opt = t.closest ? t.closest('.opt:not(.locked)') : null;
  if(opt){
    const qEl = opt.closest('.qcard');
    $$('.opt', qEl).forEach(function(o){ o.classList.remove('sel'); });
    opt.classList.add('sel');
    const section = opt.closest('[data-quiz]');
    if(section){
      const isExam = section.getAttribute('data-quiz') === '__exam';
      updateRemain(section, isExam ? EXAM.questions : (LESSONS_BY_ID[section.getAttribute('data-quiz')] ? LESSONS_BY_ID[section.getAttribute('data-quiz')].blocks.filter(function(b){ return b.t === 'quiz'; })[0].questions : []));
    }
    return;
  }
  const nav = t.closest('[data-nav]');
  if(nav){ navTo(nav.getAttribute('data-nav'), nav.getAttribute('data-id')); return; }
  const actionEl = t.closest('[data-action]');
  if(!actionEl) return;
  const action = actionEl.getAttribute('data-action');
  if(action === 'toggle-module'){
    actionEl.closest('.sgroup').classList.toggle('open');
  } else if(action === 'copy'){
    copyText(CODE_STORE[Number(actionEl.getAttribute('data-code'))] || '', actionEl);
  } else if(action === 'run'){
    const w = actionEl.closest('.edwrap');
    $('.edprev', w).srcdoc = $('textarea', w).value;
  } else if(action === 'reset'){
    const w = actionEl.closest('.edwrap');
    const ta = $('textarea', w);
    ta.value = EDITOR_CODES[Number(w.getAttribute('data-ed'))] || '';
    $('.edprev', w).srcdoc = ta.value;
  } else if(action === 'grade-quiz'){
    const section = actionEl.closest('[data-quiz]');
    const lessonId = section.getAttribute('data-quiz');
    const lesson = LESSONS_BY_ID[lessonId];
    const quizBlock = lesson.blocks.filter(function(b){ return b.t === 'quiz'; })[0];
    gradeQuizSection(section, quizBlock.questions, lessonId);
  } else if(action === 'grade-exam'){
    const section = actionEl.closest('[data-quiz]');
    gradeQuizSection(section, EXAM.questions, '__exam');
  } else if(action === 'grade-ex'){
    gradeExercise(actionEl.closest('[data-ex]'));
  } else if(action === 'retry'){
    render();
  } else if(action === 'tab'){
    $$('.tab', actionEl.closest('.tabs')).forEach(function(b){ b.classList.remove('active'); });
    actionEl.classList.add('active');
    renderProjectTab(Number(actionEl.getAttribute('data-tab')));
  } else if(action === 'save-name'){
    const inp = $('#certName');
    state.name = inp ? inp.value.trim() : '';
    saveState();
    render();
  } else if(action === 'print-cert'){
    try{ window.print(); }catch(e){ alertFallback(); }
  } else if(action === 'reset-progress'){
    if(actionEl.getAttribute('data-armed') === '1'){
      state = { scores:{}, examScore:null, name:'', lastLesson:'1-1' };
      saveState();
      render();
    } else {
      actionEl.setAttribute('data-armed','1');
      actionEl.textContent = '⚠️ ¿Seguro? Clic de nuevo para borrar TODO';
      setTimeout(function(){ actionEl.setAttribute('data-armed','0'); actionEl.textContent = '🗑️ Borrar todo mi progreso'; }, 4000);
    }
  }
});
function alertFallback(){
  const el = document.createElement('div');
  el.textContent = 'Para imprimir o guardar PDF, descarga el archivo y ábrelo en tu navegador.';
  el.style.cssText = 'position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1e293b;color:#fff;padding:10px 18px;border-radius:10px;font-size:13px;z-index:99';
  document.body.appendChild(el);
  setTimeout(function(){ document.body.removeChild(el); }, 3000);
}

/* ---------- menú móvil ---------- */
$('#menuBtn').addEventListener('click', function(){
  const sb = $('#sidebar'), bd = document.getElementById('backdrop');
  if(!sb) return;
  const abierto = sb.classList.toggle('open');
  if(bd) bd.classList.toggle('show', abierto);
  document.body.classList.toggle('no-scroll', abierto);
});

/* ---------- arranque protegido ---------- */
function fatal(err){
  const c = document.getElementById('content');
  if(!c) return;
  c.innerHTML = '<div class="view" style="padding-top:40px">' +
    '<div class="box warn"><span class="box-title">⚠️ No se pudo iniciar la interfaz del curso</span>' +
    'Detalle técnico: <code>' + esc(String((err && err.message) || err)) + '</code>.<br><br>' +
    'Prueba recargar la página (F5). Si estás en un visor integrado que bloquea JavaScript o el almacenamiento, ' +
    'descarga el archivo <code>index.html</code> y ábrelo directamente en tu navegador (doble clic): ' +
    'ahí el curso funciona al 100%, con progreso guardado y editores en vivo.</div></div>';
}
try{ loadState(); }catch(e){}
try{ CURRENT = parseHash(); }catch(e){ CURRENT = { view:'home' }; }
try{
  window.addEventListener('hashchange', function(){
    try{ CURRENT = parseHash(); }catch(e){}
    try{ render(); }catch(e){ fatal(e); }
  });
}catch(e){}
(function(){
  const bd = document.getElementById('backdrop');
  if(bd){ bd.addEventListener('click', function(){ const sb = $('#sidebar'); if(sb) sb.classList.remove('open'); }); }
})();
try{ render(); }catch(e){ fatal(e); }
</script>
